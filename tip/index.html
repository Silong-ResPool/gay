<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>支持打赏 · 巳泷资源库</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;color:#f3e9ff;
  background:radial-gradient(1100px 600px at 15% -10%,rgba(192,132,252,.28),transparent 60%),radial-gradient(900px 500px at 90% 15%,rgba(232,121,249,.2),transparent 60%),#0a0612}
body.day{background:radial-gradient(1100px 600px at 15% -10%,rgba(192,132,252,.22),transparent 60%),radial-gradient(900px 500px at 90% 15%,rgba(232,121,249,.16),transparent 60%),#fbf8ff;color:#2a1b3d}
.page{max-width:540px;margin:0 auto;padding:28px 20px 60px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{font-size:26px;margin:0 0 10px;letter-spacing:2px;background:linear-gradient(90deg,#c084fc,#e879f9,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:13px;line-height:1.9;color:#b7a4d3}
body.day .hero p{color:#6e5a88}
.card{padding:20px;border-radius:22px;border:1px solid rgba(192,132,252,.32);background:linear-gradient(145deg,rgba(124,58,237,.16),rgba(232,121,249,.08));backdrop-filter:blur(16px);box-shadow:0 18px 60px rgba(88,28,135,.25);margin-bottom:18px}
body.day .card{background:rgba(255,255,255,.82);border-color:#e5d8f8;box-shadow:0 18px 50px rgba(124,58,237,.12)}
.card h2{margin:0 0 10px;font-size:16px;color:#e9d5ff}
body.day .card h2{color:#6d28d9}
.card p{margin:0 0 8px;font-size:12.8px;line-height:1.9;color:#c9b8e2}
body.day .card p{color:#5e4b78}
.free{font-weight:800;color:#ffd6f4}
.qr-wrap{text-align:center;margin:18px 0 10px}
.qr{width:min(76vw,300px);border-radius:18px;display:block;margin:0 auto;border:2px solid rgba(232,121,249,.45);box-shadow:0 10px 40px rgba(232,121,249,.2)}
.qr-tip{font-size:11.5px;color:#a892c4;line-height:1.8;margin-top:10px}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.btn{border:0;border-radius:14px;padding:14px 18px;font-size:14px;font-weight:800;cursor:pointer;
  background:linear-gradient(135deg,#7c3aed,#a855f7,#e879f9);color:#fff;box-shadow:0 10px 30px rgba(168,85,247,.35)}
.btn.ghost{background:transparent;border:1px solid rgba(192,132,252,.4);color:#d8bffa;box-shadow:none}
.foot{text-align:center;margin-top:22px;font-size:11px;color:#8873a4;line-height:1.9}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;padding:11px 20px;border-radius:12px;background:rgba(30,18,48,.97);border:1px solid rgba(232,121,249,.45);color:#fff;font-size:12px;z-index:99;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    /* v8.1.0 卡死修复：classList.remove/add 即使无实际变化也会产生 class 变更记录，
       本函数由 MutationObserver 回调，无脑 remove+add 会造成无限观察者风暴（主线程卡死）。
       改为「先检查、确有差异才写」。 */
    var d=document.documentElement;
    if(d){
      var dNeed=!d.classList.contains('sl-night')||d.classList.contains('sl-day')||d.classList.contains('sl-dusk')||d.classList.contains('day');
      if(dNeed){
        d.classList.remove('sl-day','sl-dusk','day');
        d.classList.add('sl-night');
      }
    }
    var b=document.body;
    if(b){
      var bNeed=!b.classList.contains('mode-night')||!b.classList.contains('mode-adult')||b.classList.contains('mode-daily')||b.classList.contains('mode-dusk')||b.classList.contains('day');
      if(bNeed){
        b.classList.remove('mode-daily','mode-dusk','day');
        b.classList.add('mode-night','mode-adult');
      }
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

<div class="page">
  <div class="hero">
    <h1>支持打赏</h1>
    <p>谢谢您愿意停下脚步，看到这里。<br>巳泷资源库会一直保持免费、干净、无强制收费。</p>
  </div>
  <div class="card">
    <h2>所有资源，永久免费</h2>
    <p><span class="free">本站所有资源完全免费</span>，不设会员墙、不强制付费、不拿资源做交易。</p>
    <p>如果这里曾帮到您，喜欢的话可以随缘打赏支持，纯粹自愿；不打赏也完全不影响任何功能。</p>
    <p>您的每一份支持，都会变成服务器、域名和维护深夜里的一点光。</p>
  </div>
  <div class="card">
    <h2>打赏码</h2>
    <div class="qr-wrap">
      <img class="qr" id="payImg" src="./收款码/赞赏码.jpg" onerror="this.style.display='none';document.getElementById('qrFallback').style.display='block'" alt="打赏码">
      <div class="qr-tip">可长按图片保存，再打开微信「扫一扫」→ 相册选择这张图。<br>或点击下方按钮调用系统扫码。</div>
    </div>
    <div class="btns">
      <button class="btn" id="scanBtn">调用系统扫码</button>
      <button class="btn ghost" id="saveBtn">保存打赏码到相册</button>
      <button class="btn ghost" id="backBtn">返回资源库</button>
    </div>
  </div>
  <div class="foot">巳泷资源库 · 因为被喜欢，所以一直亮着</div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(function(){x.classList.remove('on')},2400)}
if(localStorage.getItem('sl_theme')==='day')document.body.classList.add('day');
$('scanBtn').onclick=function(){
  try{ if(window.Android&&Android.openSystemScan){ Android.openSystemScan(); return; } }catch(e){}
  toast('当前环境不支持系统扫码，请长按图片保存后用微信扫一扫');
};
$('saveBtn').onclick=function(){
  try{ if(window.Android&&Android.saveTipImage){ Android.saveTipImage(); toast('已保存到相册'); return; } }catch(e){}
  var img=$('payImg');
  try{
    var a=document.createElement('a');a.href=img.src;a.download='巳泷打赏码.png';a.click();
    toast('已开始保存图片');
  }catch(e){ toast('请长按图片选择「保存图片」'); }
};
$('backBtn').onclick=function(){ try{history.back()}catch(e){location.href='../index.html'} };
})();
</script>
<style id="sl-skeleton">
/* ============================================================
   巳泷资源库 · 前端骨架 Token 体系（v8.0.7）
   统一：颜色 / 字体 / 圆角 / 间距 / 阴影 / 层级
   所有页面通过构建脚本内联本文件，页面运行时不额外请求 CSS。
   ============================================================ */
:root{
  /* 颜色 */
  --sl-bg:#08050f;
  --sl-bg-2:#0e0819;
  --sl-surface:#151024;
  --sl-surface-2:#1d1533;
  --sl-glass:rgba(16,10,30,.72);
  --sl-glass-strong:rgba(20,12,36,.92);
  --sl-primary:#8b5cf6;
  --sl-primary-2:#7c3aed;
  --sl-accent:#22d3ee;
  --sl-pink:#ff6ec7;
  --sl-glow:rgba(139,92,246,.45);
  --sl-text:#f5f3ff;
  --sl-text-2:#d8cfe9;
  --sl-muted:#a99bc4;
  --sl-line:rgba(139,92,246,.26);
  --sl-line-strong:rgba(139,92,246,.42);
  --sl-success:#34d399;
  --sl-danger:#f87171;
  --sl-warning:#fbbf24;
  /* 字体 */
  --sl-font:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sl-font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
  /* 圆角 */
  --sl-r-sm:8px;
  --sl-r-md:12px;
  --sl-r-lg:18px;
  --sl-r-xl:24px;
  --sl-r-pill:999px;
  /* 间距 */
  --sl-sp-1:4px;
  --sl-sp-2:8px;
  --sl-sp-3:12px;
  --sl-sp-4:16px;
  --sl-sp-5:24px;
  --sl-sp-6:32px;
  /* 阴影 */
  --sl-shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --sl-shadow:0 8px 30px rgba(0,0,0,.45);
  --sl-shadow-lg:0 18px 60px rgba(0,0,0,.55);
  --sl-glow-line:0 0 0 1px rgba(139,92,246,.18),0 0 24px rgba(139,92,246,.18);
  /* 层级 */
  --sl-z-nav:100;
  --sl-z-panel:300;
  --sl-z-modal:1000;
  --sl-z-toast:2000;
  /* 兼容旧页面变量名 */
  --acc:var(--sl-primary);
  --acc2:var(--sl-accent);
  --pink:var(--sl-pink);
  --border:var(--sl-line);
  --bg:var(--sl-bg);
  --txt:var(--sl-text);
  --v-glow:var(--sl-primary);
  --v-ink:var(--sl-text);
  --v-soft:var(--sl-line);
  --text-muted:var(--sl-muted);
}

html,body{
  background:var(--sl-bg);
  color:var(--sl-text);
  font-family:var(--sl-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{min-height:100vh}
::selection{background:rgba(139,92,246,.38);color:#fff}
*{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.55) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:var(--sl-r-pill)}
::-webkit-scrollbar-track{background:transparent}
*:focus-visible{outline:2px solid rgba(34,211,238,.55);outline-offset:2px}

/* 顶部栏：统一深色玻璃 + 紫罗兰描边（不改各页面原有高度与排布） */
.navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-sm)!important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
/* 侧栏 / 抽屉 / 面板统一 */
.side,.side-panel,.side-pane,.src-dock,.panel,.drawer{
  border-color:var(--sl-line)!important;
}
.side-header,.side-hd,.dock-head{
  border-bottom-color:var(--sl-line)!important;
}
.side-header h3,.side-hd h3,.dock-title{
  color:var(--sl-text)!important;letter-spacing:.4px;
}

/* 通用按钮：统一字体、圆角、动效；保留各页面自己的配色 */
.btn,.pbtn,.mini,.sr-tool,.tab-btn,.api-pool-btn,.rate-btn,.mbtn,.card-edit,.dk-tts,.icon-btn,.sl-top .bk{
  font-family:var(--sl-font);
  border-radius:var(--sl-r-md);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:active,.pbtn:active,.mini:active,.sr-tool:active,.tab-btn:active,.api-pool-btn:active,.rate-btn:active,.mbtn:active,.card-edit:active,.dk-tts:active,.icon-btn:active,.sl-top .bk:active{
  transform:scale(.97);
}
.primary,.pbtn{
  background-image:linear-gradient(135deg,var(--sl-primary-2),var(--sl-primary))!important;
  border-color:transparent!important;
  color:#fff!important;
  box-shadow:0 6px 18px rgba(124,58,237,.32);
}

/* 输入类：统一深色底、占位色与聚焦光环（排除勾选/滑杆/取色/文件） */
input,textarea,select{font-family:var(--sl-font)}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),textarea,select{
  background:var(--sl-surface-2)!important;
  color:var(--sl-text)!important;
  border:1px solid var(--sl-line)!important;
  border-radius:var(--sl-r-md)!important;
}
input::placeholder,textarea::placeholder{color:var(--sl-muted)}
input:focus,textarea:focus,select:focus{
  border-color:var(--sl-primary)!important;
  box-shadow:0 0 0 3px rgba(139,92,246,.16);
}

/* 区块标题与正文层级 */
.hd h2,.side-section h4,.side-header h3,.bubble-name,.v-bubble-name{
  color:var(--sl-text);
}
.hd,.side-section h4{
  letter-spacing:.3px;
}
.msg-time,.sub,.hint,.brand-status,.meta,.ds{
  color:var(--sl-muted);
}

/* 弹窗 / 浮层统一描边与阴影 */
.modal,.rate-card,.pet-card,.sl-kwarn,.dt,.dt-head,.context-menu{
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-lg)!important;
}

/* 兼容旧的白日/黄昏蓝白覆盖：即使旧 class 残留，也保持统一紫罗兰暗色 */
html.sl-day,html.sl-dusk{
  --bg:var(--sl-bg);--card:var(--sl-surface);--line:var(--sl-line);
  --txt:var(--sl-text);--mut:var(--sl-muted);--acc:var(--sl-primary);--acc2:var(--sl-accent);
}
html.sl-day body,html.sl-dusk body{
  background:radial-gradient(ellipse at 12% 6%,rgba(139,92,246,.20),transparent 55%),
             radial-gradient(ellipse at 88% 94%,rgba(255,110,199,.12),transparent 55%),
             var(--sl-bg)!important;
  color:var(--sl-text)!important;
}
html.sl-day .navbar,html.sl-dusk .navbar,body.mode-daily .nav{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  background-image:none!important;
}
html.sl-day .side-header h3,body.mode-daily .hd h2,body.mode-daily .about-site h2{
  color:var(--sl-text)!important;
}
html.sl-day .side,body.mode-daily .side{
  background:var(--sl-glass-strong)!important;
  border-color:var(--sl-line)!important;
}
body.mode-daily .side a:hover,body.mode-daily .side a.on{
  color:var(--sl-text)!important;
  border-left-color:var(--sl-primary)!important;
}

/* 移动端安全区与间距基线 */
@supports(padding:max(0px)){
  .navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
    padding-top:max(8px,env(safe-area-inset-top));
  }
}

</style>
</body>
</html>
