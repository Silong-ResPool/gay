<!DOCTYPE html>
<html lang="zh-CN">
<head>
<style id="sl-color-lock">html,body,:root{color-scheme:dark!important}html,body{forced-color-adjust:none!important}</style>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的收藏 · 巳泷资源库</title>
<style>
:root{--bg:#0b0713;--bg2:#120c1d;--card:#1a1228;--line:#2d2143;--txt:#f1e9ff;--mut:#9d8bb8;--acc:#a855f7;--acc2:#7c3aed;--pink:#e879f9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(900px 480px at 80% -10%,rgba(168,85,247,.22),transparent 65%),var(--bg);color:var(--txt);font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;min-height:100vh}
body.day{--bg:#f7f2ff;--bg2:#fff;--card:#fff;--line:#e5d8f8;--txt:#2a1b3d;--mut:#78648f;background:radial-gradient(900px 480px at 80% -10%,rgba(168,85,247,.18),transparent 65%),var(--bg)}
.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:13px 15px;background:linear-gradient(180deg,rgba(20,12,32,.96),rgba(20,12,32,.78));backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.day .nav{background:linear-gradient(180deg,rgba(255,255,255,.96),rgba(255,255,255,.8))}
.back{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:20px;cursor:pointer}
body.day .back{color:#6d28d9}
.ttl{font-size:17px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#c084fc,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.cnt{margin-left:auto;font-size:11px;color:var(--mut)}
.wrap{padding:16px 14px 90px;max-width:760px;margin:0 auto}
.tip{padding:12px 14px;border:1px solid rgba(168,85,247,.3);border-radius:14px;background:linear-gradient(135deg,rgba(124,58,237,.16),rgba(232,121,249,.08));font-size:12px;color:#cbb8e6;line-height:1.7;margin-bottom:16px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:10px;padding:13px 14px;border-radius:15px;background:var(--card);border:1px solid var(--line);transition:.15s}
.item:hover{border-color:rgba(192,132,252,.55);transform:translateY(-1px)}
.item .ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(124,58,237,.35),rgba(232,121,249,.25));font-size:17px;color:#e9d5ff;flex:0 0 auto}
.item .bd{flex:1;min-width:0}
.item .nm{font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ur{font-size:10.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.item .go{flex:0 0 auto;padding:8px 13px;border-radius:10px;background:linear-gradient(135deg,var(--acc2),var(--acc));color:#fff;font-size:11.5px;font-weight:800;text-decoration:none}
.item .del{flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#fca5a5;font-size:15px;cursor:pointer}
.empty{text-align:center;padding:70px 20px;color:var(--mut);font-size:13px;line-height:2}
.empty i{font-size:40px;color:rgba(168,85,247,.5);display:block;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;padding:10px 18px;border-radius:12px;background:rgba(30,18,48,.96);border:1px solid rgba(168,85,247,.4);color:#eee;font-size:12px;z-index:99;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    /* v8.1.0 卡死修复：classList.remove/add 即使无实际变化也会产生 class 变更记录，
       本函数由 MutationObserver 回调，无脑 remove+add 会造成无限观察者风暴（主线程卡死）。
       改为「先检查、确有差异才写」。 */
    var d=document.documentElement;
    if(d){
      var dNeed=!d.classList.contains('sl-night')||d.classList.contains('sl-day')||d.classList.contains('sl-dusk')||d.classList.contains('day');
      if(dNeed){
        d.classList.remove('sl-day','sl-dusk','day');
        d.classList.add('sl-night');
      }
    }
    var b=document.body;
    if(b){
      var bNeed=!b.classList.contains('mode-night')||!b.classList.contains('mode-adult')||b.classList.contains('mode-daily')||b.classList.contains('mode-dusk')||b.classList.contains('day');
      if(bNeed){
        b.classList.remove('mode-daily','mode-dusk','day');
        b.classList.add('mode-night','mode-adult');
      }
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

<div class="nav"><button class="back" id="back">‹</button><div class="ttl">我的收藏</div><span class="cnt" id="cnt"></span></div>
<div class="wrap">
  <div class="tip"><i class="fa-solid fa-star" style="color:#f0c46a"></i> 这里只展示您在资源库里点过「☆ 收藏网站」的网址，不会上传到任何服务器。点卡片直接跳转，点删除立即移除。</div>
  <div class="list" id="list"></div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
function read(){ try{return JSON.parse(localStorage.getItem('sl_fav_sites')||'[]')}catch(e){return []} }
function write(a){ try{localStorage.setItem('sl_fav_sites',JSON.stringify(a))}catch(e){} }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function host(u){try{return String(u).replace(/^https?:\/\//,'').split('/')[0]}catch(e){return u}}
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(function(){x.classList.remove('on')},2200)}
function render(){
  var arr=read(); $('cnt').textContent=arr.length+' 个收藏';
  var list=$('list');
  if(!arr.length){ list.innerHTML='<div class="empty"><i class="fa-regular fa-star"></i>还没有收藏任何网站<br>回到资源库，点开站点详情即可收藏</div>'; return; }
  list.innerHTML=arr.map(function(x,i){
    return '<div class="item"><div class="ic"><i class="fa-solid fa-globe"></i></div>'+
      '<div class="bd"><div class="nm">'+esc(x.t||host(x.u))+'</div><div class="ur">'+esc(x.u)+'</div></div>'+
      '<a class="go" href="'+esc(x.u)+'" target="_blank" rel="noopener">打开</a>'+
      '<button class="del" data-i="'+i+'">🗑</button></div>';
  }).join('');
  list.onclick=function(e){
    var d=e.target.closest?e.target.closest('[data-i]'):null; if(!d)return;
    var i=+d.getAttribute('data-i'); var arr=read();
    if(!arr[i])return; var name=arr[i].t||host(arr[i].u);
    arr.splice(i,1); write(arr); render(); toast('已删除：'+name);
  };
}
$('back').onclick=function(){ try{history.back()}catch(e){location.href='../index.html'} };
if(localStorage.getItem('sl_theme')==='day')document.body.classList.add('day');
window.addEventListener('storage',function(e){ if(e.key==='sl_fav_sites')render(); });
setTimeout(render,60);
})();
</script>
<style id="sl-skeleton">
/* ============================================================
   巳泷资源库 · 前端骨架 Token 体系（v8.0.7）
   统一：颜色 / 字体 / 圆角 / 间距 / 阴影 / 层级
   所有页面通过构建脚本内联本文件，页面运行时不额外请求 CSS。
   ============================================================ */
:root{
  /* 颜色 */
  --sl-bg:#08050f;
  --sl-bg-2:#0e0819;
  --sl-surface:#151024;
  --sl-surface-2:#1d1533;
  --sl-glass:rgba(16,10,30,.72);
  --sl-glass-strong:rgba(20,12,36,.92);
  --sl-primary:#8b5cf6;
  --sl-primary-2:#7c3aed;
  --sl-accent:#22d3ee;
  --sl-pink:#ff6ec7;
  --sl-glow:rgba(139,92,246,.45);
  --sl-text:#f5f3ff;
  --sl-text-2:#d8cfe9;
  --sl-muted:#a99bc4;
  --sl-line:rgba(139,92,246,.26);
  --sl-line-strong:rgba(139,92,246,.42);
  --sl-success:#34d399;
  --sl-danger:#f87171;
  --sl-warning:#fbbf24;
  /* 字体 */
  --sl-font:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sl-font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
  /* 圆角 */
  --sl-r-sm:8px;
  --sl-r-md:12px;
  --sl-r-lg:18px;
  --sl-r-xl:24px;
  --sl-r-pill:999px;
  /* 间距 */
  --sl-sp-1:4px;
  --sl-sp-2:8px;
  --sl-sp-3:12px;
  --sl-sp-4:16px;
  --sl-sp-5:24px;
  --sl-sp-6:32px;
  /* 阴影 */
  --sl-shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --sl-shadow:0 8px 30px rgba(0,0,0,.45);
  --sl-shadow-lg:0 18px 60px rgba(0,0,0,.55);
  --sl-glow-line:0 0 0 1px rgba(139,92,246,.18),0 0 24px rgba(139,92,246,.18);
  /* 层级 */
  --sl-z-nav:100;
  --sl-z-panel:300;
  --sl-z-modal:1000;
  --sl-z-toast:2000;
  /* 兼容旧页面变量名 */
  --acc:var(--sl-primary);
  --acc2:var(--sl-accent);
  --pink:var(--sl-pink);
  --border:var(--sl-line);
  --bg:var(--sl-bg);
  --txt:var(--sl-text);
  --v-glow:var(--sl-primary);
  --v-ink:var(--sl-text);
  --v-soft:var(--sl-line);
  --text-muted:var(--sl-muted);
}

html,body{
  background:var(--sl-bg);
  color:var(--sl-text);
  font-family:var(--sl-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{min-height:100vh}
::selection{background:rgba(139,92,246,.38);color:#fff}
*{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.55) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:var(--sl-r-pill)}
::-webkit-scrollbar-track{background:transparent}
*:focus-visible{outline:2px solid rgba(34,211,238,.55);outline-offset:2px}

/* 顶部栏：统一深色玻璃 + 紫罗兰描边（不改各页面原有高度与排布） */
.navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-sm)!important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
/* 侧栏 / 抽屉 / 面板统一 */
.side,.side-panel,.side-pane,.src-dock,.panel,.drawer{
  border-color:var(--sl-line)!important;
}
.side-header,.side-hd,.dock-head{
  border-bottom-color:var(--sl-line)!important;
}
.side-header h3,.side-hd h3,.dock-title{
  color:var(--sl-text)!important;letter-spacing:.4px;
}

/* 通用按钮：统一字体、圆角、动效；保留各页面自己的配色 */
.btn,.pbtn,.mini,.sr-tool,.tab-btn,.api-pool-btn,.rate-btn,.mbtn,.card-edit,.dk-tts,.icon-btn,.sl-top .bk{
  font-family:var(--sl-font);
  border-radius:var(--sl-r-md);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:active,.pbtn:active,.mini:active,.sr-tool:active,.tab-btn:active,.api-pool-btn:active,.rate-btn:active,.mbtn:active,.card-edit:active,.dk-tts:active,.icon-btn:active,.sl-top .bk:active{
  transform:scale(.97);
}
.primary,.pbtn{
  background-image:linear-gradient(135deg,var(--sl-primary-2),var(--sl-primary))!important;
  border-color:transparent!important;
  color:#fff!important;
  box-shadow:0 6px 18px rgba(124,58,237,.32);
}

/* 输入类：统一深色底、占位色与聚焦光环（排除勾选/滑杆/取色/文件） */
input,textarea,select{font-family:var(--sl-font)}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),textarea,select{
  background:var(--sl-surface-2)!important;
  color:var(--sl-text)!important;
  border:1px solid var(--sl-line)!important;
  border-radius:var(--sl-r-md)!important;
}
input::placeholder,textarea::placeholder{color:var(--sl-muted)}
input:focus,textarea:focus,select:focus{
  border-color:var(--sl-primary)!important;
  box-shadow:0 0 0 3px rgba(139,92,246,.16);
}

/* 区块标题与正文层级 */
.hd h2,.side-section h4,.side-header h3,.bubble-name,.v-bubble-name{
  color:var(--sl-text);
}
.hd,.side-section h4{
  letter-spacing:.3px;
}
.msg-time,.sub,.hint,.brand-status,.meta,.ds{
  color:var(--sl-muted);
}

/* 弹窗 / 浮层统一描边与阴影 */
.modal,.rate-card,.pet-card,.sl-kwarn,.dt,.dt-head,.context-menu{
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-lg)!important;
}

/* 兼容旧的白日/黄昏蓝白覆盖：即使旧 class 残留，也保持统一紫罗兰暗色 */
html.sl-day,html.sl-dusk{
  --bg:var(--sl-bg);--card:var(--sl-surface);--line:var(--sl-line);
  --txt:var(--sl-text);--mut:var(--sl-muted);--acc:var(--sl-primary);--acc2:var(--sl-accent);
}
html.sl-day body,html.sl-dusk body{
  background:radial-gradient(ellipse at 12% 6%,rgba(139,92,246,.20),transparent 55%),
             radial-gradient(ellipse at 88% 94%,rgba(255,110,199,.12),transparent 55%),
             var(--sl-bg)!important;
  color:var(--sl-text)!important;
}
html.sl-day .navbar,html.sl-dusk .navbar,body.mode-daily .nav{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  background-image:none!important;
}
html.sl-day .side-header h3,body.mode-daily .hd h2,body.mode-daily .about-site h2{
  color:var(--sl-text)!important;
}
html.sl-day .side,body.mode-daily .side{
  background:var(--sl-glass-strong)!important;
  border-color:var(--sl-line)!important;
}
body.mode-daily .side a:hover,body.mode-daily .side a.on{
  color:var(--sl-text)!important;
  border-left-color:var(--sl-primary)!important;
}

/* 移动端安全区与间距基线 */
@supports(padding:max(0px)){
  .navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
    padding-top:max(8px,env(safe-area-inset-top));
  }
}

</style>
</body>
</html>
