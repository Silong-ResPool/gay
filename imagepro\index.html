<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>巳泷图像工坊 · 影盾版</title>
<meta name="description" content="单文件在线图像工坊：图层绘画、修图调色、滤镜、PSD 导入导出、幻影坦克、隐写与批量处理。">
<!-- BASE64-IMAGE: 图像工坊 favicon（浏览器标签图标，替换时只改下一行 data:image） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23f472b6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='24' height='24' rx='6' fill='%230b0716'/%3E%3Cpath d='M5 16.5 12 5l7 11.5H5z' fill='none' stroke='url(%23g)' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#07050f; --bg2:#0b0817; --panel:#0d0919; --panel2:#120c22; --panel3:#170f2b;
  --line:rgb(167,139,250,.16); --line2:rgb(167,139,250,.30); --line3:rgb(196,181,253,.45);
  --text:#f2edff; --text2:#cfc2e9; --muted:#9d8fbe; --dim:#6f6390;
  --acc:#8b5cf6; --acc2:#a855f7; --acc3:#c084fc; --cyan:#ddd6fe; --pink:#f472b6;
  --ok:#34d399; --warn:#fbbf24; --danger:#fb7185;
  --r-s:7px; --r:10px; --r-l:14px; --r-xl:18px;
  --sh-s:0 2px 8px rgb(0,0,0,.35); --sh:0 10px 34px rgb(0,0,0,.45); --sh-l:0 24px 70px rgb(0,0,0,.6);
  --glow:0 0 0 1px rgb(139,92,246,.35),0 8px 22px rgb(109,40,217,.35);
  --font:'PingFang SC','HarmonyOS Sans SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono','SF Mono','Consolas',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;overflow:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:var(--cyan);text-decoration:none}
::selection{background:rgb(139,92,246,.4);color:#ffffff}
*{scrollbar-width:thin;scrollbar-color:rgb(139,92,246,.5) transparent}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgb(139,92,246,.42);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgb(139,92,246,.62)}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid rgb(221,214,254,.6);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 应用骨架 ---------- */
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:38px 46px 1fr 26px;
  background:radial-gradient(1200px 600px at 18% -10%,rgb(124,58,237,.16),transparent 60%),
             radial-gradient(900px 500px at 92% 110%,rgb(244,114,182,.09),transparent 60%),var(--bg)}
.main{display:grid;grid-template-columns:60px 0 minmax(0,1fr) 300px;min-height:0;position:relative}
body.side-open .main{grid-template-columns:60px 344px minmax(0,1fr) 300px}
/* 左侧影盾侧边栏（并入工具列） */
.side{position:relative;min-width:0;overflow:hidden;border-right:1px solid var(--line2);
  background:linear-gradient(180deg,#0f0a1d,#0a0613);display:flex;flex-direction:column}
body:not(.side-open) .side{display:none}
.side-scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden}
.side-head{display:flex;align-items:center;gap:9px;padding:11px 12px 9px;border-bottom:1px solid var(--line)}
.side-head .sh-ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;
  background:linear-gradient(135deg,#8b5cf6,#c026d3);box-shadow:0 3px 12px rgb(139,92,246,.4)}
.side-head .sh-ico svg{width:15px;height:15px;color:#ffffff}
.side-head h3{font-size:12.5px;font-weight:800;letter-spacing:.5px}
.side-head small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.6px;margin-top:1px}
.side-head .sh-close{margin-left:auto;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;color:var(--text2)}
.side-head .sh-close:hover{background:rgb(251,113,133,.16);color:#ffd0d6}

/* ---------- 顶部菜单栏 ---------- */
.menubar{display:flex;align-items:center;gap:6px;padding:0 10px;position:relative;z-index:40;
  background:linear-gradient(180deg,#150e28,#0b0717);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;padding-right:8px;flex:none}
.brand-mark{width:24px;height:24px;display:grid;place-items:center;border-radius:8px;
  background:linear-gradient(135deg,rgb(139,92,246,.28),rgb(244,114,182,.18));border:1px solid var(--line2)}
.brand-mark svg{width:16px;height:16px}
.brand-text{font-size:13.5px;font-weight:800;letter-spacing:.6px;background:linear-gradient(92deg,#d8c6ff,#a78bfa 40%,#f9a8d4);
  -webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.brand-tag{font-size:9px;letter-spacing:1px;color:#c4b5fd;border:1px solid var(--line2);padding:2px 5px;border-radius:5px;
  background:rgb(139,92,246,.12);white-space:nowrap}
.menus{display:flex;align-items:center;gap:1px;min-width:0;flex:1 1 auto;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.menus::-webkit-scrollbar{display:none}
.menu-btn{padding:5px 9px;border-radius:6px;font-size:12.5px;color:var(--text2);transition:.15s;white-space:nowrap}
.menu-btn:hover{background:rgb(139,92,246,.14);color:#ffffff}
.menu-btn.on{background:rgb(139,92,246,.26);color:#ffffff;box-shadow:inset 0 0 0 1px var(--line2)}
.menubar-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex:none}
.icon-btn{width:31px;height:28px;display:grid;place-items:center;border-radius:8px;color:var(--text2);transition:.15s;
  border:1px solid var(--line2);background:rgb(139,92,246,.10)}
.icon-btn:hover{background:rgb(139,92,246,.22);color:#ffffff;border-color:var(--line3)}
.icon-btn:active{transform:scale(.95)}
.icon-btn:disabled{opacity:.3;cursor:default;background:rgb(139,92,246,.05);border-color:var(--line)}
.icon-btn svg{width:16px;height:16px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:99px;font-size:11.5px;
  border:1px solid var(--line2);color:#e6dcff;background:rgb(139,92,246,.12);transition:.18s;white-space:nowrap}
.pill-btn:hover{background:rgb(139,92,246,.28);border-color:var(--line3);box-shadow:0 4px 14px rgb(109,40,217,.3)}
.pill-btn.solid{background:linear-gradient(135deg,#8b5cf6,#a855f7 55%,#d946ef);border-color:transparent;color:#ffffff;font-weight:700}
.pill-btn.solid:hover{filter:brightness(1.08);box-shadow:0 6px 20px rgb(139,92,246,.5)}
.pill-btn svg{width:14px;height:14px}

/* 下拉菜单 */
.dropdown{position:fixed;z-index:60;min-width:250px;max-height:min(76vh,640px);overflow:auto;
  background:linear-gradient(180deg,#130d24,#0c0818);border:1px solid var(--line2);border-radius:12px;
  box-shadow:var(--sh-l),inset 0 1px 0 rgb(255,255,255,.04);padding:5px;animation:pop .14s ease}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.99)}to{opacity:1;transform:none}}
.mi{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:12.5px;color:var(--text2);cursor:pointer}
.mi:hover{background:rgb(139,92,246,.16);color:#ffffff}
.mi.dis{opacity:.35;pointer-events:none}
.mi .ic{width:16px;height:16px;flex:none;color:var(--acc3);display:grid;place-items:center}
.mi .ic svg{width:15px;height:15px}
.mi .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .kbd{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.3px}
.mi.arrow .kbd{font-size:12px}
.msep{height:1px;margin:5px 6px;background:linear-gradient(90deg,transparent,var(--line2),transparent)}
.mgroup{padding:5px 9px 3px;font-size:9.5px;letter-spacing:1.4px;color:var(--dim)}
.dropdown.sub{min-width:210px}

/* ---------- 选项栏 ---------- */
.optionsbar{display:flex;align-items:center;gap:10px;padding:0 10px;overflow-x:auto;overflow-y:hidden;
  background:linear-gradient(180deg,#0e0a1a,#0a0714);border-bottom:1px solid var(--line);position:relative;z-index:30}
.optionsbar::-webkit-scrollbar{height:0}
.opt-tool{display:flex;align-items:center;gap:7px;flex:none;padding-right:10px;margin-right:2px;border-right:1px solid var(--line)}
.opt-tool .tico{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:#ffffff;
  background:linear-gradient(135deg,rgb(139,92,246,.5),rgb(168,85,247,.25));border:1px solid var(--line2)}
.opt-tool .tico svg{width:14px;height:14px}
.opt-tool .tname{font-size:12px;font-weight:600;color:#efe6ff}
.opt-controls{display:flex;align-items:center;gap:9px;flex-wrap:nowrap;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.opt-controls::-webkit-scrollbar{height:0}
.opt-controls .field{flex:none}
.opt-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex:none;position:sticky;right:0;
  background:linear-gradient(90deg,transparent,#0a0714 18%);padding-left:14px}
.field{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);flex:none}
.field > span{white-space:nowrap}
.inp{height:24px;background:#150f28;border:1px solid var(--line2);border-radius:6px;padding:0 6px;
  color:var(--text);font-size:11.5px;font-family:var(--mono);width:56px;transition:.15s}
.inp:focus{outline:none;border-color:var(--acc3);box-shadow:0 0 0 3px rgb(139,92,246,.15)}
.sel{height:24px;background:#150f28;border:1px solid var(--line2);border-radius:6px;padding:0 22px 0 7px;font-size:11.5px;
  color:var(--text);appearance:none;/* BASE64-IMAGE: 下拉选择框箭头（UI 图标，不是封面/Logo） */ background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a99bc9' fill='none' stroke-width='1.4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 7px center;cursor:pointer}
.sel:focus{outline:none;border-color:var(--acc3)}
.tgl{height:24px;min-width:26px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line2);
  background:#150f28;color:var(--text2);font-size:11px;padding:0 7px;transition:.15s;white-space:nowrap;flex:none}
.tgl:hover{border-color:var(--line3);color:#ffffff}
.tgl.on{background:linear-gradient(135deg,rgb(139,92,246,.55),rgb(168,85,247,.35));border-color:var(--line3);color:#ffffff;
  box-shadow:0 0 12px rgb(139,92,246,.35)}
.tgl svg{width:13px;height:13px}
.mini-range{width:96px;accent-color:var(--acc2);height:18px}
.val{font-family:var(--mono);font-size:11px;color:#e9e1ff;min-width:26px;text-align:right}
.swatch-pair{display:flex;align-items:center;gap:0;position:relative;width:46px;height:26px}
.sw-main,.sw-back{position:absolute;border-radius:5px;border:1px solid rgb(255,255,255,.35);box-shadow:0 2px 6px rgb(0,0,0,.5)}
.sw-main{width:22px;height:22px;left:0;top:2px;z-index:2}
.sw-back{width:20px;height:20px;right:0;bottom:2px;z-index:1}
.sw-swap{width:12px;height:12px;position:absolute;right:-2px;top:-4px;z-index:3;color:var(--muted);cursor:pointer}
.zoom-box{display:flex;align-items:center;gap:2px;background:#120c22;border:1px solid var(--line);border-radius:8px;padding:1px}
.zoom-box button{width:24px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--text2)}
.zoom-box button:hover{background:rgb(139,92,246,.18);color:#ffffff}
.zoom-box svg{width:13px;height:13px}
.zoom-val{font-family:var(--mono);font-size:11px;min-width:44px;text-align:center;color:#e9e1ff}

/* 左侧栏开关 */
.rail-toggle{position:absolute;left:0;top:0;width:20px;height:100%;z-index:30;display:none;place-items:center;
  color:#c4b5fd;background:linear-gradient(180deg,rgb(139,92,246,.22),rgb(139,92,246,.1));border-right:1px solid var(--line2)}
.rail-toggle svg{width:16px;height:16px;color:#d8c6ff}
/* ---------- 工具栏 ---------- */
.toolrail{background:linear-gradient(180deg,#0b0716,#080510);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto;z-index:20}
.toolrail::-webkit-scrollbar{width:0}
.rail-group{display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;width:100%}
.rail-group + .rail-group{border-top:1px solid var(--line)}
.tool{width:40px;height:33px;display:grid;place-items:center;border-radius:9px;color:#c3b4e2;position:relative;transition:.16s}
.tool svg{width:18px;height:18px}
.tool:hover{background:rgb(139,92,246,.14);color:#ffffff}
.tool.on{background:linear-gradient(135deg,#8b5cf6,#a855f7 60%,#c026d3);color:#ffffff;
  box-shadow:0 3px 14px rgb(139,92,246,.5),inset 0 1px 0 rgb(255,255,255,.25)}
.tool .dot{position:absolute;right:4px;bottom:4px;width:4px;height:4px;border-radius:99px;background:var(--cyan);opacity:0}
.tool.has-sub .dot{opacity:1}

/* ---------- 画布舞台 ---------- */
.stage{position:relative;min-width:0;overflow:hidden;background:
   radial-gradient(900px 500px at 50% 0%,rgb(91,33,182,.14),transparent 70%),
   linear-gradient(180deg,#08050f,#06040c)}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgb(167,139,250,.16) 1px,transparent 1px);background-size:26px 26px}
.stage-scroll{position:absolute;inset:0;overflow:auto;display:grid;place-items:center;padding:36px;
  overscroll-behavior:contain}
.doc-wrap{position:relative;flex:none;box-shadow:var(--sh-l),0 0 0 1px rgb(196,181,253,.28);
  background-color:#1a1428;
  background-image:conic-gradient(#241a38 25%,#1a1327 0 50%,#241a38 0 75%,#1a1327 0);
  background-size:20px 20px;background-position:0 0}
.doc-wrap canvas{display:block}
#mainCanvas{position:relative;z-index:1;touch-action:none}
#overlayCanvas{position:absolute;inset:0;z-index:2;pointer-events:none}
.stage-scroll{touch-action:none}
.stage-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--muted);
  pointer-events:none;z-index:3;transition:.3s}
.stage-hint h3{font-size:14px;font-weight:600;color:#d8c9f7;margin-bottom:8px;letter-spacing:.5px}
.stage-hint p{font-size:11.5px;line-height:1.9;color:var(--dim)}
.stage-hint .k{font-family:var(--mono);color:#c4b5fd;border:1px solid var(--line2);border-radius:5px;padding:1px 5px;font-size:10px}
.stage.drag-over::after{content:"松开以导入图片";position:absolute;inset:14px;z-index:9;display:grid;place-items:center;
  border:2px dashed rgb(196,181,253,.6);border-radius:16px;background:rgb(76,29,149,.28);backdrop-filter:blur(4px);
  font-size:15px;color:#ffffff;letter-spacing:2px}
.float-note{position:absolute;left:12px;bottom:10px;z-index:5;font-size:10.5px;color:var(--dim);
  background:rgb(8,5,16,.72);border:1px solid var(--line);border-radius:99px;padding:3px 9px;pointer-events:none}

/* ---------- 右侧面板 ---------- */
.dock{background:linear-gradient(180deg,#0b0717,#090613);border-left:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;z-index:20}
.dock-tabs{display:flex;gap:2px;padding:6px 6px 0;border-bottom:1px solid var(--line);flex:none}
.dock-tab{flex:1;height:28px;display:flex;align-items:center;justify-content:center;gap:5px;border-radius:7px 7px 0 0;
  font-size:11.5px;color:var(--muted);border-bottom:2px solid transparent;transition:.15s}
.dock-tab svg{width:13px;height:13px}
.dock-tab.on{color:#ffffff;background:rgb(139,92,246,.12);border-bottom-color:var(--acc3)}
.dock-tab:hover{color:#e9def9}
.dock-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.panel{border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel-head{display:flex;align-items:center;gap:6px;height:29px;padding:0 9px;flex:none;cursor:pointer;
  background:linear-gradient(180deg,rgb(139,92,246,.07),transparent)}
.panel-head .pt{font-size:10.5px;letter-spacing:1.2px;color:#c9b8ea;font-weight:700;text-transform:uppercase}
.panel-head .pi{width:13px;height:13px;color:var(--acc3);display:grid;place-items:center}
.panel-head .pi svg{width:12px;height:12px}
.panel-head .pbtn{margin-left:auto;display:flex;gap:2px;color:var(--muted);opacity:0;transition:.15s}
.panel-head:hover .pbtn{opacity:1}
.panel-head .pbtn button{width:20px;height:20px;display:grid;place-items:center;border-radius:5px}
.panel-head .pbtn button:hover{background:rgb(139,92,246,.2);color:#ffffff}
.panel-head .pbtn svg{width:12px;height:12px}
.panel-head .chev{color:var(--dim);transition:.2s}
.panel.collapsed .chev{transform:rotate(-90deg)}
.panel.collapsed .panel-body{display:none}
.panel-body{padding:8px 9px 9px;min-height:0;overflow:auto}

/* 图层 */
.layer-top{display:flex;flex-direction:column;gap:6px;padding:7px 9px;border-bottom:1px solid var(--line);flex:none}
.layer-blend-row{display:flex;align-items:center;gap:6px}
.layer-blend-row .sel{flex:1;height:25px}
.layer-op-row{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted)}
.layer-op-row input[type=range]{flex:1}
.layer-list{flex:1;overflow:auto;min-height:96px;padding:5px 6px}
.layer-row{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:8px;margin-bottom:3px;cursor:pointer;
  border:1px solid transparent;position:relative;transition:.14s}
.layer-row:hover{background:rgb(139,92,246,.08);border-color:var(--line)}
.layer-row.on{background:linear-gradient(90deg,rgb(139,92,246,.26),rgb(139,92,246,.06));border-color:var(--line2)}
.layer-row.on::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--acc3)}
.layer-eye{width:18px;height:18px;display:grid;place-items:center;color:#cfc0ec;flex:none;border-radius:4px}
.layer-eye svg{width:14px;height:14px}
.layer-eye.off{color:#5f537b}
.layer-eye:hover{background:rgb(139,92,246,.2)}
.layer-thumb{width:30px;height:30px;flex:none;border-radius:5px;overflow:hidden;position:relative;background:#221a35;
  box-shadow:inset 0 0 0 1px rgb(255,255,255,.14);
  background-image:conic-gradient(#332a4a 25%,#2a2340 0 50%,#332a4a 0 75%,#2a2340 0);background-size:10px 10px}
.layer-thumb canvas{width:100%;height:100%;object-fit:contain;display:block}
.layer-name{flex:1;min-width:0;font-size:11.5px;color:#e4d9fa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer-name small{display:block;font-size:9px;color:var(--dim);font-family:var(--mono);letter-spacing:.4px}
.layer-badge{font-size:9px;color:#b7a6d8;border:1px solid var(--line);border-radius:4px;padding:1px 4px;flex:none}
.layer-lock{width:14px;height:14px;color:var(--dim);flex:none}
.layer-lock svg{width:12px;height:12px}

/* 颜色面板 */
.color-body{display:flex;flex-direction:column;gap:7px}
.sv-wrap{position:relative;width:100%;aspect-ratio:1.5/1;border-radius:8px;overflow:hidden;border:1px solid var(--line2)}
.sv-wrap canvas{width:100%;height:100%;display:block;cursor:crosshair}
.hue-wrap{height:14px;border-radius:99px;overflow:hidden;position:relative;border:1px solid var(--line2)}
.hue-wrap canvas{width:100%;height:100%;display:block;cursor:pointer}
.color-row{display:flex;align-items:center;gap:6px}
.color-row .hex{flex:1;height:24px;background:#150f28;border:1px solid var(--line2);border-radius:6px;padding:0 7px;
  font-family:var(--mono);font-size:11px;color:#efe6ff}
.color-row .sm{display:flex;gap:3px}
.color-row .sm button{width:15px;height:15px;border-radius:4px;border:1px solid rgb(255,255,255,.2)}
.swatch-strip{display:flex;gap:3px;flex-wrap:wrap}
.swatch-strip i{width:16px;height:16px;border-radius:4px;cursor:pointer;border:1px solid rgb(255,255,255,.16)}
.swatch-strip i:hover{transform:scale(1.12);border-color:#ffffff}

/* 导航器 */
.nav-body{padding:7px 9px}
.nav-box{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line2);background:#120c20;
  display:flex;align-items:center;justify-content:center;height:92px}
.nav-box canvas{max-width:100%;max-height:100%;display:block}
.nav-frame{position:absolute;border:1px solid var(--cyan);box-shadow:0 0 0 9999px rgb(6,4,14,.45);pointer-events:none}

/* 历史 */
.hist-list{overflow:auto;padding:4px 6px}
.hist-item{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;font-size:11px;color:var(--text2);cursor:pointer}
.hist-item:hover{background:rgb(139,92,246,.1)}
.hist-item.on{background:rgb(139,92,246,.2);color:#ffffff}
.hist-item .hi{width:12px;height:12px;color:var(--acc3)}
.hist-item .hi svg{width:11px;height:11px}
.hist-item.future{opacity:.4}
.hist-item small{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--dim)}

/* 信息 */
.info-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:10.5px;color:var(--muted)}
.info-grid b{color:#e9e1ff;font-weight:500;font-family:var(--mono);text-align:right}
.info-swatch{display:flex;align-items:center;gap:6px;margin-top:7px;font-size:10.5px;color:var(--muted)}
.info-swatch i{width:16px;height:16px;border-radius:4px;border:1px solid rgb(255,255,255,.25)}

/* ---------- 状态栏 ---------- */
.statusbar{display:flex;align-items:center;gap:14px;padding:0 11px;font-size:10.5px;color:var(--dim);
  background:linear-gradient(180deg,#0b0717,#080511);border-top:1px solid var(--line);overflow:hidden;white-space:nowrap}
.statusbar .sb-item{display:flex;align-items:center;gap:5px;flex:none}
.statusbar .sb-item svg{width:11px;height:11px;color:var(--acc3)}
.statusbar .spacer{flex:1}
.statusbar b{color:#c9b8ea;font-weight:500}
.statusbar .hint{color:#b6a6d4;overflow:hidden;text-overflow:ellipsis}

/* ---------- 通用弹窗 ---------- */
.modals{position:fixed;inset:0;z-index:120;pointer-events:none}
.modal-bg{position:absolute;inset:0;background:rgb(4,2,10,.7);backdrop-filter:blur(9px);opacity:0;transition:.18s;pointer-events:auto}
.modal-bg.on{opacity:1}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);width:min(560px,calc(100vw - 28px));
  max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:linear-gradient(170deg,#140e26,#0b0717);
  border:1px solid var(--line2);border-radius:16px;box-shadow:var(--sh-l),inset 0 1px 0 rgb(255,255,255,.05);
  opacity:0;pointer-events:auto;transition:.18s;overflow:hidden}
.modal.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.modal.wide{width:min(860px,calc(100vw - 24px))}
.modal-head{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--line);flex:none;
  background:linear-gradient(90deg,rgb(139,92,246,.14),transparent)}
.modal-head .mh-ico{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;color:#ffffff;
  background:linear-gradient(135deg,#8b5cf6,#c026d3);box-shadow:0 3px 12px rgb(139,92,246,.4)}
.modal-head .mh-ico svg{width:15px;height:15px}
.modal-head h3{font-size:13.5px;font-weight:700;letter-spacing:.4px}
.modal-head p{font-size:10.5px;color:var(--muted);margin-top:2px}
.modal-head .close{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted)}
.modal-head .close:hover{background:rgb(251,113,133,.16);color:#ffd0d6}
.modal-head .close svg{width:14px;height:14px}
.modal-body{padding:14px 15px;overflow:auto;min-height:0}
.modal-foot{display:flex;align-items:center;gap:8px;padding:11px 15px;border-top:1px solid var(--line);flex:none;
  background:rgb(10,6,20,.6)}
.modal-foot .l{margin-right:auto;display:flex;gap:7px}
.modal-foot .r{margin-left:auto;display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;border-radius:8px;font-size:12px;
  border:1px solid var(--line2);color:#e8dcff;background:rgb(139,92,246,.1);transition:.16s;white-space:nowrap}
.btn:hover{background:rgb(139,92,246,.22);border-color:var(--line3)}
.btn:active{transform:scale(.98)}
.btn svg{width:14px;height:14px}
.btn.primary{background:linear-gradient(135deg,#8b5cf6,#a855f7 55%,#d946ef);border-color:transparent;color:#ffffff;font-weight:700;
  box-shadow:0 6px 18px rgb(124,58,237,.4)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.danger{color:#ffd0d6;border-color:rgb(251,113,133,.35)}
.btn.sm{height:25px;padding:0 9px;font-size:11px;border-radius:6px}

/* 表单 */
.form{display:flex;flex-direction:column;gap:11px}
.frow{display:flex;align-items:center;gap:9px}
.frow > label{width:86px;flex:none;font-size:11.5px;color:var(--text2)}
.frow > .ctl{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
.frow .unit{font-size:10px;color:var(--dim);flex:none}
.num{height:28px;background:#150f28;border:1px solid var(--line2);border-radius:7px;padding:0 8px;
  font-family:var(--mono);font-size:12px;color:#f2edff;width:100%;min-width:0}
.num:focus{outline:none;border-color:var(--acc3);box-shadow:0 0 0 3px rgb(139,92,246,.16)}
.txt{height:28px;background:#150f28;border:1px solid var(--line2);border-radius:7px;padding:0 9px;width:100%;
  font-size:12px;color:#f2edff}
.txt:focus{outline:none;border-color:var(--acc3);box-shadow:0 0 0 3px rgb(139,92,246,.16)}
textarea.txt{height:auto;min-height:62px;padding:8px 9px;line-height:1.6;resize:vertical}
.dropdown-sel{height:28px;background:#150f28;border:1px solid var(--line2);border-radius:7px;padding:0 24px 0 8px;width:100%;
  font-size:12px;color:#f2edff;appearance:none;/* BASE64-IMAGE: 下拉选择框箭头（UI 图标，不是封面/Logo） */ background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23a99bc9' fill='none' stroke-width='1.4'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 8px center;cursor:pointer}
.rng{width:100%;accent-color:var(--acc2)}
.rng-val{font-family:var(--mono);font-size:11px;color:#e9e1ff;width:46px;text-align:right;flex:none}
.chk{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--text2);cursor:pointer}
.chk input{width:15px;height:15px;accent-color:var(--acc2)}
.note{font-size:10.5px;color:var(--dim);line-height:1.7;padding:7px 9px;border-radius:8px;background:rgb(139,92,246,.07);
  border:1px solid var(--line)}
.tabs{display:flex;gap:4px;padding:4px;border-radius:9px;background:rgb(8,5,16,.6);border:1px solid var(--line);margin-bottom:12px}
.tab{flex:1;height:28px;border-radius:6px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.tab.on{background:linear-gradient(135deg,rgb(139,92,246,.45),rgb(168,85,247,.25));color:#ffffff;box-shadow:inset 0 0 0 1px var(--line2)}
.tab svg{width:12px;height:12px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.dropzone{border:1px dashed var(--line2);border-radius:10px;background:rgb(139,92,246,.06);padding:14px;text-align:center;
  cursor:pointer;transition:.16s;position:relative;overflow:hidden}
.dropzone:hover,.dropzone.on{border-color:var(--acc3);background:rgb(139,92,246,.14);box-shadow:0 0 0 3px rgb(139,92,246,.1)}
.dropzone svg{width:22px;height:22px;color:var(--acc3);margin-bottom:5px}
.dropzone p{font-size:11px;color:var(--muted);line-height:1.6}
.dropzone img{max-width:100%;max-height:120px;object-fit:contain;display:block;margin:0 auto;border-radius:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px;margin-top:9px;max-height:150px;overflow:auto}
.thumbs .th{position:relative;border-radius:7px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:#120c20}
.thumbs .th img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .th span{position:absolute;left:0;right:0;bottom:0;font-size:8px;padding:1px 3px;background:rgb(6,4,14,.76);
  color:#d9ccf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{font-family:var(--mono);font-size:10px;color:#a596c6;background:rgb(6,4,14,.7);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;max-height:110px;overflow:auto;line-height:1.7}
.log .ok{color:#86efac}.log .err{color:#fda4af}

/* ---------- 影盾入口格 ---------- */
.sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.sh-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:66px;border-radius:10px;
  border:1px solid var(--line);background:linear-gradient(160deg,rgb(139,92,246,.12),rgb(139,92,246,.02));
  color:#d9caf5;font-size:11px;transition:.15s}
.sh-tile svg{width:18px;height:18px;color:var(--acc3)}
.sh-tile:hover{border-color:var(--line2);background:linear-gradient(160deg,rgb(139,92,246,.24),rgb(139,92,246,.06));
  color:#ffffff;transform:translateY(-1px)}

/* ---------- 影盾工作台（左侧边栏） ---------- */
.drawer-mask{position:fixed;inset:0;z-index:100;background:rgb(4,2,10,.55);backdrop-filter:blur(3px);opacity:0;
  pointer-events:none;transition:.2s}
.drawer-mask.on{opacity:1;pointer-events:auto}
.drawer{position:relative;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:linear-gradient(180deg,#120c22,#080511);border-right:1px solid var(--line2)}
.drawer.on{display:flex}
.drawer-head{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line);flex:none}
.drawer-head .dh-ico{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;
  background:linear-gradient(135deg,#8b5cf6,#a78bfa);color:#ffffff}
.drawer-head .dh-ico svg{width:15px;height:15px}
.drawer-head h3{font-size:13px;font-weight:700}
.drawer-head small{display:block;font-size:9.5px;color:var(--dim);letter-spacing:.6px;margin-top:1px}
.drawer-head .close{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border-radius:7px;color:var(--muted)}
.drawer-head .close:hover{background:rgb(251,113,133,.16);color:#ffd0d6}
.drawer-head .close svg{width:14px;height:14px}
.drawer-scroll{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.drawer-nav{display:flex;flex-direction:column;gap:2px;padding:7px 8px 9px;border-bottom:1px solid var(--line)}
.dn-item{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:9px;font-size:12px;text-align:left;width:100%;
  color:var(--muted);border:1px solid transparent;transition:.16s;position:relative}
.dn-item .dn-ico{width:24px;height:24px;flex:none;display:grid;place-items:center;border-radius:7px;
  background:rgb(139,92,246,.14);color:#d5c6ff}
.dn-item .dn-ico svg{width:14px;height:14px}
.dn-item .dn-txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.dn-item .dn-txt b{font-size:12px;font-weight:600;color:#ddd6f3;letter-spacing:.2px}
.dn-item .dn-txt i{display:none;font-style:normal;font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-item.on .dn-txt i{display:block}
.dn-item .dn-arrow{margin-left:auto;flex:none;opacity:.5;transition:.16s}
.dn-item .dn-arrow svg{width:12px;height:12px}
.dn-item:hover{background:rgb(139,92,246,.1);color:#ffffff;border-color:var(--line)}
.dn-item.on{background:linear-gradient(90deg,rgb(139,92,246,.3),rgb(168,85,247,.1));border-color:var(--line2);color:#ffffff}
.dn-item.on .dn-txt b{color:#ffffff}
.dn-item.on .dn-ico{background:rgb(139,92,246,.34);color:#ffffff}
.dn-item.on .dn-arrow{opacity:1;color:#c4b5fd;transform:rotate(90deg)}
.drawer-body{padding:13px 14px 20px}
.sh-block{display:flex;flex-direction:column;gap:10px}
.sh-block-head{display:flex;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.1em;color:var(--dim);margin-bottom:3px}
.sh-block-head svg{width:12px;height:12px;color:#a78bfa;transform:rotate(90deg)}
.drawer-body:empty{display:none}
.sh-pane{display:none;flex-direction:column;gap:11px}
.sh-pane.on{display:flex}
.pane-title{font-size:11px;color:#cbb8ea;letter-spacing:.6px;font-weight:700;display:flex;align-items:center;gap:6px}
.pane-title svg{width:13px;height:13px;color:var(--acc3)}
.pane-desc{font-size:10.5px;color:var(--dim);line-height:1.7}
.seg{display:flex;gap:3px;padding:3px;border-radius:8px;background:rgb(8,5,16,.62);border:1px solid var(--line)}
.seg button{flex:1;height:26px;border-radius:6px;font-size:11px;color:var(--muted)}
.seg button.on{background:linear-gradient(135deg,rgb(139,92,246,.5),rgb(168,85,247,.28));color:#ffffff}
.result-box{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.result-box .rb{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--muted)}
.result-box img{max-height:150px;border-radius:8px;border:1px solid var(--line2);display:block;margin:0 auto}
.cta{width:100%;height:40px;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#a855f7 55%,#e879f9);color:#ffffff;font-weight:700;
  font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 22px rgb(139,92,246,.36)}
.cta:hover{filter:brightness(1.07)}
.cta:disabled{opacity:.55;filter:none;box-shadow:none;cursor:default}
.cta svg{width:15px;height:15px}
.cta span{font-size:12.5px;letter-spacing:.4px}
.cta.alt{background:rgb(139,92,246,.14);border:1px solid var(--line2);color:#e9defb;box-shadow:none;font-weight:600}

/* ---------- 提示 ---------- */
.toasts{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:150;display:flex;flex-direction:column;gap:7px;
  align-items:center;pointer-events:none;width:min(440px,calc(100vw - 24px))}
.toast{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;font-size:11.5px;color:#f4eeff;
  background:linear-gradient(135deg,rgb(30,18,52,.96),rgb(14,9,26,.96));border:1px solid var(--line2);
  box-shadow:0 12px 34px rgb(0,0,0,.5);animation:tin .22s ease}
.toast svg{width:14px;height:14px;color:var(--acc3)}
.toast.ok svg{color:var(--ok)}.toast.err svg{color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tip{position:fixed;z-index:70;padding:5px 8px;border-radius:6px;font-size:10.5px;color:#f0e9ff;
  background:rgb(14,9,26,.96);border:1px solid var(--line2);pointer-events:none;opacity:0;transition:opacity .12s;
  white-space:nowrap;box-shadow:0 8px 20px rgb(0,0,0,.5)}
.tip.on{opacity:1}

/* ---------- 响应式 ---------- */
@media(min-width:961px){
  .main.nodock{grid-template-columns:58px minmax(0,1fr)!important}
  .main.nodock .dock{display:none}
}
@media(max-width:1180px){
  .main{grid-template-columns:54px minmax(0,1fr) 272px}
  .menus .menu-btn{padding:5px 7px}
}
@media(max-width:1180px){
  .main{grid-template-columns:58px 0 minmax(0,1fr) 272px}
  body.side-open .main{grid-template-columns:58px 320px minmax(0,1fr) 272px}
}
@media(max-width:960px){
  .brand-tag{display:none}
  .main{grid-template-columns:56px 0 minmax(0,1fr)!important}
  body.side-open .main{grid-template-columns:56px 300px minmax(0,1fr)!important}
  .toolrail{width:56px;flex-direction:column;overflow-y:auto;overflow-x:hidden}
  .rail-group{flex-direction:column;padding:0;width:100%}
  .rail-group + .rail-group{border-top:1px solid var(--line);border-left:0;margin:0;padding:0}
  .tool{width:44px;height:38px;flex:none}
  .dock{position:fixed;right:0;top:84px;bottom:0;width:min(300px,86vw);transform:translateX(102%);transition:transform .24s;
    box-shadow:-20px 0 60px rgb(0,0,0,.6);z-index:90;border-left:1px solid var(--line2)}
  .dock.on{transform:none}
  .optionsbar{height:auto;min-height:44px;flex-wrap:nowrap;padding:5px 8px}
  .opt-controls{gap:7px}
  .app{grid-template-rows:40px auto minmax(0,1fr) 26px}
  .stage-scroll{padding:16px}
}
/* 手机竖屏：侧栏浮层，默认收起，左上角按钮展开 */
@media(max-width:760px) and (orientation:portrait){
  .main{grid-template-columns:minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important}
  .rail-toggle{display:grid;position:fixed;left:8px;top:88px;width:44px;height:44px;transform:none;
    border-radius:12px;border:1px solid rgb(196,181,253,.32);
    background:linear-gradient(135deg,rgb(139,92,246,.55),rgb(192,38,211,.4));
    box-shadow:0 8px 24px rgb(88,28,135,.5),inset 0 1px 0 rgb(255,255,255,.25);backdrop-filter:blur(6px)}
  .rail-toggle svg{width:19px;height:19px;color:#f5f0ff}
  body.side-open .rail-toggle{left:auto;right:8px;background:rgb(12,7,23,.72)}
  .rail-toggle{max-width:44px}
  .toolrail{position:fixed;left:0;top:84px;bottom:0;width:56px!important;height:auto;z-index:96;
    transform:translateX(-104%);transition:transform .22s;box-shadow:14px 0 40px rgb(0,0,0,.5)}
  body.side-open .toolrail{transform:none}
  .drawer{position:fixed;left:56px;top:84px;bottom:0;height:auto;width:min(320px,calc(100vw - 56px));z-index:95;
    transform:translateX(calc(-100% - 60px));transition:transform .24s;box-shadow:18px 0 50px rgb(0,0,0,.55)}
  body.side-open .drawer{transform:none}
  .drawer-mask{z-index:93}
  body.side-open .drawer-mask{opacity:1;pointer-events:auto}
  .statusbar{display:none}
}
@media(min-width:900px) and (max-width:1180px){
  .app{grid-template-rows:40px auto minmax(0,1fr) 26px!important}
  .optionsbar{height:auto;min-height:46px;flex-wrap:wrap;padding:6px 10px;row-gap:5px;overflow:visible}
  .opt-controls{flex-wrap:wrap;overflow:visible}
  .opt-right{position:static;margin-left:auto}
}
@media(max-width:1500px){
  .opt-right{gap:6px}
  #zoomFit{display:none}
  .zoom-val{width:34px;font-size:10px}
}
@media(max-width:560px){
  .menubar{padding:0 7px;gap:3px}
  .menus{display:none}
  #btnMenuSheet{display:grid!important}
  .ms-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
  .ms-menu{display:flex;align-items:center;gap:8px;padding:11px 10px;border-radius:10px;background:rgb(139,92,246,.08);border:1px solid var(--line);color:#ddd6f3;font-size:12.5px}
  .ms-menu svg{width:16px;height:16px;color:#c4b5fd}
  .ms-menu i{margin-left:auto;font-style:normal;font-size:10px;color:var(--dim)}
  .ms-items{display:flex;flex-direction:column;gap:2px;margin-top:10px;max-height:56vh;overflow:auto}
  .ms-item{display:flex;align-items:center;gap:9px;padding:10px 8px;border-radius:9px;color:#e6dff8;font-size:12.5px}
  .ms-item svg{width:15px;height:15px;color:#b9a6e6}
  .ms-item .kbd{margin-left:auto;font-size:10px;color:var(--dim)}
  .ms-back{align-self:flex-start;padding:5px 9px;font-size:11.5px}
  .zoom-box{display:none}
  .opt-right{gap:6px}
  .brand-text{display:none}
  .menu-btn{padding:5px 5px;font-size:11.5px}
  .menubar-right .pill-btn span{display:none}
  .menubar-right{gap:4px}
  .pill-btn{padding:0;width:30px;height:26px;justify-content:center}
  .opt-tool .tname{display:none}
  .modal{width:calc(100vw - 16px);max-height:calc(100vh - 24px)}
  .frow > label{width:74px;font-size:11px}
  .statusbar{gap:9px;font-size:9.5px}
  .statusbar .sb-hide{display:none}
  .drawer{width:min(320px,calc(100vw - 56px))}
}
/* ===== 视觉精修 v10：层次 / 滑杆 / 工具栏 / 面板质感 ===== */
:root{--panel:#100a1e;--panel2:#150d27;--panel3:#1b1233}
.app{grid-template-rows:40px 46px 1fr 26px}
.menubar{height:40px;padding:0 12px;gap:8px;
  background:linear-gradient(180deg,rgb(25,15,46,.94),rgb(11,7,23,.94));
  border-bottom:1px solid var(--line2);box-shadow:0 1px 0 rgb(196,181,253,.06)}
.brand-mark{width:27px;height:27px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#d946ef);
  border-color:rgb(216,180,254,.35);box-shadow:0 4px 14px rgb(139,92,246,.42)}
.brand-mark svg{color:#ffffff}
.menu-btn{padding:6px 10px;border-radius:8px;font-size:12.5px}
.menu-btn:hover{background:rgb(139,92,246,.18)}
.pill-btn{height:29px}
.toolrail{width:60px;gap:4px;padding:9px 0}
.tool{width:44px;height:36px;border-radius:11px}
.tool:hover{background:rgb(139,92,246,.16)}
.tool.on{box-shadow:0 4px 16px rgb(139,92,246,.5),inset 0 1px 0 rgb(255,255,255,.28)}
/* 滑杆精修 */
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:99px;
  background:linear-gradient(90deg,rgb(139,92,246,.6),rgb(192,132,252,.32))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;margin-top:-5px;border-radius:50%;
  background:#ffffff;border:3px solid var(--acc2);box-shadow:0 2px 8px rgb(139,92,246,.55)}
input[type=range]::-moz-range-track{height:5px;border-radius:99px;background:rgb(139,92,246,.4)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#ffffff;border:3px solid var(--acc2)}
/* 面板与图层 */
.dock{background:linear-gradient(180deg,#0e0919,#0a0613)}
.dock-tab{border-radius:9px 9px 0 0;font-weight:600}
.layer-row{border-radius:10px}
.inp,.sel,.num,.txt,.dropdown-sel{background:#171029}
.doc-wrap{border-radius:5px}
.stage{background:radial-gradient(900px 500px at 50% 0%,rgb(91,33,182,.16),transparent 70%),linear-gradient(180deg,#07040e,#05030a)}
/* 抽屉导航 */
.dn-item{border-radius:10px;padding:9px 2px}
.dn-item.on{background:linear-gradient(135deg,rgb(139,92,246,.3),rgb(168,85,247,.14));
  box-shadow:inset 0 0 0 1px var(--line2)}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="app">
  <header class="menubar">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" style="color:#cbb8ff"><path d="M12 3 21 20H3L12 3z" opacity=".9"/><path d="M7.5 14.5h9" opacity=".7"/></svg></div>
      <span class="brand-text">巳泷图像工坊</span>
      <span class="brand-tag">影盾版 v12</span>
    </div>
    <button class="icon-btn" id="btnMenuSheet" title="全部菜单" aria-label="全部菜单" style="display:none;margin-left:2px">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav class="menus" id="menus" aria-label="主菜单"></nav>
    <div class="menubar-right">
      <button class="icon-btn" id="btnUndo" title="撤销 (Ctrl+Z)" aria-label="撤销"></button>
      <button class="icon-btn" id="btnRedo" title="重做 (Ctrl+Shift+Z)" aria-label="重做"></button>
      <button class="pill-btn" id="btnDockToggle" title="图层与颜色面板">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><rect x="13" y="7" width="5" height="10" rx="1" fill="currentColor" opacity=".35"/></svg>
        <span>面板</span>
      </button>
      <button class="pill-btn solid" id="btnExport" title="导出图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 4v10m0 0 4-4m-4 4-4-4"/><path d="M5 16v3h14v-3"/></svg>
        <span>导出</span>
      </button>
    </div>
  </header>

  <div class="optionsbar" id="optionsbar">
    <div class="opt-tool" id="optTool"></div>
    <div class="opt-controls" id="optControls"></div>
    <div class="opt-right">
      <div class="swatch-pair" title="前景色 / 背景色">
        <div class="sw-main" id="swMain"></div>
        <div class="sw-back" id="swBack"></div>
        <svg class="sw-swap" id="swSwap" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 7h7v7" opacity=".9"/><path d="M17 17h-7v-7" opacity=".9"/></svg>
      </div>
      <div class="zoom-box">
        <button id="zoomOut" title="缩小"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
        <span class="zoom-val" id="zoomVal">100%</span>
        <button id="zoomIn" title="放大"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zoomFit" title="适应窗口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 4H4v5M15 4h5v5M15 20h5v-5M9 20H4v-5"/></svg></button>
      </div>
    </div>
  </div>

  <div class="main">
    <button class="rail-toggle" id="btnSide" title="展开 / 收起功能侧边栏" aria-label="功能侧边栏">
      <span class="rt-ico"></span>
    </button>
    <aside class="toolrail" id="toolrail" aria-label="工具箱"></aside>

    <aside class="drawer" id="drawer" aria-label="影盾工作台">
      <div class="drawer-head">
        <div class="dh-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3 19 6v6c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6l7-3z"/></svg></div>
        <div>
          <h3>影盾工具箱</h3>
          <small>10 个模块 · 纯本地运行</small>
        </div>
        <button class="close" id="drawerClose" aria-label="收起侧边栏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <div class="drawer-scroll">
        <div class="drawer-nav" id="drawerNav"></div>
        <div class="drawer-body" id="drawerBody"></div>
      </div>
    </aside>

    <section class="stage" id="stage">
      <div class="stage-scroll" id="stageScroll">
        <div class="doc-wrap" id="docWrap">
          <canvas id="mainCanvas"></canvas>
          <canvas id="overlayCanvas"></canvas>
        </div>
      </div>
      <div class="stage-hint" id="stageHint">
        <h3>图像工作台已就绪</h3>
        <p>把图片拖进来，或 <span class="k">Ctrl+V</span> 粘贴截图<br>从「文件 → 新建」开始一张空白画布</p>
      </div>
      <div class="float-note" id="floatNote">画笔 · 尺寸 24px · 不透明度 100%</div>
    </section>

    <aside class="dock" id="dock">
      <div class="dock-tabs" id="dockTabs"></div>
      <div class="dock-body" id="dockBody"></div>
    </aside>
  </div>

  <footer class="statusbar">
    <div class="sb-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="5" width="16" height="14" rx="2"/></svg><b id="sbSize">—</b></div>
    <div class="sb-item sb-hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4h4M4 4v4M20 4h-4M20 4v4M20 20h-4M20 20v-4M4 20h4M4 20v-4"/></svg><b id="sbPos">0, 0</b></div>
    <div class="sb-item sb-hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="5"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3"/></svg><b id="sbZoom">100%</b></div>
    <div class="sb-item sb-hide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 4 4 8l8 4 8-4-8-4z"/><path d="M4 12l8 4 8-4M4 16l8 4 8-4"/></svg><b id="sbLayers">1</b> 图层</div>
    <div class="spacer"></div>
    <div class="hint" id="sbHint">就绪 · 拖入图片或从文件菜单开始</div>
  </footer>
</div>

<div class="modals" id="modals"></div>
<div class="drawer-mask" id="drawerMask"></div>
<div class="toasts" id="toasts"></div>
<div class="tip" id="tip"></div>
<input type="file" id="fileInput" accept="image/*,.psd,.slproj,.json" hidden multiple>

function ic(n,cls){const p=P[n]||P.sparkle;return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ${cls?`class="${cls}"`:''}>${p}</svg>`}

/* ---------- 基础工具 ---------- */
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function cloneCanvas(src){const c=mkCanvas(src.width,src.height);c.getContext('2d').drawImage(src,0,0);return c}
/* 同步取当前文档完整合成结果，供取样类工具使用（不依赖屏幕画布渲染时机） */
function compositeCanvas(){const c=mkCanvas(S.doc.w,S.doc.h);composite(c.getContext('2d'),true);return c}
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}
function rgb2hex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function rgb2hsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;const s=mx?d/mx:0, v=mx;
  if(d){if(mx===r)h=((g-b)/d+(g<b?6:0));else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h/=6}return{h:h*360,s:v*100? s*100:s*100,v:v*100}}
function hsv2rgb(h,s,v){h=(h%360+360)%360;s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r,g,b;
  if(h<60){r=c;g=x;b=0}else if(h<120){r=x;g=c;b=0}else if(h<180){r=0;g=c;b=x}else if(h<240){r=0;g=x;b=c}else if(h<300){r=x;g=0;b=c}else{r=c;g=0;b=x}
  return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
function fmtBytes(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}
function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();if(url.startsWith('blob:'))URL.revokeObjectURL(url)},1200)}
function toast(msg,kind='info',ms=2400){const t=document.createElement('div');t.className='toast '+kind;
  t.innerHTML=ic(kind==='ok'?'check':kind==='err'?'info':'sparkle')+`<span>${msg}</span>`;toasts.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-6px)';setTimeout(()=>t.remove(),260)},ms)}
let tipTimer=0;
function showTip(el,txt){const t=$('#tip');t.textContent=txt;t.classList.add('on');const r=el.getBoundingClientRect();
  t.style.left=Math.round(clamp(r.right+8,6,window.innerWidth-t.offsetWidth-6))+'px';t.style.top=Math.round(r.top+r.height/2-14)+'px';
  clearTimeout(tipTimer);tipTimer=setTimeout(()=>t.classList.remove('on'),1400)}

/* ---------- 文档与图层 ---------- */
function newLayer(name,canvas){
  const c=canvas||mkCanvas(S.doc?S.doc.w:800,S.doc?S.doc.h:600);
  return {id:uid(),name:name||'图层',canvas:c,ctx:c.getContext('2d'),visible:true,opacity:100,blend:'source-over',
    ox:0,oy:0,lock:false,thumb:null};
}
function layerAt(i){return S.doc.layers[i]}
function active(){return S.doc.layers[S.doc.active]}
function newDoc(w,h,bg){
  w=clamp(Math.round(w),1,8000);h=clamp(Math.round(h),1,8000);
  const c=mkCanvas(w,h);
  if(bg&&bg!=='transparent'){const x=c.getContext('2d');x.fillStyle=bg==='white'?'#ffffff':bg;x.fillRect(0,0,w,h)}
  S.doc={w, h, layers:[], active:0, name:'未命名文档', pathBg:bg||'transparent'};
  const base={id:uid(),name:bg&&bg!=='transparent'?'背景':'图层 1',canvas:c,ctx:c.getContext('2d'),
    visible:true,opacity:100,blend:'source-over',ox:0,oy:0,lock:false,thumb:null};
  S.doc.layers.push(base);
  S.sel=null; S.hist=[];S.hIdx=-1;
  resizeSurfaces(); render(); pushHistory('新建文档');
  $('#stageHint').style.display='none';
  fitView(); syncAll();
}
function resizeSurfaces(){
  const d=S.doc,mc=$('#mainCanvas'),oc=$('#overlayCanvas');
  mc.width=d.w;mc.height=d.h;oc.width=d.w;oc.height=d.h;
  applyZoomUI();
}
function applyZoomUI(){
  const d=S.doc,mc=$('#mainCanvas'),oc=$('#overlayCanvas'),z=S.view.zoom;
  mc.style.width=oc.style.width=(d.w*z)+'px';mc.style.height=oc.style.height=(d.h*z)+'px';
  $('#docWrap').style.width=(d.w*z)+'px';$('#docWrap').style.height=(d.h*z)+'px';
  $('#zoomVal').textContent=Math.round(z*100)+'%';$('#sbZoom').textContent=Math.round(z*100)+'%';
}
function fitView(){
  if(!S.doc)return;const st=$('#stageScroll'),pad=70;
  const avW=st.clientWidth-pad,avH=st.clientHeight-pad;
  const z=clamp(Math.min(avW/S.doc.w,avH/S.doc.h),0.03,4);
  S.view.zoom=z;S.view.fit=true;applyZoomUI();render();drawOverlay();
}
function setZoom(z,cx,cy){
  if(!S.doc)return;z=clamp(z,0.03,32);const st=$('#stageScroll');
  const r=$('#mainCanvas').getBoundingClientRect();
  const ox=cx!=null?(cx-r.left)/S.view.zoom:null,oy=cy!=null?(cy-r.top)/S.view.zoom:null;
  S.view.zoom=z;S.view.fit=false;applyZoomUI();render();drawOverlay();
  if(ox!=null){const nr=$('#mainCanvas').getBoundingClientRect();
    st.scrollLeft+=(nr.left+cx-ox*S.view.zoom)-(st.getBoundingClientRect().left+cx);
    st.scrollTop+=(nr.top+cy-oy*S.view.zoom)-(st.getBoundingClientRect().top+cy);}
  syncStatus();
}

/* ---------- 合成渲染 ---------- */
function composite(ctx,skipStroke){
  const d=S.doc;if(!d)return;
  ctx.save();ctx.clearRect(0,0,d.w,d.h);
  for(let i=0;i<d.layers.length;i++){
    const L=d.layers[i];if(!L.visible)continue;
    ctx.globalAlpha=clamp(L.opacity/100,0,1);
    ctx.globalCompositeOperation=L.blend||'source-over';
    ctx.drawImage(L.canvas,L.ox,L.oy);
  }
  const st=S.stroke;
  if(st&&!skipStroke){
    ctx.globalAlpha=clamp((st.opacity??100)/100,0,1);
    ctx.globalCompositeOperation=st.mode==='erase'?'destination-out':'source-over';
    ctx.drawImage(st.buf,0,0);
  }
  ctx.restore();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
let rafPending=false;
function render(){if(!S.doc)return;if(rafPending)return;rafPending=true;
  requestAnimationFrame(()=>{rafPending=false;const mc=$('#mainCanvas');if(!mc.width)return;
    composite(mc.getContext('2d'));drawOverlay();updateNav();syncStatus()})}

/* ---------- 选区 ---------- */
function selMask(){return S.sel?S.sel.mask:null}
function setSelFromMask(mask,bounds,outline,kind){
  S.sel={mask, bounds, outline, kind};S.clip=null;drawOverlay();syncStatus();
}
function clearSel(){S.sel=null;S.clip=null;drawOverlay();toast('已取消选择')}
function rectSel(x,y,w,h){
  const d=S.doc;x=Math.round(x);y=Math.round(y);w=Math.round(w);h=Math.round(h);
  const mask=mkCanvas(d.w,d.h),m=mask.getContext('2d');
  m.fillStyle='#ffffff';m.fillRect(x,y,w,h);
  setSelFromMask(mask,{x,y,w,h},[{x,y},{x:w,y},{x:w,y:h},{x,y:h}],'rect');
}
function ellipseSel(x,y,w,h){
  const d=S.doc;const mask=mkCanvas(d.w,d.h),m=mask.getContext('2d');
  m.fillStyle='#ffffff';m.beginPath();m.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,7);m.fill();
  const pts=[];for(let i=0;i<=72;i++){const a=i/72*Math.PI*2;pts.push({x:x+w/2+Math.cos(a)*w/2,y:y+h/2+Math.sin(a)*h/2})}
  setSelFromMask(mask,{x,y,w,h},pts,'ellipse');
}
function lassoMask(pts){
  const d=S.doc;let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  pts.forEach(p=>{minx=Math.min(minx,p.x);miny=Math.min(miny,p.y);maxx=Math.max(maxx,p.x);maxy=Math.max(maxy,p.y)});
  const mask=mkCanvas(d.w,d.h),m=mask.getContext('2d');
  m.fillStyle='#ffffff';m.beginPath();pts.forEach((p,i)=>i?m.lineTo(p.x,p.y):m.moveTo(p.x,p.y));m.closePath();m.fill();
  setSelFromMask(mask,{x:minx,y:miny,w:maxx-minx,h:maxy-miny},pts,'lasso');
}
function selClip(ctx){
  if(!S.sel||!S.sel.outline)return false;
  const mo=S.sel.mask.getContext('2d').getImageData(0,0,S.doc.w,S.doc.h).data;
  // 仅当为矩形/椭圆/套索且轮廓为纯路径时用 clip
  const o=S.sel.outline;
  ctx.beginPath();
  if(S.sel.kind==='ellipse'){const b=S.sel.bounds;ctx.ellipse(b.x+b.w/2,b.y+b.h/2,b.w/2,b.h/2,0,0,7)}
  else o.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  if(S.sel.kind!=='rect')ctx.closePath();
  ctx.clip();return true;
}
function maskAlpha(x,y){
  if(!S.sel)return 255;
  const m=S.sel.mctx;
  if(!m){S.sel.mctx=S.sel.mask.getContext('2d');}
  if(x<0||y<0||x>=S.doc.w||y>=S.doc.h)return 0;
  return S.sel.mask.getContext('2d').getImageData(x,y,1,1).data[3];
}
function selContains(x,y){return maskAlpha(x,y)>40}

/* ---------- 文字/图形/滤镜的选区应用 ---------- */
function applyToLayerMasked(L,temp,op,blend){
  const d=S.doc;
  if(S.sel){
    const t=temp.getContext('2d');
    const id=t.getImageData(0,0,d.w,d.h),mm=S.sel.mask.getContext('2d').getImageData(0,0,d.w,d.h).data;
    for(let i=3;i<id.data.length;i+=4){id.data[i]=Math.round(id.data[i]*mm[i]/255)}
    t.putImageData(id,0,0);
  }
  L.ctx.save();
  L.ctx.globalAlpha=clamp((op??100)/100,0,1);
  L.ctx.globalCompositeOperation=blend||'source-over';
  L.ctx.drawImage(temp,0,0);
  L.ctx.restore();
  markLayerDirty(L);
}

/* ---------- 历史 ---------- */
function snapshot(){
  const d=S.doc;if(!d)return null;
  return {w:d.w,h:d.h,active:d.active,layers:d.layers.map(L=>({id:L.id,name:L.name,visible:L.visible,opacity:L.opacity,
    blend:L.blend,ox:L.ox,oy:L.oy,lock:L.lock,canvas:cloneCanvas(L.canvas) })), name:d.name};
}
function restoreSnapshot(s){
  const d=S.doc;d.w=s.w;d.h=s.h;d.name=s.name;d.active=clamp(s.active,0,s.layers.length-1);
  d.layers=s.layers.map(L=>{const c=cloneCanvas(L.canvas);return {...L,canvas:c,ctx:c.getContext('2d'),thumb:null}});
  S.doc.w=s.w;S.doc.h=s.h;resizeSurfaces();render();syncAll();
}
function pushHistory(label){
  if(!S.doc)return;
  const s=snapshot();if(!s)return;
  S.hist=S.hist.slice(0,S.hIdx+1);
  S.hist.push({label,state:s});
  if(S.hist.length>18){S.hist.shift()}
  S.hIdx=S.hist.length-1;
  renderHistory();updateUndoButtons();
}
function undo(){if(S.hIdx<=0){toast('没有更多可撤销的操作');return}
  S.hIdx--;restoreSnapshot(S.hist[S.hIdx].state);renderHistory();updateUndoButtons();toast('撤销：'+S.hist[S.hIdx+1].label)}
function redo(){if(S.hIdx>=S.hist.length-1){toast('没有可重做的操作');return}
  S.hIdx++;restoreSnapshot(S.hist[S.hIdx].state);renderHistory();updateUndoButtons();toast('重做：'+S.hist[S.hIdx].label)}
function jumpHistory(i){if(i===S.hIdx)return;S.hIdx=i;restoreSnapshot(S.hist[i].state);renderHistory();updateUndoButtons()}
function updateUndoButtons(){
  const u=$('#btnUndo'),r=$('#btnRedo');if(u)u.disabled=S.hIdx<=0;if(r)r.disabled=S.hIdx>=S.hist.length-1;
}
</script>

/* ---------- 菜单渲染 ---------- */
let openMenuEl=null,openMenuKey=null;
const MENU_ICON={file:'folder',edit:'pencil',image:'image',layer:'layers',select:'marquee',adjust:'adjust',filter:'filter',view:'eye',shield:'shield',help:'info'};
function openMenuSheet(){
  const grid=MENUS.map(m=>`<button class="ms-menu" data-k="${m.key}">${ic(MENU_ICON[m.key]||'gridSmall')}<span>${m.label}</span><i>${m.items.filter(x=>!x.sep).length}</i></button>`).join('');
  const box=openModal({title:'全部菜单',sub:'按菜单 → 功能逐项选择',icon:'gridSmall',wide:true,
    body:`<div class="ms-grid">${grid}</div>`,footer:'<button class="btn" data-x="cancel">关闭</button>'});
  box.panel.querySelectorAll('.ms-menu').forEach(b=>b.onclick=()=>showMenuSheet(b.dataset.k,box));
}
function showMenuSheet(key,box){
  const menu=MENUS.find(m=>m.key===key);if(!menu)return;
  box.panel.querySelector('.modal-head h3').textContent=menu.label;
  box.panel.querySelector('.modal-head p').textContent='共 '+menu.items.filter(x=>!x.sep).length+' 项';
  const body=box.panel.querySelector('.modal-body');
  body.innerHTML=`<button class="btn ghost ms-back">‹ 返回</button><div class="ms-items">`+
    menu.items.map(it=>it.sep?'<div class="msep"></div>':`<button class="ms-item" data-act="${MENUS.indexOf(menu)}:${menu.items.indexOf(it)}">${ic(it.icon||'sparkle')}<span>${it.label}</span>${it.key?`<span class="kbd">${it.key}</span>`:''}</button>`).join('')+`</div>`;
  body.querySelector('.ms-back').onclick=()=>openMenuSheet();
  body.querySelectorAll('.ms-item').forEach(b=>b.onclick=()=>{
    const [mi,ii]=b.dataset.act.split(':').map(Number);
    box.close();
    const it=MENUS[mi].items[ii];setTimeout(()=>it.act&&it.act(),60);
  });
}
function buildMenus(){
  const wrap=$('#menus');
  MENUS.forEach(m=>{
    const b=document.createElement('button');b.className='menu-btn';b.textContent=m.label;b.dataset.menu=m.key;
    b.onclick=e=>{e.stopPropagation();openMenuKey===m.key?closeMenu():openMenu(m,b)};
    b.onmouseenter=()=>{if(openMenuEl)openMenu(m,b)};
    wrap.appendChild(b);
  });
}
function openMenu(m,btn){
  closeMenu();
  $$('.menu-btn').forEach(b=>b.classList.toggle('on',b.dataset.menu===m.key));
  const dd=document.createElement('div');dd.className='dropdown';
  m.items.forEach(it=>{
    if(it.sep){dd.insertAdjacentHTML('beforeend','<div class="msep"></div>');return}
    const row=document.createElement('div');row.className='mi';row.innerHTML=
      `<span class="ic">${ic(it.icon||'sparkle')}</span><span class="lbl">${it.label}</span>${it.key?`<span class="kbd">${it.key}</span>`:''}`;
    row.onclick=e=>{e.stopPropagation();closeMenu();it.act&&it.act()};
    dd.appendChild(row);
  });
  document.body.appendChild(dd);
  const r=btn.getBoundingClientRect();
  dd.style.left=Math.min(r.left,window.innerWidth-dd.offsetWidth-8)+'px';
  dd.style.top=(r.bottom+4)+'px';
  openMenuEl=dd;openMenuKey=m.key;
}
function closeMenu(){if(openMenuEl){openMenuEl.remove();openMenuEl=null;openMenuKey=null}
  $$('.menu-btn').forEach(b=>b.classList.remove('on'))}
document.addEventListener('click',()=>closeMenu());

/* 颜色面板 */
let colHSV={h:275,s:70,v:100};
function initColorPanel(){
  const sv=$('#svCanvas'),hue=$('#hueCanvas');
  if(!sv)return;
  const {r,g,b}=hex2rgb(S.fg);const hsv=rgb2hsv(r,g,b);
  colHSV={h:hsv.h,s:hsv.s,v:hsv.v};
  renderSV();renderHue();
  buildSwatches();
  let down=false;
  const pickSV=e=>{
    const b2=sv.getBoundingClientRect();
    const x=clamp(((e.touches?e.touches[0].clientX:e.clientX)-b2.left)/b2.width,0,1);
    const y=clamp(((e.touches?e.touches[0].clientY:e.clientY)-b2.top)/b2.height,0,1);
    colHSV.s=x*100;colHSV.v=(1-y)*100;
    const {r,g,b}=hsv2rgb(colHSV.h,colHSV.s,colHSV.v);setFg(rgb2hex(r,g,b));
  };
  sv.onpointerdown=e=>{down=true;pickSV(e);sv.setPointerCapture(e.pointerId)};
  sv.onpointermove=e=>{if(down)pickSV(e)};
  sv.onpointerup=()=>down=false;
  let hdown=false;
  const pickH=e=>{const b2=hue.getBoundingClientRect();
    const x=clamp(((e.touches?e.touches[0].clientX:e.clientX)-b2.left)/b2.width,0,1);
    colHSV.h=x*360;const {r,g,b}=hsv2rgb(colHSV.h,colHSV.s,colHSV.v);setFg(rgb2hex(r,g,b))};
  hue.onpointerdown=e=>{hdown=true;pickH(e);hue.setPointerCapture(e.pointerId)};
  hue.onpointermove=e=>{if(hdown)pickH(e)};
  hue.onpointerup=()=>hdown=false;
  $('#hexInput').onchange=e=>{const v=e.target.value.trim();if(/^#?[0-9a-f]{6}$/i.test(v)){const h='#'+(v[0]==='#'?v.slice(1):v);setFg(h);const {r,g,b}=hex2rgb(h);const q=rgb2hsv(r,g,b);colHSV={h:q.h,s:q.s,v:q.v}}};
  $('#fgPick').onclick=()=>{const i=document.createElement('input');i.type='color';i.value=S.fg;i.oninput=()=>setFg(i.value);i.click()};
  $('#bgPick').onclick=()=>{const i=document.createElement('input');i.type='color';i.value=S.bg;i.oninput=()=>setBg(i.value);i.click()};
}
function renderSV(){
  const sv=$('#svCanvas');if(!sv||dockTab!=='color')return;
  const c=sv.getContext('2d'),w=sv.width,h=sv.height;
  const hueColor=hsv2rgb(colHSV.h,100,100);
  c.fillStyle=rgb2hex(hueColor.r,hueColor.g,hueColor.b);c.fillRect(0,0,w,h);
  let g=c.createLinearGradient(0,0,w,0);g.addColorStop(0,'rgb(255,255,255,1)');g.addColorStop(1,'rgb(255,255,255,0)');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgb(0,0,0,0)');g.addColorStop(1,'rgb(0,0,0,1)');
  c.fillStyle=g;c.fillRect(0,0,w,h);
  const x=colHSV.s/100*w,y=(1-colHSV.v/100)*h;
  c.beginPath();c.arc(x,y,5,0,7);c.lineWidth=1.5;c.strokeStyle='#ffffff';c.stroke();
  c.beginPath();c.arc(x,y,7,0,7);c.lineWidth=1;c.strokeStyle='rgb(0,0,0,.5)';c.stroke();
}
function renderHue(){
  const cv=$('#hueCanvas');if(!cv||dockTab!=='color')return;
  const c=cv.getContext('2d'),w=cv.width,h=cv.height;const g=c.createLinearGradient(0,0,w,0);
  ['#ff0000','#ffff00','#00ff00','#c4b5fd','#7c3aed','#ff00ff','#ff0000'].forEach((col,i)=>g.addColorStop(i/6,col));
  c.fillStyle=g;c.fillRect(0,0,w,h);
  const x=colHSV.h/360*w;c.fillStyle='#ffffff';c.fillRect(x-1,0,2,h);
}
function buildSwatches(){
  const box=$('#swStrip');if(!box)return;
  const cols=['#ffffff','#000000','#f472b6','#c084fc','#a855f7','#8b5cf6','#8b5cf6','#a78bfa','#34d399','#fbbf24','#fb7185','#ad94b8',
    '#7c3aed','#7c3aed','#7c3aed','#059669','#ca8a04','#e11d48','#a16207','#f1f5f9'];
  box.innerHTML=cols.map(c=>`<i style="background:${c}" data-c="${c}" title="${c}"></i>`).join('');
  box.querySelectorAll('i').forEach(i=>i.onclick=()=>{setFg(i.dataset.c);const {r,g,b}=hex2rgb(i.dataset.c);const q=rgb2hsv(r,g,b);colHSV={h:q.h,s:q.s,v:q.v};renderSV();renderHue()});
}

    return `<div class="frow" data-f="${f.key}"><label>${f.label}</label><div class="ctl">
      <input class="rng" type="range" data-k="${f.key}" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${f.value}">
      <span class="rng-val" data-v="${f.key}">${f.value}${f.unit||''}</span></div></div>`;
  }).join('');
  const body=`<div class="form">${fields}</div>${o.note?`<div class="note" style="margin-top:11px">${o.note}</div>`:''}
    ${o.preview===false?'':`<div class="frow" style="margin-top:11px"><label>实时预览</label><div class="ctl">
      <label class="chk"><input type="checkbox" id="livePreview" ${o.previewDefault===false?'':'checked'}>调整时同步画布</label></div></div>`}`;
  const params={};
  o.fields.forEach(f=>params[f.key]=f.value);
  return openModal({title:o.title,sub:o.sub,icon:o.icon,body,okText:o.okText||'应用',
    footer:`<button class="btn ghost" data-x="cancel">取消</button><button class="btn primary" data-x="ok">${o.okText||'应用'}</button>`,
    onMount(panel,close){
      panel.querySelectorAll('[data-k]').forEach(el=>{
        const k=el.dataset.k;const out=panel.querySelector(`[data-v="${k}"]`);
        const handler=()=>{
          params[k]=el.type==='range'||el.type==='number'?parseFloat(el.value):(el.type==='checkbox'?el.checked:el.value);
          if(out)out.textContent=params[k]+(o.fields.find(f=>f.key===k).unit||'');
          if(o.onInput)o.onInput(params,panel);
          if(!o.noLive&&panel.querySelector('#livePreview')?.checked)o.onLive&&o.onLive(params,panel);
        };
        el.addEventListener('input',handler);el.addEventListener('change',handler);
      });
      panel.querySelectorAll('[data-kh]').forEach(el=>{
        const k=el.dataset.kh;el.onchange=()=>{const t=panel.querySelector(`[data-k="${k}"]`);if(t&&/^#[0-9a-f]{6}$/i.test(el.value)){t.value=el.value;t.dispatchEvent(new Event('input'))}};
      });
      o.onMountExtra&&o.onMountExtra(panel,close,params);
    },
    onOk(panel){return o.onApply?o.onApply(params,panel):true},
    onClose(){o.onCancel&&o.onCancel(params)}
  });
}

function pickFiles(kind){

$('#fileInput').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length)return;
  const kind=e.target.dataset.kind||'image';
  for(const f of files) await openFile(f,kind,true);
});
async function openFile(file,kind,append){
  try{
    if(/\.psd$/i.test(file.name)){const buf=await file.arrayBuffer();loadPSD(buf,file.name);return}
    if(/\.(slproj|json)$/i.test(file.name)){const txt=await file.text();loadProject(JSON.parse(txt));return}
    if(file.type==='image/svg+xml'||/\.svg$/i.test(file.name)){await loadImageFile(file,'svg');return}
    await loadImageFile(file,kind==='layer'?'layer':'doc');
  }catch(err){console.error(err);toast('打开失败：'+err.message,'err')}
}
function loadImgEl(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('图片解码失败'));im.src=url})}
async function loadImageFile(file,mode){
  const url=URL.createObjectURL(file);
  try{
    const im=await loadImgEl(url);
    addImageAsDocOrLayer(im,file.name,mode);
  }finally{setTimeout(()=>URL.revokeObjectURL(url),4000)}
}
function addImageAsDocOrLayer(im,name,mode){
  const w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
  if(mode==='layer'&&S.doc){
    const c=mkCanvas(S.doc.w,S.doc.h);
    const s=Math.min(S.doc.w/w,S.doc.h/h,1);
    const dw=w*s,dh=h*s;
    c.getContext('2d').drawImage(im,(S.doc.w-dw)/2,(S.doc.h-dh)/2,dw,dh);
    const L=newLayer(name.replace(/\.[^.]+$/,''),c);L.ox=0;L.oy=0;
    S.doc.layers.push(L);S.doc.active=S.doc.layers.length-1;
    render();renderLayers();pushHistory('置入图层');syncAll();
  }else{
    newDoc(w,h,'transparent');
    const c=mkCanvas(w,h);c.getContext('2d').drawImage(im,0,0);
    S.doc.layers[0].canvas=c;S.doc.layers[0].ctx=c.getContext('2d');S.doc.layers[0].name=name.replace(/\.[^.]+$/,'');
    S.doc.name=name;
    render();renderLayers();pushHistory('打开图片');fitView();syncAll();
    toast('已打开 '+name,'ok');
  }
}

/* ============ 工具系统 ============ */
function evPos(e){const r=$('#mainCanvas').getBoundingClientRect();

function selBoundsOrFull(){const d=S.doc;

function markLayerDirty(L){L.thumb=null}

/* ---------- 画笔印章 ---------- */
function makeStamp(color,size,hard){
  const s=Math.max(2,Math.ceil(size*1.08)),c=mkCanvas(s,s),x=c.getContext('2d');
  const r=s/2,g=x.createRadialGradient(r,r,0,r,r,r);
  const solid=clamp(hard/100,0.02,0.98);
  g.addColorStop(0,color);g.addColorStop(solid,color);g.addColorStop(1,'rgb(0,0,0,0)');
  x.fillStyle=g;x.beginPath();x.arc(r,r,r,0,7);x.fill();
  return c;
}
/* 笔刷预设：硬度 / 流量 / 抖动 */
const BRUSH_PRESETS={
  round:{hard:100,flow:1,jit:0},soft:{hard:24,flow:1,jit:0},air:{hard:8,flow:.5,jit:1},
  marker:{hard:92,flow:.88,jit:0},water:{hard:14,flow:.38,jit:.35},chalk:{hard:58,flow:.72,jit:.6},ink:{hard:100,flow:1,jit:0},
};
/* 沿路径以极小间距连续压印，笔迹完全连贯 */
function stampAt(st,from,to,size,pr){
  const ctx=st.buf.getContext('2d');
  const step=Math.max(0.45,Math.min(size*0.11,1.6));
  const dist=Math.hypot(to.x-from.x,to.y-from.y);
  const n=Math.max(1,Math.ceil(dist/step));
  const jit=(BRUSH_PRESETS[st.pres]||{}).jit||0;
  ctx.globalAlpha=clamp((st.flow??100)/100,.03,1);
  for(let i=1;i<=n;i++){
    const t=i/n, x=from.x+(to.x-from.x)*t, y=from.y+(to.y-from.y)*t;
    let dx=0,dy=0;
    if(jit){const a=Math.random()*6.283,r=Math.random()*size*0.16*jit;dx=Math.cos(a)*r;dy=Math.sin(a)*r}
    ctx.drawImage(st.stamp,x-size*0.54+dx,y-size*0.54+dy,size*1.08,size*1.08);
  }
  ctx.globalAlpha=1;
}
function paintSeg(buf,a,b,stamp,size,flow,hard){
  const ctx=buf.getContext('2d');
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy);
  ctx.globalAlpha=clamp((flow??100)/100,.03,1);
  const step=Math.max(0.6,Math.min(size*0.12,2.2));
  const n=Math.max(1,Math.ceil(dist/step));
  for(let i=1;i<=n;i++){
    const t=i/n;
    // 二次贝塞尔：控制点取前一点，起点取中点，避免折线拐角
    const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    const qx=(1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x;
    const qy=(1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y;
    ctx.drawImage(stamp,qx-size*0.54,qy-size*0.54,size*1.08,size*1.08);
  }
  if(dist===0)ctx.drawImage(stamp,a.x-size*0.54,a.y-size*0.54,size*1.08,size*1.08);
  ctx.globalAlpha=1;
}
function maskDirtyBuf(buf,x,y,w,h){
  if(!S.sel)return;
  x=Math.max(0,Math.floor(x));y=Math.max(0,Math.floor(y));
  w=Math.min(S.doc.w-x,Math.ceil(w));h=Math.min(S.doc.h-y,Math.ceil(h));
  if(w<=0||h<=0)return;
  const b=buf.getContext('2d').getImageData(x,y,w,h);
  const m=S.sel.mask.getContext('2d').getImageData(x,y,w,h).data;
  let any=false;
  for(let i=3;i<b.data.length;i+=4){if(m[i]<128){if(b.data[i])any=true;b.data[i]=0}}
  if(any)b.putImageData(b,x,y);else b.putImageData(b,x,y);
}
function beginStroke(mode,blend){
  const L=active();
  if(!L){toast('请先新建文档','err');return null}
  if(L.lock){toast('当前图层已锁定','err');return null}
  const o=S.opts[S.tool]||{};
  const st={buf:mkCanvas(S.doc.w,S.doc.h),mode,blend:blend||'source-over',opacity:o.opacity!=null?o.opacity:100,tool:S.tool,
    snap:cloneCanvas(L.canvas)};
  S.stroke=st;return st;
}
function endStroke(label){
  const st=S.stroke;if(!st)return;S.stroke=null;
  const L=active();
  L.ctx.save();L.ctx.globalAlpha=clamp(st.opacity/100,0,1);
  L.ctx.globalCompositeOperation=st.blend;
  L.ctx.drawImage(st.buf,0,0);L.ctx.restore();
  markLayerDirty(L);render();renderLayers();pushHistory(label||TOOL_DEF[S.tool].name);
}
/* 中断笔画：回滚到落笔前的图层快照，不写入历史（双指手势等场景使用） */
function abortStroke(){
  const st=S.stroke;if(!st)return;
  const L=active();
  if(st.snap&&L){L.ctx.save();L.ctx.clearRect(0,0,L.canvas.width,L.canvas.height);L.ctx.drawImage(st.snap,0,0);L.ctx.restore();markLayerDirty(L)}
  S.stroke=null;S.drag=null;render();renderLayers();
}

/* ---------- 选区工具 ---------- */
function selectAll(){rectSel(0,0,S.doc.w,S.doc.h);toast('已全选')}
function invertSel(){
  const d=S.doc,m2=mkCanvas(d.w,d.h),x=m2.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,d.w,d.h);
  if(S.sel){x.globalCompositeOperation='destination-out';x.drawImage(S.sel.mask,0,0)}
  setSelFromMask(m2,{x:0,y:0,w:d.w,h:d.h},[{x:0,y:0},{x:d.w,y:0},{x:d.w,y:d.h},{x:0,y:d.h}],'rect');
}
function floodMask(data,w,h,sx,sy,tol,contig){
  const idx=(sy*w+sx)*4,base=[data[idx],data[idx+1],data[idx+2],data[idx+3]];
  const out=new Uint8Array(w*h);
  const near=(i)=>{const dr=data[i]-base[0],dg=data[i+1]-base[1],db=data[i+2]-base[2],da=data[i+3]-base[3];
    return Math.abs(dr)+Math.abs(dg)+Math.abs(db)+Math.abs(da)<=tol*4};
  if(!contig){
    for(let p=0;p<w*h;p++)if(near(p*4))out[p]=1;
    return out;
  }
  const stack=[sy*w+sx];out[sy*w+sx]=1;
  while(stack.length){
    const p=stack.pop(),x=p%w,y=(p-x)/w;
    const nb=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    for(const [nx,ny] of nb){
      if(nx<0||ny<0||nx>=w||ny>=h)continue;
      const q=ny*w+nx;if(out[q])continue;
      if(near(q*4)){out[q]=1;stack.push(q)}
    }
  }
  return out;
}
function wandSelect(x,y,opts){
  const d=S.doc,L=active();x=Math.floor(x);y=Math.floor(y);
  if(x<0||y<0||x>=d.w||y>=d.h){toast('请点击画布内区域','err');return}
  const id=L.ctx.getImageData(0,0,d.w,d.h);
  const filled=floodMask(id.data,d.w,d.h,x,y,opts.tol,opts.contig);
  const mask=mkCanvas(d.w,d.h),m=mask.getContext('2d'),md=m.createImageData(d.w,d.h);
  let minx=d.w,miny=d.h,maxx=0,maxy=0;
  for(let p=0;p<filled.length;p++)if(filled[p]){const px=p%d.w,py=(p-px)/d.w;
    if(px<minx)minx=px;if(py<miny)miny=py;if(px>maxx)maxx=px;if(py>maxy)maxy=py;
    md.data[p*4]=255;md.data[p*4+1]=255;md.data[p*4+2]=255;md.data[p*4+3]=255}
  if(maxx===0&&miny===d.h){toast('没有选中任何区域');return}
  m.putImageData(md,0,0);
  const b={x:minx,y:miny,w:Math.max(1,maxx-minx+1),h:Math.max(1,maxy-miny+1)};
  setSelFromMask(mask,b,[{x:b.x,y:b.y},{x:b.x+b.w,y:b.y},{x:b.x+b.w,y:b.y+b.h},{x:b.x,y:b.y+b.h}],'wand');
  toast('魔棒选区 '+Math.round(b.w)+'×'+Math.round(b.h),'ok');
}
