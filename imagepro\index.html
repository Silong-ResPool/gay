/* 直线 */
function drawLine(drag){  const st=drag.st,ctx=st.buf.getContext('2d'),o=S.opts.line,a=drag.a,b=drag.b;
  ctx.save();ctx.clearRect(0,0,S.doc.w,S.doc.h);
  ctx.strokeStyle=S.fg;ctx.lineWidth=Math.max(1,o.size);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore();
  maskDirtyBuf(st.buf,Math.min(a.x,b.x)-o.size-2,Math.min(a.y,b.y)-o.size-2,
    Math.abs(b.x-a.x)+o.size*2+4,Math.abs(b.y-a.y)+o.size*2+4);
}
/* 海绵：按笔刷范围调整饱和度 */
function satPaint(st,a,b,size){
  const buf=st.buf,ctx=buf.getContext('2d'),src=st.src;
  const x=Math.floor(Math.min(a.x,b.x)-size/2),y=Math.floor(Math.min(a.y,b.y)-size/2);
  const w=Math.ceil(Math.abs(b.x-a.x)+size),h=Math.ceil(Math.abs(b.y-a.y)+size);
  const cw=S.doc.w,ch=S.doc.h;
  const rx=Math.max(0,x),ry=Math.max(0,y),rw=Math.min(cw-rx,w),rh=Math.min(ch-ry,h);
  if(rw<=0||rh<=0)return;
  const sd=src.getContext('2d').getImageData(rx,ry,rw,rh);
  const dd=ctx.getImageData(rx,ry,rw,rh);
  const cx0=((a.x+b.x)/2-rx),cy0=((a.y+b.y)/2-ry),r=size/2;
  const amt=(st.amount||45)/100*(st.mode==='sat'?1:-1);
  for(let py=0;py<rh;py++)for(let px=0;px<rw;px++){
    const dx=px-cx0,dy=py-cy0,d=Math.hypot(dx,dy);if(d>r)continue;
    const fall=1-d/r;const i=(py*rw+px)*4;
    const R=sd.data[i],G=sd.data[i+1],B=sd.data[i+2];
    const gray=0.299*R+0.587*G+0.114*B;
    const k=amt*fall;
    dd.data[i]=clamp(R+(R-gray)*k*1.6,0,255);
    dd.data[i+1]=clamp(G+(G-gray)*k*1.6,0,255);
    dd.data[i+2]=clamp(B+(B-gray)*k*1.6,0,255);
    dd.data[i+3]=Math.max(dd.data[i+3],Math.round(255*Math.min(1,fall*2.2)));
  }
  ctx.putImageData(dd,rx,ry);
  maskDirtyBuf(buf,rx,ry,rw,rh);
}
/* 内容填充：用周边像素做模糊外推，生成一张"擦掉物体后"的底图 */
function contentFill(target,out){
  const w=target.width,h=target.height,o=out.getContext('2d');
  const id=target.getContext('2d').getImageData(0,0,w,h);
  const tmp=mkCanvas(w,h),tc=tmp.getContext('2d');
  tc.putImageData(id,0,0);
  // 多次降采样模糊后放大，模拟周边内容向洞内扩散
  let scale=0.08;
  for(let pass=0;pass<3;pass++){
    const sw=Math.max(2,Math.round(w*scale)),sh=Math.max(2,Math.round(h*scale));
    const small=mkCanvas(sw,sh);small.getContext('2d').drawImage(tmp,0,0,sw,sh);
    tc.save();tc.filter='blur(1.5px)';tc.clearRect(0,0,w,h);
    tc.imageSmoothingEnabled=true;tc.drawImage(small,0,0,w,h);tc.restore();
    scale*=2.2;
  }
  o.drawImage(tmp,0,0);
  return tmp;
}
/* 内容填充笔刷：把修复底图按笔刷形状贴到笔画缓冲 */
function fillinPaint(st,a,b,size){
  const ctx=st.buf.getContext('2d');
  const step=Math.max(1,size*0.25);
  const dist=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(dist/step));
  ctx.save();ctx.globalAlpha=clamp((S.opts.fillin?1:1)*0.92,0,1);
  for(let i=1;i<=n;i++){
    const t=i/n,x=a.x+(b.x-a.x)*t,y=a.y+(b.y-a.y)*t;
    ctx.save();
    ctx.beginPath();ctx.arc(x,y,size/2,0,7);ctx.clip();
    ctx.drawImage(st.src,0,0);
    ctx.restore();
  }
  ctx.restore();
  maskDirtyBuf(st.buf,Math.min(a.x,b.x)-size,Math.min(a.y,b.y)-size,
    Math.abs(b.x-a.x)+size*2,Math.abs(b.y-a.y)+size*2);
}
/* 钢笔：把锚点用 Catmull-Rom 转贝塞尔，得到顺滑曲线并写入图层 */
function penCommit(){
  const pen=S.pen;if(!pen||pen.pts.length<2){toast('至少需要两个锚点','err');return}
  const L=active();if(!L||L.lock){toast('当前图层已锁定','err');return}
  const pts=pen.pts.slice(),tmp=mkCanvas(S.doc.w,S.doc.h),t=tmp.getContext('2d');
  t.strokeStyle=S.fg;t.lineWidth=Math.max(1,S.opts.pen.size);t.lineCap='round';t.lineJoin='round';
  t.beginPath();t.moveTo(pts[0].x,pts[0].y);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6};
    const c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};
    t.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,p2.x,p2.y);
  }
  if(S.opts.pen.closed){const p0=pts[pts.length-1],p1=pts[0];t.lineTo(p1.x,p1.y)}
  t.stroke();
  L.ctx.drawImage(tmp,0,0);markLayerDirty(L);
  S.pen=null;render();renderLayers();drawOverlay();pushHistory('钢笔路径');
  toast('已绘制平滑曲线','ok');
}
/* 渐变 */
function paintGradient(drag){
  const st=drag.st,ctx=st.buf.getContext('2d'),a=drag.a,b=drag.b,S2=S.opts.gradient;
  ctx.save();ctx.clearRect(0,0,S.doc.w,S.doc.h);
  const c1=S2.reverse?S.bg:S.fg,c2=S2.reverse?S.fg:S.bg;
  let g;
  if(S2.type==='radial')g=ctx.createRadialGradient(a.x,a.y,0,a.x,a.y,Math.max(2,Math.hypot(b.x-a.x,b.y-a.y)));
  else g=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
  g.addColorStop(0,c1);g.addColorStop(1,c2);
  ctx.fillStyle=g;
  if(S2.type==='radial'){ctx.beginPath();ctx.arc(a.x,a.y,Math.max(2,Math.hypot(b.x-a.x,b.y-a.y)),0,7);ctx.fill()}
  else if(S2.type==='angle'){
    const ang=Math.atan2(b.y-a.y,b.x-a.x);ctx.beginPath();
    const R=Math.hypot(S.doc.w,S.doc.h);ctx.moveTo(a.x-Math.cos(ang)*R,a.y-Math.sin(ang)*R);
    ctx.lineTo(a.x+Math.cos(ang)*R,a.y+Math.sin(ang)*R);ctx.strokeStyle=g;ctx.lineWidth=R*2;ctx.stroke();
  }else ctx.fillRect(0,0,S.doc.w,S.doc.h);
  ctx.restore();
  maskDirtyBuf(st.buf,0,0,S.doc.w,S.doc.h);
}
/* 形状 */
function drawShape(drag){
  const st=drag.st,ctx=st.buf.getContext('2d'),a=drag.a,b=drag.b,o=S.opts.shape;
  const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
  ctx.save();ctx.clearRect(0,0,S.doc.w,S.doc.h);
  ctx.fillStyle=o.fill;ctx.strokeStyle=o.stroke;ctx.lineWidth=o.strokeW||1;
  ctx.beginPath();
  if(o.kind==='rect'){ctx.roundRect?ctx.roundRect(x,y,w,h,o.radius||0):ctx.rect(x,y,w,h)}
  else if(o.kind==='ellipse'){ctx.ellipse(x+w/2,y+h/2,Math.max(.5,w/2),Math.max(.5,h/2),0,0,7)}
  else if(o.kind==='line'){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}
  else {ctx.moveTo(x+w/2,y);ctx.lineTo(x+w,y+h);ctx.lineTo(x,y+h);ctx.closePath()}
  if(o.kind==='line'){ctx.strokeStyle=o.fill;ctx.lineWidth=Math.max(1,o.strokeW||3);ctx.stroke()}
  else{if(o.fillOn)ctx.fill();if(o.strokeOn&&o.strokeW>0)ctx.stroke()}
  ctx.restore();
  maskDirtyBuf(st.buf,0,0,S.doc.w,S.doc.h);
}
/* 文字 */
function dialogText(pos,o){
  sliderDialog({
    title:'输入文字',icon:'text',sub:'点击位置 '+(Math.round(pos.x))+', '+Math.round(pos.y),
    fields:[
      {key:'content',type:'text',value:''},
      {key:'size',label:'字号',min:8,max:400,step:1,value:o.size,unit:'px'},
      {key:'color',label:'颜色',type:'color',value:o.color},
      {key:'font',label:'字体',type:'select',value:o.font,options:[['PingFang SC','苹方 / 黑体'],['Microsoft YaHei','微软雅黑'],['SimSun','宋体'],['KaiTi','楷体'],['Georgia','Georgia'],['Arial','Arial']]},
      {key:'bold',label:'粗体',type:'check',value:o.bold},
      {key:'shadow',label:'阴影',type:'check',value:false},
      {key:'align',label:'对齐',type:'select',value:'left',options:[['left','左对齐'],['center','居中'],['right','右对齐']]},
    ],
    preview:false,okText:'写入图层',
    onMountExtra(panel){const ta=panel.querySelector('[data-k="content"]');ta.outerHTML='<textarea class="txt" data-k="content" rows="3" placeholder="输入多行文字，回车换行" style="min-height:66px"></textarea>';
      panel.querySelector('[data-k="content"]').addEventListener('input',e=>panel._content=e.target.value);
      setTimeout(()=>panel.querySelector('[data-k="content"]')?.focus(),120)},
    onApply(params,panel){
      const content=(panel._content??params.content??'').toString();
      if(!content.trim()){toast('请输入文字内容','err');return false}
      drawTextToLayer(pos,content,params);return true;
    }
  });
}
function drawTextToLayer(pos,content,p){
  const L=active();if(!L)return;
  const tmp=mkCanvas(S.doc.w,S.doc.h),t=tmp.getContext('2d');
  const lh=p.size*1.32;
  t.font=`${p.bold?'700':'400'} ${p.size}px "${p.font}",sans-serif`;
  t.fillStyle=p.color;t.textBaseline='top';
  const lines=content.split('\n');
  const maxW=Math.max(...lines.map(l=>t.measureText(l).width));
  let x=pos.x;
  if(p.align==='center')x=pos.x-maxW/2;else if(p.align==='right')x=pos.x-maxW;
  t.save();
  if(p.shadow){t.shadowColor='rgb(0,0,0,.6)';t.shadowBlur=Math.round(p.size*0.22);t.shadowOffsetY=Math.round(p.size*0.1)}
  lines.forEach((ln,i)=>{t.fillText(ln,x,pos.y+i*lh)});
  t.restore();
  applyToLayerMasked(L,tmp,100,'source-over');
  render();renderLayers();pushHistory('添加文字');
}

/* 采样类画笔 */
function samplePaint(st,a,b,size,strength){
  const ctx=st.buf.getContext('2d');
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.hypot(dx,dy),step=Math.max(3,size*0.28);
  const n=Math.max(1,Math.floor(dist/step));
  for(let i=1;i<=n;i++){
    const t=i/n,x=a.x+dx*t,y=a.y+dy*t;
    const stamp=mkCanvas(size,size),sctx=stamp.getContext('2d');
    const r=size/2;
    sctx.drawImage(st.src,x-r-(st.off?st.off.x:0),y-r-(st.off?st.off.y:0),size,size,0,0,size,size);
    sctx.globalCompositeOperation='destination-in';
    sctx.drawImage(makeStamp('#ffffff',size,55),0,0,size,size);
    ctx.globalAlpha=clamp(strength,.1,1);
    ctx.drawImage(stamp,x-r,y-r);
  }
  ctx.globalAlpha=1;
  maskDirtyBuf(st.buf,a.x-size,b.y>a.y?a.y-size:b.y-size,Math.abs(dx)+size*2,Math.abs(dy)+size*2);
}

/* ---------- 画布指针事件：单指绘制，双指手势（缩放/平移）绝不绘画 ---------- */
const stageScrollEl=$('#stageScroll');
let drawing=false;
const ptrs=new Map();          // 活动指针：pointerId -> {x,y}
let gesture=null;             // 双指手势基准
function curTool(){return S.tempHand?'hand':S.tool}

function onDown(e){
  if(!S.doc)return;
  if(e.button===2)return;
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{$('#mainCanvas').setPointerCapture(e.pointerId)}catch(_){}
  // 第二指落地：立刻中断并回滚当前笔画，进入双指手势，不再产生任何绘制
  if(ptrs.size>=2){
    if(drawing){abortStroke();drawing=false;$('body').classList.remove('drawing')}
    const ps=[...ptrs.values()];
    gesture={d0:Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1,z0:S.view.zoom,
      cx0:(ps[0].x+ps[1].x)/2,cy0:(ps[0].y+ps[1].y)/2,
      sl:stageScrollEl.scrollLeft,st:stageScrollEl.scrollTop};
    stageScrollEl.style.cursor='grabbing';
    e.preventDefault();return;
  }
  gesture=null;
  const p=evPos(e);S.cursor=p;
  const def=TOOL_DEF[curTool()];if(!def)return;
  drawing=true;
  $('body').classList.add('drawing');
  try{def.down&&def.down(p,e)}catch(err){console.error(err);toast('操作失败：'+err.message,'err')}
  drawOverlay();
}
function onMove(e){
  if(!S.doc)return;
  const p=evPos(e);S.cursor=p;
  $('#sbPos').textContent=`${Math.round(p.x)}, ${Math.round(p.y)}`;
  if(dockTab==='info'){const $p=$('#infoPos');if($p)$p.textContent=`${Math.round(p.x)}, ${Math.round(p.y)}`}
  const L=active();
  if(L&&dockTab==='info'){
    try{const d=L.ctx.getImageData(clamp(Math.floor(p.x),0,S.doc.w-1),clamp(Math.floor(p.y),0,S.doc.h-1),1,1).data;
      $('#infoHex').textContent=rgb2hex(d[0],d[1],d[2]).toUpperCase();
      $('#infoColor').style.background=rgb2hex(d[0],d[1],d[2]);
    }catch(_){}
  }
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // 双指手势：缩放 + 平移，屏蔽一切工具绘制
  if(gesture&&ptrs.size>=2){
    const ps=[...ptrs.values()];
    const d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1;
    const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
    const z=clamp(gesture.z0*(d/gesture.d0),0.03,32);
    S.view.zoom=z;S.view.fit=false;applyZoomUI();render();
    stageScrollEl.scrollLeft=gesture.sl-(cx-gesture.cx0);
    stageScrollEl.scrollTop=gesture.st-(cy-gesture.cy0);
    e.preventDefault();return;
  }
  if(drawing){const def=TOOL_DEF[curTool()];def&&def.move&&def.move(p,e)}
  drawOverlay();
}
function onUp(e){
  if(!S.doc)return;
  if(ptrs.has(e.pointerId))ptrs.delete(e.pointerId);
  // 手势结束：剩余手指不自动恢复绘制，需重新按下
  if(gesture){
    if(ptrs.size<2){
      gesture=null;stageScrollEl.style.cursor='';
      if(drawing){abortStroke();drawing=false;$('body').classList.remove('drawing')}
    }
    return;
  }
  const p=evPos(e);
  if(drawing){const def=TOOL_DEF[curTool()];def&&def.up&&def.up(p,e);drawing=false;$('body').classList.remove('drawing')}
  drawOverlay();
}
$('#mainCanvas').addEventListener('pointerdown',onDown);
$('#mainCanvas').addEventListener('pointermove',onMove);
$('#mainCanvas').addEventListener('pointerup',onUp);
$('#mainCanvas').addEventListener('pointercancel',onUp);
$('#mainCanvas').addEventListener('pointerleave',e=>{if(!ptrs.size){S.cursor=null;drawOverlay()}});
window.addEventListener('pointerup',e=>{
  if(ptrs.has(e.pointerId))ptrs.delete(e.pointerId);
  if(drawing&&ptrs.size===0)onUp(e);
});
window.addEventListener('pointercancel',e=>{
  if(ptrs.has(e.pointerId))ptrs.delete(e.pointerId);
  if(drawing&&ptrs.size===0)onUp(e);
});

stageScrollEl.addEventListener('wheel',e=>{
  if(!S.doc)return;
  if(e.ctrlKey||e.metaKey||e.altKey){e.preventDefault();setZoom(S.view.zoom*(e.deltaY<0?1.12:0.89),e.clientX,e.clientY)}
},{passive:false});
stageScrollEl.addEventListener('scroll',()=>updateNav());

/* ---------- 叠加层绘制 ---------- */
let antOffset=0;
setInterval(()=>{if(S.sel){antOffset=(antOffset+1)%12;drawOverlay()}},140);
function drawOverlay(){
  const oc=$('#overlayCanvas');if(!oc||!S.doc)return;
  if(oc.width!==S.doc.w){oc.width=S.doc.w;oc.height=S.doc.h}
  const ctx=oc.getContext('2d'),z=S.view.zoom,d=S.doc;
  ctx.clearRect(0,0,d.w,d.h);
  ctx.lineWidth=1/z;
  /* 网格 */
  if(S.view.showGrid){
    ctx.strokeStyle='rgb(196,181,253,.20)';ctx.beginPath();
    for(let x=50;x<d.w;x+=50){ctx.moveTo(x,0);ctx.lineTo(x,d.h)}
    for(let y=50;y<d.h;y+=50){ctx.moveTo(0,y);ctx.lineTo(d.w,y)}
    ctx.stroke();
  }
  /* 选区着色 */
  if(S.sel){
    if(!S.sel.tint){const t=mkCanvas(d.w,d.h),tc=t.getContext('2d');
      tc.fillStyle='#8b5cf6';tc.fillRect(0,0,d.w,d.h);tc.globalCompositeOperation='destination-in';tc.drawImage(S.sel.mask,0,0);S.sel.tint=t}
    ctx.globalAlpha=.20;ctx.drawImage(S.sel.tint,0,0);ctx.globalAlpha=1;
    ctx.save();ctx.strokeStyle='rgb(243,240,255,.95)';ctx.setLineDash([5/z,4/z]);ctx.lineDashOffset=antOffset/z;
    ctx.beginPath();
    const o=S.sel.outline;
    if(S.sel.kind==='ellipse'){const b=S.sel.bounds;ctx.ellipse(b.x+b.w/2,b.y+b.h/2,Math.max(.5,b.w/2),Math.max(.5,b.h/2),0,0,7)}
    else o.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if(S.sel.kind!=='rect')ctx.closePath();
    ctx.stroke();ctx.restore();
    ctx.save();ctx.strokeStyle='rgb(10,6,20,.6)';ctx.setLineDash([5/z,4/z]);ctx.lineDashOffset=(antOffset+5)/z;
    ctx.beginPath();
    if(S.sel.kind==='ellipse'){const b=S.sel.bounds;ctx.ellipse(b.x+b.w/2,b.y+b.h/2,Math.max(.5,b.w/2),Math.max(.5,b.h/2),0,0,7)}
    else o.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if(S.sel.kind!=='rect')ctx.closePath();
    ctx.stroke();ctx.restore();
  }
  /* 钢笔锚点预览 */
  if(S.pen&&S.pen.pts.length){
    const pts=S.pen.pts;
    ctx.save();
    ctx.strokeStyle='rgb(196,181,253,.95)';ctx.lineWidth=1.4/z;
    ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=0;i<pts.length-1;i++){
      const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
      ctx.bezierCurveTo(p1.x+(p2.x-p0.x)/6,p1.y+(p2.y-p0.y)/6,p2.x-(p3.x-p1.x)/6,p2.y-(p3.y-p1.y)/6,p2.x,p2.y);
    }
    ctx.stroke();
    pts.forEach(p=>{ctx.fillStyle='#f5f3ff';ctx.beginPath();ctx.arc(p.x,p.y,3.2/z,0,7);ctx.fill();
      ctx.strokeStyle='rgb(139,92,246,.9)';ctx.lineWidth=1/z;ctx.stroke()});
    ctx.restore();
  }
  /* 拖拽预览 */
  const drag=S.drag;
  if(drag&&(drag.t==='marquee'||drag.t==='ellipse'||drag.t==='crop')){
    const a=drag.a,b=drag.b||drag.a;
    const x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    ctx.save();ctx.fillStyle='rgb(139,92,246,.16)';ctx.fillRect(x,y,w,h);
    ctx.strokeStyle='rgb(243,240,255,.95)';ctx.setLineDash([5/z,4/z]);
    if(drag.t==='ellipse'){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,7);ctx.stroke()}
    else ctx.strokeRect(x,y,w,h);
    ctx.restore();
  }
  if(S.cropRect&&!drag){
    const a=S.cropRect.a,b=S.cropRect.b,x=Math.min(a.x,b.x),y=Math.min(a.y,b.y),w=Math.abs(b.x-a.x),h=Math.abs(b.y-a.y);
    ctx.save();ctx.fillStyle='rgb(6,4,14,.6)';
    ctx.fillRect(0,0,d.w,y);ctx.fillRect(0,y+h,d.w,d.h-y-h);ctx.fillRect(0,y,x,h);ctx.fillRect(x+w,y,d.w-x-w,h);
    ctx.strokeStyle='rgb(255,255,255,.9)';ctx.setLineDash([6/z,4/z]);ctx.strokeRect(x,y,w,h);
    ctx.setLineDash([]);ctx.strokeStyle='rgb(255,255,255,.35)';
    for(let i=1;i<3;i++){ctx.beginPath();ctx.moveTo(x+w*i/3,y);ctx.lineTo(x+w*i/3,y+h);ctx.moveTo(x,y+h*i/3);ctx.lineTo(x+w,y+h*i/3);ctx.stroke()}
    ctx.restore();
  }
  if(drag&&drag.t==='lasso'&&drag.pts){
    ctx.save();ctx.strokeStyle='rgb(243,240,255,.9)';ctx.setLineDash([4/z,4/z]);
    ctx.beginPath();drag.pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();ctx.restore();
  }
  if(drag&&drag.t==='shape'&&drag.rect){}
  /* 画笔光标 */
  if(S.cursor&&!drawing){
    const o=S.opts[S.tool]||{},r=(o.size||0)/2;
    if(r>0){
      ctx.save();ctx.strokeStyle='rgb(255,255,255,.65)';ctx.lineWidth=1/z;
      ctx.beginPath();ctx.arc(S.cursor.x,S.cursor.y,r,0,7);ctx.stroke();
      ctx.strokeStyle='rgb(10,6,20,.5)';ctx.beginPath();ctx.arc(S.cursor.x,S.cursor.y,r+1/z,0,7);ctx.stroke();
      ctx.restore();
    }
  }
}
</script>
<script>
/* ============ 图层与文档操作 ============ */
function addLayer(name){
  if(!S.doc)return;
  const L=newLayer(name||('图层 '+(S.doc.layers.length+1)));
  S.doc.layers.push(L);S.doc.active=S.doc.layers.length-1;
  render();renderLayers();pushHistory('新建图层');syncStatus();
}
function dupLayer(){
  const L=active();if(!L)return;
  const c=cloneCanvas(L.canvas);
  const NL={...L,id:uid(),name:L.name+' 副本',canvas:c,ctx:c.getContext('2d'),thumb:null};
  S.doc.layers.splice(S.doc.active+1,0,NL);S.doc.active++;
  render();renderLayers();pushHistory('复制图层');
}
function delLayer(){
  if(!S.doc||S.doc.layers.length<=1){toast('至少要保留一个图层','err');return}
  S.doc.layers.splice(S.doc.active,1);S.doc.active=Math.max(0,S.doc.active-1);
  render();renderLayers();pushHistory('删除图层');
}
function moveLayer(dir){
  const d=S.doc,i=d.active,j=i+dir;
  if(j<0||j>=d.layers.length)return;
  [d.layers[i],d.layers[j]]=[d.layers[j],d.layers[i]];d.active=j;
  render();renderLayers();pushHistory('调整图层顺序');
}
function mergeDown(){
  const d=S.doc;if(d.active<1){toast('下方没有图层可合并','err');return}
  const up=d.layers[d.active],down=d.layers[d.active-1];
  down.ctx.save();down.ctx.globalAlpha=clamp(up.opacity/100,0,1);down.ctx.globalCompositeOperation=up.blend;
  down.ctx.drawImage(up.canvas,up.ox-down.ox,up.oy-down.oy);down.ctx.restore();
  d.layers.splice(d.active,1);d.active--;
  render();renderLayers();pushHistory('向下合并');
}
function mergeVisible(){
  const d=S.doc;if(d.layers.length<2)return;
  const c=mkCanvas(d.w,d.h),x=c.getContext('2d');
  d.layers.forEach(L=>{if(!L.visible)return;x.globalAlpha=clamp(L.opacity/100,0,1);x.globalCompositeOperation=L.blend;x.drawImage(L.canvas,L.ox,L.oy)});
  const L=newLayer('合并图层',c);L.ox=0;L.oy=0;
  d.layers=[L];d.active=0;
  render();renderLayers();pushHistory('合并可见图层');
}
function flattenDoc(){
  if(!S.doc)return;
  const c=mkCanvas(S.doc.w,S.doc.h);composite(c.getContext('2d'),true);
  const L=newLayer('背景',c);L.ox=0;L.oy=0;
  S.doc.layers=[L];S.doc.active=0;S.sel=null;
  render();renderLayers();pushHistory('拼合图像');syncStatus();
}
function toggleLock(){
  const L=active();if(!L)return;L.lock=!L.lock;renderLayers();toast(L.lock?'图层已锁定':'图层已解锁','ok');
}
function clearPixels(){
  const L=active();if(!L||L.lock)return;
  if(S.sel){const t=mkCanvas(S.doc.w,S.doc.h);applyToLayerMasked(L,t,100,'destination-out')}

function rotateDoc(deg){
  const d=S.doc;const w=d.w,h=d.h,swap=Math.abs(deg)===90;
  d.layers.forEach(L=>{

    x.save();
    if(deg===90){x.translate(c.width,0);x.rotate(Math.PI/2)}
    else if(deg===-90){x.translate(0,c.height);x.rotate(-Math.PI/2)}
    else{x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.translate(-L.canvas.width/2,-L.canvas.height/2)}
    x.drawImage(L.canvas,0,0);x.restore();
    L.canvas=c;L.ctx=c.getContext('2d');L.ox=0;L.oy=0;markLayerDirty(L);
  });
  if(swap){d.w=h;d.h=w;S.doc.w=h;S.doc.h=w}

function applyPixel(fn,params,label){
  const L=active();if(!L||L.lock){toast('当前图层不可编辑','err');return false}
  const b=selBoundsOrFull();if(b.w<=0||b.h<=0)return false;
  const img=L.ctx.getImageData(b.x,b.y,b.w,b.h);
  const orig=S.sel?new Uint8ClampedArray(img.data):null;
  fn(img,params||{},b);
  if(orig&&S.sel){
    const mm=S.sel.mask.getContext('2d').getImageData(b.x,b.y,b.w,b.h).data;
    for(let i=0;i<img.data.length;i+=4){
      if(mm[i+3]<40){img.data[i]=orig[i];img.data[i+1]=orig[i+1];img.data[i+2]=orig[i+2];img.data[i+3]=orig[i+3]}
    }
  }
  L.ctx.putImageData(img,b.x,b.y);
  markLayerDirty(L);render();renderLayers();
  if(label)pushHistory(label);
  return true;
}

}

function tempFrom(imgData,w,h){const c=mkCanvas(w,h);c.getContext('2d').putImageData(imgData,0,0);return c}

/* ---------- 调整函数 ---------- */
const ADJ={
  brightContrast(img,p){const d=img.data;const br=p.brightness*2.55,c=(p.contrast+100)/100;
    for(let i=0;i<d.length;i+=4){for(let k=0;k<3;k++){let v=d[i+k]+br;v=(v-128)*c+128;d[i+k]=clamp(v,0,255)}}},
  levels(img,p){const d=img.data,bl=p.black,wh=Math.max(p.white,p.black+1),g=p.gamma||1;
    const lut=new Uint8ClampedArray(256);
    for(let v=0;v<256;v++){let t=(v-bl)/(wh-bl);t=clamp(t,0,1);t=Math.pow(t,1/g);lut[v]=clamp(t*255*(p.outWhite-p.outBlack)/255+p.outBlack,0,255)}
    for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}},
  gamma(img,p){const d=img.data,g=p.gamma||1;const lut=new Uint8ClampedArray(256);
    for(let v=0;v<256;v++)lut[v]=clamp(Math.pow(v/255,g)*255,0,255);
    for(let i=0;i<d.length;i+=4){d[i]=lut[d[i]];d[i+1]=lut[d[i+1]];d[i+2]=lut[d[i+2]]}},
  hsl(img,p){const d=img.data,hue=p.hue,sat=p.sat/100,light=p.light/100;
    for(let i=0;i<d.length;i+=4){const r=d[i]/255,g=d[i+1]/255,b=d[i+2]/255;
      const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,s0=mx===mn?0:(mx-mn)/(1-Math.abs(2*l-1));
      let h0=0;if(mx===r)h0=((g-b)/(mx-mn))%6;else if(mx===g)h0=(b-r)/(mx-mn)+2;else h0=(r-g)/(mx-mn)+4;
      h0=(h0*60+360)%360;
      const s1=clamp(s0*(1+sat),0,1),l1=clamp(l*(1+light)+ (light<0?light*0.3:0),0,1);
      const hh=(h0+hue+360)%360,c=(1-Math.abs(2*l1-1))*s1,x=c*(1-Math.abs((hh/60)%2-1)),m=l1-c/2;
      let rr=0,gg=0,bb=0;
      if(hh<60){rr=c;gg=x}else if(hh<120){rr=x;gg=c}else if(hh<180){gg=c;bb=x}
      else if(hh<240){gg=x;bb=c}else if(hh<300){rr=x;bb=c}else{rr=c;bb=x}
      d[i]=(rr+m)*255;d[i+1]=(gg+m)*255;d[i+2]=(bb+m)*255}},
  colorBalance(img,p){const d=img.data;
    for(let i=0;i<d.length;i+=4){const l=(d[i]+d[i+1]+d[i+2])/765;
      const w=l<.5?(1-l*2)*0.9+.1:(1-l)*2*.5+.1;
      d[i]=clamp(d[i]+p.r*w,0,255);d[i+1]=clamp(d[i+1]+p.g*w,0,255);d[i+2]=clamp(d[i+2]+p.b*w,0,255)}},
  exposure(img,p){const f=Math.pow(2,p.ev),d=img.data;
    for(let i=0;i<d.length;i+=4){d[i]=clamp(d[i]*f,0,255);d[i+1]=clamp(d[i+1]*f,0,255);d[i+2]=clamp(d[i+2]*f,0,255)}},
  vibrance(img,p){const d=img.data,amt=p.amount/100;
    for(let i=0;i<d.length;i+=4){const mx=Math.max(d[i],d[i+1],d[i+2]),mn=Math.min(d[i],d[i+1],d[i+2]);
      const sat=(mx-mn)/255,g=(d[i]+d[i+1]+d[i+2])/3;
      const k=1+amt*(1-sat)*1.4;
      d[i]=clamp(g+(d[i]-g)*k,0,255);d[i+1]=clamp(g+(d[i+1]-g)*k,0,255);d[i+2]=clamp(g+(d[i+2]-g)*k,0,255)}},
  threshold(img,p){const d=img.data,l=p.level;
    for(let i=0;i<d.length;i+=4){const g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11);const v=g>l?255:0;d[i]=d[i+1]=d[i+2]=v}},
  posterize(img,p){const d=img.data,n=Math.max(2,p.levels),step=255/(n-1);
    for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]/step)*step;d[i+1]=Math.round(d[i+1]/step)*step;d[i+2]=Math.round(d[i+2]/step)*step}},
  gradientMap(img,p){const c1=hex2rgb(p.c1),c2=hex2rgb(p.c2),d=img.data;
    for(let i=0;i<d.length;i+=4){const t=(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;
      d[i]=c1.r+(c2.r-c1.r)*t;d[i+1]=c1.g+(c2.g-c1.g)*t;d[i+2]=c1.b+(c2.b-c1.b)*t}},
};
function conv(img,k,div,offset,keepAlpha){
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
  const side=Math.sqrt(k.length),half=Math.floor(side/2);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let r=0,g=0,b=0;
    for(let ky=0;ky<side;ky++)for(let kx=0;kx<side;kx++){
      const px=clamp(x+kx-half,0,w-1),py=clamp(y+ky-half,0,h-1),o=(py*w+px)*4,wt=k[ky*side+kx];
      r+=src[o]*wt;g+=src[o+1]*wt;b+=src[o+2]*wt;
    }
    const o=(y*w+x)*4;
    if(offset){const g0=(r+g+b)/(3*div)+offset;d[o]=d[o+1]=d[o+2]=clamp(g0,0,255)}
    else{d[o]=clamp(r/div,0,255);d[o+1]=clamp(g/div,0,255);d[o+2]=clamp(b/div,0,255)}
  }
  return img;
}
function boxBlur(img,r){
  const w=img.width,h=img.height,d=img.data,tmp=new Uint8ClampedArray(d.length);
  r=Math.max(1,Math.round(r));
  for(let y=0;y<h;y++){
    let sr=0,sg=0,sb=0,sa=0;
    for(let x=-r;x<=r;x++){const o=(y*w+clamp(x,0,w-1))*4;sr+=d[o];sg+=d[o+1];sb+=d[o+2];sa+=d[o+3]}
    const n=2*r+1;
    for(let x=0;x<w;x++){
      const o=(y*w+x)*4;tmp[o]=sr/n;tmp[o+1]=sg/n;tmp[o+2]=sb/n;tmp[o+3]=sa/n;
      const add=(y*w+clamp(x+r+1,0,w-1))*4,rem=(y*w+clamp(x-r,0,w-1))*4;
      sr+=d[add]-d[rem];sg+=d[add+1]-d[rem+1];sb+=d[add+2]-d[rem+2];sa+=d[add+3]-d[rem+3];
    }
  }
  // 纵向
  for(let x=0;x<w;x++){
    let sr=0,sg=0,sb=0,sa=0;
    for(let y=-r;y<=r;y++){const o=(clamp(y,0,h-1)*w+x)*4;sr+=tmp[o];sg+=tmp[o+1];sb+=tmp[o+2];sa+=tmp[o+3]}
    const n=2*r+1;
    for(let y=0;y<h;y++){
      const o=(y*w+x)*4;d[o]=sr/n;d[o+1]=sg/n;d[o+2]=sb/n;d[o+3]=sa/n;
      const add=(clamp(y+r+1,0,h-1)*w+x)*4,rem=(clamp(y-r,0,h-1)*w+x)*4;
      sr+=tmp[add]-tmp[rem];sg+=tmp[add+1]-tmp[rem+1];sb+=tmp[add+2]-tmp[rem+2];sa+=tmp[add+3]-tmp[rem+3];
    }
  }
  return img;
}
function blurCanvas(c,r){const x=c.getContext('2d');const id=x.getImageData(0,0,c.width,c.height);boxBlur(boxBlur(id,r),r);x.putImageData(id,0,0);return c}
function edgeDetect(img){
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
  const gx=[-1,0,1,-2,0,2,-1,0,1],gy=[-1,-2,-1,0,0,0,1,2,1];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let sx=0,sy=0;
    for(let ky=-1;ky<=1;ky++)for(let kx=-1;kx<=1;kx++){
      const px=clamp(x+kx,0,w-1),py=clamp(y+ky,0,h-1),o=(py*w+px)*4,wt=(ky+1)*3+(kx+1);
      const g=(src[o]+src[o+1]+src[o+2])/3;
      sx+=g*gx[wt];sy+=g*gy[wt];
    }
    const o=(y*w+x)*4,v=clamp(Math.hypot(sx,sy),0,255);
    d[o]=d[o+1]=d[o+2]=v;
  }
  return img;
}
function sketch(img){
  const d=img.data;
  for(let i=0;i<d.length;i+=4){const g=(d[i]*.3+d[i+1]*.59+d[i+2]*.11);d[i]=d[i+1]=d[i+2]=255-g}
  boxBlur(img,6);
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data);
  for(let i=0;i<d.length;i+=4){const a=(d[i]-src[i])*0.6+src[i];d[i]=d[i+1]=d[i+2]=clamp(a,0,255)}
  return img;
}
function vintage(img){
  const d=img.data,w=img.width,h=img.height;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],g=d[i+1],b=d[i+2];
    d[i]=clamp(r*.92+g*.18+b*.06,0,255);d[i+1]=clamp(r*.55+g*.55+b*.10,0,255);d[i+2]=clamp(r*.35+g*.32+b*.42,0,255);
  }
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const o=(y*w+x)*4,nx=(x/w-.5)*2,ny=(y/h-.5)*2;
    const vig=clamp(1-0.75*Math.pow(Math.hypot(nx*.9,ny*.9),2.2),0,1);
    d[o]*=vig;d[o+1]*=vig;d[o+2]*=vig;
    const n=(Math.random()-.5)*16;d[o]+=n;d[o+1]+=n;d[o+2]+=n;
  }
  return img;
}
function glow(img){
  const copy=new ImageData(new Uint8ClampedArray(img.data),img.width,img.height);
  boxBlur(copy,Math.max(2,Math.round(Math.min(img.width,img.height)/60)));
  const d=img.data,cd=copy.data;
  for(let i=0;i<d.length;i+=4){
    d[i]=255-((255-d[i])*(255-cd[i]))/255;
    d[i+1]=255-((255-d[i+1])*(255-cd[i+1]))/255;
    d[i+2]=255-((255-d[i+2])*(255-cd[i+2]))/255;
  }
  return img;
}
function chroma(img){
  const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data,off=Math.max(2,Math.round(w/120));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const o=(y*w+x)*4;
    const r=src[(y*w+clamp(x+off,0,w-1))*4],b=src[(y*w+clamp(x-off,0,w-1))*4+2];
    d[o]=r;d[o+2]=b;
  }
  return img;
}

function autoTone(){
  applyPixel((img)=>{const d=img.data;let mn=255,mx=0;
    for(let i=0;i<d.length;i+=4){mn=Math.min(mn,d[i],d[i+1],d[i+2]);mx=Math.max(mx,d[i],d[i+1],d[i+2])}
    const sc=mx>mn?255/(mx-mn):1;
    for(let i=0;i<d.length;i+=4){d[i]=clamp((d[i]-mn)*sc,0,255);d[i+1]=clamp((d[i+1]-mn)*sc,0,255);d[i+2]=clamp((d[i+2]-mn)*sc,0,255)}
  },{},'自动色调');
}
function autoContrast(){
  applyPixel((img)=>{const d=img.data;const hist=new Array(256).fill(0);
    for(let i=0;i<d.length;i+=4)hist[Math.round((d[i]+d[i+1]+d[i+2])/3)]++;
    const total=d.length/4,cut=total*0.005;let acc=0,lo=0,hi=255;
    for(let v=0;v<256;v++){acc+=hist[v];if(acc>cut){lo=v;break}}
    acc=0;for(let v=255;v>=0;v--){acc+=hist[v];if(acc>cut){hi=v;break}}
    const sc=hi>lo?255/(hi-lo):1;
    for(let i=0;i<d.length;i+=4){d[i]=clamp((d[i]-lo)*sc,0,255);d[i+1]=clamp((d[i+1]-lo)*sc,0,255);d[i+2]=clamp((d[i+2]-lo)*sc,0,255)}
  },{},'自动对比度');
}

function fltGaussian(){pixelDialog({title:'高斯模糊',icon:'blur',
  fields:[{key:'radius',label:'半径',min:0,max:80,step:1,value:6,unit:'px'}],
  fn:(img,p)=>{for(let i=0;i<3;i++)boxBlur(img,p.radius)},label:'高斯模糊'})}
function fltMotion(){pixelDialog({title:'动感模糊',icon:'blur',
  fields:[{key:'angle',label:'角度',min:0,max:180,step:1,value:45,unit:'°'},
    {key:'dist',label:'距离',min:1,max:120,step:1,value:20,unit:'px'},
    {key:'fade',label:'渐隐',min:0,max:100,step:1,value:60}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
    const rad=p.angle*Math.PI/180,dx=Math.cos(rad),dy=Math.sin(rad),N=Math.max(3,Math.round(p.dist/2));
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let r=0,g=0,b=0,a=0,tw=0;
      for(let s=-N;s<=N;s++){
        const wt=1-Math.abs(s)/(N+1)*(p.fade/100);
        const px=clamp(Math.round(x+dx*s),0,w-1),py=clamp(Math.round(y+dy*s),0,h-1),o=(py*w+px)*4;
        r+=src[o]*wt;g+=src[o+1]*wt;b+=src[o+2]*wt;a+=src[o+3]*wt;tw+=wt;
      }
      const o=(y*w+x)*4;d[o]=r/tw;d[o+1]=g/tw;d[o+2]=b/tw;d[o+3]=a/tw;
    }
  },label:'动感模糊'})}
function fltRadial(){pixelDialog({title:'径向模糊',icon:'target',
  fields:[{key:'amount',label:'强度',min:1,max:60,step:1,value:12},
    {key:'zoom',label:'缩放',type:'check',value:true}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data;
    const cx=w/2,cy=h/2,N=p.amount;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      let r=0,g=0,b=0,a=0;
      for(let s=0;s<N;s++){const t=1-s/N*0.8;
        const px=clamp(Math.round(cx+(x-cx)*t),0,w-1),py=clamp(Math.round(cy+(y-cy)*t),0,h-1),o=(py*w+px)*4;
        r+=src[o];g+=src[o+1];b+=src[o+2];a+=src[o+3]}
      const o=(y*w+x)*4;d[o]=r/N;d[o+1]=g/N;d[o+2]=b/N;d[o+3]=a/N;
    }
  },label:'径向模糊'})}
function fltUnsharp(){pixelDialog({title:'USM 锐化',icon:'sharpen',
  fields:[{key:'amount',label:'数量',min:1,max:300,step:1,value:120,unit:'%'},
    {key:'radius',label:'半径',min:1,max:30,step:1,value:3,unit:'px'},
    {key:'thr',label:'阈值',min:0,max:100,step:1,value:6}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,orig=new Uint8ClampedArray(img.data);
    const blur=new ImageData(new Uint8ClampedArray(orig),w,h);
    boxBlur(blur,p.radius);
    const d=img.data,bd=blur.data,k=p.amount/100;
    for(let i=0;i<d.length;i+=4)for(let c=0;c<3;c++){
      const diff=orig[i+c]-bd[i+c];
      if(Math.abs(diff)>p.thr)d[i+c]=clamp(orig[i+c]+diff*k,0,255);
    }
  },label:'USM 锐化'})}
function fltNoise(){pixelDialog({title:'添加杂色',icon:'dice',
  fields:[{key:'amount',label:'数量',min:1,max:100,step:1,value:24},
    {key:'mono',label:'单色',type:'check',value:true}],
  fn:(img,p)=>{
    const d=img.data,N=p.amount*1.2;
    for(let i=0;i<d.length;i+=4){
      if(p.mono){const n=(Math.random()-0.5)*N;d[i]+=n;d[i+1]+=n;d[i+2]+=n}
      else{d[i]+=(Math.random()-.5)*N;d[i+1]+=(Math.random()-.5)*N;d[i+2]+=(Math.random()-.5)*N}
    }
  },label:'添加杂色'})}
function fltPixelate(mosaic){
  pixelDialog({title:mosaic?'马赛克':'像素化',icon:'gridSmall',
  fields:[{key:'cell',label:'单元格',min:2,max:80,step:1,value:10,unit:'px'}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,d=img.data,src=new Uint8ClampedArray(d),cell=Math.max(2,p.cell);
    for(let y=0;y<h;y+=cell)for(let x=0;x<w;x+=cell){
      let r=0,g=0,b=0,a=0,n=0;
      for(let yy=y;yy<Math.min(h,y+cell);yy++)for(let xx=x;xx<Math.min(w,x+cell);xx++){
        const o=(yy*w+xx)*4;r+=src[o];g+=src[o+1];b+=src[o+2];a+=src[o+3];n++}
      r/=n;g/=n;b/=n;a/=n;
      for(let yy=y;yy<Math.min(h,y+cell);yy++)for(let xx=x;xx<Math.min(w,x+cell);xx++){
        const o=(yy*w+xx)*4;d[o]=r;d[o+1]=g;d[o+2]=b;d[o+3]=a}
    }
  },label:mosaic?'马赛克':'像素化'})}
function fltOil(){pixelDialog({title:'油画效果',icon:'brush',
  fields:[{key:'radius',label:'笔触',min:1,max:8,step:1,value:3},
    {key:'levels',label:'色阶',min:4,max:48,step:1,value:20}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,src=new Uint8ClampedArray(img.data),d=img.data,r=p.radius,levels=p.levels;
    const bin=256/levels;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const cnt=new Array(levels).fill(0),sr=new Array(levels).fill(0),sg=new Array(levels).fill(0),sb=new Array(levels).fill(0);
      for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
        const px=clamp(x+dx,0,w-1),py=clamp(y+dy,0,h-1),o=(py*w+px)*4;
        const b=Math.min(levels-1,Math.floor((src[o]+src[o+1]+src[o+2])/3/bin));
        cnt[b]++;sr[b]+=src[o];sg[b]+=src[o+1];sb[b]+=src[o+2];
      }
      let best=0;for(let i=1;i<levels;i++)if(cnt[i]>cnt[best])best=i;
      const o=(y*w+x)*4;
      if(cnt[best]){d[o]=sr[best]/cnt[best];d[o+1]=sg[best]/cnt[best];d[o+2]=sb[best]/cnt[best]}
    }
  },label:'油画效果'})}
function fltVignette(){pixelDialog({title:'暗角',icon:'target',
  fields:[{key:'amount',label:'强度',min:1,max:100,step:1,value:45},
    {key:'size',label:'范围',min:10,max:100,step:1,value:55}],
  fn:(img,p)=>{
    const w=img.width,h=img.height,d=img.data;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const nx=(x/w-.5)*2,ny=(y/h-.5)*2,dist=Math.hypot(nx,ny)/1.414;
      const k=clamp(1-Math.pow(clamp((dist-(1-p.size/100))*2.4,0,1),1.6)*p.amount/100,0,1);
      const o=(y*w+x)*4;d[o]*=k;d[o+1]*=k;d[o+2]*=k;
    }
  },label:'暗角'})}

function dlgImageSize(){
  if(!S.doc){toast('请先新建或打开文档','err');return}
  openModal({title:'图像大小',icon:'image',sub:`当前 ${S.doc.w} × ${S.doc.h} 像素`,okText:'应用',
    body:`<div class="form">
      <div class="frow"><label>宽度</label><div class="ctl"><input class="num" id="iw" type="number" value="${S.doc.w}"><span class="unit">px</span></div></div>
      <div class="frow"><label>高度</label><div class="ctl"><input class="num" id="ih" type="number" value="${S.doc.h}"><span class="unit">px</span></div></div>
      <div class="frow"><label>锁定比例</label><div class="ctl"><label class="chk"><input type="checkbox" id="ilr" checked>等比缩放</label></div></div>
      <div class="note">所有图层会同步缩放，画质按双线性插值重采样。</div></div>`,
    onMount(panel){
      const w=panel.querySelector('#iw'),h=panel.querySelector('#ih'),lr=panel.querySelector('#ilr');
      let ratio=S.doc.w/S.doc.h;
      w.oninput=()=>{if(lr.checked)h.value=Math.round(+w.value/ratio)};
      h.oninput=()=>{if(lr.checked)w.value=Math.round(+h.value*ratio)};
    },
    onOk(panel){
      const nw=clamp(Math.round(+panel.querySelector('#iw').value),1,8000),nh=clamp(Math.round(+panel.querySelector('#ih').value),1,8000);
      if(nw===S.doc.w&&nh===S.doc.h)return true;
      S.doc.layers.forEach(L=>{const c=mkCanvas(nw,nh);c.getContext('2d').drawImage(L.canvas,0,0,nw,nh);
        L.canvas=c;L.ctx=c.getContext('2d');markLayerDirty(L)});
      S.doc.w=nw;S.doc.h=nh;S.sel=null;resizeSurfaces();fitView();renderLayers();pushHistory('调整图像大小');syncStatus();
      toast(`图像已缩放为 ${nw} × ${nh}`,'ok');
    }});
}

      <div class="note">缩小画布会裁掉边缘内容；放大则补透明区域。</div></div>`,
    onOk(panel){
      const nw=clamp(Math.round(+panel.querySelector('#cw').value),1,8000),nh=clamp(Math.round(+panel.querySelector('#ch').value),1,8000);

        L.canvas=c;L.ctx=c.getContext('2d');L.ox+=dx;L.oy+=dy;markLayerDirty(L)});
      S.doc.w=nw;S.doc.h=nh;S.sel=null;resizeSurfaces();fitView();renderLayers();pushHistory('调整画布大小');syncStatus();
    }});

      <div class="frow"><label>质量</label><div class="ctl"><input class="rng" id="exQ" type="range" min="10" max="100" step="1" value="92"><span class="rng-val" id="exQv">92%</span></div></div>

      <div class="frow"><label>背景</label><div class="ctl"><label class="chk"><input type="checkbox" id="exWhite">JPG 使用白底</label></div></div>
      <div class="note" id="exInfo">输出尺寸 ${S.doc.w} × ${S.doc.h}</div></div>`,
    onMount(panel){
      const q=panel.querySelector('#exQ'),sq=panel.querySelector('#exScale');
      q.oninput=()=>panel.querySelector('#exQv').textContent=q.value+'%';
      sq.oninput=()=>{panel.querySelector('#exSv').textContent=sq.value+'%';
        const sel=panel.querySelector('#exSel').checked&&S.sel;
        const b=sel?S.sel.bounds:{x:0,y:0,w:S.doc.w,h:S.doc.h};
        panel.querySelector('#exInfo').textContent=`输出尺寸 ${Math.round(b.w*sq.value/100)} × ${Math.round(b.h*sq.value/100)}`};
      panel.querySelector('#exSel').onchange=()=>sq.dispatchEvent(new Event('input'));
    },
    onOk(panel){
      const fmt=panel.querySelector('#exFmt').value;
      const q=+panel.querySelector('#exQ').value/100;
      const scale=+panel.querySelector('#exScale').value/100;
      const b=(panel.querySelector('#exSel').checked&&S.sel)?S.sel.bounds:{x:0,y:0,w:S.doc.w,h:S.doc.h};
      const tmp=mkCanvas(Math.round(b.w*scale),Math.round(b.h*scale)),t=tmp.getContext('2d');
      t.imageSmoothingQuality='high';
      if(fmt==='image/jpeg'||panel.querySelector('#exWhite').checked){t.fillStyle='#ffffff';t.fillRect(0,0,tmp.width,tmp.height)}
      t.drawImage(compositeCanvas(),b.x,b.y,b.w,b.h,0,0,tmp.width,tmp.height);
      const ext=fmt==='image/png'?'png':fmt==='image/webp'?'webp':fmt==='image/bmp'?'bmp':'jpg';
      const name=(panel.querySelector('#exName').value||'巳泷作品').replace(/[\\/:*?"<>|]/g,'_')+'.'+ext;
      const finish=url=>{download(url,name);toast('已导出 '+name,'ok')};
      if(fmt==='image/bmp'){const url=canvasToBMP(tmp);finish(url)}
      else tmp.toBlob(blob=>{if(!blob){toast('导出失败','err');return}finish(URL.createObjectURL(blob))},fmt,q);
    }});

function canvasToBMP(cv){

<script>
/* ============ PSD 解析 / 导出 ============ */
const PSD_BLEND={norm:'source-over',mul:'multiply',scrn:'screen',over:'overlay',dark:'darken',lite:'lighten',
  hLit:'hard-light',sLit:'soft-light',diff:'difference',smud:'exclusion',div:'color-dodge',idiv:'color-burn',
  hue:'hue',sat:'saturation',colr:'color',lum:'luminosity',pass:'source-over'};
const BLEND_TO_PSD={};
Object.entries(PSD_BLEND).forEach(([k,v])=>{if(!BLEND_TO_PSD[v])BLEND_TO_PSD[v]=k});

function readPascal(buf,pos,len){
  const n=buf[pos];pos++;const chars=[];
  for(let i=0;i<n;i++)chars.push(String.fromCharCode(buf[pos+i]));
  pos+=n;
  const total=1+n;
  const pad=(4-(total%4))%4;
  return {text:chars.join(''),pos:pos+pad};
}
function decodeRLE(buf,pos,w,h,len){
  const out=new Uint8Array(w*h);const counts=[];
  for(let i=0;i<h;i++){counts.push(buf.getUint16(pos,false));pos+=2}
  if(len!=null){/* 保留参数 */}
  for(let y=0;y<h;y++){
    let x=0;const end=pos+counts[y];
    while(pos<end&&x<w){
      const n=buf.getInt8(pos);pos++;
      if(n>=0){for(let i=0;i<n+1;i++){if(x<w)out[y*w+x]=buf.getUint8(pos+i)}pos+=n+1;x+=n+1}
      else if(n>-128){const v=buf.getUint8(pos);pos++;for(let i=0;i<1-n;i++){if(x<w)out[y*w+x]=v;x++}}
    }
    pos=end;
  }
  return {data:out,pos};
}
function loadPSD(arrayBuffer,fileName){
  let psd;
  try{psd=parsePSD(arrayBuffer)}catch(err){console.error(err);toast('PSD 解析失败：'+err.message,'err');return}
  S.doc={w:psd.width,h:psd.height,layers:[],active:0,name:(fileName||'PSD 文档').replace(/\.psd$/i,'')};
  resizeSurfaces();
  psd.layers.forEach(l=>{
    const c=mkCanvas(psd.width,psd.height);
    c.getContext('2d').drawImage(l.canvas,l.left,l.top);
    S.doc.layers.push({id:uid(),name:l.name,canvas:c,ctx:c.getContext('2d'),visible:l.visible,
      opacity:Math.round(l.opacity/255*100),blend:l.blend,ox:0,oy:0,lock:false,thumb:null});
  });
  if(!S.doc.layers.length){const c=mkCanvas(psd.width,psd.height);
    S.doc.layers.push({id:uid(),name:'背景',canvas:c,ctx:c.getContext('2d'),visible:true,opacity:100,blend:'source-over',ox:0,oy:0,lock:false});}
  S.doc.active=Math.min(S.doc.active,S.doc.layers.length-1);
  $('#stageHint').style.display='none';
  render();fitView();syncAll();pushHistory('打开 PSD');
  toast(`PSD 已载入 · ${psd.layers.length} 个图层 · ${psd.width}×${psd.height}`,'ok',3200);
}
function parsePSD(ab){
  const buf=new DataView(ab);
  const sig=String.fromCharCode(buf.getUint8(0),buf.getUint8(1),buf.getUint8(2),buf.getUint8(3));
  if(sig!=='8BPS')throw new Error('不是有效的 PSD 文件');
  const version=buf.getUint16(4,false);
  if(version!==1)throw new Error('暂只支持 PSD v1（不支持 PSB 大文档）');
  const channels=buf.getUint16(12,false);
  const height=buf.getUint32(14,false),width=buf.getUint32(18,false);
  const depth=buf.getUint16(22,false),mode=buf.getUint16(24,false);
  if(depth!==8)throw new Error(`暂只支持 8 位/通道（该文件为 ${depth} 位）`);
  if(mode!==3&&mode!==1)throw new Error('暂只支持 RGB / 灰度色彩模式（CMYK 请先在 PS 中转 RGB）');
  if(width*height>8000*8000)throw new Error('图像过大（超过 6400 万像素）');
  let pos=26;
  pos+=4+buf.getUint32(pos,false); // 颜色模式数据
  pos+=4+buf.getUint32(pos,false); // 图像资源
  const lmLen=buf.getUint32(pos,false);pos+=4;
  const lmStart=pos,lmEnd=pos+lmLen;
  const records=[];
  if(lmLen>0){
  const layerInfoLen=buf.getUint32(pos,false);pos+=4;
  const nLayers=Math.abs(buf.getInt16(pos,false));pos+=2;
  for(let i=0;i<nLayers;i++){
    const top=buf.getInt32(pos,false),left=buf.getInt32(pos+4,false),bottom=buf.getInt32(pos+8,false),right=buf.getInt32(pos+12,false);
    pos+=16;
    const nCh=buf.getUint16(pos,false);pos+=2;
    const chs=[];
    for(let c=0;c<nCh;c++){chs.push({id:buf.getInt16(pos,false),len:buf.getUint32(pos+2,false)});pos+=6}
    const bsig=String.fromCharCode(buf.getUint8(pos),buf.getUint8(pos+1),buf.getUint8(pos+2),buf.getUint8(pos+3));
    const key=String.fromCharCode(buf.getUint8(pos+4),buf.getUint8(pos+5),buf.getUint8(pos+6),buf.getUint8(pos+7));
    const opacity=buf.getUint8(pos+8),clipping=buf.getUint8(pos+9),flags=buf.getUint8(pos+10);
    pos+=12;
    const extraLen=buf.getUint32(pos,false);pos+=4;
    const extraEnd=pos+extraLen;
    // 图层蒙版
    const maskLen=buf.getUint32(pos,false);pos+=4+maskLen;
    const rangeLen=buf.getUint32(pos,false);pos+=4+rangeLen;
    let nm=readPascal(buf,pos);pos=nm.pos;let name=nm.text;
    while(pos<extraEnd-8){
      const s4=String.fromCharCode(buf.getUint8(pos),buf.getUint8(pos+1),buf.getUint8(pos+2),buf.getUint8(pos+3));
      if(s4!=='8BIM'&&s4!=='8B64'){pos+=4;continue}
      const k4=String.fromCharCode(buf.getUint8(pos+4),buf.getUint8(pos+5),buf.getUint8(pos+6),buf.getUint8(pos+7));
      const len=buf.getUint32(pos+8,false);
      const dataStart=pos+12;
      if(k4==='luni'){
        const n=buf.getUint32(dataStart,false);let s='';
        for(let q=0;q<n;q++)s+=String.fromCharCode(buf.getUint16(dataStart+4+q*2,false));
        if(s)name=s;
      }
      let next=dataStart+len;
      if(len%2||len%4){}
      pos=next;
      if(len===0&&k4==='')break;
    }
    records.push({top,left,bottom,right,width:Math.max(0,right-left),height:Math.max(0,bottom-top),
      chs,key,opacity,visible:!(flags&2),name,nameRaw:key});
    pos=extraEnd;
  }
  }
  // 通道数据
  const layers=[];
  records.forEach(rec=>{
    const w=rec.width,h=rec.height;
    const chData={};
    rec.chs.forEach(ch=>{
      if(pos+2>lmEnd)throw new Error('图层通道数据不完整');
      const comp=buf.getUint16(pos,false);pos+=2;
      if(w===0||h===0){pos+=ch.len;return}
      if(comp===0){const arr=new Uint8Array(ab,pos,w*h);chData[ch.id]=new Uint8Array(arr);pos+=w*h}
      else if(comp===1){
        const r=decodeRLE(buf,pos,w,h);
        chData[ch.id]=r.data;pos+= (ch.len-2);
      }else{
        pos+=ch.len-2;
      }
    });
    if(w===0||h===0)return;
    const c=mkCanvas(w,h),x=c.getContext('2d'),id=x.createImageData(w,h);
    const R=chData[0],G=chData[mode===1?0:1],B=chData[mode===1?0:2],A=chData[-1]||chData[-2];
    for(let i=0;i<w*h;i++){
      if(mode===1){const v=R?R[i]:0;id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v}
      else{id.data[i*4]=R?R[i]:0;id.data[i*4+1]=G?G[i]:0;id.data[i*4+2]=B?B[i]:0}
      id.data[i*4+3]=A?A[i]:255;
    }
    x.putImageData(id,0,0);
    layers.push({name:rec.name||('图层 '+(layers.length+1)),canvas:c,left:rec.left,top:rec.top,
      opacity:rec.opacity,visible:rec.visible,blend:PSD_BLEND[rec.key]||'source-over'});
  });
  // 无图层信息（拼合 PSD）→ 读取合并图像数据
  if(!layers.length){
    pos=lmEnd;
    if(pos+2<=buf.byteLength){
      const comp=buf.getUint16(pos,false);pos+=2;
      const planes=[];
      for(let c=0;c<(mode===1?1:3);c++){
        if(comp===0){planes.push(new Uint8Array(ab,pos,width*height));pos+=width*height}
        else if(comp===1){const r=decodeRLE(buf,pos,width,height);planes.push(r.data);pos=r.pos}
        else break;
      }
      if(planes.length>=1){
        const c=mkCanvas(width,height),x=c.getContext('2d'),id=x.createImageData(width,height);
        for(let i=0;i<width*height;i++){
          const v0=planes[0][i];
          id.data[i*4]=v0;id.data[i*4+1]=mode===1?v0:planes[1][i];id.data[i*4+2]=mode===1?v0:planes[2][i];id.data[i*4+3]=255;
        }
        x.putImageData(id,0,0);
        layers.push({name:'背景（拼合）',canvas:c,left:0,top:0,opacity:255,visible:true,blend:'source-over'});
      }
    }
  }
  return {width,height,channels,layers};
}

/* PSD 导出（拼合） */
function exportPSD(){
  if(!S.doc)return;
  const w=S.doc.w,h=S.doc.h;
  const flat=mkCanvas(w,h);composite(flat.getContext('2d'),true);
  const id=flat.getContext('2d').getImageData(0,0,w,h).data;
  const size=26+4+4+4+2+w*h*3;
  const out=new ArrayBuffer(size),v=new DataView(out);
  let p=0;
  const str=s=>{for(let i=0;i<s.length;i++)v.setUint8(p++,s.charCodeAt(i))};
  const u16=x=>{v.setUint16(p,x,false);p+=2};
  const u32=x=>{v.setUint32(p,x,false);p+=4};
  str('8BPS');u16(1);for(let i=0;i<6;i++)v.setUint8(p++,0);
  u16(3);u32(h);u32(w);u16(8);u16(3);
  u32(0); // color mode data
  u32(0); // image resources
  u32(0); // layer & mask
  u16(0); // compression raw
  for(let c=0;c<3;c++)for(let i=0;i<w*h;i++)v.setUint8(p++,id[i*4+c]);
  const blob=new Blob([out],{type:'image/vnd.adobe.photoshop'});
  download(URL.createObjectURL(blob),(S.doc.name||'巳泷作品').replace(/\.(png|jpg|psd|slproj)$/i,'')+'.psd');
  toast('已导出拼合 PSD（'+fmtBytes(size)+'）','ok');
}

<script>
/* ============ 影盾引擎 ============ */
function hashKey(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let s=seed||123456789;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296}}
function shuffleOrder(n,key){
  const arr=new Int32Array(n);for(let i=0;i<n;i++)arr[i]=i;
  const r=rng(hashKey(key)+0x9e3779b9);
  for(let i=n-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=arr[i];arr[i]=arr[j];arr[j]=t}
  return arr;
}
function canvasOf(c){const x=c.getContext('2d');return {c,x,w:c.width,h:c.height}}
function dataURLtoCanvas(url){return loadImgEl(url).then(im=>{const c=mkCanvas(im.width,im.height);c.getContext('2d').drawImage(im,0,0);return c})}

/* 文件 -> 画布 */
const BLOB_URLS=[];
async function fileToCanvas(file){
  if(/\.psd$/i.test(file.name)){
    const buf=await file.arrayBuffer();const psd=parsePSD(buf);
    const c=mkCanvas(psd.width,psd.height),x=c.getContext('2d');
    psd.layers.forEach(l=>x.drawImage(l.canvas,l.left,l.top));
    return {name:file.name.replace(/\.psd$/i,''),canvas:c};
  }
  const url=URL.createObjectURL(file);BLOB_URLS.push(url);
  const im=await loadImgEl(url);
  const c=mkCanvas(im.naturalWidth||im.width,im.naturalHeight||im.height);
  c.getContext('2d').drawImage(im,0,0);
  return {name:file.name,canvas:c};
}
const PANE_OF={tankA:'tank',tankB:'tank',wmImgWM:'wmImg',qrLogo:'qr',img2qr:'qr'};
function addFiles(pane,files,opt){
  opt=opt||{};
  openModal({title:'正在读取图片',icon:'upload',footer:false,body:'<div class="note">解析中…</div>'});
  const modal=$('#modals > div:last-child');
  (async()=>{
    const list=[];
    for(const f of files){
      if(!/image|psd/i.test(f.type)&&!/\.(png|jpe?g|webp|gif|bmp|svg|psd)$/i.test(f.name))continue;
      try{list.push(await fileToCanvas(f))}catch(err){console.warn(err);toast(f.name+' 读取失败','err')}
    }
    if(!list.length){modal&&modal.querySelector('.modal-bg')?.click();toast('没有读到图片。请确认格式为 JPG/PNG/WEBP/BMP/GIF/SVG/PSD，或换一张图重试。','err',3200);return}
    if(opt.single){SH.files[pane]=list.slice(0,1)}else{SH.files[pane]=(SH.files[pane]||[]).concat(list).slice(0,40)}
    modal&&modal.querySelector('.modal-bg')?.click();
    shGo(PANE_OF[pane]||pane);
  })();
}
function shThumbs(pane){
  const box=$(`[data-thumbs="1"]`);if(!box)return;
  const arr=SH.files[pane]||[];
  box.innerHTML=arr.map((f,i)=>`<div class="th" title="${esc(f.name)}">${thumbHTML(f.canvas)}<span>${esc(f.name.slice(0,14))}</span></div>`).join('');
}
function thumbHTML(c){
  const t=mkCanvas(80,80),s=Math.min(80/c.width,80/c.height),w=c.width*s,h=c.height*s;
  t.getContext('2d').drawImage(c,(80-w)/2,(80-h)/2,w,h);
  return `<img loading="lazy" decoding="async" src="${t.toDataURL('image/png')}" alt="">`;
}
function showOut(pane,items){
  const box=document.querySelector(`[data-out="1"]`);if(!box)return;
  box.innerHTML=items.map((it,idx)=>`
    <div style="border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:7px;background:rgb(139,92,246,.05)">
      <div style="display:flex;gap:8px;align-items:center">
        <img loading="lazy" decoding="async" src="${it.url}" style="width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line2)">
        <div style="min-width:0;flex:1">
          <div style="font-size:11px;color:#efe6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.name)}</div>
          <div style="font-size:9.5px;color:var(--dim)">${it.note||''}</div>
        </div>
        <button class="btn sm primary" data-dl="${idx}">${ic('download')}保存</button>
      </div>
      ${it.text?`<div class="log" style="max-height:80px">${esc(it.text)}</div>`:''}
    </div>`).join('')||'<div class="pane-desc">暂无输出</div>';
  box.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>{
    const it=items[+b.dataset.dl];download(it.url,it.name);toast('已保存 '+it.name,'ok');
  });
  SH.out[pane]=items;
}

/* 面板事件绑定 */
function wirePane(k){
  const C=shCfg(k,{key:'silong',mode:'enc',text:'巳泷 · 严禁盗用',size:32,opacity:16,rotate:-30,gap:60,color:'#ffffff',
    font:'PingFang SC',pos:'br',scale:18,strength:16,depth:1,level:'M',px:520,fg:'#160a2a',bg:'#ffffff',i2q:64,i2qq:40,
    maxW:1600,q:82,fmt:'image/jpeg',bri:0,con:0,sat:0,hue:0,sharp:0,blur:0,gray:false,invert:false});
  const pane=$('#drawerBody');
  pane.querySelectorAll('[data-c]').forEach(el=>{
    const key=el.dataset.c;
    if(el.type==='checkbox')el.checked=!!C[key];else if(el.tagName!=='TEXTAREA'&&el.type!=='color'&&(!C[key]||el.value!==String(C[key]))){el.value=C[key]}
    const out=pane.querySelector(`[data-v="${key}"]`);
    const h=()=>{
      C[key]=el.type==='checkbox'?el.checked:(el.type==='range'||el.type==='number')?parseFloat(el.value):el.value;
      if(out)out.textContent=C[key]+(key==='hue'||key==='rotate'?'°':key==='depth'||key==='strength'?'':key==='px'?'px':'%');
    };

  });
  pane.querySelectorAll('[data-seg]').forEach(seg=>{
    const name=seg.dataset.seg;
    seg.querySelectorAll('button').forEach(b=>{
      const v=b.dataset.v;
      if(name==='obfMode'&&(C.mode||'enc')===v)b.classList.add('on');else if(name==='dctMode'&&(C.mode||'enc')===v)b.classList.add('on');else if(name==='lsbMode'&&(C.mode||'enc')===v)b.classList.add('on');
      b.onclick=()=>{C.mode=v;seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
        if(k==='obf'){const l=pane.querySelector('[data-run-label]');if(l)l.textContent=v==='enc'?'开始混淆':'开始解混淆'}}
    });
  });
  shThumbs(k);
  const drop=pane.querySelector('[data-drop="1"]');
  drop&&bindDrop(drop,true,fs=>addFiles(k,fs));
  const dw=pane.querySelector('[data-dropwm="1"]');
  dw&&bindDrop(dw,false,fs=>addFiles('wmImgWM',fs,{single:true}));
  const logo=pane.querySelector('[data-droplogo="1"]');
  logo&&bindDrop(logo,false,fs=>addFiles('qrLogo',fs,{single:true}));
  const i2q=pane.querySelector('[data-dropimg2qr="1"]');
  i2q&&bindDrop(i2q,false,fs=>addFiles('img2qr',fs,{single:true}));
  const a=pane.querySelector('[data-dropA="1"]'),b=pane.querySelector('[data-dropB="1"]');
  a&&bindDrop(a,false,fs=>addFiles('tankA',fs,{single:true}));
  b&&bindDrop(b,false,fs=>addFiles('tankB',fs,{single:true}));
  // 预览已有水印图/logo/二维码源图
  paintDropPreview(pane.querySelector('[data-dropwm="1"]'),SH.files.wmImgWM?.[0]);
  paintDropPreview(pane.querySelector('[data-droplogo="1"]'),SH.files.qrLogo?.[0]);
  paintDropPreview(pane.querySelector('[data-dropimg2qr="1"]'),SH.files.img2qr?.[0]);
  paintDropPreview(pane.querySelector('[data-dropA="1"]'),SH.files.tankA?.[0]);
  paintDropPreview(pane.querySelector('[data-dropB="1"]'),SH.files.tankB?.[0]);
  const ta=pane.querySelector('textarea[data-c="text"]');
  if(ta&&!C.text)C.text=ta.value;
  if(k==='tank'){drawTankPreview()}
  pane.querySelectorAll('[data-run]').forEach(btn=>btn.onclick=()=>runPane(k,btn.dataset.run));
  if(SH.out[k])showOut(k,SH.out[k]);
}
function paintDropPreview(zone,f){
  if(!zone||!f)return;
  zone.innerHTML='<img loading="lazy" decoding="async" src="'+thumbHTML(f.canvas).match(/src="([^"]+)"/)[1]+'" alt="" style="max-height:88px"><p style="margin-top:4px">'+esc(f.name.slice(0,18))+'</p>';
  zone.classList.add('on');
}
function bindDrop(el,multiple,onFiles){
  // 固定挂到 DOM 的隐藏 input：部分手机浏览器/鸿蒙 WebView 不允许点击未挂载的 input
  let inp=el.__slFileInput;
  if(!inp){
    inp=document.createElement('input');
    inp.type='file';inp.accept='image/*,.psd';inp.multiple=!!multiple;
    inp.id='slDropFile'+(window.__slDropSeq=(window.__slDropSeq||0)+1);
    inp.style.cssText='position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.appendChild(inp);
    el.__slFileInput=inp;
  }
  inp.multiple=!!multiple;
  inp.onchange=()=>{
    const files=inp.files?[...inp.files]:[];
    if(files.length)onFiles(files);
    inp.value='';
  };
  el.onclick=(e)=>{e.preventDefault();e.stopPropagation();inp.value='';inp.click()};
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('on')});
  el.addEventListener('dragleave',()=>el.classList.remove('on'));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('on');
    const fs=e.dataTransfer&&e.dataTransfer.files?[...e.dataTransfer.files]:[];
    if(fs.length)onFiles(fs)});
}

/* 主流程 */
async function runPane(k,run){
  const C=SH.cfg[k];
  try{
    if(k==='obf')return await runObf();
    if(k==='wmText')return await runTextWM();
    if(k==='wmImg')return await runImgWM();
    if(k==='dct')return await runDct();
    if(k==='lsb')return await runLsb();
    if(k==='detect')return await runDetect();
    if(k==='qr'){if(run==='img2qr')return await runImg2Qr();return await runQr()}
    if(k==='tank')return await runTank();
    if(k==='batch')return await runBatch();
    if(k==='adjust')return await runBatchAdjust();
  }catch(err){console.error(err);toast('处理失败：'+(err.message||err),'err',3200)}
}

/* ---------- 1. 混淆 ---------- */
async function runObf(){
  const C=SH.cfg.obf,files=SH.files.obf||[];
  if(!files.length){toast('请先选择图片','err');return}
  if(!C.key){toast('请输入密钥','err');return}
  const out=[];
  for(const f of files){
    const c=cloneCanvas(f.canvas);
    obfuscate(c,C.key,C.mode==='dec');
    out.push({url:c.toDataURL('image/png'),name:f.name.replace(/\.[^.]+$/,'')+(C.mode==='dec'?'_还原':'_混淆')+'.png',
      note:`${c.width}×${c.height} · 密钥 ${C.key}`});
  }
  showOut('obf',out);
  toast(`已处理 ${out.length} 张（${C.mode==='dec'?'解混淆':'混淆'}）`,'ok');
}
function obfuscate(c,key,decrypt){
  const x=c.getContext('2d'),w=c.width,h=c.height,img=x.getImageData(0,0,w,h);
  const n=w*h,order=shuffleOrder(n,key),src=new Uint8ClampedArray(img.data),dst=img.data;
  if(!decrypt){
    for(let i=0;i<n;i++){const s=order[i]*4,t=i*4;dst[t]=src[s];dst[t+1]=src[s+1];dst[t+2]=src[s+2];dst[t+3]=src[s+3]}
  }else{
    for(let i=0;i<n;i++){const d=order[i]*4,s=i*4;dst[d]=src[s];dst[d+1]=src[s+1];dst[d+2]=src[s+2];dst[d+3]=src[s+3]}
  }
  x.putImageData(img,0,0);
  return c;
}
/* ---------- 2. 文字水印 ---------- */
async function runTextWM(){
  const C=SH.cfg.wmText,files=SH.files.wmText||[];
  if(!files.length){toast('请先选择图片','err');return}
  if(!C.text.trim()){toast('请输入水印文字','err');return}
  const out=[];
  for(const f of files){
    const c=cloneCanvas(f.canvas);textWatermark(c,C);
    out.push({url:c.toDataURL('image/png'),name:f.name.replace(/\.[^.]+$/,'')+'_水印.png',
      note:`${c.width}×${c.height} · ${C.text.slice(0,12)}`});
  }
  showOut('wmText',out);toast(`已为 ${out.length} 张图片加上水印`,'ok');
}
function textWatermark(c,C){
  const x=c.getContext('2d'),w=c.width,h=c.height;
  const fs=Math.max(10,C.size),font=`${C.bold?'700':'400'} ${fs}px "${C.font}",sans-serif`;
  x.save();x.font=font;x.fillStyle=C.color;x.globalAlpha=clamp(C.opacity/100,.02,1);
  if(C.shadow){x.shadowColor='rgb(0,0,0,.55)';x.shadowBlur=fs*0.2;x.shadowOffsetY=fs*0.08}
  const tw=Math.max(1,x.measureText(C.text).width),gap=fs*Math.max(.2,C.gap/100);
  const diag=Math.hypot(w,h);
  x.translate(w/2,h/2);x.rotate((C.rotate||0)*Math.PI/180);x.translate(-w/2,-h/2);
  for(let yy=-diag;yy<h+diag;yy+=fs+gap+6)
    for(let xx=-diag;xx<w+diag;xx+=tw+gap+fs*2)
      x.fillText(C.text,xx,yy);
  x.restore();return c;
}
/* ---------- 3. 图片水印 ---------- */
async function runImgWM(){
  const C=SH.cfg.wmImg,src=SH.files.wmImgWM?.[0],files=SH.files.wmImg||[];
  if(!src){toast('请先上传水印图','err');return}
  if(!files.length){toast('请先选择目标图片','err');return}
  const out=[];
  for(const f of files){
    const c=cloneCanvas(f.canvas);imageWatermark(c,src.canvas,C);
    out.push({url:c.toDataURL('image/png'),name:f.name.replace(/\.[^.]+$/,'')+'_LOGO.png',note:`${c.width}×${c.height}`});
  }
  showOut('wmImg',out);toast(`已合成 ${out.length} 张`,'ok');
}
function imageWatermark(c,wm,C){
  const x=c.getContext('2d'),w=c.width,h=c.height;
  const scale=(C.scale||18)/100,ww=Math.max(8,w*scale),wh=ww*wm.height/wm.width;
  x.save();x.globalAlpha=clamp((C.opacity??55)/100,.02,1);
  const draw=(px,py)=>{x.save();x.translate(px+ww/2,py+wh/2);x.rotate((C.rotate||0)*Math.PI/180);x.drawImage(wm,-ww/2,-wh/2,ww,wh);x.restore()};
  const pad=Math.round(w*0.03);
  if(C.pos==='tile'){
    const stepX=ww+pad*2,stepY=wh+pad*2;
    for(let yy=0;yy<h;yy+=stepY)for(let xx=0;xx<w;xx+=stepX)draw(xx,yy);
  }else{
    const map={br:[w-ww-pad,h-wh-pad],bl:[pad,h-wh-pad],tr:[w-ww-pad,pad],tl:[pad,pad],center:[(w-ww)/2,(h-wh)/2]};
    draw(...(map[C.pos]||map.br));
  }
  x.restore();return c;
}
/* ---------- 4. DCT 盲水印 ---------- */
const DCT_COS=(()=>{const t=[];for(let u=0;u<8;u++){const row=[];for(let x=0;x<8;x++)row.push(Math.cos((2*x+1)*u*Math.PI/16)*(u?1:Math.SQRT1_2));t.push(row)}return t})();
function dct8(block){const out=new Float64Array(64);
  for(let u=0;u<8;u++)for(let v=0;v<8;v++){let s=0;
    for(let y=0;y<8;y++)for(let x=0;x<8;x++)s+=block[y*8+x]*DCT_COS[u][x]*DCT_COS[v][y];
    out[u*8+v]=s/4}
  return out}
function idct8(co){const out=new Float64Array(64);
  for(let y=0;y<8;y++)for(let x=0;x<8;x++){let s=0;
    for(let u=0;u<8;u++)for(let v=0;v<8;v++)s+=co[u*8+v]*DCT_COS[u][x]*DCT_COS[v][y];
    out[y*8+x]=s/4}
  return out}
function bytesToBits(bytes){const bits=new Uint8Array(bytes.length*8);
  for(let i=0;i<bytes.length;i++)for(let b=0;b<8;b++)bits[i*8+b]=(bytes[i]>>(7-b))&1;return bits}
function bitsToBytes(bits){const out=new Uint8Array(Math.floor(bits.length/8));
  for(let i=0;i<out.length;i++){let v=0;for(let b=0;b<8;b++)v=(v<<1)|bits[i*8+b];out[i]=v}return out}
function textToPay(text){const enc=new TextEncoder().encode(text);
  const bytes=new Uint8Array(3+enc.length);bytes[0]=0x53;bytes[1]=0x4C;bytes[2]=enc.length>255?255:enc.length;
  bytes.set(enc.subarray(0,255),3);return bytes}
function payToText(bytes){
  if(bytes[0]!==0x53||bytes[1]!==0x4C)return null;
  const n=bytes[2];const dec=new TextDecoder();
  return dec.decode(bytes.subarray(3,3+n));
}

function dctBlocks(w,h){return Math.floor(w/8)*Math.floor(h/8)}
function dctEmbed(c,text,strength,key){
  const w=c.width,h=c.height,nb=dctBlocks(w,h);
  const bytes=textToPay(text),bits=bytesToBits(bytes);
  if(bits.length>nb*0.9)return false;
  const x=c.getContext('2d'),img=x.getImageData(0,0,w,h),d=img.data;
  const order=shuffleOrder(nb,key+'dct');
  const q=Math.max(4,strength)*2.2;
  for(let bi=0;bi<bits.length;bi++){
    const block=order[bi%nb],bx=(block%Math.floor(w/8))*8,by=Math.floor(block/Math.floor(w/8))*8;
    const B=new Float64Array(64);
    for(let y=0;y<8;y++)for(let xx=0;xx<8;xx++)B[y*8+xx]=d[((by+y)*w+(bx+xx))*4+2];
    const co=dct8(B);
    co[3*8+2]=(bits[bi]?1:-1)*Math.max(Math.abs(co[3*8+2]),q);
    const back=idct8(co);
    for(let y=0;y<8;y++)for(let xx=0;xx<8;xx++){
      const o=((by+y)*w+(bx+xx))*4+2;d[o]=clamp(back[y*8+xx],0,255);
    }
  }
  x.putImageData(img,0,0);return true;
}
function dctExtract(c,key){
  const w=c.width,h=c.height,nb=dctBlocks(w,h);
  const d=c.getContext('2d').getImageData(0,0,w,h).data;
  const order=shuffleOrder(nb,key+'dct');
  const maxBits=Math.min(nb,3*8+255*8);
  const bits=new Uint8Array(maxBits);
  for(let bi=0;bi<maxBits;bi++){
    const block=order[bi%nb],bx=(block%Math.floor(w/8))*8,by=Math.floor(block/Math.floor(w/8))*8;
    const B=new Float64Array(64);
    for(let y=0;y<8;y++)for(let xx=0;xx<8;xx++)B[y*8+xx]=d[((by+y)*w+(bx+xx))*4+2];
    const co=dct8(B);
    bits[bi]=co[3*8+2]>0?1:0;
  }
  const bytes=bitsToBytes(bits);
  return payToText(bytes);
}

function lsbEmbed(c,text,depth,key){
  const w=c.width,h=c.height,x=c.getContext('2d'),img=x.getImageData(0,0,w,h),d=img.data;
  const bytes=textToPay(text),bits=bytesToBits(bytes);
  const n=w*h*depth*3;
  if(bits.length>n-32)return false;
  const order=shuffleOrder(w*h,key+'lsb');
  const mask=(1<<depth)-1;
  for(let i=0;i<bits.length;i++){
    const ch=i%3,pi=order[Math.floor(i/3)%(w*h)],off=pi*4+ch;
    const cur=d[off]&~mask;
    let val=0;
    for(let b=0;b<depth;b++)val=(val<<1)|bits[i*depth+b]||0;
    d[off]=cur|(val&mask);
  }
  x.putImageData(img,0,0);return true;
}
function lsbExtract(c,depth,key){
  const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;
  const order=shuffleOrder(w*h,key+'lsb');
  const maxBytes=Math.min(300,w*h*3*depth/8);
  const bits=new Uint8Array(maxBytes*8);
  try{
    for(let i=0;i<bits.length;i++){
      const ch=i%3,pi=order[Math.floor(i/3)%(w*h)],off=pi*4+ch;
      const val=d[off]&((1<<depth)-1);
      for(let b=0;b<depth;b++)bits[i*depth+b]=(val>>(depth-1-b))&1;
    }
    return payToText(bitsToBytes(bits));
  }catch(e){return null}
}

function fltMedian(){pixelDialog({title:'中值降噪',icon:'blur',note:'去掉照片噪点，同时保留边缘',
  fields:[{key:'r',label:'半径',min:1,max:6,step:1,value:3}],
  fn:(img,p)=>medianBlur(img.data,img.width,img.height,Math.round(p.r||3)),label:'中值降噪'})}
function medianBlur(d,w,h,r){
  if(r<1)return;const src=new Uint8ClampedArray(d);const rr=r*2+1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=(y*w+x)*4;
    const R=[],G=[],B=[],A=[];
    for(let oy=-r;oy<=r;oy++)for(let ox=-r;ox<=r;ox++){
      const yy=Math.min(h-1,Math.max(0,y+oy)),xx=Math.min(w-1,Math.max(0,x+ox)),j=(yy*w+xx)*4;
      R.push(src[j]);G.push(src[j+1]);B.push(src[j+2]);A.push(src[j+3]);
    }
    R.sort((a,b)=>a-b);G.sort((a,b)=>a-b);B.sort((a,b)=>a-b);A.sort((a,b)=>a-b);
    const m=Math.floor(R.length/2);
    d[i]=R[m];d[i+1]=G[m];d[i+2]=B[m];d[i+3]=A[m];
  }
}
function fltSurface(){pixelDialog({title:'表面模糊',icon:'softBlur',note:'磨皮级平滑：只模糊平坦区域，保留边缘细节',
  fields:[{key:'r',label:'半径',min:1,max:20,step:1,value:6},{key:'th',label:'阈值',min:2,max:80,step:1,value:24}],
  fn:(img,p)=>{
    const r=Math.round(p.r||6),th=p.th||24,src=new Uint8ClampedArray(img.data),w=img.width,h=img.height;
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){
      const i=(y*w+x)*4;let sr=0,sg=0,sb=0,wt=0;
      for(let oy=-r;oy<=r;oy+=2)for(let ox=-r;ox<=r;ox+=2){
        const yy=Math.min(h-1,Math.max(0,y+oy)),xx=Math.min(w-1,Math.max(0,x+ox)),j=(yy*w+xx)*4;
        const diff=Math.abs(src[j]-src[i])+Math.abs(src[j+1]-src[i+1])+Math.abs(src[j+2]-src[i+2]);
        if(diff<th){const wgt=1-diff/th;sr+=src[j]*wgt;sg+=src[j+1]*wgt;sb+=src[j+2]*wgt;wt+=wgt}
      }
      if(wt>0){img.data[i]=sr/wt;img.data[i+1]=sg/wt;img.data[i+2]=sb/wt}
    }
  },label:'表面模糊'})}
function fltWave(){pixelDialog({title:'波纹扭曲',icon:'wave',note:'正弦波纹扭曲，可做水面 / 旗帜飘动',
  fields:[{key:'amp',label:'振幅',min:1,max:60,step:1,value:14},{key:'wl',label:'波长',min:20,max:400,step:5,value:120},
    {key:'vert',label:'垂直',min:0,max:1,step:1,value:0}],

function phantomTank(ca,cb){
  const W=Math.max(2,Math.min(ca.width,cb.width)),H=Math.max(2,Math.min(ca.height,cb.height));
  const A=mkCanvas(W,H),B=mkCanvas(W,H),O=mkCanvas(W,H);
  A.getContext('2d').drawImage(ca,0,0,W,H);
  B.getContext('2d').drawImage(cb,0,0,W,H);
  const da=A.getContext('2d').getImageData(0,0,W,H).data,db=B.getContext('2d').getImageData(0,0,W,H).data;
  const od=O.getContext('2d').createImageData(W,H);
  for(let i=0;i<da.length;i+=4){
    const alpha=clamp(1+((db[i]-da[i])+(db[i+1]-da[i+1])+(db[i+2]-da[i+2]))/(3*255),.02,1);
    od.data[i]=clamp(db[i]/alpha,0,255);
    od.data[i+1]=clamp(db[i+1]/alpha,0,255);
    od.data[i+2]=clamp(db[i+2]/alpha,0,255);
    od.data[i+3]=Math.round(alpha*255);
  }
  O.getContext('2d').putImageData(od,0,0);
  return O;
}

    x.putImageData(img,0,0);
    out.push({url:c.toDataURL(C.fmt==='image/jpeg'?'image/jpeg':C.fmt==='image/webp'?'image/webp':'image/png',.9),
      name:f.name.replace(/\.[^.]+$/,'')+'_调色.'+(C.fmt==='image/webp'?'webp':C.fmt==='image/jpeg'?'jpg':'png'),note:`${c.width}×${c.height}`});
  }
  showOut('adjust',out);toast(`已处理 ${out.length} 张`,'ok');
}
/* ---------- 当前画布送入影盾 ---------- */
function sendToShield(){
  if(!S.doc){toast('当前没有文档','err');return}
  const c=mkCanvas(S.doc.w,S.doc.h);composite(c.getContext('2d'),true);
  const entry={name:'当前画布.png',canvas:c};
  SH.files.obf=[entry];SH.files.wmText=[entry];SH.files.wmImg=[entry];SH.files.dct=[entry];SH.files.lsb=[entry];
  openDrawer();shGo('wmText');toast('当前画布已送入影盾','ok');
}
function dlgTank(){openDrawer();shGo('tank')}
function dlgBatch(){openDrawer();shGo('batch')}
</script>
<script>
/* ============ 启动与交互 ============ */
S.opts.sel={feather:0};
S.opts.sharpenTool={size:40,strength:50};

/* 选项栏按钮命令 */
$('#optControls').addEventListener('click',e=>{
  const b=e.target.closest('[data-cmd]');if(!b)return;
  const cmd=b.dataset.cmd;
  if(cmd==='selectAll')selectAll();
  else if(cmd==='invertSel'){if(S.sel)invertSel();else toast('请先建立选区','err')}
  else if(cmd==='clearSel')clearSel();
  else if(cmd==='applyCrop'){
    if(!S.cropRect){toast('请先在画布上框选裁剪区域','err');return}
    const a=S.cropRect.a,b2=S.cropRect.b;
    const x=Math.round(Math.min(a.x,b2.x)),y=Math.round(Math.min(a.y,b2.y));
    const w=Math.round(Math.abs(b2.x-a.x)),h=Math.round(Math.abs(b2.y-a.y));
    applyCropRect(clamp(x,0,S.doc.w),clamp(y,0,S.doc.h),Math.min(w,S.doc.w-x),Math.min(h,S.doc.h-y));
  }
  else if(cmd==='cancelCrop'){S.cropRect=null;drawOverlay();toast('已取消裁剪')}
  else if(cmd==='pickFg'){const i=document.createElement('input');i.type='color';i.value=S.fg;i.oninput=()=>{setFg(i.value);buildOptions()};i.click()}
  else if(cmd==='penCommit')penCommit();
  else if(cmd==='penCancel'){S.pen=null;drawOverlay();toast('已取消路径')}
  else if(cmd==='fitView')fitView();
  else if(cmd==='zoomIn')setZoom(S.view.zoom*1.25);
  else if(cmd==='zoomOut')setZoom(S.view.zoom/1.25);
  else if(cmd==='zoomHundred')setZoom(1);
});

/* 顶栏按钮 */
$('#btnUndo').onclick=undo;$('#btnRedo').onclick=redo;
$('#btnExport').onclick=dlgExport;
$('#btnDockToggle').onclick=()=>{
  const main=document.querySelector('.main');
  if(window.innerWidth<=960){$('#dock').classList.toggle('on')}
  else{main.classList.toggle('nodock')}
  updateNav();setTimeout(()=>{if(S.view.fit)fitView()},260);
};;
$('#zoomIn').onclick=()=>setZoom(S.view.zoom*1.25);
$('#zoomOut').onclick=()=>setZoom(S.view.zoom/1.25);
$('#zoomFit').onclick=fitView;
$('#swMain').onclick=()=>{const i=document.createElement('input');i.type='color';i.value=S.fg;i.oninput=()=>setFg(i.value);i.click()};
$('#swBack').onclick=()=>{const i=document.createElement('input');i.type='color';i.value=S.bg;i.oninput=()=>setBg(i.value);i.click()};
$('#swSwap').onclick=()=>{const t=S.fg;S.fg=S.bg;S.bg=t;paintSwatches();buildOptions()};
$('#mainCanvas').addEventListener('contextmenu',e=>e.preventDefault());

/* 快捷键 */
let spaceDown=false;
document.addEventListener('keydown',e=>{
  const tgt=e.target;
  const typing=tgt&&(/INPUT|TEXTAREA|SELECT/.test(tgt.tagName)||tgt.isContentEditable);
  const modalOpen=$$('#modals .modal').length>0;
  if(e.key==='Escape'){
    if(modalOpen){const m=$$('#modals .modal').pop();m.querySelector('.close')?.click();return}
    if(document.body.classList.contains('side-open')){closeDrawer();return}
    S.cropRect=null;drawOverlay();return;
  }
  if(typing||modalOpen)return;
  if(e.key==='Enter'&&S.pen){penCommit();return}
  if(e.key==='Escape'&&S.pen){S.pen=null;drawOverlay();return}
  const k=e.key.toLowerCase();
  if(e.shiftKey&&!e.ctrlKey&&!e.metaKey&&k==='s'){e.preventDefault();toggleSide();return}
  if(e.code==='Space'){if(!spaceDown){spaceDown=true;S.tempHand=true;$('#mainCanvas').style.cursor='grab'}e.preventDefault();return}
  if(e.ctrlKey||e.metaKey){
    if(k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
    if(k==='y'){e.preventDefault();redo();return}
    if(k==='s'){e.preventDefault();saveProject();return}
    if(k==='e'&&e.shiftKey){e.preventDefault();dlgExport();return}
    if(k==='e'){e.preventDefault();mergeDown();return}
    if(k==='o'){e.preventDefault();pickFiles('image');return}
    if(k==='n'){e.preventDefault();dlgNew();return}
    if(k==='a'){e.preventDefault();selectAll();return}
    if(k==='d'){e.preventDefault();clearSel();return}
    if(k==='i'){e.preventDefault();invertSel();return}
    if(k==='j'){e.preventDefault();dupLayer();return}
    if(k==='0'){e.preventDefault();fitView();return}
    if(k==='1'){e.preventDefault();setZoom(1);return}
    if(k==='='||k==='+'){e.preventDefault();setZoom(S.view.zoom*1.25);return}
    if(k==='-'){e.preventDefault();setZoom(S.view.zoom/1.25);return}
    if(k==='u'){e.preventDefault();adjHueSat();return}
    if(k==='b'){e.preventDefault();adjColorBalance();return}
    if(k==='['){e.preventDefault();moveLayer(-1);return}
    if(k===']'){e.preventDefault();moveLayer(1);return}
    return;
  }
  if(k==='enter'&&S.cropRect){
    const a=S.cropRect.a,b2=S.cropRect.b;
    const x=Math.round(Math.min(a.x,b2.x)),y=Math.round(Math.min(a.y,b2.y));
    const w=Math.round(Math.abs(b2.x-a.x)),h=Math.round(Math.abs(b2.y-a.y));
    applyCropRect(clamp(x,0,S.doc.w),clamp(y,0,S.doc.h),Math.min(w,S.doc.w-x),Math.min(h,S.doc.h-y));return;
  }
  if(k==='delete'||k==='backspace'){clearPixels();return}
  if(k==='arrowup'||k==='arrowdown'||k==='arrowleft'||k==='arrowright'){
    if(!S.doc||!active())return;const L=active(),step=e.shiftKey?10:1;
    if(k==='arrowup')L.oy-=step;if(k==='arrowdown')L.oy+=step;if(k==='arrowleft')L.ox-=step;if(k==='arrowright')L.ox+=step;
    render();e.preventDefault();return;
  }
  if(k==='['||k===']'){
    const o=S.opts[S.tool];if(!o||!o.size)return;
    const d=Math.max(1,Math.round(o.size*0.2));
    o.size=clamp(o.size+(k===']'?d:-d),1,300);
    buildOptions();drawOverlay();syncBrushNote();return;
  }
  if(k==='x'){const t=S.fg;S.fg=S.bg;S.bg=t;paintSwatches();buildOptions();return}
  if(k==='d'&&!e.ctrlKey){setFg('#000000');setBg('#ffffff');return}
  const map={v:'move',m:'marquee',l:'lasso',w:'wand',c:'crop',i:'eyedrop',b:'brush',n:'pencil',e:'eraser',
    g:'bucket',t:'text',u:'shape',s:'clone',j:'heal',h:'hand',z:'zoom'};
  if(map[k]){setTool(map[k]);return}
});
document.addEventListener('keyup',e=>{
  if(e.code==='Space'){spaceDown=false;S.tempHand=false;$('#mainCanvas').style.cursor='crosshair'}
});

/* 拖入文档 → 打开 */
window.addEventListener('resize',()=>{if(S.view.fit)fitView();else updateNav()});

/* ---------- 示例文档 ---------- */
function makeDemoDoc(){
  const W=1600,H=1000;
  newDoc(W,H,'#0a0616');
  const bg=S.doc.layers[0];bg.name='背景 · 紫夜';
  const bx=bg.ctx;
  const g=bx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,'#1b1033');g.addColorStop(.55,'#0c0719');g.addColorStop(1,'#06030d');
  bx.fillStyle=g;bx.fillRect(0,0,W,H);
  const glow=(x,y,r,c1)=>{const rg=bx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,c1);rg.addColorStop(1,'rgb(0,0,0,0)');bx.fillStyle=rg;bx.beginPath();bx.arc(x,y,r,0,7);bx.fill()};
  glow(420,180,520,'rgb(139,92,246,.35)');
  glow(1250,820,600,'rgb(244,114,182,.16)');
  glow(1180,220,300,'rgb(167,139,250,.10)');
  // 细网格
  bx.strokeStyle='rgb(167,139,250,.10)';bx.lineWidth=1;
  for(let x=0;x<W;x+=64){bx.beginPath();bx.moveTo(x+.5,0);bx.lineTo(x+.5,H);bx.stroke()}
  for(let y=0;y<H;y+=64){bx.beginPath();bx.moveTo(0,y+.5);bx.lineTo(W,y+.5);bx.stroke()}

  // 光带图层
  const halo=newLayer('光带 · 装饰');S.doc.layers.push(halo);
  const hx=halo.ctx;
  hx.save();hx.translate(W/2,H/2);hx.rotate(-.18);
  const lg=hx.createLinearGradient(-700,0,700,0);
  lg.addColorStop(0,'rgb(139,92,246,0)');lg.addColorStop(.42,'rgb(168,85,247,.55)');
  lg.addColorStop(.58,'rgb(244,114,182,.35)');lg.addColorStop(1,'rgb(167,139,250,0)');
  hx.fillStyle=lg;hx.fillRect(-760,-1.6,1520,3.2);
  hx.globalAlpha=.55;hx.fillRect(-620,34,1240,1.2);
  hx.restore();

  // 形状图层
  const sh=newLayer('框线 · 图形');S.doc.layers.push(sh);
  const sx=sh.ctx;
  sx.strokeStyle='rgb(196,181,253,.35)';sx.lineWidth=1.5;sx.strokeRect(88,88,W-176,H-176);
  sx.strokeStyle='rgb(196,181,253,.16)';sx.strokeRect(108,108,W-216,H-216);
  [[88,88],[W-88,88],[88,H-88],[W-88,H-88]].forEach(([x,y])=>{
    sx.fillStyle='rgb(216,180,254,.9)';sx.fillRect(x-7,y-7,14,14);
  });
  sx.strokeStyle='rgb(139,92,246,.5)';sx.beginPath();sx.arc(W-290,300,120,0,7);sx.stroke();
  sx.strokeStyle='rgb(167,139,250,.35)';sx.beginPath();sx.arc(W-290,300,86,0,7);sx.stroke();
  sx.beginPath();sx.moveTo(W-290,300);sx.lineTo(W-290+Math.cos(-.6)*120,300+Math.sin(-.6)*120);sx.strokeStyle='rgb(244,114,182,.6)';sx.stroke();

  // 文字图层
  const tx=newLayer('标题 · 主视觉');S.doc.layers.push(tx);
  const t=tx.ctx;
  t.textBaseline='alphabetic';
  t.font='800 92px "PingFang SC","Microsoft YaHei",sans-serif';
  const tg=t.createLinearGradient(140,0,900,0);
  tg.addColorStop(0,'#f5eaff');tg.addColorStop(.45,'#c4b5fd');tg.addColorStop(1,'#f0abfc');
  t.fillStyle=tg;t.fillText('巳泷图像工坊',140,470);
  t.font='400 25px "PingFang SC",sans-serif';t.fillStyle='rgb(214,196,255,.78)';
  t.fillText('巳泷视觉工作室  ·  影盾版 v12',146,522);
  t.font='400 17px "PingFang SC",sans-serif';t.fillStyle='rgb(190,170,225,.55)';
  t.fillText('图层绘画 · 修图调色 · 滤镜库 · PSD 导入导出 · 隐写与批量处理',146,566);
  // 标签
  const tags=['图层','选区','滤镜','PSD','隐写','二维码'];
  let px=146;
  t.font='500 15px "PingFang SC",sans-serif';
  tags.forEach(tag=>{
    const w=t.measureText(tag).width+30;
    t.fillStyle='rgb(139,92,246,.22)';t.strokeStyle='rgb(196,181,253,.4)';t.lineWidth=1;
    if(t.roundRect){t.beginPath();t.roundRect(px,614,w,34,17);t.fill();t.stroke()}
    else{t.fillRect(px,614,w,34)}
    t.fillStyle='rgb(233,221,255,.9)';t.fillText(tag,px+15,637);
    px+=w+12;
  });
  t.font='300 13px "PingFang SC",sans-serif';t.fillStyle='rgb(180,160,215,.45)';
  t.fillText('巳泷工作室 · 2026',146,700);
  t.textAlign='right';t.font='300 12px "PingFang SC",sans-serif';t.fillStyle='rgb(196,181,253,.5)';
  t.fillText('本地运行 · 无需联网 · 单文件',W-130,H-108);t.textAlign='left';

  S.doc.active=S.doc.layers.length-1;
  S.doc.name='巳泷主视觉 · 示例';
  render();renderLayers();fitView();syncAll();pushHistory('示例文档');
  $('#stageHint').style.display='none';
}

/* 启动 */
(function boot(){
  buildMenus();buildToolbar();buildDock();paintSwatches();
  $('#btnUndo').innerHTML=ic('undo');$('#btnRedo').innerHTML=ic('redo');
  $('#btnSide').innerHTML=ic('layers');
  syncSideDefault();
  window.addEventListener('resize',()=>{if(!window.__sideManual)syncSideDefault()});
  makeDemoDoc();
  updateUndoButtons();
  window.addEventListener('load',()=>{if(S.view.fit)fitView()});
  setTimeout(()=>{
    fitView();updateNav();
    if(window.__silongErrors.length)console.warn('初始化异常',window.__silongErrors);
  },80);
})();
</script>
