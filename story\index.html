<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="dark">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>巳泷文游 · 互动叙事工坊</title>
<style>
/* ============================================================
   巳泷文游 · 互动叙事工坊（2026-11-11）
   书架式主页 + 独立世界卡引用 + TXT 生成世界 + 本地存档
   ============================================================ */
:root{
  --bg:#070510;--panel:rgb(20,14,34,.8);--panel2:rgb(14,9,24,.94);
  --line:rgb(139,92,246,.22);--line2:rgb(255,255,255,.07);
  --p:#8b5cf6;--p2:#7c3aed;--acc:#a78bfa;--pink:#f472b6;
  --txt:#f4f1ff;--sub:#a79bc4;--muted:#7d7196;
  --r:18px;--r-sm:11px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
body{background:
  radial-gradient(980px 540px at 8% -8%,rgb(124,58,237,.26),transparent 60%),
  radial-gradient(820px 460px at 100% 0%,rgb(167,139,250,.10),transparent 58%),
  radial-gradient(860px 480px at 50% 114%,rgb(244,114,182,.10),transparent 60%),
  var(--bg)}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgb(139,92,246,.4);border-radius:99px}
::selection{background:rgb(139,92,246,.35);color:#ffffff}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(180deg,rgb(12,8,22,.94),rgb(10,7,18,.72));
  border-bottom:1px solid var(--line2);backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);z-index:40}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:0 0 auto}
.brand .mk{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--p2),var(--acc));box-shadow:0 5px 16px rgb(124,58,237,.46)}
.brand .mk svg{width:17px;height:17px;stroke:#ffffff;fill:none;stroke-width:1.8}
.brand b{font-size:16px;letter-spacing:1.2px;white-space:nowrap;
  background:linear-gradient(92deg,#ffffff,#e9d5ff 30%,#a78bfa 62%,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.brand em{font-style:normal;font-size:9px;letter-spacing:1.6px;color:var(--muted);margin-left:1px}
.spacer{flex:1}
.search{flex:1;max-width:340px;position:relative;min-width:80px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;
  stroke:#8f83ab;fill:none;stroke-width:2}
.search input{width:100%;height:36px;border-radius:99px;border:1px solid rgb(255,255,255,.09);
  background:rgb(255,255,255,.055);color:#ffffff;font-size:12.5px;padding:0 14px 0 34px;outline:none;transition:.18s}
.search input:focus{border-color:rgb(139,92,246,.8);box-shadow:0 0 0 3px rgb(139,92,246,.16)}
.ibtn{width:36px;height:36px;border-radius:50%;border:1px solid rgb(255,255,255,.1);
  background:rgb(255,255,255,.06);color:#e9e4ff;display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;transition:.18s}
.ibtn:hover{background:rgb(139,92,246,.24);border-color:rgb(139,92,246,.55)}
.ibtn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 14px calc(32px + env(safe-area-inset-bottom,0px));
  -webkit-overflow-scrolling:touch}
.wrap{max-width:1060px;margin:0 auto}

/* ---------- 首页 ---------- */
.hero{position:relative;overflow:hidden;margin:2px 0 20px;padding:24px 22px;border-radius:24px;
  background:linear-gradient(150deg,rgb(124,58,237,.36),rgb(24,16,42,.9) 55%,rgb(12,8,22,.95));
  border:1px solid var(--line);box-shadow:0 20px 48px rgb(0,0,0,.38)}
.hero::after{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgb(167,139,250,.26),transparent 68%)}
.hero::before{content:"";position:absolute;left:-40px;bottom:-90px;width:220px;height:220px;border-radius:50%;
  background:radial-gradient(circle,rgb(244,114,182,.2),transparent 70%)}
.hero .kicker{font-size:10px;letter-spacing:3px;color:#a78bfa;margin-bottom:9px}
.hero h1{margin:0 0 9px;font-size:24px;line-height:1.35;letter-spacing:.5px;
  background:linear-gradient(92deg,#ffffff,#ddd6fe 38%,#a78bfa 68%,#a78bfa);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:#b9aed4;font-size:12.5px;line-height:1.85;max-width:600px}
.hero .acts{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hstats{display:flex;gap:18px;margin-top:15px;flex-wrap:wrap;position:relative;z-index:1}
.hero .hstats span{font-size:10.5px;color:#8f83ab;letter-spacing:.5px}
.hero .hstats b{font-size:15px;color:#e9e4ff;font-weight:800;margin-right:4px}
.btn{border:none;border-radius:12px;padding:11px 18px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px;transition:.18s}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.btn.pri{background:linear-gradient(135deg,var(--p2),var(--p));color:#ffffff;
  box-shadow:0 9px 24px rgb(124,58,237,.4)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 13px 30px rgb(124,58,237,.5)}
.btn.gho{background:rgb(255,255,255,.06);color:#d9d0ee;border:1px solid rgb(255,255,255,.1)}
.btn.gho:hover{background:rgb(139,92,246,.2);border-color:rgb(139,92,246,.5)}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 11px}
.sec h2{margin:0;font-size:14px;letter-spacing:.6px;color:#e7e0ff}
.sec em{font-style:normal;font-size:11px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border-radius:99px;padding:7px 13px;font-size:11.5px;border:1px solid rgb(255,255,255,.08);
  background:rgb(255,255,255,.045);color:#b9aed4;transition:.16s;white-space:nowrap}
.chip:hover{background:rgb(139,92,246,.2);color:#ffffff}
.chip.on{background:linear-gradient(135deg,var(--p2),var(--p));color:#ffffff;border-color:rgb(255,255,255,.16);
  box-shadow:0 5px 16px rgb(124,58,237,.34)}
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:13px}
.wcard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--line2);
  background:linear-gradient(160deg,rgb(26,17,44,.8),rgb(11,7,20,.92));
  transition:.2s;text-align:left;padding:0;display:flex;flex-direction:column}
.wcard:hover{transform:translateY(-3px);border-color:rgb(139,92,246,.6);
  box-shadow:0 18px 40px rgb(0,0,0,.42),0 0 0 1px rgb(139,92,246,.2)}
.wcard .cover{height:126px;position:relative;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--c1,rgb(124,58,237,.5)),var(--c2,rgb(167,139,250,.3)))}
.wcard .cover::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(180px 90px at 76% 16%,rgb(255,255,255,.22),transparent 70%),
    linear-gradient(0deg,rgb(7,5,16,.72),transparent 55%)}
.wcard .cover b,.wcard .cover b.cov-title{position:relative;z-index:1;font-size:19px;font-weight:800;color:rgb(255,255,255,.96);
  letter-spacing:1px;line-height:1.35;padding:0 12px;text-align:center;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 4px 20px rgb(0,0,0,.45)}
.wcard .cover .st{position:absolute;z-index:2;left:12px;top:11px;font-size:9px;letter-spacing:1.5px;
  color:rgb(255,255,255,.86);padding:3px 8px;border-radius:99px;background:rgb(8,4,16,.5);
  border:1px solid rgb(255,255,255,.18)}
.wcard .cover .ad{position:absolute;z-index:2;right:12px;top:11px;font-size:9px;letter-spacing:.5px;
  color:#fecdd3;padding:3px 8px;border-radius:99px;background:rgb(80,10,24,.55);
  border:1px solid rgb(248,113,113,.35)}
.wcard .cover .recent{position:absolute;z-index:2;left:12px;bottom:11px;font-size:9px;letter-spacing:.5px;
  color:#ede9fe;padding:3px 8px;border-radius:99px;background:rgb(47,8,64,.6);
  border:1px solid rgb(167,139,250,.4)}
.wcard .cover::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(120deg,rgb(255,255,255,.05) 0 1px,transparent 1px 9px);
  opacity:.35;pointer-events:none}
.wcard .bd{padding:13px 14px 14px;flex:1;display:flex;flex-direction:column}
.wcard h3{margin:0;font-size:15px;color:#ffffff;letter-spacing:.4px}
.wcard .sub{margin:3px 0 0;font-size:10.5px;color:#8f83ab;letter-spacing:.8px}
.wcard .tags{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:9.5px;padding:2px 7px;border-radius:99px;color:#c9bfe2;
  background:rgb(139,92,246,.16);border:1px solid rgb(139,92,246,.28)}
.wcard .desc{margin:0 0 12px;font-size:11px;line-height:1.75;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wcard .foot{display:flex;align-items:center;gap:8px;margin-top:auto}
.wcard .foot .go{flex:1;border:none;border-radius:10px;padding:9px 12px;font-size:11.5px;font-weight:700;
  color:#ffffff;background:linear-gradient(135deg,var(--p2),var(--p));box-shadow:0 5px 14px rgb(124,58,237,.3)}
.wcard .foot .gh{border-radius:10px;padding:9px 12px;font-size:11.5px;color:#c9bfe2;
  background:rgb(255,255,255,.06);border:1px solid rgb(255,255,255,.09)}
.wcard .playbar{height:3px;background:rgb(255,255,255,.06)}
.wcard .playbar i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--acc))}
.empty{padding:38px 20px;text-align:center;color:var(--muted);font-size:12.5px;
  border:1px dashed rgb(139,92,246,.26);border-radius:var(--r);line-height:1.9}

/* ---------- 表单 ---------- */
.panel{border-radius:var(--r);border:1px solid var(--line2);
  background:linear-gradient(160deg,rgb(26,17,44,.82),rgb(12,8,22,.92));padding:18px;
  box-shadow:0 12px 34px rgb(0,0,0,.3)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;color:#b9aed4;margin-bottom:6px;letter-spacing:.3px}
.field input,.field textarea,.field select{width:100%;border-radius:11px;border:1px solid rgb(255,255,255,.1);
  background:rgb(255,255,255,.05);color:#ffffff;padding:11px 13px;font-size:13px;outline:none;transition:.16s}
.field textarea{resize:vertical;min-height:90px;line-height:1.7}
.field input:focus,.field textarea:focus,.field select:focus{border-color:rgb(139,92,246,.8);
  box-shadow:0 0 0 3px rgb(139,92,246,.16)}
.field select option{background:#161024;color:#ffffff}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;padding:22px;
  border:1px dashed rgb(139,92,246,.4);border-radius:12px;color:#b9aed4;font-size:12.5px;
  background:rgb(139,92,246,.06);transition:.18s;text-align:center;line-height:1.7}
.drop:hover,.drop.on{background:rgb(139,92,246,.14);border-color:rgb(139,92,246,.7)}
.drop svg{width:18px;height:18px;stroke:#a78bfa;fill:none;stroke-width:1.8;flex:0 0 auto}
.hint{font-size:10.5px;color:var(--muted);line-height:1.7;margin-top:6px}

/* ---------- 自建世界游玩 ---------- */
.playtop{padding:0 0 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.playtop h2{margin:0;font-size:17px;letter-spacing:.4px;color:#ffffff}
.meta{font-size:11px;color:var(--muted)}
.story{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.seg{border-radius:14px;border:1px solid var(--line2);
  background:linear-gradient(160deg,rgb(24,16,40,.74),rgb(11,7,20,.86));
  padding:15px 16px;font-size:13.5px;line-height:1.95;color:#ddd5f0;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.seg.narr{white-space:pre-wrap}
.seg.choice{align-self:flex-end;max-width:86%;border-color:rgb(167,139,250,.34);
  background:linear-gradient(160deg,rgb(47,8,64,.6),rgb(18,10,22,.9));color:#f2d5ff;font-size:12.5px;
  padding:11px 15px}
.seg.choice::before{content:"你的选择";display:block;font-size:9.5px;letter-spacing:1.5px;
  color:#ddd6fe;margin-bottom:5px}
.dlg{display:flex;gap:9px;margin:9px 0}
.dlg .av{width:32px;height:32px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:#ffffff;
  background:linear-gradient(135deg,var(--p2),var(--acc));box-shadow:0 4px 12px rgb(124,58,237,.3)}
.dlg .bd{flex:1;min-width:0}
.dlg .who{font-size:11px;color:#a78bfa;margin-bottom:3px;letter-spacing:.3px}
.dlg .tx{font-size:13px;line-height:1.8;color:#e9e4ff;white-space:pre-wrap}
.choices{display:grid;gap:9px;margin-top:16px}
.opt{width:100%;text-align:left;border-radius:12px;padding:13px 16px;font-size:13px;
  border:1px solid rgb(139,92,246,.28);color:#e7e0ff;line-height:1.6;
  background:linear-gradient(160deg,rgb(139,92,246,.14),rgb(18,12,32,.86));
  transition:.18s;display:flex;gap:10px;align-items:flex-start}
.opt:hover{border-color:rgb(139,92,246,.7);background:linear-gradient(160deg,rgb(139,92,246,.26),rgb(24,16,42,.9));
  transform:translateY(-1px);box-shadow:0 10px 24px rgb(124,58,237,.24)}
.opt i{font-style:normal;width:20px;height:20px;border-radius:7px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;font-size:10.5px;color:#c4b5fd;
  background:rgb(139,92,246,.18);border:1px solid rgb(139,92,246,.35);margin-top:1px}
.freebar{display:flex;gap:8px;margin-top:12px}
.freebar input{flex:1;border-radius:12px;border:1px solid rgb(255,255,255,.1);
  background:rgb(255,255,255,.05);color:#ffffff;padding:12px 14px;font-size:13px;outline:none}
.freebar input:focus{border-color:rgb(139,92,246,.8);box-shadow:0 0 0 3px rgb(139,92,246,.16)}
.freebar button{border:none;border-radius:12px;padding:0 18px;font-size:12.5px;font-weight:700;
  background:linear-gradient(135deg,var(--p2),var(--p));color:#ffffff;display:flex;align-items:center;gap:6px}
.freebar button svg{width:14px;height:14px;stroke:#ffffff;fill:none;stroke-width:2.2}
.typing{display:flex;gap:5px;padding:8px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#a78bfa;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

/* ---------- 弹窗 ---------- */
.mask{position:fixed;inset:0;z-index:100;background:rgb(4,2,10,.68);backdrop-filter:blur(9px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:580px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;
  border:1px solid var(--line);border-bottom:none;background:linear-gradient(180deg,rgb(24,16,42,.98),rgb(10,7,18,.99));
  padding:0 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.22,.9,.3,1) both}
@keyframes up{from{transform:translateY(42px);opacity:.6}to{transform:none;opacity:1}}
.sheet .bigcover{height:150px;margin:0 -18px 16px;display:flex;align-items:center;justify-content:center;
  position:relative;background:linear-gradient(135deg,var(--c1,rgb(124,58,237,.6)),var(--c2,rgb(167,139,250,.4)))}
.sheet .bigcover::after{content:"";position:absolute;inset:0;
  background:radial-gradient(220px 110px at 72% 12%,rgb(255,255,255,.24),transparent 70%),
  linear-gradient(0deg,rgb(10,7,18,.96),transparent 62%)}
.sheet .bigcover b{position:relative;z-index:1;font-size:52px;font-weight:800;letter-spacing:6px;
  color:rgb(255,255,255,.94);text-shadow:0 6px 26px rgb(0,0,0,.45)}
.sheet h3{margin:0 0 4px;font-size:19px;color:#ffffff}
.sheet .ssub{margin:0 0 10px;font-size:11px;color:#8f83ab;letter-spacing:1px}
.sheet .sdesc{font-size:12.5px;line-height:1.9;color:#c9bfe2;margin:0 0 14px}
.sheet .acts{display:flex;gap:10px;margin-top:16px}
.sheet .acts .btn{flex:1;justify-content:center}
.close{position:absolute;right:16px;top:14px;z-index:3}
.sheet .spad{padding-top:4px}
#toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:300;
  padding:10px 18px;border-radius:99px;font-size:12px;color:#ffffff;background:rgb(24,16,42,.96);
  border:1px solid rgb(139,92,246,.45);box-shadow:0 10px 30px rgb(0,0,0,.5);
  opacity:0;pointer-events:none;transition:.24s;max-width:82vw;text-align:center;line-height:1.6}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* ---------- 自定义封面 / 互动小说 / 档案 ---------- */
.wcard .cover.hasimg{background-size:cover;background-position:center}
.wcard .cover.hasimg::after{background:linear-gradient(0deg,rgb(7,5,16,.86),rgb(7,5,16,.10) 58%,rgb(7,5,16,.34))}
.wcard .cover.hasimg b{display:none}
.wcard .cover .novelmark{position:absolute;z-index:2;right:12px;top:11px;font-size:9px;letter-spacing:.5px;
  color:#c4b5fd;padding:3px 8px;border-radius:99px;background:rgb(46,16,80,.72);
  border:1px solid rgb(139,92,246,.5)}
.wcard .cover .novelmark.ai{color:#ede9fe;background:rgb(47,8,64,.66);border-color:rgb(167,139,250,.42)}
.detail-cover{height:168px;margin:0 -18px 16px;position:relative;display:flex;align-items:center;justify-content:center;
  background-size:cover;background-position:center;
  background-image:linear-gradient(135deg,var(--c1,rgb(124,58,237,.6)),var(--c2,rgb(167,139,250,.4)))}
.detail-cover::after{content:"";position:absolute;inset:0;
  background:linear-gradient(0deg,rgb(10,7,18,.92),transparent 64%)}
.detail-cover b{position:relative;z-index:1;font-size:22px;font-weight:800;letter-spacing:1px;line-height:1.35;
  padding:0 18px;text-align:center;word-break:break-all;
  color:rgb(255,255,255,.96);text-shadow:0 6px 26px rgb(0,0,0,.45)}
.invbar{display:flex;gap:7px;flex-wrap:wrap;padding:9px 2px 4px}
.invchip{font-size:10.5px;padding:4px 9px;border-radius:99px;color:#fde68a;
  background:rgb(120,53,15,.4);border:1px solid rgb(251,191,36,.34)}
.flagchip{font-size:10.5px;padding:4px 9px;border-radius:99px;color:#c4b5fd;
  background:rgb(76,29,149,.34);border:1px solid rgb(139,92,246,.4)}
.ephead{margin:14px 0 2px;font-size:10.5px;letter-spacing:2px;color:#a78bfa;text-align:center}
.ephead::before,.ephead::after{content:"—";margin:0 8px;color:rgb(167,139,250,.35)}
.seg.end{border-color:rgb(251,191,36,.4);background:linear-gradient(160deg,rgb(80,53,10,.4),rgb(11,7,20,.9));text-align:center;color:#fde68a}
.seg.effect{border-color:rgb(167,139,250,.3);color:#ede9fe;font-size:12px}
.opt.need{opacity:.55;border-color:rgb(255,255,255,.12)}
.opt.need em{font-style:normal;color:#fca5a5;font-size:10px;margin-left:6px}
.arch-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.arch-tabs::-webkit-scrollbar{display:none}
.arch-tabs button{flex:0 0 auto;border-radius:99px;padding:6px 12px;font-size:11px;
  border:1px solid rgb(255,255,255,.09);background:rgb(255,255,255,.05);color:#b9aed4}
.arch-tabs button.on{background:linear-gradient(135deg,var(--p2),var(--p));color:#ffffff;border-color:transparent}
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:9px}
.arch-card{border:1px solid rgb(255,255,255,.08);border-radius:12px;overflow:hidden;
  background:rgb(255,255,255,.035)}
.arch-card .apic{height:150px;background-size:cover;background-position:center top;

<script>
(function(){
'use strict';
var LS_MINE='sl_story_worlds_v1', LS_CFG='sl_story_cfg_v1', LS_LAST='sl_story_last_v1';
var LS_PLAYED='sl_story_played_v1', LS_IMPORT='sl_story_cards_v1';
var LS_COVERS='sl_story_covers_v1', LS_META='sl_story_meta_v1';
var S={mine:[],imported:[],played:{},covers:{},meta:{},cur:null,busy:false,filter:'all',kw:'',view:'home',archTab:'chars'};
var $=function(id){return document.getElementById(id)};
var view=$('view'), modal=$('modal');
var BUILTIN=Array.isArray(window.SL_WORLDS)?window.SL_WORLDS:[];

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el.__t);el.__t=setTimeout(function(){el.classList.remove('on')},2600)}
function uid(){return 'w'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function now(){return Date.now()}
function load(){
  try{S.mine=JSON.parse(localStorage.getItem(LS_MINE)||'[]')||[]}catch(e){S.mine=[]}
  if(!Array.isArray(S.mine))S.mine=[];
  try{S.imported=JSON.parse(localStorage.getItem(LS_IMPORT)||'[]')||[]}catch(e){S.imported=[]}
  if(!Array.isArray(S.imported))S.imported=[];
  try{S.played=JSON.parse(localStorage.getItem(LS_PLAYED)||'{}')||{}}catch(e){S.played={}}
  try{S.covers=JSON.parse(localStorage.getItem(LS_COVERS)||'{}')||{}}catch(e){S.covers={}}
  try{S.meta=JSON.parse(localStorage.getItem(LS_META)||'{}')||{}}catch(e){S.meta={}}
}
function saveCovers(){try{localStorage.setItem(LS_COVERS,JSON.stringify(S.covers))}catch(e){toast('封面保存失败：本地空间不足')}}
function saveMeta(){try{localStorage.setItem(LS_META,JSON.stringify(S.meta))}catch(e){}}
function coverOf(id){return S.covers[id]||''}
function metaOf(id){return S.meta[id]||null}
function merged(w){
  var m=metaOf(w.id); if(!m)return w;
  var x={}; for(var k in w)x[k]=w[k];
  for(var k2 in m){if(m[k2]!=null)x[k2]=m[k2]}
  return x;
}
function saveMine(){try{localStorage.setItem(LS_MINE,JSON.stringify(S.mine))}catch(e){toast('存档失败：本地空间不足')}}
function saveImported(){try{localStorage.setItem(LS_IMPORT,JSON.stringify(S.imported))}catch(e){toast('导入失败：本地空间不足')}}
function markPlayed(id){
  S.played[id]=now();try{localStorage.setItem(LS_PLAYED,JSON.stringify(S.played))}catch(e){}
}

/* ---------------- AI ---------------- */
function getCfg(){
  var d={base:'',key:'',model:'',temp:0.9};
  try{
    var A=window.SL_API||window.SL_API_NV;
    if(A){d.base=SL_D(A.b||'');d.key=SL_D((A.k&&A.k[0])||'');d.model=SL_D(A.m||'')}
  }catch(e){}
  try{var s=JSON.parse(localStorage.getItem(LS_CFG)||'{}');for(var k in s){if(s[k])d[k]=s[k]}}catch(e){}
  return d;
}
function setCfg(c){try{localStorage.setItem(LS_CFG,JSON.stringify(c))}catch(e){}}
function apiUrl(base){
  var b=String(base||'').replace(/\/+$/,'');
  if(!/\/v\d+$/.test(b))b+='/v1';
  return b+'/chat/completions';
}
function aiCacheKey(messages,opt){
  var s=JSON.stringify(messages||[])+'|'+(opt&&opt.temp||'')+'|'+(opt&&opt.max||'');
  var h=2166136261;
  for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}
  return 'c'+((h>>>0).toString(36));
}
function aiCachePut(key,text){
  try{
    var o=JSON.parse(localStorage.getItem('sl_ai_cache_v1')||'{}')||{};
    o[key]={t:text,at:Date.now()};
    var ks=Object.keys(o);if(ks.length>80){ks.slice(0,ks.length-80).forEach(function(k){delete o[k]})}
    localStorage.setItem('sl_ai_cache_v1',JSON.stringify(o));
  }catch(e){}
}
function chat(messages,opt){
  opt=opt||{};
  var c=getCfg();
  if(!c.base||!c.key)return Promise.reject(new Error('还没有配置 API，请点右上角齿轮填写，或到资源管家注册免费 API'));
  var inj=String(window.SL_INJECTION||'').trim();
  if(inj){messages=[{role:'system',content:inj}].concat(messages||[])}
  var cacheKey=aiCacheKey(messages,opt);
  try{
    var cj=JSON.parse(localStorage.getItem('sl_ai_cache_v1')||'{}')||{};
    if(cj[cacheKey]&&cj[cacheKey].t){return Promise.resolve(cj[cacheKey].t)}
  }catch(e){}
  var custom=false;try{var __cc=JSON.parse(localStorage.getItem(LS_CFG)||'{}');custom=!!__cc.key}catch(e){}
  if(!custom&&window.SL_AI_LIMIT&&!window.SL_DEV){var __q=SL_AI_LIMIT.take();if(!__q.ok)return Promise.reject(new Error('本设备内置 API 额度已用完（5 分钟内最多 20 次）。请更换 API，或到资源管家注册免费 API；自填 API Key 不受此限制。冷却剩余约 '+Math.ceil((__q.resetIn||0)/1000)+' 秒。'))}
  var body=JSON.stringify({model:c.model||'agnes-3.0-flash',messages:messages,
    temperature:opt.temp!=null?opt.temp:(parseFloat(c.temp)||0.9),max_tokens:opt.max||1800,stream:false});
  var url=apiUrl(c.base),tries=[];
  if(/^https?:$/.test(location.protocol)&&/^(localhost|127\.0\.0\.1)$/i.test(location.hostname)){
    tries.push('/api?url='+encodeURIComponent(url));
  }
  tries.push(url);
  var idx=0;
  function attempt(){
    if(idx>=tries.length)return Promise.reject(new Error('网络请求失败，请检查 API 或网络'));
    var u=tries[idx++],ctl=new AbortController();
    var timer=setTimeout(function(){try{ctl.abort()}catch(e){}},85000);
    return fetch(u,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:body,signal:ctl.signal}).then(function(r){
      clearTimeout(timer);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return r.json();
    }).then(function(j){
      var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      if(!t)throw new Error('API 返回空内容');
      try{window.__SL_LAST_AI=t}catch(e){}
      aiCachePut(cacheKey,t);
      return t;
    }).catch(function(e){clearTimeout(timer);return attempt()});
  }
  return attempt();
}
function parseJson(txt){
  var s=String(txt||'').trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  var a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a>=0&&b>a){
    try{return JSON.parse(s.slice(a,b+1))}catch(e){}
    try{return JSON.parse(s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1'))}catch(e){}
  }
  return null;
}

/* ---------------- 首页 ---------------- */
function playedOf(id){return S.played[id]||0}
function modeOf(x){if(x.kind!=='mine')return '';return x.w.mode==='script'?'script':'ai'}
function allCards(){
  var arr=[];
  BUILTIN.forEach(function(w){arr.push({kind:'builtin',w:w})});
  S.imported.forEach(function(w){arr.push({kind:'imported',w:w})});
  S.mine.forEach(function(w){arr.push({kind:'mine',w:w})});
  return arr;
}
function match(x){
  var w=x.w;
  if(S.filter==='novel'&&!(x.kind==='mine'&&modeOf(x)==='script'))return false;
  if(S.filter==='ai'&&!(x.kind==='mine'&&modeOf(x)==='ai'))return false;
  if(S.filter==='mine'&&x.kind!=='mine')return false;
  if(S.filter==='builtin'&&x.kind==='mine')return false;
  if(S.filter==='adult'&&!w.adult)return false;
  if(S.filter==='科幻'||S.filter==='古风'){
    var tags=(w.tags||[]).join(' ')+' '+(w.genre||'');
    if(tags.indexOf(S.filter)<0)return false;
  }
  if(!S.kw)return true;
  var q=S.kw.toLowerCase();
  return (String(w.title||'')+String(w.subtitle||'')+String(w.desc||'')+(w.tags||[]).join('')+String(w.genre||'')).toLowerCase().indexOf(q)>=0;
}
function renderHome(){
  S.view='home';S.cur=null;
  var novels=S.mine.filter(function(w){return w.mode==='script'}).length;
  var h='';
  h+='<section class="hero"><div class="kicker">INTERACTIVE FICTION</div>'+
    '<h1>每一个世界，都等你翻开第一页</h1>'+
    '<p>内置世界卡直接进入；创世工坊里的设定可以一键变成剧情互动小说或 AI 互动小说，正常排在书架上。封面、角色立绘、物品图鉴与地图都能自定义，存档全部在本机。</p>'+
    '<div class="acts"><button class="btn pri" data-a="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>AI 新建世界</button>'+
    '<button class="btn gho" data-a="import"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>导入世界卡</button>'+
    '<button class="btn gho" data-a="tpl" title="下载 .slcard.json 模板，按板块填写后导入">下载模板</button>'+
    '<button class="btn gho" data-a="oc"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>创世工坊</button></div>'+
    '<div class="hstats"><span><b id="stWorlds">0</b>个世界</span><span><b id="stMine">0</b>个自建</span><span><b id="stNovel">0</b>本互动小说</span><span><b>本地</b>存档</span><span><b>AI</b>续写</span></div></section>';
  h+='<div class="chips">'+['all','builtin','novel','ai','科幻','古风','成人向','mine'].map(function(k){
    var label={all:'全部',builtin:'内置',novel:'剧情互动',ai:'AI 世界','科幻':'科幻','古风':'古风','成人向':'成人向',mine:'我的世界'}[k]||k;
    return '<button class="chip'+(S.filter===k?' on':'')+'" data-f="'+k+'">'+label+'</button>';
  }).join('')+'</div>';
  var cards=allCards().filter(match);
  var bcards=cards.filter(function(x){return x.kind!=='mine'});
  var mcards=cards.filter(function(x){return x.kind==='mine'});
  if(S.filter==='mine'||S.filter==='novel'||S.filter==='ai'){bcards=[]}
  if(bcards.length||S.filter==='all'||S.filter==='builtin'||S.filter==='科幻'||S.filter==='古风'||S.filter==='adult'){
    h+='<div class="sec"><h2>'+(S.filter==='mine'?'我的世界':'内置 · 导入世界')+'</h2><em>'+(bcards.length?bcards.length+' 个':'')+'</em></div>';
    h+=bcards.length?('<div class="worlds">'+bcards.map(cardHtml).join('')+'</div>'):'<div class="empty">没有匹配的世界，换个筛选或关键词。</div>';
  }
  var ocs=ocWorlds().filter(function(w){
    if(S.filter==='adult')return false;
    if(S.kw){var q=S.kw.toLowerCase();if((String(w.name||'')+String(w.desc||'')+String(w.tagline||'')).toLowerCase().indexOf(q)<0)return false}
    return true;
  });
  if(ocs.length&&(S.filter==='all'||S.filter==='mine'||S.filter==='科幻'||S.filter==='古风')){
    h+='<div class="sec"><h2>创世世界</h2><em>'+ocs.length+' 个 · 角色/关系/势力/地图/剧情</em></div>';
    h+='<div class="worlds">'+ocs.map(ocCardHtml).join('')+'</div>';
  }
  if(S.filter!=='builtin'){
    h+='<div class="sec"><h2>我的书架</h2><em>'+(mcards.length?mcards.length+' 个':'')+'</em></div>';
    h+=mcards.length?('<div class="worlds">'+mcards.map(cardHtml).join('')+'</div>'):'<div class="empty">还没有自建世界。点「AI 新建世界」，或去创世工坊把设定保存成互动小说。</div>';
  }
  view.innerHTML=h;
  var sw=$('stWorlds'),sm=$('stMine'),sn=$('stNovel');
  if(sw)sw.textContent=allCards().length;
  if(sm)sm.textContent=S.mine.length;
  if(sn)sn.textContent=novels;
  $('main').scrollTop=0;
}
function cardHtml(x){
  var w=merged(x.w);
  var isMine=x.kind==='mine';
  var mode=isMine?(w.mode==='script'?'script':'ai'):'';
  var cov=coverOf(w.id)||w.cover||'';
  var c=w.accent||['rgb(124,58,237,.5)','rgb(167,139,250,.32)'];
  var p=playedOf(w.id);
  var badge=isMine?(mode==='script'?'互动小说':'AI 世界'):(x.kind==='imported'?'导入':'内置');
  var h='<div class="wcard" data-a="'+(isMine?'play':'detail')+'" data-id="'+esc(w.id)+'">'+
    '<div class="cover'+(cov?' hasimg':'')+'" style="--c1:'+c[0]+';--c2:'+c[1]+(cov?';background-image:url('+cov+')':'')+'">'+
    '<span class="st">'+badge+'</span>'+
    (w.adult?'<span class="ad">18+</span>':'')+
    (mode?'<span class="novelmark'+(mode==='ai'?' ai':'')+'">'+(mode==='script'?'剧情互动':'AI 互动')+'</span>':'')+
    (p?'<span class="recent">最近游玩</span>':'')+
    (!cov?'<b class="cov-title">'+esc(w.title||'?')+'</b>':'')+'</div>'+
    '<div class="bd"><h3>'+esc(w.title)+'</h3><p class="sub">'+esc(w.subtitle||(isMine?(mode==='script'?'剧情互动小说':'AI 互动小说'):''))+'</p>'+
    '<div class="tags">'+(w.tags&&w.tags.length?w.tags:w.genre?[w.genre]:[]).slice(0,3).map(function(t){return '<span class="tag">'+esc(t)+'</span>'}).join('')+'</div>'+
    '<p class="desc">'+esc(w.desc||w.world||'')+'</p>'+
    '<div class="foot">'+
    (isMine?'<button class="go" data-a="play" data-id="'+esc(w.id)+'">'+(p?'继续':'开始游玩')+'</button>':
      '<button class="go" data-a="enter" data-id="'+esc(w.id)+'">'+(p?'继续':'进入世界')+'</button>')+
    '<button class="gh" data-a="detail" data-id="'+esc(w.id)+'">详情</button></div></div>'+
    (p?'<div class="playbar"><i style="width:70%"></i></div>':'')+'</div>';
  return h;
}
function findCard(id){var a=allCards();for(var i=0;i<a.length;i++)if(String(a[i].w.id)===String(id))return a[i];return null}

/* ---------------- 创世世界联动 ---------------- */
var LS_OC='sl_oc_worlds_v1';
function ocWorlds(){try{var a=JSON.parse(localStorage.getItem(LS_OC)||'[]')||[];return Array.isArray(a)?a:[]}catch(e){return []}}
function ocNodeCount(w){var n=0;(w.chapters||[]).forEach(function(ch){(ch.episodes||[]).forEach(function(ep){n+=(ep.nodes||[]).length})});return n}
function ocCardHtml(w){
  var c=w.accent||['#7c3aed','#a78bfa'];
  var cov=w.cover||'';
  var nodes=ocNodeCount(w);
  var simTag='';
  if(w.sim){
    var tpy=Math.max(4,Math.min(60,Math.round(((w.sim.physics&&w.sim.physics.yearLength)||365)/30)));
    simTag='<span class="tag">推演 第'+(Math.floor((w.sim.tick||0)/tpy)+1)+'年</span>'+(w.sim.auto?'<span class="tag">自动推演</span>':'');
  }
  return '<div class="wcard"><div class="cover'+(cov?' hasimg':'')+'" style="--c1:'+c[0]+';--c2:'+c[1]+(cov?';background-image:url('+cov+')':'')+'">'+
    '<span class="st">创世世界</span>'+(w.cover?'':'<b class="cov-title">'+esc(w.name||'?')+'</b>')+'</div>'+
    '<div class="bd"><h3>'+esc(w.name)+'</h3><p class="sub">'+esc(w.tagline||w.genre||'')+'</p>'+
    '<div class="tags"><span class="tag">'+((w.chars||[]).length)+' 角色</span><span class="tag">'+((w.places||[]).length)+' 地点</span><span class="tag">'+((w.chapters||[]).length)+' 章</span>'+(nodes?'<span class="tag">'+nodes+' 剧情节点</span>':'')+simTag+'</div>'+
    '<p class="desc">'+esc(w.desc||'')+'</p>'+
    '<div class="foot"><button class="go" data-a="ocOpen" data-id="'+esc(w.id)+'">进入工坊</button>'+
    '<button class="gh" data-a="ocPlay" data-id="'+esc(w.id)+'" data-mode="'+(nodes?'script':'ai')+'">'+(nodes?'按剧情开局':'AI 开局')+'</button></div></div></div>';
}
function ocContext(oc){
  var out=[];
  function line(label,arr,fn){if(!arr||!arr.length)return;out.push(label+'：'+arr.slice(0,40).map(fn).join('；'))}
  if(oc.desc)out.push('世界：'+oc.desc);
  if(oc.tagline)out.push('标语：'+oc.tagline);
  line('势力',oc.factions,function(f){return f.name+'（'+(f.type||'')+'）目标：'+(f.goal||f.desc||'')});
  line('地点',oc.places,function(p){return p.name+'（'+(p.type||'')+'）：'+(p.desc||'')});
  line('角色',oc.chars,function(c){return c.name+'（'+[c.race,c.role,c.alias].filter(Boolean).join('/')+'）：'+[c.persona,c.background,c.ability,c.look].filter(Boolean).join('；')});
  line('关系',oc.rels,function(r){var a=refName(oc,'chars',r.a),b=refName(oc,'chars',r.b);return a+'与'+b+'是'+(r.type||'')+(r.note?'（'+r.note+'）':'')});
  line('历史',oc.events,function(e){return [e.era,e.time,e.title].filter(Boolean).join(' ')+'：'+(e.desc||'')});
  line('百科',oc.lore,function(l){return (l.cat||'')+'·'+l.title+'：'+(l.content||'')});
  line('世界书',oc.worldbook,function(b){return b.keys+'：'+b.content});
  line('物种',oc.species,function(s){return s.name+'：'+(s.desc||'')});
  line('草药',oc.flora,function(s){return s.name+'：'+[s.effect,s.desc].filter(Boolean).join('；')});
  line('食物',oc.foods,function(s){return s.name+'：'+[s.taste,s.effect,s.desc].filter(Boolean).join('；')});
  line('物品',oc.items,function(s){return s.name+'（'+(s.type||'')+'）：'+[s.effect,s.desc].filter(Boolean).join('；')});
  line('能力',oc.powers,function(s){return s.name+'：'+[s.effect,s.desc].filter(Boolean).join('；')});
  line('冲突',oc.conflicts,function(s){return s.name+'（'+(s.status||'')+'）：'+[s.parties,s.desc].filter(Boolean).join('；')});
  line('物流',oc.logistics,function(s){return s.name+'（'+(s.type||'')+'）：'+[s.from,s.to,s.desc].filter(Boolean).join('；')});
  line('信息',oc.infos,function(s){return s.name+'：'+[s.speed,s.desc].filter(Boolean).join('；')});
  line('语言',oc.langs,function(s){return s.name+'：'+(s.desc||s.sample||'')});
  line('剧情线',oc.stories,function(s){return s.name+'：'+(s.desc||'')});
  line('手记',oc.notes,function(s){return s.name+'：'+(s.desc||'')});
  if(oc.run)out.push('运行状态：人口 '+(oc.run.pop||0)+'，士气 '+(oc.run.morale||0)+'，食物 '+(oc.run.food||0)+'，水 '+(oc.run.water||0)+'，木材 '+(oc.run.wood||0)+'，铁矿 '+(oc.run.iron||0)+'，金币 '+(oc.run.gold||0));
  if((oc.chapters||[]).length)out.push('剧情：'+oc.chapters.map(function(ch){return ch.title+'（'+(ch.summary||'')+'）'}).join('；'));
  if(oc.map && Array.isArray(oc.map.terrain)){
    var trules=oc.map.terrain.filter(function(t){return t.rule&&(t.strokes||[]).length}).map(function(t){return '【'+t.name+'区域】'+t.rule});
    if(trules.length)out.push('地形规则：'+trules.join('；'));
  }
  if((oc.statusPanels||[]).length)out.push('状态面板：'+oc.statusPanels.map(function(p){return (p.nick||p.name)+'='+(p.value||0)+'/'+(p.max||100)+'（'+(p.rule||'')+'）'}).join('；'));
  return out.join('\n').slice(0,5200);
}
function refName(w,ref,id){var arr=w[ref]||[];for(var i=0;i<arr.length;i++)if(String(arr[i].id)===String(id))return arr[i].name||arr[i].title||'';return''}

  }).join('')+'</div>';
}
function applyStatusPanels(w,text){
  var oc=ocForStory(w);if(!oc||!(oc.statusPanels||[]).length)return;
  var changed=false;
  oc.statusPanels.forEach(function(p){
    var before=Number(p.value)||0;
    if(p.code){try{new Function('p','text',p.code)(p,text||'')}catch(e){}}
    var max=Number(p.max)||100;
    p.value=Math.max(0,Math.min(max,Number(p.value)||0));
    if(p.value!==before)changed=true;
  });
  if(changed){
    oc.updated=now();
    try{
      var list=ocWorlds();
      for(var i=0;i<list.length;i++)if(String(list[i].id)===String(oc.id))list[i]=oc;
      localStorage.setItem('sl_oc_worlds_v1',JSON.stringify(list));
    }catch(e){}
    if(w.snapshot)w.snapshot.statusPanels=oc.statusPanels;
  }
}
function makeNovelCard(oc,mode){
  var snap=JSON.parse(JSON.stringify(oc));

    subtitle:oc.tagline||(mode==='script'?'剧情互动小说':'AI 互动小说'),
    tags:[oc.genre||'幻想',mode==='script'?'剧情互动':'AI 互动','创世世界'],
    desc:oc.desc||(oc.name+' · 由创世工坊生成的可玩世界'),mark:String(oc.name||'?').slice(0,1),
    accent:oc.accent||['#7c3aed','#a78bfa'],cover:oc.cover||'',
    world:ocContext(oc),chars:snap.chars||[],items:snap.items||[],places:snap.places||[],
    factions:snap.factions||[],rels:snap.rels||[],
    chapters:mode==='script'?(snap.chapters||[]):[],snapshot:snap,log:[],choices:[],state:null,turn:0,
    created:now(),updated:now()};
  if(mode==='script'){card.log=[{type:'sys',text:'《'+oc.name+'》互动小说'}]}
  else{card.log=[{type:'narr',text:oc.desc||('故事在「'+oc.name+'」开始。')}];card.choices=['先观察四周','找个人谈谈','跟随直觉行动']}

function ocPlay(id,mode){
  var list=ocWorlds(),oc=null;
  for(var i=0;i<list.length;i++)if(String(list[i].id)===String(id))oc=list[i];
  if(!oc){toast('创世世界不存在');return}
  var nodes=ocNodeCount(oc);
  if(mode!=='script')mode=nodes?'script':'ai';
  if(mode==='script'&&!nodes){toast('这个世界还没有剧情节点，先按 AI 开局');mode='ai'}
  var found=null;
  for(var k=0;k<S.mine.length;k++)if(S.mine[k]&&String(S.mine[k].ocId)===String(oc.id)&&(S.mine[k].mode||'ai')===mode)found=S.mine[k];
  if(!found){
    found=makeNovelCard(oc,mode);
    S.mine.unshift(found);saveMine();
  }
  markPlayed(found.id);
  openMine(found);
}

function pickCoverFile(id){
  var inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var max=1100,w=img.width||1,h=img.height||1,sc=Math.min(1,max/Math.max(w,h));
          var cv=document.createElement('canvas');cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
          var ctx=cv.getContext('2d');ctx.fillStyle='#120c20';ctx.fillRect(0,0,cv.width,cv.height);
          ctx.drawImage(img,0,0,cv.width,cv.height);
          S.covers[id]=cv.toDataURL('image/jpeg',0.82);saveCovers();
          closeModal();renderHome();toast('封面已更新');
        }catch(e){toast('封面处理失败')}
      };
      img.onerror=function(){toast('图片读取失败')};
      img.src=String(r.result||'');
    };
    r.readAsDataURL(f);
  };
  inp.click();
}

function enterWorld(id){
  var x=findCard(id);if(!x)return;
  markPlayed(id);closeModal();
  if(x.kind==='mine'){openMine(x.w);return}
  if(x.kind==='imported'&&x.w.slcard){
    location.href='worlds/imported.html?id='+encodeURIComponent(x.w.id);return;
  }
  if(x.kind==='imported'&&x.w.html){
    var b=new Blob([x.w.html],{type:'text/html'});
    location.href=URL.createObjectURL(b);return;
  }
  if(x.w.file){location.href=x.w.file;return}
  toast('这个世界卡缺少入口文件');
}

function readRefFile(f){
  if(!f)return;
  if(f.size>16*1024*1024){toast('参考文件太大（超过 16MB），请先截取关键内容');return}
  if(!/\.(txt|md|json|html)$/i.test(f.name)&&!/text\/plain|application\/json|text\/html|text\/markdown/.test(f.type||'')){toast('请上传 TXT / MD / JSON / HTML 参考文件');return}
  var r=new FileReader();
  r.onload=function(){
    var t=String(r.result||'');
    draft.refName=f.name;draft.refText=t.slice(0,120000);
    var hint=$('refHint');
    if(hint)hint.textContent='已载入参考：'+f.name+'（'+t.length+' 字），点下方按钮让 AI 读取并生成整卡。';
    toast('参考文件已载入');
  };
  r.onerror=function(){toast('参考文件读取失败，请换一个文件')};
  r.readAsText(f,'utf-8');
}

  chat([{role:'system',content:sys},{role:'user',content:user}],{temp:0.88,max:6000}).then(function(txt){

function aiFillPage(){

    '\n请补全并润色这一页：未填写的随机生成，已填写的保留原意并补充细节。只输出这个 JSON：'+pageSchema();
  chat([{role:'system',content:sys},{role:'user',content:user}],{temp:0.85,max:1800}).then(function(txt){
    var j=parseJson(txt);

      ['species','flora','foods','items'].forEach(function(k){ if(Array.isArray(j[k])&&j[k].length)d[k]=j[k]; });
    } else if(p.id==='systems'){
      ['economy','faith','society','tech','careers','powers','langs'].forEach(function(k){ if(Array.isArray(j[k])&&j[k].length)d[k]=j[k]; });

function readTxt(f){
  if(!f)return;
  if(!/\.txt$/i.test(f.name)&&!/text\/plain/.test(f.type||'')){toast('请选择 .txt 文本文件');return}
  if(f.size>12*1024*1024){toast('文件太大（超过 12MB），请先截取前几章');return}
  var r=new FileReader();
  r.onload=function(){
    var t=String(r.result||'');draft.text=t;draft.fileName=f.name;
    var hint=$('fileHint');if(hint)hint.textContent='已载入：'+f.name+'（'+t.length+' 字）';
    var ta=$('fText');if(ta)ta.value=t.slice(0,200000);
    if(!draft.title){draft.title=f.name.replace(/\.txt$/i,'').slice(0,30);var ti=$('fTitle');if(ti)ti.value=draft.title}
    toast('已载入 '+t.length+' 字');
  };
  r.onerror=function(){toast('读取失败，请换一个文件')};
  r.readAsText(f,'utf-8');
}

function freeAction(){

  S.busy=true;
  w.log.push({type:'choice',text:choice});renderPlay();
  var recent=w.log.slice(-12).map(function(m){
    if(m.type==='choice')return '【玩家选择】'+m.text;
    if(m.type==='say')return m.who+'：'+m.text;
    return m.text;
  }).join('\n');
  var sys='你是一个互动小说引擎，文风克制、有画面感。你只输出严格 JSON。';
  var user='世界设定：'+w.world+'\n主要角色：'+(w.chars||[]).map(function(c){return c.name+'（'+c.role+'）：'+c.desc}).join('；')+
    '\n前情：\n'+recent+'\n\n玩家这次的选择：'+choice+
    '\n\n请续写下一段，并给出新的三个选择。只输出 JSON：{"narrative":"120-260字，第二人称，承接前情","dialogue":[{"who":"角色名","text":"对白"}],"choices":["选项一","选项二","选项三"]}';
  chat([{role:'system',content:sys},{role:'user',content:user}],{temp:0.95,max:1600}).then(function(txt){
    var j=parseJson(txt);
    if(!j||!j.narrative)throw new Error('AI 返回格式不对');
    if(j.dialogue&&j.dialogue.length){
      j.dialogue.slice(0,4).forEach(function(d){w.log.push({type:'say',who:String(d.who||''),text:String(d.text||'')})});
    }
    w.log.push({type:'narr',text:String(j.narrative)});
    w.choices=(j.choices&&j.choices.length)?j.choices.slice(0,4):['继续','换个方向','停下来思考'];
    w.turn++;w.updated=now();
    while(w.log.length>360)w.log.shift();
    saveMine();S.busy=false;renderPlay();
  }).catch(function(e){S.busy=false;toast(e.message||'续写失败，请重试');renderPlay()});
}

/* ---------------- 剧情互动小说引擎 ---------------- */
function novelChap(w){return (w.chapters||[])[w.state.ci]}
function novelEp(w){var ch=novelChap(w);return ch&&(ch.episodes||[])[w.state.ei]}
function novelNode(w){var ep=novelEp(w);return ep&&(ep.nodes||[])[w.state.ni]}
function novelItemName(w,id){
  var arr=(w.snapshot&&w.snapshot.items)||w.items||[];
  for(var i=0;i<arr.length;i++)if(String(arr[i].id)===String(id))return arr[i].name||'物品';
  return id||'物品';
}
function novelHas(w,id){
  var inv=(w.state&&w.state.inv)||[];
  for(var i=0;i<inv.length;i++)if(String(inv[i])===String(id))return true;
  return false;
}
function novelAdd(w,id){
  if(!w.state.inv)w.state.inv=[];
  if(id&&!novelHas(w,id))w.state.inv.push(id);
}
function novelRefs(w,text){
  var d=w.snapshot||w;
  return String(text==null?'':text).replace(/\[\[([cpi]):([^\]]+)\]\]/g,function(all,t,id){
    var arr=t==='c'?d.chars:t==='p'?d.places:d.items;
    for(var i=0;i<(arr||[]).length;i++)if(String(arr[i].id)===String(id))return arr[i].name||'';
    return all;
  });
}
function novelEpHead(w){
  var ch=novelChap(w),ep=novelEp(w);
  if(ch&&ep)w.log.push({type:'ep',text:(ch.title?ch.title+' · ':'')+(ep.title||'')});
}
function novelAdvance(w){
  var ep=novelEp(w);
  w.state.ni++;
  if(!ep||w.state.ni>=(ep.nodes||[]).length){
    w.state.ei++;w.state.ni=0;
    var ch=novelChap(w);
    if(!ch||w.state.ei>=(ch.episodes||[]).length){
      w.state.ci++;w.state.ei=0;w.state.ni=0;
      if(w.state.ci>=(w.chapters||[]).length){w.state.done=true;return}
    }
    novelEpHead(w);
  }
}
function novelFill(w,max){
  var count=0;w.state.more=false;
  while(!w.state.done&&count<max){
    var n=novelNode(w);
    if(!n){novelAdvance(w);count++;continue}
    if(n.type==='choice'){saveMine();return}
    if(n.type==='end'){
      w.log.push({type:'end',text:novelRefs(w,n.text||'故事到这里结束。')});
      w.state.done=true;saveMine();return;
    }
    if(n.type==='jump'){
      var ch=novelChap(w),ep=novelEp(w),target=-1;
      for(var i=0;i<(ch.episodes||[]).length;i++)if(String(ch.episodes[i].id)===String(n.next)){target=i;break}
      if(target>=0){w.state.ei=target;w.state.ni=0;w.log.push({type:'sys',text:'▸ 剧情跳转'});novelEpHead(w);count++;continue}
      novelAdvance(w);count++;continue;
    }
    if(n.type==='say')w.log.push({type:'say',who:novelRefs(w,n.who||''),text:novelRefs(w,n.text||'')});
    else if(n.type==='effect'){
      var msg=n.text||'';
      if(n.grant){novelAdd(w,n.grant);msg=(msg?msg+' ':'')+'获得物品：'+novelItemName(w,n.grant)}
      if(n.flag){w.state.flags[n.flag]=true;msg=(msg?msg+' ':'')+'「'+n.flag+'」已被记住'}
      w.log.push({type:'effect',text:msg||'发生了变化。'});
    } else w.log.push({type:'narr',text:novelRefs(w,n.text||'')});
    novelAdvance(w);count++;
  }
  if(!w.state.done){var cn=novelNode(w);if(cn&&cn.type!=='choice')w.state.more=true}
  saveMine();
}
function openNovel(w){
  S.cur=w;S.view='play';
  if(!w.state||!w.chapters||!w.chapters.length){
    w.state={ci:0,ei:0,ni:0,flags:{},inv:[],done:false,more:false};
    w.log=[{type:'sys',text:'《'+w.title+'》'}];
    novelEpHead(w);
    novelFill(w,4);
  }
  renderNovel();
}
function renderNovel(){
  var w=S.cur;if(!w){renderHome();return}
  var st=w.state||{};
  var h='<div class="playtop"><button class="mini" data-a="home">← 书架</button>'+
    '<h2>'+esc(w.title)+'</h2><span class="meta">'+(st.done?'已完结':('第 '+((st.ci||0)+1)+' / '+((w.chapters||[]).length)+' 章'))+'</span>'+
    '<span class="spacer" style="flex:1"></span>'+
    '<button class="mini" data-a="archive">档案</button>'+
    '<button class="mini" data-a="export" data-id="'+esc(w.id)+'">导出</button></div>';
  var inv=st.inv||[],flags=st.flags||{};
  if(inv.length||Object.keys(flags).length){
    h+='<div class="invbar">'+inv.map(function(id){return '<span class="invchip">🎒 '+esc(novelItemName(w,id))+'</span>'}).join('')+
      Object.keys(flags).map(function(k){return '<span class="flagchip">✦ '+esc(k)+'</span>'}).join('')+'</div>';
  }
  h+='<div class="story" id="story">';
  (w.log||[]).forEach(function(m){
    if(m.type==='choice')h+='<div class="seg choice">'+esc(m.text)+'</div>';
    else if(m.type==='say')h+=sayHtml(w,m);
    else if(m.type==='ep')h+='<div class="ephead">'+esc(m.text)+'</div>';
    else if(m.type==='sys')h+='<div class="meta" style="text-align:center;padding:8px 0">'+esc(m.text)+'</div>';
    else if(m.type==='effect')h+='<div class="seg effect">'+esc(m.text)+'</div>';
    else if(m.type==='end')h+='<div class="seg end">'+esc(m.text)+'</div>';
    else h+='<div class="seg narr">'+esc(m.text)+'</div>';
  });
  h+='</div>';
  if(st.done){
    h+='<div style="display:flex;justify-content:center;gap:10px;margin-top:16px">'+
      '<button class="btn gho" data-a="home">回到书架</button>'+
      '<button class="btn pri" data-a="novelRestart">重新开始</button></div>';
  }else{
    var n=novelNode(w);
    if(n&&n.type==='choice'){
      h+='<div class="choices">';
      (n.opts||[]).forEach(function(o,i){
        var need=o.require&&!novelHas(w,o.require);
        h+='<button class="opt'+(need?' need':'')+'" data-a="novelPick" data-i="'+i+'">'+
          '<i>'+String.fromCharCode(65+i)+'</i><span>'+esc(novelRefs(w,o.text))+(need?'<em>需要 '+esc(novelItemName(w,o.require))+'</em>':'')+'</span></button>';
      });
      h+='</div>';
    }else if(st.more){
      h+='<div style="display:flex;justify-content:center;margin-top:16px"><button class="btn pri" data-a="novelNext">继续 ▶</button></div>';
    }
  }
  view.innerHTML=h;
  setTimeout(function(){var m=$('main');if(m)m.scrollTop=m.scrollHeight},60);
}
function novelNext(){
  var w=S.cur;if(!w)return;
  novelFill(w,4);renderNovel();
}
function novelPick(i){
  var w=S.cur;if(!w||!w.state)return;
  var n=novelNode(w);
  if(!n||n.type!=='choice')return;
  var o=(n.opts||[])[i];if(!o)return;
  if(o.require&&!novelHas(w,o.require)){toast('需要：'+novelItemName(w,o.require));return}
  w.log.push({type:'choice',text:novelRefs(w,o.text)});
  if(o.grant)novelAdd(w,o.grant);
  if(o.flag)w.state.flags[o.flag]=true;
  var ch=novelChap(w),target=-1;
  if(o.next&&o.next!=='continue'){
    for(var k=0;k<(ch.episodes||[]).length;k++)if(String(ch.episodes[k].id)===String(o.next)){target=k;break}
  }
  if(target>=0){w.state.ei=target;w.state.ni=0;novelEpHead(w)}
  else novelAdvance(w);
  novelFill(w,4);renderNovel();
}
function novelRestart(){
  var w=S.cur;if(!w)return;
  w.state={ci:0,ei:0,ni:0,flags:{},inv:[],done:false,more:false};
  w.log=[{type:'sys',text:'《'+w.title+'》'}];
  novelEpHead(w);novelFill(w,4);renderNovel();toast('已重新开始');
}

  var w=merged(x.w), oc=ocForStory(w);

    slcard:true,version:2,exportedAt:new Date().toISOString(),
    id:w.id,title:w.title,subtitle:w.subtitle||'',tags:w.tags||[],desc:w.desc||'',mark:w.mark||String(w.title||'?').slice(0,1),
    accent:w.accent||['#7c3aed','#a78bfa'],adult:!!w.adult,cover:S.covers[w.id]||w.cover||'',
    genre:w.genre||'',world:w.world||'',opening:(oc&&oc.desc)||w.world||w.desc||'',
    chars:w.chars||(oc&&oc.chars)||[],items:w.items||(oc&&oc.items)||[],places:w.places||(oc&&oc.places)||[],
    factions:w.factions||(oc&&oc.factions)||[],events:w.events||(oc&&oc.events)||[],
    snapshot:oc||w.snapshot||null,
    pack:(w.pack&&typeof w.pack==='object')?w.pack:null,
    choices:w.choices||['先观察四周','找个人谈谈','跟随直觉行动'],log:w.log||[]
  };
  if(card.cover&&card.cover.length>900000){toast('封面太大，导出时不包含封面；可单独压缩后重试');card.cover=''}
  var b=new Blob([JSON.stringify(card,null,2)],{type:'application/json;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(w.title||'世界卡')+'.slcard.json';
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},450);
  toast('世界卡已导出；换设备后点「导入世界卡」即可继续');
}
function delWorld(id){
  var x=findCard(id);if(!x)return;
  if(x.kind==='builtin'){toast('内置世界卡不能删除，可以更换封面或卡片设置');return}
  if(!confirm('删除「'+x.w.title+'」？'))return;
  if(x.kind==='mine')S.mine=S.mine.filter(function(w){return String(w.id)!==String(id)});
  else S.imported=S.imported.filter(function(w){return String(w.id)!==String(id)});
  saveMine();saveImported();renderHome();toast('已删除');
}

/* ---------------- 设置 ---------------- */
function openCfg(){
  var c=getCfg();
  var h='<div class="mask" data-a="closeMask"><div class="sheet">'+
    '<button class="ibtn close" data-a="closeMask">✕</button><h3>API 设置</h3>'+
    '<p class="ssub">默认使用资源管家的内置双 API；手动填写会覆盖。内置 API 为本设备独立额度：5 分钟最多 20 次；自填 API Key 不受限制。</p>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px"><a class="mini" href="../butler/index.html#register" target="_blank" style="text-decoration:none">注册免费 API</a><a class="mini" href="../butler/index.html" target="_blank" style="text-decoration:none">打开资源管家</a></div>'+
    '<div class="field"><label>接口地址（OpenAI 兼容）</label><input id="cBase" placeholder="https://api.example.com/v1" value="'+esc(c.base)+'"></div>'+
    '<div class="field"><label>API Key</label><input id="cKey" type="password" placeholder="sk-..." value="'+esc(c.key)+'"></div>'+
    '<div class="row2"><div class="field"><label>模型</label><input id="cModel" value="'+esc(c.model)+'"></div>'+
    '<div class="field"><label>温度</label><input id="cTemp" type="number" step="0.1" min="0.1" max="1.5" value="'+esc(c.temp||0.9)+'"></div></div>'+
    '<div class="acts"><button class="btn gho" data-a="resetCfg">恢复默认</button><button class="btn pri" data-a="saveCfg">保存</button></div>'+
    '</div></div>';
  modal.innerHTML=h;
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');
  if(!t)return;
  var a=t.getAttribute('data-a'),id=t.getAttribute('data-id');
  if(a==='home')renderHome();
  else if(a==='create'){draft=blankDraft();renderCreate(false)}
  else if(a==='import'){importCard()}
  else if(a==='tpl'){downloadCardTemplate()}
  else if(a==='gen'){doGenerate()}
  else if(a==='enter'){enterWorld(id)}
  else if(a==='play'){var m=findCard(id);if(m&&m.kind==='mine')openMine(m.w)}
  else if(a==='detail'){openDetail(id)}
  else if(a==='del'){delWorld(id)}
  else if(a==='export'){exportWorld(id)}
  else if(a==='exportCard'){exportCard(id)}
  else if(a==='pick'){var i=+t.getAttribute('data-i');var w=S.cur;if(w&&w.choices&&w.choices[i]!=null){var __ch=w.choices[i];try{applyStatusPanels(w,__ch)}catch(e){}act(__ch)}}
  else if(a==='free'){freeAction()}
  else if(a==='oc'){location.href='oc.html'}
  else if(a==='ocOpen'){location.href='oc.html?id='+encodeURIComponent(id)}
  else if(a==='ocPlay'){ocPlay(id,t.getAttribute('data-mode')||'')}
  else if(a==='pickCover'){pickCoverFile(id)}
  else if(a==='cardMeta'){openCardMeta(id)}
  else if(a==='saveCardMeta'){saveCardMeta(id)}
  else if(a==='archive'){openArchive()}
  else if(a==='archTab'){
    S.archTab=t.getAttribute('data-k');
    var body=$('archBody'),cur=S.cur;
    if(body&&cur)body.innerHTML=archBody(cur.snapshot||cur);
    var tabs=modal.querySelectorAll('.arch-tabs button');
    for(var ti=0;ti<tabs.length;ti++)tabs[ti].className=tabs[ti].getAttribute('data-k')===S.archTab?'on':'';
  }
  else if(a==='novelPick'){novelPick(+t.getAttribute('data-i'))}
  else if(a==='novelNext'){novelNext()}
  else if(a==='novelRestart'){novelRestart()}
  else if(a==='saveCfg'){
    setCfg({base:($('cBase').value||'').trim(),key:($('cKey').value||'').trim(),
      model:($('cModel').value||'').trim(),temp:parseFloat($('cTemp').value)||0.9});
    closeModal();toast('已保存');
  }
  else if(a==='resetCfg'){try{localStorage.removeItem(LS_CFG)}catch(x){}closeModal();toast('已恢复内置 API')}
  else if(a==='closeMask'){if(e.target===t||t.classList.contains('close'))closeModal()}
});
document.addEventListener('click',function(e){
  var f=e.target.closest('[data-f]');
  if(f){S.filter=f.getAttribute('data-f');renderHome()}
});
$('kw').addEventListener('input',function(){S.kw=this.value.trim();renderHome()});
$('btnHome').addEventListener('click',renderHome);
$('btnCfg').addEventListener('click',openCfg);
$('btnImport').addEventListener('click',importCard);

/* ---------------- 启动 ---------------- */
load();
var __simRep=null;
try{ if(window.SL_SIM) __simRep=SL_SIM.catchUpAll(); }catch(e){}
renderHome();
if(__simRep&&__simRep.changed) setTimeout(function(){toast('离线推演：'+__simRep.changed+' 个世界发生了变化');},1200);
var oq=new URLSearchParams(location.search);
if(oq.get('card')&&oq.get('play')==='1'){
  try{var cc=findCard(oq.get('card'));if(cc&&cc.kind==='mine')openMine(cc.w)}catch(e){}
}else if(oq.get('oc')&&oq.get('play')==='1'){
  try{ocPlay(oq.get('oc'),oq.get('mode')||'')}catch(e){}
}
})();
</script>
