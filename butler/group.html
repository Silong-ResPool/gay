<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    /* v8.1.0 卡死修复：classList.remove/add 即使无实际变化也会产生 class 变更记录，
       本函数由 MutationObserver 回调，无脑 remove+add 会造成无限观察者风暴（主线程卡死）。
       改为「先检查、确有差异才写」。 */
    var d=document.documentElement;
    if(d){
      var dNeed=!d.classList.contains('sl-night')||d.classList.contains('sl-day')||d.classList.contains('sl-dusk')||d.classList.contains('day');
      if(dNeed){
        d.classList.remove('sl-day','sl-dusk','day');
        d.classList.add('sl-night');
      }
    }
    var b=document.body;
    if(b){
      var bNeed=!b.classList.contains('mode-night')||!b.classList.contains('mode-adult')||b.classList.contains('mode-daily')||b.classList.contains('mode-dusk')||b.classList.contains('day');
      if(bNeed){
        b.classList.remove('mode-daily','mode-dusk','day');
        b.classList.add('mode-night','mode-adult');
      }
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

/* ---------- API ---------- */
function keysFrom(v){
  if(Array.isArray(v))return v.filter(Boolean);
  return String(v||'').split(/[\n,，;；]+/).map(function(s){return s.trim()}).filter(Boolean);
}
function cfgOf(m){
  var st=(store[m.id]||{}).ai||{};
  var gp=groupPool();
  var stBase=(oldApi(st.base)?gp.base:st.base);
  var base=(m.base||stBase||gp.base||NV_BASE).replace(/\/+$/,'');
  var keys=keysFrom(m.keys&&m.keys.length?m.keys:st.keys);
  if(!keys.length && G.baseKey) keys=keysFrom(G.baseKey.keys);
  if(!keys.length) keys=gp.keys.slice();
  var model=(deadModel(m.model)?gp.model:(m.model||(deadModel(st.model)?gp.model:st.model)||gp.model));
  return {base:base,keys:keys,model:model};
}
function apiSig(m){var c=cfgOf(m);return c.base+'|'+(c.keys[0]||'')}
function pickKey(c){return c.keys.length?c.keys[Math.floor(Math.random()*c.keys.length)]:''}
function isMuted(m){var until=G.muted[m.id]||0;return until>Date.now()}
function muteLeft(m){var t=Math.max(0,(G.muted[m.id]||0)-Date.now());return Math.ceil(t/60000)}
function bannedWords(){
  var m=/禁词[:：]([^\n]+)/.exec(G.rules||'');
  return m?m[1].split(/[,，、]+/).map(function(s){return s.trim()}).filter(Boolean):[];
}
function punish(m,minOverride){
  var v=(G.violations[m.id]||0)+1;G.violations[m.id]=v;
  if(v>=10){
    G.members=G.members.filter(function(x){return x.id!==m.id});
    addMsg({who:'sys',text:nameOf(m)+' 违规累计 10 次，已被移出群聊。'});
  }else{
    var mins=minOverride||[1,2,3,5,10][Math.min(v-1,4)];
    G.muted[m.id]=Date.now()+mins*60000;
    addMsg({who:'sys',text:nameOf(m)+' 违反群规，禁言 '+mins+' 分钟（第 '+v+' 次）。'});
  }
  save();
}
function enforce(m,text){
  var b=bannedWords();if(!b.length)return;
  var hit=b.some(function(w){return text.indexOf(w)>=0});
  if(hit){punish(m);render()}
}

function profileText(){

  [['name','姓名'],['gender','性别'],['height','身高'],['weight','体重'],['look','外貌'],['family','家世'],['ability','能力'],['size','尺寸']].forEach(function(x){

function maskText(t){

function sysFor(m){

  var names=G.members.map(nameOf).join('、');

  return [

    '像真人聊天：每次回复 1~3 句，短句、口语化；可以 @某个成员 点名对方；不要代替别人说话，不要写旁白或括号动作。',
    '当前你对主人的好感度：'+aff+'/100（'+mood+'）。好感低时冷淡，好感高时亲近，但不要突然崩人设。',
    G.rules?('群规：'+G.rules):'',
    (G.profile.name&&!G.profile.hide.name)?('群主姓名/称呼：'+G.profile.name+'。如果设定或记忆里本来就认识群主，就像熟人一样用亲近的称呼；不认识就保持礼貌。'):'',
    prof
  ].filter(Boolean).join('\n');
}
async function ask(m,userText,quoteName,quoteText){
  if(isMuted(m))return null;
  var hist=[];
  G.messages.slice(-16).forEach(function(x){
    if(x.who==='user')hist.push({role:'user',content:x.text});
    else if(x.who!=='sys'&&x.who!=='gm')hist.push({role:'assistant',content:(x.name||'成员')+'：'+x.text});
  });
  var content=maskText((quoteName?('【引用 '+quoteName+'：'+String(quoteText||'').slice(0,120)+'】\n'):'')+userText);
  for(var round=0; round<2; round++){
    var c=cfgOf(m);
    var isFree=/pollinations/i.test(c.base);
    if(!c.keys.length && !isFree)return null;
    var body={model:c.model,messages:[{role:'system',content:sysFor(m)}].concat(hist).concat([{role:'user',content:content}]),temperature:.9,max_tokens:320};
    if(/nemotron/i.test(String(c.model||''))) body.chat_template_kwargs={enable_thinking:false};
    var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},30000);
    try{
      var target=c.base+'/chat/completions';
      var key=pickKey(c);
      var hdr={'Content-Type':'application/json'};
      if(key) hdr.Authorization='Bearer '+key;
      var init={method:'POST',headers:hdr,body:JSON.stringify(body),signal:ctrl.signal};
      try{
        if(location.protocol==='http:' && /^(127\.0\.0\.1|localhost)$/.test(location.hostname||'')){
          var ah=init.headers.Authorization;
          init={method:'POST',headers:{'Content-Type':'application/json','X-SL-Auth':ah},body:init.body,signal:ctrl.signal};
          target='/api?url='+encodeURIComponent(target);
        }
      }catch(e){}
      var res=await fetch(target,init);
      if(!res.ok) throw new Error('HTTP '+res.status);
      var j=await res.json();
      var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      t=String(t||'').trim();
      clearTimeout(to);
      if(t) return t;
    }catch(e){
      clearTimeout(to);
      if(!m.base && !(store[m.id]||{}).ai){
        GROUP_POOL = GROUP_POOL===0 ? 2 : 0;
        try{localStorage.setItem('sl_api_pool',String(GROUP_POOL))}catch(x){}
        continue;
      }
      return null;
    }
  }
  return null;
}

/* 统一自定义深色弹窗：替代原生白色 confirm / prompt / alert */
function slDialog(opt){
  return new Promise(function(resolve){
    opt=opt||{};
    var mask=document.createElement('div'); mask.className='sl-mask';
    var box=document.createElement('div'); box.className='sl-dialog';
    var h=document.createElement('h3'); h.textContent=opt.title||'提示';
    var p=document.createElement('p'); p.textContent=opt.text||'';
    box.appendChild(h); box.appendChild(p);
    var inp=null;
    if(opt.input){
      var field=document.createElement('div'); field.className='sl-d-field';
      var lab=document.createElement('label'); lab.textContent=opt.input.label||'';
      inp=document.createElement('input'); inp.type=opt.input.type||'text';
      inp.value=opt.input.value!=null?opt.input.value:'';
      if(opt.input.min!=null) inp.min=opt.input.min;
      if(opt.input.max!=null) inp.max=opt.input.max;
      field.appendChild(lab); field.appendChild(inp); box.appendChild(field);
    }
    var acts=document.createElement('div'); acts.className='sl-d-actions';
    var cancel=document.createElement('button'); cancel.type='button'; cancel.textContent=opt.cancel||'取消';
    var ok=document.createElement('button'); ok.type='button'; ok.className='ok'+(opt.danger?' danger':''); ok.textContent=opt.ok||'确定';
    acts.appendChild(cancel); acts.appendChild(ok); box.appendChild(acts); mask.appendChild(box); document.body.appendChild(mask);
    function done(v){ try{mask.remove()}catch(e){} resolve(v); }
    cancel.onclick=function(){ done(null); };
    ok.onclick=function(){ done(opt.input?(inp?inp.value:''):true); };
    mask.addEventListener('click',function(e){ if(e.target===mask) done(null); });
    if(inp) setTimeout(function(){ try{inp.focus()}catch(e){} },50);
    document.addEventListener('keydown',function esc2(e){ if(e.key==='Escape'){ document.removeEventListener('keydown',esc2); done(null); } });
  });
}
window.slDialog=slDialog;
function editMsg(x){

/* ---------- 好感度 ---------- */
var GOOD=['喜欢你','爱你','好棒','真棒','厉害','乖','谢谢','宝贝','老公','抱抱','想你','可爱','温柔','贴心','辛苦了'];
var BAD=['滚','废物','讨厌你','垃圾','蠢','傻','去死','闭嘴','恶心','烦人','没用的东西','笨蛋'];
function adjustAffection(text){
  var p=0,n=0;
  GOOD.forEach(function(w){if(text.indexOf(w)>=0)p++});
  BAD.forEach(function(w){if(text.indexOf(w)>=0)n++});
  if(!p&&!n)return;
  G.members.forEach(function(m){
    var cur=G.affection[m.id]==null?50:G.affection[m.id];
    cur=Math.max(0,Math.min(100,cur+p*3-n*5));
    G.affection[m.id]=cur;
    var rel=m.rel||'';
    if(cur<=0)rel='正常关系（记忆保留）';
    else if(cur<=15)rel='敌意';
    else if(cur>=90)rel='恋人';
    else if(cur>=70)rel='好友';
    else rel='普通';
    m.rel=rel;
  });
  save();
}

/* ---------- 发送与多智能体回复 ---------- */
function parseMentions(text){
  var names=G.members.map(nameOf);
  return G.members.filter(function(m){return text.indexOf('@'+nameOf(m))>=0}).map(function(m){return m.id});
}
function firstNameMentioned(text){
  var hit=null;
  G.members.forEach(function(m){if(text.indexOf('@'+nameOf(m))>=0)hit=hit||m.id});
  return hit;
}
function groupTts(m,text){
  var c=cardOf(m.id);
  var st=(store[m.id]||{}).settings||{};
  var t=(st.tts)||{};
  if(t.on===false)return;
  if(m.ttsOn===false)return;
  var preset=TTS_VOICES.filter(function(v){return v.k===m.voice})[0]||TTS_VOICES[0];
  try{window.top.postMessage({type:'sl_group_tts',text:String(text||'').slice(0,600),voice:preset.voice,pitch:preset.pitch},'*')}catch(e){}
}
async function handleSend(){
  var inp=$('msgInput');
  var text=String(inp.value||'').trim();
  if(!text||busy)return;
  inp.value='';
  addMsg({who:'user',text:text,name:'我'});
  adjustAffection(text);
  render();
  busy=true;
  var budget=Math.max(1,Math.min(100,G.maxReplies));
  var queue=parseMentions(text);
  if(!queue.length)G.members.forEach(function(m){queue.push(m.id)});
  var used={},failed={};
  /* 不同 API 且关闭朗读时可并发；同一 API 永远按加入顺序轮流 */
  if(G.parallel && !anyTts() && budget>1){
    var bySig={};
    queue.forEach(function(id){
      var mm=G.members.filter(function(x){return x.id===id})[0];
      if(!mm||isMuted(mm))return;
      var sig=apiSig(mm);(bySig[sig]=bySig[sig]||[]).push(id);
    });
    var heads=Object.keys(bySig).map(function(k){return bySig[k][0]});
    if(heads.length>1){
      var rs=await Promise.all(heads.map(function(id){
        var mm=G.members.filter(function(x){return x.id===id})[0];
        used[id]=1;
        return ask(mm,text,null,null).then(function(r){return {id:id,r:r}});
      }));
      rs.forEach(function(x){
        if(!x.r){failed[x.id]=1;return}
        var mm=G.members.filter(function(y){return y.id===x.id})[0];if(!mm)return;
        addMsg({who:mm.id,name:nameOf(mm),avatar:avatarOf(mm),text:x.r});
        enforce(mm,x.r);groupTts(mm,x.r);
      });
      budget-=heads.length;
      queue=queue.filter(function(id){return heads.indexOf(id)<0});
    }
  }
  while(queue.length&&budget>0){
    var id=queue.shift();
    if(used[id]||failed[id])continue;
    var m=G.members.filter(function(x){return x.id===id})[0];
    if(!m||isMuted(m))continue;
    used[id]=1;budget--;
    var reply=await ask(m,text,null,null);
    if(!reply){failed[id]=1;continue}
    var quote=firstNameMentioned(text)?{name:'我',text:text}:null;
    addMsg({who:m.id,name:nameOf(m),avatar:avatarOf(m),text:reply,quote:quote});
    enforce(m,reply);
    groupTts(m,reply);
    /* 回复里 @ 了别人 → 依次接话 */
    G.members.forEach(function(o){
      if(o.id===m.id)return;
      if(reply.indexOf('@'+nameOf(o))>=0&&!used[o.id]&&!failed[o.id])queue.push(o.id);
    });
  }
  busy=false;
  save();
}

/* ---------- 狼人杀（简化完整流程） ---------- */
function wwRoles(){
  var players=G.members.length+1; // + user
  var roles=[];
  var wolves=players>=8?2:1;
  for(var i=0;i<wolves;i++)roles.push('狼人');
  roles.push('预言家');roles.push('女巫');
  while(roles.length<players)roles.push('平民');
  return roles;
}
function startWerewolf(){
  if(G.members.length<3){toast('至少拉 3 个智能体进群（连你共 4 人）');return}
  var roles=wwRoles();
  var ids=['me'].concat(G.members.map(function(m){return m.id}));
  roles.sort(function(){return Math.random()-.5});
  var assign={};ids.forEach(function(id,i){assign[id]=roles[i]});
  G.werewolf={day:0,phase:'night',assign:assign,alive:ids.slice(),votes:{},cheat:false,antidote:1,poison:1,log:[]};
  save();
  addMsg({who:'gm',name:'狼人杀',text:'本局开始，共 '+ids.length+' 人。身份已私发。'});
  var myRole=assign['me'];
  addMsg({who:'sys',text:'你的身份：'+myRole+'。'+(G.werewolf.cheat?'（已开启全局透视）':'')});
  if(G.werewolf.cheat){addMsg({who:'sys',text:'透视：'+ids.map(function(id){return (id==='me'?'我':nameOf(G.members.filter(function(m){return m.id===id})[0]))+'='+assign[id]}).join('，')})}
  nextNight();
}
function aliveNames(){
  return G.werewolf.alive.map(function(id){return id==='me'?'我':nameOf(G.members.filter(function(m){return m.id===id})[0])});
}
function killTarget(id){
  var w=G.werewolf;w.alive=w.alive.filter(function(x){return x!==id});w.log.push(id);
}
function checkWin(){
  var w=G.werewolf;
  var wolves=w.alive.filter(function(id){return w.assign[id]==='狼人'});
  var others=w.alive.filter(function(id){return w.assign[id]!=='狼人'});
  if(!wolves.length){addMsg({who:'gm',name:'狼人杀',text:'好人阵营胜利！'});w.phase='over';save();return true}
  if(wolves.length>=others.length){addMsg({who:'gm',name:'狼人杀',text:'狼人阵营胜利！'});w.phase='over';save();return true}
  return false;
}
function nextNight(){
  var w=G.werewolf;w.phase='night';w.day++;
  var oldV=$('voteOpts');if(oldV)oldV.remove();
  var oldW=$('witchOpts');if(oldW)oldW.remove();
  addMsg({who:'gm',name:'狼人杀',text:'第 '+w.day+' 天 · 天黑请闭眼。存活：'+aliveNames().join('、')});
  var wolfTarget=null;
  var wolfAlive=w.alive.filter(function(id){return w.assign[id]==='狼人'});
  if(wolfAlive.length){
    wolfTarget=w.alive.filter(function(id){return w.assign[id]!=='狼人'})[Math.floor(Math.random()*Math.max(1,w.alive.filter(function(id){return w.assign[id]!=='狼人'}).length))];
  }
  var seer=G.werewolf.alive.filter(function(id){return w.assign[id]==='预言家'})[0];
  if(seer&&seer==='me'&&wolfAlive.length){
    var cand=w.alive.filter(function(id){return id!=='me'});
    var pick=cand[Math.floor(Math.random()*cand.length)];
    addMsg({who:'sys',text:'预言家查验：'+(pick==='me'?'我':nameOf(G.members.filter(function(m){return m.id===pick})[0]))+' 是 '+(w.assign[pick]==='狼人'?'狼人':'好人')});
  }
  var witch=G.werewolf.alive.filter(function(id){return w.assign[id]==='女巫'})[0];
  if(witch&&wolfTarget){
    if(witch==='me'||G.werewolf.cheat){
      addMsg({who:'sys',text:'女巫：今晚被刀的是 '+wwName(wolfTarget)+'。可用解药救人或毒药毒人。'});
      var opt=document.createElement('div');opt.className='opt opt-float';opt.id='witchOpts';
      var s=document.createElement('button');s.textContent='使用解药救 '+wwName(wolfTarget);
      s.onclick=function(){
        if(!w.antidote){toast('解药已用完');return}
        w.antidote=0;w.guarded=wolfTarget;save();opt.remove();toast('已使用解药');
      };opt.appendChild(s);
      G.werewolf.alive.forEach(function(id){
        if(id==='me')return;
        var p=document.createElement('button');p.textContent='毒 '+wwName(id);
        p.onclick=function(){if(!w.poison){toast('毒药已用完');return}w.poison=0;killTarget(id);opt.remove();addMsg({who:'sys',text:'毒药带走了 '+wwName(id)+'。'});save()};
        opt.appendChild(p);
      });
      document.body.appendChild(opt);
    }
  }
  setTimeout(function(){
    if(wolfTarget&&!G.werewolf.guarded){
      killTarget(wolfTarget);
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。'+wwName(wolfTarget)+' 昨晚被狼人杀害。'});
    }else if(wolfTarget&&G.werewolf.guarded){
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。昨晚无人死亡（女巫用了解药）。'});
    }else{
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。昨晚平安夜。'});
    }
    G.werewolf.guarded=null;save();
    if(checkWin())return;
    w.phase='vote';save();
    addMsg({who:'gm',name:'狼人杀',text:'白天讨论与投票开始。'});
    renderVoteOpts();
    G.members.forEach(function(m,i){
      if(G.werewolf.alive.indexOf(m.id)<0)return;
      (function(m){setTimeout(function(){
        if(G.werewolf.phase!=='vote')return;
        addMsg({who:m.id,name:nameOf(m),avatar:avatarOf(m),text:['我觉得 '+wwName(pickAlive())+' 很可疑。','先听听 '+wwName(pickAlive())+' 怎么说。','我投 '+wwName(pickAlive())+'。'][Math.floor(Math.random()*3)]});
      },900+i*1200)})(m);
    });
  },900);
}
function pickAlive(){
  var a=G.werewolf.alive.filter(function(id){return id!=='me'});
  if(!a.length)return 'me';
  return a[Math.floor(Math.random()*a.length)];
}
function wwName(id){
  if(id==='me')return '我';
  var m=G.members.filter(function(x){return x.id===id})[0];
  return m?nameOf(m):'某人';
}
function renderVoteOpts(){
  var old=$('voteOpts');if(old)old.remove();
  var box=document.createElement('div');box.className='opt opt-float';box.id='voteOpts';
  G.werewolf.alive.filter(function(id){return id!=='me'}).forEach(function(id){
    var b=document.createElement('button');b.textContent='投 '+wwName(id);
    b.onclick=function(){
      if(G.werewolf.phase!=='vote')return;
      G.werewolf.votes[id]=(G.werewolf.votes[id]||0)+1;
      toggleOffVote();
      addMsg({who:'sys',text:'你投了 '+wwName(id)+'。'});
      setTimeout(function(){countVotes()},900);
    };
    box.appendChild(b);
  });
  box.appendChild(document.createElement('br'));
  document.body.appendChild(box);
}
function toggleOffVote(){var v=$('voteOpts');if(v)v.remove()}
function countVotes(){
  if(G.werewolf.phase!=='vote')return;
  var vo=$('voteOpts');if(vo)vo.remove();
  G.werewolf.alive.forEach(function(id){
    if(id==='me')return;
    var pick=G.werewolf.alive.filter(function(x){return x!=='me'})[Math.floor(Math.random()*Math.max(1,G.werewolf.alive.length-1))];
    G.werewolf.votes[pick]=(G.werewolf.votes[pick]||0)+1;
  });
  var best=null,bs=-1;
  Object.keys(G.werewolf.votes).forEach(function(k){if(G.werewolf.votes[k]>bs){bs=G.werewolf.votes[k];best=k}});
  if(best){
    addMsg({who:'gm',name:'狼人杀',text:'投票结果：'+wwName(best)+' 被放逐。'});
    killTarget(best);
  }else addMsg({who:'gm',name:'狼人杀',text:'平票，无人被放逐。'});
  G.werewolf.votes={};save();
  if(checkWin())return;
  nextNight();
}
