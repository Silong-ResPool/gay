<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>群聊 · 玉珩</title>
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#060210;--card:#160927;--line:rgba(157,78,221,.26);--txt:#f2eaff;--mut:#a996c4;--acc:#9d4edd;--acc2:#d946ef;--ok:#7cf7c4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(ellipse at 12% 6%,rgba(157,78,221,.3) 0,transparent 50%),radial-gradient(ellipse at 88% 94%,rgba(217,70,239,.22) 0,transparent 50%),var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,'PingFang SC','Microsoft YaHei',sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font-family:inherit}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:8px 10px 0;background:rgba(14,6,28,.6);border:1px solid var(--line);border-radius:42px;flex:0 0 auto;backdrop-filter:blur(20px)}
.top b{flex:1;font-size:14px;color:#f0e3ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#e8ddff;font-size:14px;cursor:pointer;flex:0 0 auto}
.top button:hover{background:rgba(157,78,221,.25)}
.chat{flex:1;overflow-y:auto;padding:12px 10px 6px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.msg{display:flex;gap:8px;max-width:90%;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.ai{align-self:flex-start}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:0 0 34px;border:1px solid rgba(199,125,255,.45)}
.bd{min-width:0;max-width:100%}
.nm{font-size:10.5px;color:#c9b0ea;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.nm .tag{font-size:9px;color:#8fd8ff;border:1px solid rgba(143,216,255,.4);border-radius:8px;padding:0 5px}
.nm .aff{font-size:9px;color:#ffb38a}
.bubble{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.7;word-break:break-word;white-space:pre-wrap;background:rgba(30,18,50,.72);border:1px solid rgba(157,78,221,.24)}
.msg.user .bubble{background:linear-gradient(135deg,rgba(92,45,145,.9),rgba(109,40,217,.8));border-color:rgba(199,125,255,.3)}
.quote{font-size:11px;color:#b9a8d8;border-left:2px solid rgba(199,125,255,.5);padding:3px 8px;margin-bottom:6px;background:rgba(157,78,221,.1);border-radius:6px;white-space:pre-wrap}
.acts{display:flex;gap:8px;margin-top:4px;font-size:10px;color:#8f7ea8}
.acts button{background:none;border:0;color:#8f7ea8;cursor:pointer;font-size:10px}
.acts button:hover{color:#e8ddff}
.sys{align-self:center;font-size:11px;color:#b8a7d6;background:rgba(157,78,221,.12);border:1px solid rgba(157,78,221,.25);border-radius:12px;padding:5px 12px;max-width:92%;text-align:center;line-height:1.6}
.gm{max-width:94%;background:linear-gradient(135deg,rgba(124,58,237,.16),rgba(232,121,249,.1));border:1px solid rgba(192,132,252,.4);border-radius:14px;padding:10px 12px;align-self:center;font-size:12px;line-height:1.7}
.gm b{color:#e9d5ff}
.inbar{padding:8px 10px 12px;flex:0 0 auto}
.inbox{display:flex;align-items:center;gap:6px;background:rgba(14,6,28,.6);border:1px solid var(--line);border-radius:28px;padding:6px}
.inbox input{flex:1;min-width:0;height:34px;background:transparent;border:0;outline:0;color:#fff;padding:0 10px;font-size:12.5px}
.inbox button{height:34px;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#e8ddff;padding:0 12px;font-size:12px;cursor:pointer;flex:0 0 auto}
.inbox button.send{border:0;background:linear-gradient(135deg,#8b5cf6,#d946ef);font-weight:700;color:#fff;padding:0 16px}
.panel{position:fixed;inset:0;z-index:20;background:rgba(6,2,16,.72);display:none;align-items:center;justify-content:center;padding:16px}
.panel.on{display:flex}
.card{width:min(560px,95vw);max-height:88vh;overflow:auto;background:linear-gradient(160deg,#201038,#150a26);border:1px solid rgba(177,108,255,.5);border-radius:16px;padding:14px}
.card h3{display:flex;align-items:center;gap:8px;font-size:14px;color:#f0e3ff;margin-bottom:10px}
.card h3 button{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid rgba(177,108,255,.4);background:rgba(255,255,255,.05);color:#e8ddff;cursor:pointer}
.sub{font-size:11px;color:#b9a8d8;margin:10px 0 4px;letter-spacing:.5px}
.row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#cbb9ea;margin:6px 0;flex-wrap:wrap}
.row b{flex:1;color:#f0e3ff}
.row input[type=text],.row input[type=number],.row select,.row textarea{background:#0d0622;border:1px solid rgba(177,108,255,.35);border-radius:8px;color:#fff;padding:5px 7px;font-size:11px;outline:0}
.row textarea{width:100%;min-height:64px;resize:vertical}
.row button{border:1px solid rgba(177,108,255,.4);border-radius:8px;background:rgba(255,255,255,.05);color:#e8ddff;font-size:10.5px;padding:4px 8px;cursor:pointer}
.row button.on{background:linear-gradient(135deg,#8b5cf6,#d946ef);border-color:transparent;color:#fff;font-weight:700}
.item{border:1px solid rgba(177,108,255,.28);border-radius:10px;padding:8px;margin-bottom:7px;background:rgba(255,255,255,.03)}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.opt-float{position:fixed;left:10px;right:10px;bottom:66px;z-index:18;background:rgba(16,8,32,.96);border:1px solid rgba(177,108,255,.45);border-radius:14px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.55);display:flex;flex-wrap:wrap;gap:6px}
.opt button{border:1px solid rgba(199,125,255,.3);background:rgba(157,78,221,.12);color:#e9dcff;border-radius:12px;padding:5px 10px;font-size:11px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:rgba(30,14,50,.96);border:1px solid rgba(177,108,255,.5);color:#f2eaff;padding:8px 14px;border-radius:12px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
</style>
<script src="../data/env.js"></script><script src="../data/api-app.js"></script><script src="../data/api-web.js"></script></head>
<body>
<div class="top">
  <button id="backBtn" title="返回单聊"><i class="fa-solid fa-chevron-left"></i></button>
  <b>群聊</b>
  <button id="memberBtn" title="成员"><i class="fa-solid fa-users"></i></button>
  <button id="ruleBtn" title="公告 / 管理"><i class="fa-solid fa-bullhorn"></i></button>
  <button id="gameBtn" title="游戏"><i class="fa-solid fa-dice"></i></button>
  <button id="meBtn" title="我的设定"><i class="fa-solid fa-id-card"></i></button>
  <button id="setBtn" title="群设置"><i class="fa-solid fa-gear"></i></button>
</div>
<div class="chat" id="chat"></div>
<div class="inbar">
  <div class="inbox">
    <input id="msgInput" placeholder="在群里说点什么… 用 @名字 可以直接点名" autocomplete="off">
    <button id="atBtn" title="点名"><i class="fa-solid fa-at"></i></button>
    <button class="send" id="sendBtn">发送</button>
  </div>
</div>
<div class="panel" id="panel"><div class="card"><h3><i class="fa-solid fa-layer-group" style="color:#c77dff"></i><span id="panelTitle">面板</span><button id="panelClose">×</button></h3><div id="panelBody"></div></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var CARDS_KEY='yuheng_cards_v4', AGENT_KEY='yuheng_agent_store_v2', GK='sl_group_v1';
var cards=[],store={},G=null;
var DEF_BASE='https://api.agnes-ai.cn/v1', DEF_MODEL='agnes-3.0-flash';
var NV_BASE=(window.SL_API_NV?SL_D(SL_API_NV.b):'https://integrate.api.nvidia.com/v1');
var NV_KEYS=(window.SL_API_NV&&SL_API_NV.k)?SL_API_NV.k.map(function(x){return SL_D(x)}):[];
var NV_MODEL=(window.SL_API_NV?SL_D(SL_API_NV.m):'deepseek-ai/deepseek-v4.1-flash');
var GROUP_POOL=1;
try{var __gp=parseInt(localStorage.getItem('sl_api_pool')||'1',10);if(__gp>=0&&__gp<2)GROUP_POOL=__gp}catch(e){}
function groupPool(){
  return GROUP_POOL===0
    ? {base:NV_BASE,keys:NV_KEYS,model:NV_MODEL}
    : {base:DEF_BASE,keys:(window.SL_API&&SL_API.k)?SL_API.k.map(function(x){return SL_D(x)}):[],model:DEF_MODEL};
}
var TONE='分寸感：正经话题保持得体，不耍黄腔；主人主动暧昧时才温柔暧昧。始终顺从、让主人心情愉快。';
var TTS_VOICES=[
  {k:'brian',label:'布莱恩',voice:'en-US-BrianMultilingualNeural',pitch:'+0Hz'},
  {k:'yunjhe',label:'云哲',voice:'zh-TW-YunJheNeural',pitch:'+0Hz'},
  {k:'yunxi',label:'云希',voice:'zh-CN-YunxiNeural',pitch:'+0Hz'},
  {k:'yunjian',label:'云健',voice:'zh-CN-YunjianNeural',pitch:'+0Hz'},
  {k:'yunyang',label:'云扬',voice:'zh-CN-YunyangNeural',pitch:'+0Hz'},
  {k:'wanlung',label:'云龙',voice:'zh-HK-WanLungNeural',pitch:'+0Hz'}
];
var busy=false, ttsSeq=0;
function anyTts(){return G.members.some(function(m){return m.ttsOn!==false})}

function toast(m){var t=$('toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove('show')},2200)}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function save(){try{localStorage.setItem(GK,JSON.stringify(G))}catch(e){}}
function load(){
  try{cards=JSON.parse(localStorage.getItem(CARDS_KEY)||'[]')||[]}catch(e){cards=[]}
  try{store=JSON.parse(localStorage.getItem(AGENT_KEY)||'{}')||{}}catch(e){store={}}
  if(!cards.length){
    cards=Object.keys(store).map(function(id){
      return {id:id,name:(id==='yuheng_default'?'玉珩':id),avatar:'avatar.png',prompt:''};
    });
    if(!cards.length)cards=[{id:'yuheng_default',name:'玉珩',avatar:'avatar.png',prompt:''}];
  }
  try{G=JSON.parse(localStorage.getItem(GK)||'null')}catch(e){G=null}
  if(!G)G={members:[],messages:[],rules:'',banned:[],adminsOn:true,maxReplies:3,parallel:false,muted:{},violations:{},affection:{},profile:{hide:{}},poll:null,werewolf:null};
  G.messages=G.messages||[]; G.members=G.members||[];
  if(!G.profile)G.profile={hide:{}};
  if(!G.profile.hide)G.profile.hide={};
  if(typeof G.maxReplies!=='number')G.maxReplies=3;
  /* 群聊里 AI 用的默认 API 继承当前默认智能体的配置 */
  if(!G.baseKey){
    var st=(store['yuheng_default']||{}).ai||Object.values(store)[0]&&Object.values(store)[0].ai||{};
    G.baseKey={base:st.base||DEF_BASE,model:st.model||DEF_MODEL};
  }
}
function cardOf(id){return cards.filter(function(c){return c.id===id})[0]||null}
function nameOf(m){var c=cardOf(m.id);return (c&&c.name)||m.name||'智能体'}
function avatarOf(m){var c=cardOf(m.id);return (c&&c.avatar)||m.avatar||'avatar.png'}
function started(){return G.members.length>0}

/* ---------- API ---------- */
function keysFrom(v){
  if(Array.isArray(v))return v.filter(Boolean);
  return String(v||'').split(/[\n,，;；]+/).map(function(s){return s.trim()}).filter(Boolean);
}
function cfgOf(m){
  var st=(store[m.id]||{}).ai||{};
  var gp=groupPool();
  var base=(m.base||st.base||gp.base||DEF_BASE).replace(/\/+$/,'');
  var keys=keysFrom(m.keys&&m.keys.length?m.keys:st.keys);
  if(!keys.length && G.baseKey) keys=keysFrom(G.baseKey.keys);
  if(!keys.length) keys=gp.keys.slice();
  var model=m.model||st.model||gp.model||DEF_MODEL;
  return {base:base,keys:keys,model:model};
}
function apiSig(m){var c=cfgOf(m);return c.base+'|'+(c.keys[0]||'')}
function pickKey(c){return c.keys.length?c.keys[Math.floor(Math.random()*c.keys.length)]:''}
function isMuted(m){var until=G.muted[m.id]||0;return until>Date.now()}
function muteLeft(m){var t=Math.max(0,(G.muted[m.id]||0)-Date.now());return Math.ceil(t/60000)}
function bannedWords(){
  var m=/禁词[:：]([^\n]+)/.exec(G.rules||'');
  return m?m[1].split(/[,，、]+/).map(function(s){return s.trim()}).filter(Boolean):[];
}
function punish(m,minOverride){
  var v=(G.violations[m.id]||0)+1;G.violations[m.id]=v;
  if(v>=10){
    G.members=G.members.filter(function(x){return x.id!==m.id});
    addMsg({who:'sys',text:nameOf(m)+' 违规累计 10 次，已被移出群聊。'});
  }else{
    var mins=minOverride||[1,2,3,5,10][Math.min(v-1,4)];
    G.muted[m.id]=Date.now()+mins*60000;
    addMsg({who:'sys',text:nameOf(m)+' 违反群规，禁言 '+mins+' 分钟（第 '+v+' 次）。'});
  }
  save();
}
function enforce(m,text){
  var b=bannedWords();if(!b.length)return;
  var hit=b.some(function(w){return text.indexOf(w)>=0});
  if(hit){punish(m);render()}
}

/* ---------- 提示词 ---------- */
function profileText(){
  var p=G.profile,h=p.hide||{},out=[];
  [['name','姓名'],['gender','性别'],['height','身高'],['weight','体重'],['look','外貌'],['family','家世'],['ability','能力'],['size','尺寸']].forEach(function(x){
    if(h[x[0]])return; var v=maskText(String(p[x[0]]||'').trim()); if(v)out.push(x[1]+'：'+v);
  });
  try{
    var up=JSON.parse(localStorage.getItem('sl_user_profile')||'{}')||{};
    if(up.text)out.push('全局设定（所有智能体通用，务必遵守）：'+String(up.text).slice(0,600));
    if(up.name)out.push('主人希望被称呼为：'+up.name);
    if(up.rel)out.push('主人与群成员的关系：'+up.rel+'（按这种关系相处）');
  }catch(e){}
  return out.length?('群主（用户）设定：'+out.join('；')):'';
}
function maskText(t){
  var masks=G.profile.masks||[];
  masks.forEach(function(w){ if(w) t=String(t).split(w).join('***') });
  return t;
}
function sysFor(m){
  var card=cardOf(m.id),base=(card&&card.prompt)?card.prompt:'你是群聊里的智能体，保持自己的性格与说话方式。';
  var names=G.members.map(nameOf).join('、');
  var prof=profileText();
  var aff=(G.affection[m.id]==null?50:G.affection[m.id]);
  var mood=aff<=15?'敌意':(aff>=85?'亲密':(aff>=60?'友好':'普通'));
  return [
    base,
    TONE,
    '你在一个多人群聊里，群主是用户（称呼：主人）。群成员：'+names+'。',
    '像真人聊天：每次回复 1~3 句，短句、口语化；可以 @某个成员 点名对方；不要代替别人说话，不要写旁白或括号动作。',
    '当前你对主人的好感度：'+aff+'/100（'+mood+'）。好感低时冷淡，好感高时亲近，但不要突然崩人设。',
    G.rules?('群规：'+G.rules):'',
    (G.profile.name&&!G.profile.hide.name)?('群主姓名/称呼：'+G.profile.name+'。如果设定或记忆里本来就认识群主，就像熟人一样用亲近的称呼；不认识就保持礼貌。'):'',
    prof
  ].filter(Boolean).join('\n');
}
async function ask(m,userText,quoteName,quoteText){
  if(isMuted(m))return null;
  var hist=[];
  G.messages.slice(-16).forEach(function(x){
    if(x.who==='user')hist.push({role:'user',content:x.text});
    else if(x.who!=='sys'&&x.who!=='gm')hist.push({role:'assistant',content:(x.name||'成员')+'：'+x.text});
  });
  var content=maskText((quoteName?('【引用 '+quoteName+'：'+String(quoteText||'').slice(0,120)+'】\n'):'')+userText);
  for(var round=0; round<2; round++){
    var c=cfgOf(m);
    if(!c.keys.length)return null;
    var body={model:c.model,messages:[{role:'system',content:sysFor(m)}].concat(hist).concat([{role:'user',content:content}]),temperature:.9,max_tokens:320};
    var ctrl=new AbortController();var to=setTimeout(function(){ctrl.abort()},30000);
    try{
      var res=await fetch(c.base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+pickKey(c)},body:JSON.stringify(body),signal:ctrl.signal});
      if(!res.ok) throw new Error('HTTP '+res.status);
      var j=await res.json();
      var t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
      t=String(t||'').trim();
      clearTimeout(to);
      if(t) return t;
    }catch(e){
      clearTimeout(to);
      if(!m.base && !(store[m.id]||{}).ai){
        GROUP_POOL = GROUP_POOL===0 ? 1 : 0;
        try{localStorage.setItem('sl_api_pool',String(GROUP_POOL))}catch(x){}
        continue;
      }
      return null;
    }
  }
  return null;
}

/* ---------- 消息 ---------- */
function nowTime(){var d=new Date();return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}
function addMsg(o){
  o.id='x'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); o.ts=Date.now(); o.time=nowTime();
  G.messages.push(o); save(); render(); return o;
}
function render(){
  var box=$('chat');box.innerHTML='';
  if(!started()){
    var tip=document.createElement('div');tip.className='sys';
    tip.textContent='群聊还没有成员。点右上角「成员」把智能体拉进来，一起聊天吧。';
    box.appendChild(tip);return;
  }
  G.messages.slice(-160).forEach(function(x){ box.appendChild(msgNode(x)); });
  if(!G.messages.length){ var t=document.createElement('div');t.className='sys';t.textContent='群已建好，发第一条消息开始聊天吧。';box.appendChild(t); }
  box.scrollTop=box.scrollHeight;
}
function msgNode(x){
  if(x.who==='sys'){var s=document.createElement('div');s.className='sys';s.textContent=x.text;return s}
  if(x.who==='gm'){var g=document.createElement('div');g.className='gm';g.innerHTML='<b>'+esc(x.name||'游戏')+'</b><br>'+esc(x.text).replace(/\n/g,'<br>');return g}
  var wrap=document.createElement('div');wrap.className='msg '+(x.who==='user'?'user':'ai');
  if(x.who!=='user'){var av=document.createElement('img');av.className='av';av.src=x.avatar||'avatar.png';wrap.appendChild(av)}
  var bd=document.createElement('div');bd.className='bd';wrap.appendChild(bd);
  var nm=document.createElement('div');nm.className='nm';
  nm.textContent=(x.who==='user'?'我':(x.name||'智能体'));
  if(x.who!=='user'){
    var who=G.members.filter(function(m){return m.id===x.who})[0];
    if(who&&who.isAdmin){var tg=document.createElement('span');tg.className='tag';tg.textContent='管理员';nm.appendChild(tg)}
    if(who){var af=document.createElement('span');af.className='aff';af.textContent='好感 '+(G.affection[who.id]==null?50:G.affection[who.id]);nm.appendChild(af)}
  }
  var tm=document.createElement('span');tm.style.cssText='margin-left:auto;font-size:9px;color:#7f6f9a';tm.textContent=x.time||'';nm.appendChild(tm);
  bd.appendChild(nm);
  var bub=document.createElement('div');bub.className='bubble';
  if(x.quote){var q=document.createElement('div');q.className='quote';q.textContent='回复 '+(x.quote.name||'')+'：'+String(x.quote.text||'').slice(0,80);bub.appendChild(q)}
  var txt=document.createElement('div');txt.textContent=x.text;bub.appendChild(txt);bd.appendChild(bub);
  if(x.edited){var ed=document.createElement('div');ed.style.cssText='font-size:9px;color:#8f7ea8;margin-top:2px';ed.textContent='已编辑';bd.appendChild(ed)}
  var acts=document.createElement('div');acts.className='acts';
  var e=document.createElement('button');e.textContent='编辑';e.onclick=function(){editMsg(x)};acts.appendChild(e);
  var r=document.createElement('button');r.textContent='撤回';r.onclick=function(){recallMsg(x)};acts.appendChild(r);
  bd.appendChild(acts);
  return wrap;
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function editMsg(x){
  var t=prompt('编辑这条消息：',x.text);if(t==null)return;t=t.trim();if(!t)return;
  x.text=t;x.edited=true;save();render();
}
function recallMsg(x){
  if(!confirm('撤回这条消息？'))return;

/* ---------- 好感度 ---------- */
var GOOD=['喜欢你','爱你','好棒','真棒','厉害','乖','谢谢','宝贝','老公','抱抱','想你','可爱','温柔','贴心','辛苦了'];
var BAD=['滚','废物','讨厌你','垃圾','蠢','傻','去死','闭嘴','恶心','烦人','没用的东西','笨蛋'];
function adjustAffection(text){
  var p=0,n=0;
  GOOD.forEach(function(w){if(text.indexOf(w)>=0)p++});
  BAD.forEach(function(w){if(text.indexOf(w)>=0)n++});
  if(!p&&!n)return;
  G.members.forEach(function(m){
    var cur=G.affection[m.id]==null?50:G.affection[m.id];
    cur=Math.max(0,Math.min(100,cur+p*3-n*5));
    G.affection[m.id]=cur;
    var rel=m.rel||'';
    if(cur<=0)rel='正常关系（记忆保留）';
    else if(cur<=15)rel='敌意';
    else if(cur>=90)rel='恋人';
    else if(cur>=70)rel='好友';
    else rel='普通';
    m.rel=rel;
  });
  save();
}

/* ---------- 发送与多智能体回复 ---------- */
function parseMentions(text){
  var names=G.members.map(nameOf);
  return G.members.filter(function(m){return text.indexOf('@'+nameOf(m))>=0}).map(function(m){return m.id});
}
function firstNameMentioned(text){
  var hit=null;
  G.members.forEach(function(m){if(text.indexOf('@'+nameOf(m))>=0)hit=hit||m.id});
  return hit;
}
function groupTts(m,text){
  var c=cardOf(m.id);
  var st=(store[m.id]||{}).settings||{};
  var t=(st.tts)||{};
  if(t.on===false)return;
  if(m.ttsOn===false)return;
  var preset=TTS_VOICES.filter(function(v){return v.k===m.voice})[0]||TTS_VOICES[0];
  try{window.top.postMessage({type:'sl_group_tts',text:String(text||'').slice(0,600),voice:preset.voice,pitch:preset.pitch},'*')}catch(e){}
}
async function handleSend(){
  var inp=$('msgInput');
  var text=String(inp.value||'').trim();
  if(!text||busy)return;
  inp.value='';
  addMsg({who:'user',text:text,name:'我'});
  adjustAffection(text);
  render();
  busy=true;
  var budget=Math.max(1,Math.min(100,G.maxReplies));
  var queue=parseMentions(text);
  if(!queue.length)G.members.forEach(function(m){queue.push(m.id)});
  var used={},failed={};
  /* 不同 API 且关闭朗读时可并发；同一 API 永远按加入顺序轮流 */
  if(G.parallel && !anyTts() && budget>1){
    var bySig={};
    queue.forEach(function(id){
      var mm=G.members.filter(function(x){return x.id===id})[0];
      if(!mm||isMuted(mm))return;
      var sig=apiSig(mm);(bySig[sig]=bySig[sig]||[]).push(id);
    });
    var heads=Object.keys(bySig).map(function(k){return bySig[k][0]});
    if(heads.length>1){
      var rs=await Promise.all(heads.map(function(id){
        var mm=G.members.filter(function(x){return x.id===id})[0];
        used[id]=1;
        return ask(mm,text,null,null).then(function(r){return {id:id,r:r}});
      }));
      rs.forEach(function(x){
        if(!x.r){failed[x.id]=1;return}
        var mm=G.members.filter(function(y){return y.id===x.id})[0];if(!mm)return;
        addMsg({who:mm.id,name:nameOf(mm),avatar:avatarOf(mm),text:x.r});
        enforce(mm,x.r);groupTts(mm,x.r);
      });
      budget-=heads.length;
      queue=queue.filter(function(id){return heads.indexOf(id)<0});
    }
  }
  while(queue.length&&budget>0){
    var id=queue.shift();
    if(used[id]||failed[id])continue;
    var m=G.members.filter(function(x){return x.id===id})[0];
    if(!m||isMuted(m))continue;
    used[id]=1;budget--;
    var reply=await ask(m,text,null,null);
    if(!reply){failed[id]=1;continue}
    var quote=firstNameMentioned(text)?{name:'我',text:text}:null;
    addMsg({who:m.id,name:nameOf(m),avatar:avatarOf(m),text:reply,quote:quote});
    enforce(m,reply);
    groupTts(m,reply);
    /* 回复里 @ 了别人 → 依次接话 */
    G.members.forEach(function(o){
      if(o.id===m.id)return;
      if(reply.indexOf('@'+nameOf(o))>=0&&!used[o.id]&&!failed[o.id])queue.push(o.id);
    });
  }
  busy=false;
  save();
}

/* 两个成员时互相自我介绍 */
async function selfIntro(){
  if(G.members.length<2)return;
  var a=G.members[0],b=G.members[1];
  var r1=await ask(b,'你刚加入一个群聊，请用你的性格特点向大家自我介绍一句，20 字以内，别用括号。',null,null);
  if(r1){addMsg({who:b.id,name:nameOf(b),avatar:avatarOf(b),text:r1});groupTts(b,r1)}
  var r2=await ask(a,'新成员「'+nameOf(b)+'」刚进群，请按你的性格欢迎对方一句，20 字以内。',null,null);
  if(r2){addMsg({who:a.id,name:nameOf(a),avatar:avatarOf(a),text:'@'+nameOf(b)+' '+r2});groupTts(a,r2)}
}

/* ---------- 狼人杀（简化完整流程） ---------- */
function wwRoles(){
  var players=G.members.length+1; // + user
  var roles=[];
  var wolves=players>=8?2:1;
  for(var i=0;i<wolves;i++)roles.push('狼人');
  roles.push('预言家');roles.push('女巫');
  while(roles.length<players)roles.push('平民');
  return roles;
}
function startWerewolf(){
  if(G.members.length<3){toast('至少拉 3 个智能体进群（连你共 4 人）');return}
  var roles=wwRoles();
  var ids=['me'].concat(G.members.map(function(m){return m.id}));
  roles.sort(function(){return Math.random()-.5});
  var assign={};ids.forEach(function(id,i){assign[id]=roles[i]});
  G.werewolf={day:0,phase:'night',assign:assign,alive:ids.slice(),votes:{},cheat:false,antidote:1,poison:1,log:[]};
  save();
  addMsg({who:'gm',name:'狼人杀',text:'本局开始，共 '+ids.length+' 人。身份已私发。'});
  var myRole=assign['me'];
  addMsg({who:'sys',text:'你的身份：'+myRole+'。'+(G.werewolf.cheat?'（已开启全局透视）':'')});
  if(G.werewolf.cheat){addMsg({who:'sys',text:'透视：'+ids.map(function(id){return (id==='me'?'我':nameOf(G.members.filter(function(m){return m.id===id})[0]))+'='+assign[id]}).join('，')})}
  nextNight();
}
function aliveNames(){
  return G.werewolf.alive.map(function(id){return id==='me'?'我':nameOf(G.members.filter(function(m){return m.id===id})[0])});
}
function killTarget(id){
  var w=G.werewolf;w.alive=w.alive.filter(function(x){return x!==id});w.log.push(id);
}
function checkWin(){
  var w=G.werewolf;
  var wolves=w.alive.filter(function(id){return w.assign[id]==='狼人'});
  var others=w.alive.filter(function(id){return w.assign[id]!=='狼人'});
  if(!wolves.length){addMsg({who:'gm',name:'狼人杀',text:'好人阵营胜利！'});w.phase='over';save();return true}
  if(wolves.length>=others.length){addMsg({who:'gm',name:'狼人杀',text:'狼人阵营胜利！'});w.phase='over';save();return true}
  return false;
}
function nextNight(){
  var w=G.werewolf;w.phase='night';w.day++;
  var oldV=$('voteOpts');if(oldV)oldV.remove();
  var oldW=$('witchOpts');if(oldW)oldW.remove();
  addMsg({who:'gm',name:'狼人杀',text:'第 '+w.day+' 天 · 天黑请闭眼。存活：'+aliveNames().join('、')});
  var wolfTarget=null;
  var wolfAlive=w.alive.filter(function(id){return w.assign[id]==='狼人'});
  if(wolfAlive.length){
    wolfTarget=w.alive.filter(function(id){return w.assign[id]!=='狼人'})[Math.floor(Math.random()*Math.max(1,w.alive.filter(function(id){return w.assign[id]!=='狼人'}).length))];
  }
  var seer=G.werewolf.alive.filter(function(id){return w.assign[id]==='预言家'})[0];
  if(seer&&seer==='me'&&wolfAlive.length){
    var cand=w.alive.filter(function(id){return id!=='me'});
    var pick=cand[Math.floor(Math.random()*cand.length)];
    addMsg({who:'sys',text:'预言家查验：'+(pick==='me'?'我':nameOf(G.members.filter(function(m){return m.id===pick})[0]))+' 是 '+(w.assign[pick]==='狼人'?'狼人':'好人')});
  }
  var witch=G.werewolf.alive.filter(function(id){return w.assign[id]==='女巫'})[0];
  if(witch&&wolfTarget){
    if(witch==='me'||G.werewolf.cheat){
      addMsg({who:'sys',text:'女巫：今晚被刀的是 '+wwName(wolfTarget)+'。可用解药救人或毒药毒人。'});
      var opt=document.createElement('div');opt.className='opt opt-float';opt.id='witchOpts';
      var s=document.createElement('button');s.textContent='使用解药救 '+wwName(wolfTarget);
      s.onclick=function(){
        if(!w.antidote){toast('解药已用完');return}
        w.antidote=0;w.guarded=wolfTarget;save();opt.remove();toast('已使用解药');
      };opt.appendChild(s);
      G.werewolf.alive.forEach(function(id){
        if(id==='me')return;
        var p=document.createElement('button');p.textContent='毒 '+wwName(id);
        p.onclick=function(){if(!w.poison){toast('毒药已用完');return}w.poison=0;killTarget(id);opt.remove();addMsg({who:'sys',text:'毒药带走了 '+wwName(id)+'。'});save()};
        opt.appendChild(p);
      });
      document.body.appendChild(opt);
    }
  }
  setTimeout(function(){
    if(wolfTarget&&!G.werewolf.guarded){
      killTarget(wolfTarget);
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。'+wwName(wolfTarget)+' 昨晚被狼人杀害。'});
    }else if(wolfTarget&&G.werewolf.guarded){
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。昨晚无人死亡（女巫用了解药）。'});
    }else{
      addMsg({who:'gm',name:'狼人杀',text:'天亮了。昨晚平安夜。'});
    }
    G.werewolf.guarded=null;save();
    if(checkWin())return;
    w.phase='vote';save();
    addMsg({who:'gm',name:'狼人杀',text:'白天讨论与投票开始。'});
    renderVoteOpts();
    G.members.forEach(function(m,i){
      if(G.werewolf.alive.indexOf(m.id)<0)return;
      (function(m){setTimeout(function(){
        if(G.werewolf.phase!=='vote')return;
        addMsg({who:m.id,name:nameOf(m),avatar:avatarOf(m),text:['我觉得 '+wwName(pickAlive())+' 很可疑。','先听听 '+wwName(pickAlive())+' 怎么说。','我投 '+wwName(pickAlive())+'。'][Math.floor(Math.random()*3)]});
      },900+i*1200)})(m);
    });
  },900);
}
function pickAlive(){
  var a=G.werewolf.alive.filter(function(id){return id!=='me'});
  if(!a.length)return 'me';
  return a[Math.floor(Math.random()*a.length)];
}
function wwName(id){
  if(id==='me')return '我';
  var m=G.members.filter(function(x){return x.id===id})[0];
  return m?nameOf(m):'某人';
}
function renderVoteOpts(){
  var old=$('voteOpts');if(old)old.remove();
  var box=document.createElement('div');box.className='opt opt-float';box.id='voteOpts';
  G.werewolf.alive.filter(function(id){return id!=='me'}).forEach(function(id){
    var b=document.createElement('button');b.textContent='投 '+wwName(id);
    b.onclick=function(){
      if(G.werewolf.phase!=='vote')return;
      G.werewolf.votes[id]=(G.werewolf.votes[id]||0)+1;
      toggleOffVote();
      addMsg({who:'sys',text:'你投了 '+wwName(id)+'。'});
      setTimeout(function(){countVotes()},900);
    };
    box.appendChild(b);
  });
  box.appendChild(document.createElement('br'));
  document.body.appendChild(box);
}
function toggleOffVote(){var v=$('voteOpts');if(v)v.remove()}
function countVotes(){
  if(G.werewolf.phase!=='vote')return;
  var vo=$('voteOpts');if(vo)vo.remove();
  G.werewolf.alive.forEach(function(id){
    if(id==='me')return;
    var pick=G.werewolf.alive.filter(function(x){return x!=='me'})[Math.floor(Math.random()*Math.max(1,G.werewolf.alive.length-1))];
    G.werewolf.votes[pick]=(G.werewolf.votes[pick]||0)+1;
  });
  var best=null,bs=-1;
  Object.keys(G.werewolf.votes).forEach(function(k){if(G.werewolf.votes[k]>bs){bs=G.werewolf.votes[k];best=k}});
  if(best){
    addMsg({who:'gm',name:'狼人杀',text:'投票结果：'+wwName(best)+' 被放逐。'});
    killTarget(best);
  }else addMsg({who:'gm',name:'狼人杀',text:'平票，无人被放逐。'});
  G.werewolf.votes={};save();
  if(checkWin())return;
  nextNight();
}

/* ---------- 我的设定 ---------- */
function mePanel(body){
  var p=G.profile,h=p.hide||{};
  var fields=[['name','姓名','例如：少爷'],['gender','性别','例如：男'],['height','身高','例如：178cm'],['weight','体重','例如：65kg'],['look','外貌特征','例如：黑发、戴银框眼镜'],['family','家世背景','例如：家里开公司'],['ability','能力','例如：编程、摄影'],['size','尺寸','例如：17cm（按厘米填）']];
  var sub=document.createElement('div');sub.className='sub';sub.textContent='这些信息只有勾选「显示」时才会被智能体看到；隐藏后它们完全不可见。';body.appendChild(sub);
  fields.forEach(function(f){
    var r=document.createElement('div');r.className='row';
    var lb=document.createElement('span');lb.textContent=f[1];lb.style.cssText='width:64px;flex:0 0 auto';r.appendChild(lb);
    var inp=document.createElement('input');inp.type='text';inp.placeholder=f[2];inp.value=p[f[0]]||'';inp.oninput=function(){p[f[0]]=this.value.slice(0,80);save()};r.appendChild(inp);
    var btn=document.createElement('button');btn.textContent=h[f[0]]?'隐藏':'显示';btn.className=h[f[0]]?'':'on';
    btn.onclick=function(){h[f[0]]=!h[f[0]];save();mePanel(body.parentNode)};
    r.appendChild(btn);body.appendChild(r);
  });
  var note=document.createElement('div');note.className='sub';note.textContent='提示：聊天输入框长按选中文字后，可点这里的「打码」把该词加入隐藏词，之后不会出现在任何智能体的上下文里。';body.appendChild(note);
  var r2=document.createElement('div');r2.className='row';
  var mask=document.createElement('button');mask.textContent='管理打码词';
  mask.onclick=function(){
    var w=prompt('输入要打码的词（多个用逗号分隔）：',(p.masks||[]).join(','));
    if(w==null)return;p.masks=w.split(/[,，]+/).map(function(s){return s.trim()}).filter(Boolean);save();toast('打码词已更新');
  };r2.appendChild(mask);body.appendChild(r2);
}

/* ---------- 顶栏按钮 ---------- */
$('backBtn').onclick=function(){ location.href='index.html?mode=chat' };
$('memberBtn').onclick=function(){openPanel('成员',memberPanel)};
$('ruleBtn').onclick=function(){openPanel('公告 / 管理',rulePanel)};
$('gameBtn').onclick=function(){openPanel('游戏',gamePanel)};
$('meBtn').onclick=function(){openPanel('我的设定',mePanel)};
$('setBtn').onclick=function(){ openPanel('群设置',groupSettings) };
function groupSettings(body){
    var r=document.createElement('div');r.className='sub';r.textContent='群聊基础设置';body.appendChild(r);
    var row=document.createElement('div');row.className='row';
    var tx=document.createElement('span');tx.textContent='主动回复上限（每条消息）';row.appendChild(tx);
    var n=document.createElement('input');n.type='number';n.min=1;n.max=100;n.value=G.maxReplies;n.onchange=function(){G.maxReplies=Math.max(1,Math.min(100,+this.value||1));save();toast('已设为 '+G.maxReplies+' 轮')};row.appendChild(n);
    body.appendChild(row);
    var row2=document.createElement('div');row2.className='row';
    var par=document.createElement('button');par.textContent='不同 API 并发：'+(G.parallel?'开':'关');par.className=G.parallel?'on':'';
    par.onclick=function(){G.parallel=!G.parallel;save();openPanel('群设置',groupSettings)};
    row2.appendChild(par);body.appendChild(row2);
    var row3=document.createElement('div');row3.className='row';
    var clr=document.createElement('button');clr.textContent='清空群聊记录';
    clr.onclick=function(){if(!confirm('清空全部群聊消息？'))return;G.messages=[];save();render();toast('已清空')};
    row3.appendChild(clr);
    var out=document.createElement('button');out.textContent='全部成员移出';
    out.onclick=function(){if(!confirm('把全部智能体移出群聊？'))return;G.members=[];save();render()};
    row3.appendChild(out);body.appendChild(row3);
}
$('sendBtn').onclick=handleSend;
$('msgInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend()}});
$('atBtn').onclick=function(){
  var inp=$('msgInput');
  var box=document.createElement('div');box.className='opt opt-float';box.id='atOpts';
  G.members.forEach(function(m){var b=document.createElement('button');b.textContent='@'+nameOf(m);b.onclick=function(){inp.value+='@'+nameOf(m)+' ';inp.focus();box.remove()};box.appendChild(b)});
  document.body.appendChild(box);inp.focus();
};

load();
if(!started()){
  var tip=document.createElement('div');tip.className='sys';tip.textContent='欢迎来到群聊。点右上角「成员」拉智能体进群；你默认是群主。';$('chat').appendChild(tip);
}
render();
})();
</script>
