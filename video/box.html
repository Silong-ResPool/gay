<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08050f">
<title>影视乐园 · TVBox（Box 风格）</title>
<style>
:root{--bg:#0a0616;--panel:#171029;--panel2:#221636;--line:#3a2a5c;--txt:#efe9ff;--mut:#a99bc7;
  --accent:#B16CFF;--accent2:#FF6EC7;--ok:#43d17a;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden}
/* 顶栏 */
.top{position:sticky;top:0;z-index:200;display:flex;align-items:center;gap:8px;padding:10px 12px;
  background:linear-gradient(180deg,#1a1030,#120b22);border-bottom:1px solid var(--line)}
.bk{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);font-size:15px;cursor:pointer}
.logo{font-weight:800;font-size:17px;letter-spacing:1px;color:#fff;white-space:nowrap}
.logo b{color:var(--accent)}
.sbox{flex:1;display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:0 12px;min-width:0}
.sbox input{flex:1;background:transparent;border:0;outline:0;color:var(--txt);font-size:13px;padding:9px 0;min-width:0}
.sbox .go{color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding-left:6px}
/* 分类条（仓库分支分类） */
.nav{position:sticky;top:57px;z-index:190;background:rgba(10,6,22,.96);border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;overflow-x:auto;padding:9px 12px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:9px;font-size:13px;cursor:pointer;white-space:nowrap;
  background:var(--panel);border:1px solid var(--line);color:#b9c1d4}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;font-weight:700}
.chip.sec{font-size:12px;padding:5px 11px;border-radius:16px}
.chip.sec.on{background:var(--accent);}
.crumb{font-size:11.5px;color:var(--mut);padding:2px 14px 8px}
/* 网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:12px 12px 90px}
.card{position:relative;border-radius:10px;overflow:hidden;background:var(--panel);cursor:pointer;border:1px solid #1e1e26}
.card:active{transform:scale(.97)}
.card .pic{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#1a1a22}
.card .nt{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 7px;font-size:12px;color:#fff;line-height:1.35;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.86));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .rm{position:absolute;top:6px;right:6px;font-size:10px;background:rgba(0,0,0,.62);color:#ffd9cf;padding:2px 6px;border-radius:6px;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sect{display:flex;align-items:center;gap:8px;padding:12px 14px 0;font-size:14px;font-weight:700}
.sect::before{content:"";width:3px;height:15px;border-radius:2px;background:var(--accent)}
.sect .cnt{font-size:11px;color:var(--mut);font-weight:400}
.empty,.load{grid-column:1/-1;text-align:center;color:var(--mut);font-size:12.5px;padding:30px 0}
.load{color:var(--accent2)}
.more{grid-column:1/-1;text-align:center;padding:10px}
.more button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:9px 20px;font-size:13px;cursor:pointer}
/* 详情浮层 */
.ov{position:fixed;inset:0;z-index:900;background:rgba(4,4,7,.86);backdrop-filter:blur(4px);display:none;align-items:flex-end}
.ov.on{display:flex}
.sheet{width:100%;max-height:92vh;background:var(--panel);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  display:flex;flex-direction:column;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.shead{display:flex;gap:12px;padding:14px 14px 8px}
.shead img{width:104px;height:156px;object-fit:cover;border-radius:10px;background:#1a1a22;flex:0 0 auto}
.shead .info{flex:1;min-width:0}
.shead h3{font-size:16px;line-height:1.4;margin-bottom:8px}
.mtag{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.mtag span{font-size:11px;color:#cfd6e6;background:var(--panel2);border:1px solid var(--line);padding:2px 8px;border-radius:10px}
.mdesc{font-size:12px;color:var(--mut);line-height:1.7;max-height:96px;overflow-y:auto}
.epwrap{flex:1;overflow-y:auto;padding:6px 14px 14px}
.lines{display:flex;gap:8px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.lines::-webkit-scrollbar{display:none}
.eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.ep{font-size:12px;text-align:center;padding:9px 4px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep:active{background:var(--accent);border-color:transparent}
.sclose{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:15px;cursor:pointer;z-index:2}
/* 播放浮层 */
#play{position:fixed;inset:0;z-index:1000;background:#000;display:none;flex-direction:column}
#play.on{display:flex}
.pbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#101014}
.pbar .nm{flex:1;font-size:13px;color:#e9edf5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#1c1c24;color:#fff;font-size:15px;cursor:pointer}
#pv{flex:1;width:100%;background:#000;object-fit:contain}
.tip{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:1200;background:rgba(20,20,26,.95);
  border:1px solid var(--line);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:20px;display:none}
.sr{position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(0,0,0,.9));pointer-events:none}
</style>
</head>
<body>
<div class="top">
  <button class="bk" onclick="(window.VideoNative&&VideoNative.exit)?VideoNative.exit():(location.href='../index.html')">←</button>
  <div class="logo">影视<b>乐园</b></div>
  <div class="sbox">
    <input id="kw" placeholder="搜索影片 / 剧集…" onkeydown="if(event.key==='Enter')doSearch()">
    <span class="go" onclick="doSearch()">搜索</span>
  </div>
  <button class="bk" title="源管理" onclick="showMgr()">☰</button>
</div>

<div class="nav">
  <div class="row" id="catRow"></div>
  <div class="row" id="srcRow"></div>
  <div class="crumb" id="crumb">正在加载内置源…</div>
</div>

<div id="view"><div class="grid"><div class="load">正在加载…</div></div></div>

<div class="ov" id="detail"><div class="sheet">
  <button class="sclose" onclick="closeDetail()">✕</button>
  <div class="shead"><img id="dPic" alt=""><div class="info"><h3 id="dName">—</h3><div class="mtag" id="dTags"></div><div class="mdesc" id="dDesc"></div></div></div>
  <div class="epwrap"><div class="lines" id="dLines"></div><div class="eps" id="dEps"></div></div>
</div></div>

<div id="play">
  <div class="pbar"><span class="nm" id="pName">—</span><button onclick="closePlay()">✕</button></div>
  <video id="pv" controls playsinline webkit-playsinline></video>
</div>
<div class="tip" id="tip"></div>

    var j = null;

    var push = function (name, api) {
      if (!api || typeof api !== 'string') return;
      if (!/^https?:\/\//i.test(api)) return;
      if (/\.(jar|js|py)(\?|;|$)/i.test(api)) return;      // 需要爬虫文件的源，网页版用不了
      var nm = (name && String(name).trim()) || api.replace(/^https?:\/\//, '').split('/')[0];
      var base = api.replace(/\s+$/, '');
      for (var i = 0; i < out.length; i++) if (out[i].api === base) return;
      out.push({ name: nm, api: base });
    };

    var fromSite = function (s) {
      if (!s || typeof s !== 'object') return;
      var api = s.api || s.ext || '';
      // type=1 才是 JSON 采集接口；其他类型（3=需要 jar 的爬虫）跳过
      if (s.type !== undefined && s.type !== null && String(s.type) !== '' && Number(s.type) !== 1) return;
      push(s.name || s.key, api);
    };

    if (Array.isArray(j)) { for (var i = 0; i < j.length; i++) fromSite(j[i]); }
    else if (j && Array.isArray(j.sites)) { for (var k = 0; k < j.sites.length; k++) fromSite(j.sites[k]); }
    else if (j && Array.isArray(j.urls)) { tip = '这是「多仓」配置，请打开其中一个子配置地址，把子配置里的 JSON 粘进来（或直接填该 JSON 地址）。'; }
    else if (j && (j.api || j.url)) { fromSite(j); }
    else tip = '没识别到可用的源（需要 name + api 字段，或 TVBox 的 sites 数组）。';

    // 纯文本（一行一个采集接口地址，常见于 xxx多线.txt）
    if (!out.length) {
      var lines = String(text || '').split(/[\r\n]+/);
      var n = 0;
      for (var li = 0; li < lines.length && n < 300; li++) {
        var s2 = lines[li].trim();
        if (!/^https?:\/\//i.test(s2)) continue;
        if (/\.(txt|json)$/i.test(s2)) continue;      // 子配置地址交给「仓库展开」处理
        push(s2.replace(/^https?:\/\//, '').split('/')[0], s2);
        n++;
      }
      if (out.length) return { ok: true, list: out, tip: '来自纯文本列表' };
    }

    if (!out.length) return { ok: false, msg: tip || '没有解析到 type=1（JSON 接口）的源。' };
    return { ok: true, list: out, tip: tip };
  };

  /* 三框添加源时的链接校验：把常见写法补全成标准接口地址 */
  w.normalizeSourceApi = function (api) {
    var s = String(api || '').trim();
    if (!s) return '';
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    s = s.replace(/\s+/g, '');
    // 只填了域名/目录 → 补上苹果CMS 标准路径
    if (!/\.php|\.json|\.txt|\?/i.test(s)) {
      s = s.replace(/\/+$/, '') + '/api.php/provide/vod/';
    }
    // 去掉结尾多余的 ? 或 ?ac=xxx（本应用会自己拼参数）
    s = s.replace(/[?&]+$/, '');
    s = s.replace(/\?(ac=list|ac=class|ac=detail.*)$/i, '');
    return s;
  };

})(window);
</script>
<script>
/* ==========================================================================
   影视乐园 · xpath.js（Kazumi 式 XPath 规则引擎，已吞并 Kazumi 源规则体系）
   --------------------------------------------------------------------------
   规则格式（与 Kazumi plugins 完全一致）：
   {
     name:  '源名',  type: 'anime',
     baseURL: 'https://dmbus.cc/',
     searchURL: 'https://dmbus.cc/s----------.html?wd=@keyword',   // @keyword 占位符
     searchList:   '//div/div[3]/ul/li',    // 搜索结果列表节点
     searchName:   '//div/a[2]',            // 条目名称（在 searchList 节点内求值）
     searchResult: '//div/a[2]',            // 条目链接（href，在 searchList 节点内求值）
     chapterRoads: '//div/div[4]/div/ul',   // 播放线路容器（在详情页 document 求值）
     chapterResult: '//li/a',               // 单集链接（在 road 节点内求值）
     muliSources: true, usePost: false, useWebview: true, userAgent: ''
   }
   · 与 Kazumi 逻辑一致：searchName/searchResult 在 searchList 节点上下文求值，
     chapterResult 在 chapterRoads 节点上下文求值，链接取 href 并基于 baseURL 归一化。
   · 抓取：Android 端（file:// + allowUniversalAccess）直连 fetch；
     PC 测试版走本地代理 /proxy?url=…（由 server.ps1 提供），统一环境差异。
   ========================================================================== */

(function (w) {
  'use strict';

  var XP = {};

  var BROWSER_UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36';

  /* ---------------------------------------------------------------- 抓取 */
  // 抓一段 HTML 文本（带 UA；失败返回空串，由调用方判断）
  XP.fetchHtml = function (url, ms) {
    var timeout = ms || 15000;
    return new Promise(function (resolve) {
      var done = false;
      var ctrl = null;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(''); } }, timeout);
      var opts = {
        method: 'GET', cache: 'no-store',
        headers: { 'User-Agent': BROWSER_UA, 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' }
      };
      try {
        if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); opts.signal = ctrl.signal; }
      } catch (e) {}

      // 代理检测：页面自身跑在 http(s) 上，且目标跨域 → 走本地代理转发（PC 测试版）
      var viaProxy = /^https?:/i.test(location.protocol) && !sameHost(url);
      var target = viaProxy ? '/proxy?url=' + encodeURIComponent(url) : url;

      fetch(target, opts).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function (txt) {
        if (!done) { done = true; clearTimeout(timer); resolve(String(txt || '')); }
      }).catch(function (e) {
        if (!done) { done = true; clearTimeout(timer); resolve(''); }
      });
    });
  };

  function sameHost(u) {
    try {
      var a = new URL(String(u || ''), location.href);
      return a.host === location.host;
    } catch (e) { return false; }
  }
  w.xpSameHost = sameHost;

  /* ------------------------------------------------------ 链接归一化 */
  // 基于 baseURL 把相对/绝对地址拼成完整 URL（与 Kazumi normalizeEpisodeUrl 一致）
  XP.normalize = function (base, src) {
    try {
      var s = String(src || '').trim();
      if (!s) return '';
      if (/^https?:/i.test(s)) return s;
      if (/^\/\//i.test(s)) return (base.indexOf('https:') === 0 ? 'https:' : 'http:') + s;
      var b = String(base || '').trim();
      if (!/^https?:/i.test(b)) b = 'https://' + b;
      if (s.charAt(0) === '/') {
        var m = b.match(/^(https?:\/\/[^/]+)/i);
        return (m ? m[1] : b) + s;
      }
      if (!/\/$/.test(b) && b.indexOf('/') >= 0) { b = b.replace(/\/[^/]*$/, '/'); }
      return b + s;
    } catch (e) { return ''; }
  };

  /* ------------------------------------------------------ XPath 求值 */
  // 解析 HTML 为 document，返回根元素；失败返回 null
  function toDoc(html) {
    try {
      var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
      return doc;
    } catch (e) { return null; }
  }

  // 在 context（Element 或 Document）上求值 XPath，返回节点数组
  // 兼容 Kazumi XPath 库的相对语义：表达式以 "//" 开头时，若 context 是元素节点
  // 则自动改为 ".//"（从当前节点开始找后代），避免浏览器标准里 "//" 永远从文档根算
  XP.nodes = function (context, expr) {
    try {
      var list = [];
      if (!context || !expr || !String(expr).trim()) return list;
      var e = String(expr).trim();
      var isElement = (context.nodeType === 1);
      if (isElement && e.charAt(0) === '/' && e.charAt(1) === '/') e = '.' + e;
      var r = document.evaluate(e, context, null, XPathResult.ORDERED_NODE_SNAPSHOT_TYPE, null);
      for (var i = 0; i < r.snapshotLength; i++) list.push(r.snapshotItem(i));
      return list;
    } catch (e) { return []; }
  };

  function firstNode(context, expr) {
    var n = XP.nodes(context, expr);
    return n.length ? n[0] : null;
  }

  function nodeText(node) {
    if (!node) return '';
    try { return (node.textContent || '').trim(); } catch (e) { return ''; }
  }

  function nodeHref(node) {
    if (!node) return '';
    try { return String(node.getAttribute('href') || '').trim(); } catch (e) { return ''; }
  }

  /* ------------------------------------------------------ 搜索 */
  // 返回 [{name, src}] ；失败返回 []
  XP.search = function (rule, keyword) {
    if (!rule || !rule.searchURL || !rule.searchList) return Promise.resolve([]);
    var q = String(keyword || '');
    if (!q) return Promise.resolve([]);
    var url = String(rule.searchURL).replace(/@keyword/g, encodeURIComponent(q));
    return XP.fetchHtml(url).then(function (html) {
      if (!html) return [];
      var doc = toDoc(html);
      if (!doc) return [];
      var root = doc.documentElement;
      var listNodes = XP.nodes(root, rule.searchList);
      var out = [];
      for (var i = 0; i < listNodes.length; i++) {
        var node = listNodes[i];
        try {
          var nameEl = rule.searchName ? firstNode(node, rule.searchName) : null;
          var srcEl = rule.searchResult ? firstNode(node, rule.searchResult) : null;
          var name = nodeText(nameEl);
          var src = nodeHref(srcEl);
          if (!name && srcEl) name = nodeText(srcEl);
          if (!name || !src) continue;
          out.push({ name: name, src: XP.normalize(rule.baseURL, src) });
        } catch (e) {}
      }
      return out;
    });
  };

  /* ------------------------------------------------------ 详情（线路+集数） */
  // 返回 [{from, eps:[{name,url}]}] ；失败返回 []
  XP.chapters = function (rule, detailUrl) {
    if (!rule || !detailUrl) return Promise.resolve([]);
    return XP.fetchHtml(detailUrl).then(function (html) {
      if (!html) return [];
      var doc = toDoc(html);
      if (!doc) return [];
      var root = doc.documentElement;
      if (!rule.chapterRoads || !rule.chapterResult) return [];
      var roadNodes = XP.nodes(root, rule.chapterRoads);
      var out = [];
      for (var r = 0; r < roadNodes.length; r++) {
        var road = roadNodes[r];
        try {
          var eps = [];
          var epNodes = XP.nodes(road, rule.chapterResult);
          for (var k = 0; k < epNodes.length; k++) {
            try {
              var src = nodeHref(epNodes[k]);
              if (!src) continue;
              var nm = String(epNodes[k].textContent || '').replace(/\s+/g, '');
              if (!nm) nm = '第' + (k + 1) + '集';
              eps.push({ name: nm, url: XP.normalize(rule.baseURL, src) });
            } catch (e) {}
          }
          if (!eps.length) continue;
          out.push({ from: '播放线路' + (out.length + 1), eps: eps });
        } catch (e) {}
      }
      return out;
    });
  };

  /* ------------------------------------------------------ 嗅探页内视频地址
     有些源的集数页是播放器页（非直连 m3u8），需在页面 HTML/脚本里找真实视频地址。
     返回首个匹配的 m3u8/mp4 直连地址；找不到返回 ''。 */
  XP.sniffInHtml = function (html, baseURL) {
    try {
      var h = String(html || '');
      if (!h) return '';
      // 常见形态：var url = "xxx.m3u8" / video src= / player_aaaa = "..."
      var m = h.match(/https?[^"'\s<>]+\.m3u8[^"'\s<>]*/i);
      if (m) return m[0];
      m = h.match(/(?:src|url|link|playurl)\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i);
      if (m) return XP.normalize(baseURL, m[1]);
      m = h.match(/https?[^"'\s<>]+\.mp4[^"'\s<>]*/i);
      if (m) return m[0];
      return '';
    } catch (e) { return ''; }
  };
  w.xpSniffHtml = XP.sniffInHtml;

  /* ------------------------------------------------------ 规则校验 */
  XP.checkRule = function (rule) {
    var missing = [];
    if (!rule || typeof rule !== 'object') return '规则不是对象';
    if (!rule.baseURL) missing.push('baseURL');
    if (!rule.searchURL) missing.push('searchURL');
    if (!rule.searchList) missing.push('searchList');
    if (!rule.searchName) missing.push('searchName');
    if (!rule.searchResult) missing.push('searchResult');
    if (!rule.chapterRoads) missing.push('chapterRoads');
    if (!rule.chapterResult) missing.push('chapterResult');
    return missing.length ? ('缺少字段：' + missing.join(' / ')) : '';
  };

  /* ------------------------------------------------------ 规则解析（文本 → 规则对象）
     支持：① 直接 JSON 对象  ② {rules:{...}} 包裹  ③ Kazumi 插件 JSON（含 api/type 字段） */
  XP.parseRuleText = function (text) {
    try {
      var j = JSON.parse(String(text || ''));
      if (!j || typeof j !== 'object') return { ok: false, msg: '不是合法的规则 JSON' };
      var rule = (j.rules && typeof j.rules === 'object' && (j.rules.searchURL || j.rules.baseURL)) ? j.rules : j;
      var nm = String(rule.name || j.name || '').trim();
      var err = XP.checkRule(rule);
      if (err) return { ok: false, msg: err };
      return { ok: true, rule: rule, name: nm };
    } catch (e) { return { ok: false, msg: 'JSON 解析失败：' + e.message }; }
  };

  w.XP = XP;

})(window);

</script>
<script>
/* ==========================================================================
   影视乐园 · api.js
   苹果CMS（MacCMS V10）JSON 接口封装：
   · 分类：?ac=class                    → { class:[{type_id,type_pid,type_name}] }
   · 列表：?ac=detail&pg=1&t=<分类>      → { list:[...], page, pagecount }
   · 搜索：?ac=detail&wd=<关键词>        → { list:[...] }
   · 详情：?ac=detail&ids=<vod_id>       → { list:[ 一条完整数据 ] }
   ========================================================================== */

(function (w) {
  'use strict';

  var API = {};

  /* v9.8.0：默认开启接口缓存（下次打开无需重新加载）；设置里可选 7 天 / 30 天 / 从不 / 永久 */
  var CACHE_KEY = 'video_api_cache_v1';
  function cacheMode(){ try { return (w.V && w.V.cacheMode) || '7d'; } catch (e) { return '7d'; } }
  function cacheTTL(){
    var m = cacheMode();
    if (m === 'never') return -1;
    if (m === 'forever') return 0;
    return (m === '30d' ? 30 : 7) * 24 * 3600 * 1000;
  }
  function readCache(url){
    try {
      var all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      var rec = all[url]; if (!rec) return null;
      var ttl = cacheTTL(); if (ttl < 0) return null;
      if (ttl > 0 && (Date.now() - rec.t) > ttl) { delete all[url]; localStorage.setItem(CACHE_KEY, JSON.stringify(all)); return null; }
      return rec.j;
    } catch (e) { return null; }
  }
  function writeCache(url, j){
    if (cacheTTL() < 0) return;
    try {
      var all = JSON.parse(localStorage.getItem(CACHE_KEY) || '{}');
      all[url] = { t: Date.now(), j: j };
      var keys = Object.keys(all);
      if (keys.length > 1200) { keys.sort(function(a,b){return all[a].t-all[b].t}); keys.slice(0,200).forEach(function(k){delete all[k]}); }
      localStorage.setItem(CACHE_KEY, JSON.stringify(all));
    } catch (e) {}
  }
  API.clearCache = function(){ try { localStorage.removeItem(CACHE_KEY); } catch (e) {} };

  function join(api, qs) {
    var a = String(api || '');
    if (!a) return '';
    if (a.charAt(a.length - 1) !== '/' && a.indexOf('.php') < 0 && a.indexOf('?') < 0) a += '/';
    return a + (a.indexOf('?') >= 0 ? '&' : '?') + qs;
  }

  API.url = join;

  // 带超时与重试的 JSON 请求
  // 巳泷 v9.1：给请求加浏览器 UA / Accept —— 部分采集站（Cloudflare 等）会拦截无 UA 或
  // 非浏览器 UA 的请求（返回 503/403/418/521），带 UA 后可用性明显提高。
  var BROWSER_UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36';
  API.fetchJson = function (url, ms, extraOpts) {
    var isPost = extraOpts && extraOpts.method && String(extraOpts.method).toUpperCase() !== 'GET';
    var cached = isPost ? null : readCache(url);
    if (cached) return Promise.resolve(cached);   /* 命中缓存：秒开，不重复爬取 */
    var timeout = ms || 15000;
    return new Promise(function (resolve, reject) {
      var done = false;
      var ctrl = null;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        try { if (ctrl) ctrl.abort(); } catch (e) {}
        reject(new Error('请求超时（' + Math.round(timeout / 1000) + ' 秒）：' + url));
      }, timeout);

      var opts = {
        method: 'GET', cache: 'no-store',
        headers: {
          'User-Agent': BROWSER_UA,
          'Accept': 'application/json, text/plain, */*'
        }
      };
      // 巳泷 v9.2.1：支持 POST（AdultEmbed get-embed 等）
      if (extraOpts && extraOpts.method) opts.method = extraOpts.method;
      // 只有 http(s) 页面才带 Referer（file:// 页面发 file:// 的 Referer 反而会被反盗链拦截）
      try { if (/^https?:/i.test(location.protocol)) opts.headers['Referer'] = location.href; } catch (e) {}
      try {
        if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); opts.signal = ctrl.signal; }
      } catch (e) {}

      var tryFetch = function (u, attempt) {
        return fetch(u, opts).then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.text();
        }).then(function (txt) {
          if (done) return;
          done = true; clearTimeout(timer);
          var j = parseJsonLoose(txt);
          if (!j) { reject(new Error('返回内容不是 JSON（该源可能已失效）')); return; }
          if(!isPost) writeCache(url, j);
          resolve(j);
        }).catch(function (err) {
          if (done) return;
          // 巳泷 v9.1：https 失败自动降级 http 重试一次（部分采集站只有 http 线路）
          if (attempt === 0 && /^https:/i.test(u)) {
            var alt = 'http:' + u.slice('https:'.length);
            tryFetch(alt, 1).catch(function (e2) { settleFail(err); });
            return;
          }
          settleFail(err);
        });
      };
      var settleFail = function (err) {
        if (done) return;
        done = true; clearTimeout(timer);
        reject(err && err.message ? err : new Error(String(err)));
      };
      tryFetch(url, 0);
    });
  };

  /* 宽松 JSON 解析：去 BOM / 前后空白 / 去掉 "at/json:" 前缀（个别源在 body 前带标记） */
  function parseJsonLoose(txt) {
    var s = String(txt || '');
    s = s.replace(/^\uFEFF/, '');
    // 去掉类似 at/json: 或 JSON: 的文本前缀
    s = s.replace(/^\s*(?:at\/json|json)\s*:\s*/i, '');
    s = s.trim();
    try { return JSON.parse(s); } catch (e) {}
    // 个别源在数组/对象前后有额外字符
    var m = s.match(/[\[{][\s\S]*[\]}]/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
    return null;
  }

  /* ---------------------------------------------------------------- 分类
     苹果CMS 的 ac=list / ac=class / ac=detail 都会返回 class 分类数组，
     这里依次尝试，取到就返回（兼容不同采集程序的实现差异）。 */
  function pickClasses(j) {
    var arr = (j && (j['class'] || j.classes || j.type || j.types)) || [];
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      var c = arr[i] || {};
      var id = String(c.type_id !== undefined ? c.type_id : (c.id !== undefined ? c.id : ''));
      if (!id) continue;
      out.push({
        id: id,
        pid: String(c.type_pid !== undefined ? c.type_pid : (c.pid !== undefined ? c.pid : '0')),
        name: String(c.type_name || c.name || ('分类' + id))
      });
    }
    return out;
  }

  /* 分类缓存（按接口地址，10 分钟有效）：切换/重进源时秒开，避免重复请求卡顿 */
  var classCache = {};

  API.classes = function (api) {
    var now = Date.now(), hit = classCache[api];
    if (hit && hit.list && (now - hit.at) < 10 * 60 * 1000) return Promise.resolve(hit.list);
    return API.fetchJson(join(api, 'ac=list&pg=1')).then(function (j) {
      var out = pickClasses(j);
      if (out.length) { classCache[api] = { at: Date.now(), list: out }; return out; }
      // 兜底：个别源只在 ac=class 下给分类
      return API.fetchJson(join(api, 'ac=class')).then(function (j2) {
        var out2 = pickClasses(j2);
        if (out2.length) { classCache[api] = { at: Date.now(), list: out2 }; return out2; }
        return API.fetchJson(join(api, 'ac=detail&pg=1')).then(function (j3) {
          var out3 = pickClasses(j3);
          classCache[api] = { at: Date.now(), list: out3 };
          return out3;
        });
      });
    });
  };

  /* ---------------------------------------------------------------- 列表 */
  API.list = function (api, opt) {
    opt = opt || {};
    var qs = 'ac=detail&pg=' + (opt.page || 1);
    if (opt.typeId) qs += '&t=' + encodeURIComponent(opt.typeId);
    if (opt.hours) qs += '&h=' + opt.hours;
    return API.fetchJson(join(api, qs)).then(function (j) {
      return {
        items: (j && j.list) || [],
        page: Number(j && j.page) || (opt.page || 1),
        pagecount: Number((j && (j.pagecount || j.page_count)) || 1),
        total: Number((j && j.total) || 0)
      };
    });
  };

  // 取参与聚合的成人单线源（仓库 t:"m" 不在此直接参与，需要用户自行展开）
  function gaySources() {
    var out = [];
    var seen = {};
    var list = (w.VIDEO_SOURCES || []);
    for (var i = 0; i < list.length; i++) {
      var s = list[i];
      if (!s || s.t || s.xpath) continue;                       // 跳过仓库入口 / XPath 源
      if ((s.c || '') !== '成人（18+）') continue;
      var api = s.a || s.api;
      if (!/^https?:\/\//i.test(api)) continue;
      if (seen[api]) continue;
      seen[api] = 1;
      out.push({ name: s.n || s.name || api, api: api, v: s.v });
    }
    // 已验证可用(v:1) 的排前面
    out.sort(function (a, b) { return (b.v ? 1 : 0) - (a.v ? 1 : 0); });
    return out;
  }

  // 判断一个源本身是否为男同主题（源名命中 → 整源内容都收录，不再逐条过滤）
  function gaySourceIsThemed(s) {
    return gayHitText(s.name);
  }

  function gayItemFields(raw) {
    try {
      return [
        raw.vod_name, raw.vod_class, raw.type_name, raw.vod_tag,
        raw.vod_keywords, raw.vod_actor, raw.vod_director, raw.vod_content, raw.vod_blurb,
        (raw.vod_type_name || ''), (raw.tags || '')
      ];
    } catch (e) { return [raw.vod_name]; }
  }

  // 限制并发的批量请求
  function gayPool(tasks, limit) {
    limit = limit || 6;
    return new Promise(function (resolve) {
      var i = 0, done = 0, results = new Array(tasks.length);
      if (!tasks.length) return resolve(results);
      var launch = function () {
        var idx = i++;
        if (idx >= tasks.length) return;
        Promise.resolve().then(function () { return tasks[idx](); })
          .then(function (r) { results[idx] = r; })
          .catch(function () { results[idx] = null; })
          .then(function () {
            done++;
            if (done >= tasks.length) resolve(results);
            else launch();
          });
      };
      for (var k = 0; k < Math.min(limit, tasks.length); k++) launch();
    });
  }

  // 聚合结果池：typeId → { items:[], page:1 }（一个分类会话内缓存，避免翻页重复请求）
  var gayPoolCache = {};

  // 单个关键词在单个源上搜索，返回命中的 raw 列表（已打 __gayApi 标记）
  function gaySearchOne(s, kw) {
    return API.fetchJson(join(s.api, 'ac=detail&wd=' + encodeURIComponent(kw) + '&pg=1'), 12000)
      .then(function (j) {
        var arr = (j && j.list) || [];
        var hit = [];
        for (var i = 0; i < arr.length; i++) {
          var raw = arr[i];
          if (!raw) continue;
          // 整源男同主题 → 全收；否则要求视频片名/标签命中
          if (gaySourceIsThemed(s) || gayHitText.apply(null, gayItemFields(raw))) {
            raw.__gayApi = s.api; raw.__gaySrc = s.name;
            hit.push(raw);
          }
        }
        return hit;
      })
      .catch(function () { return []; });
  }

  // 分类名命中 → 直接读该分类第 1 页（整页都属该男同分类，直接收录）
  function gayCategoryScan(s) {
    return API.classes(s.api).then(function (cls) {
      var hitIds = [];
      for (var i = 0; i < cls.length; i++) {
        if (gayHitText(cls[i].name)) hitIds.push(cls[i].id);
      }
      if (!hitIds.length) return [];
      var jobs = hitIds.slice(0, 3).map(function (tid) {
        return API.fetchJson(join(s.api, 'ac=detail&pg=1&t=' + encodeURIComponent(tid)), 12000)
          .then(function (j) {
            var arr = (j && j.list) || [];
            for (var k = 0; k < arr.length; k++) {
              if (arr[k]) { arr[k].__gayApi = s.api; arr[k].__gaySrc = s.name; }
            }
            return arr;
          })
          .catch(function () { return []; });
      });
      return Promise.all(jobs).then(function (groups) {
        var out = [];
        groups.forEach(function (g) { out = out.concat(g || []); });
        return out;
      });
    }).catch(function () { return []; });
  }

  // 拉取并聚合（核心）
  function gayFetch(typeId) {
    var srcs = gaySources();
    var kws = GAY_KW[typeId] || GAY_KW.all;
    // 源名命中关键词的源：直接整源拉取（只读首页列表）
    var themed = srcs.filter(gaySourceIsThemed);
    var normal = srcs.filter(function (s) { return !gaySourceIsThemed(s); });
    // 控制总量：普通源最多参与 14 个，关键词最多 3 个/源（全部分类时），避免请求爆炸
    normal = normal.slice(0, 14);
    var useKws = kws.slice(0, typeId === 'all' ? 4 : 2);

    var tasks = [];
    /* 快速兜底：155api 的「男同」关键词命中量大且接口稳定，先塞一组保证成人区不为空 */
    tasks.push(function () {
      var fkw = typeId === 'all' ? '男同' : kws[0];
      return API.fetchJson(join('https://155api.com/api.php/provide/vod', 'ac=detail&wd=' + encodeURIComponent(fkw) + '&pg=1'), 15000)
        .then(function (j) {
          var arr = (j && j.list) || [];
          for (var k = 0; k < arr.length; k++) {
            if (arr[k]) { arr[k].__gayApi = 'https://155api.com/api.php/provide/vod'; arr[k].__gaySrc = '男同专区'; }
          }
          return arr;
        }).catch(function () { return []; });
    });
    // ① 主题源整源拉取
    themed.slice(0, 10).forEach(function (s) {
      tasks.push(function () {
        return API.fetchJson(join(s.api, 'ac=detail&pg=1'), 12000)
          .then(function (j) {
            var arr = (j && j.list) || [];
            for (var k = 0; k < arr.length; k++) if (arr[k]) { arr[k].__gayApi = s.api; arr[k].__gaySrc = s.name; }
            return arr;
          }).catch(function () { return []; });
      });
    });
    // ② 分类名扫描（仅"全部"分类下执行一次，成本较高）
    if (typeId === 'all') {
      normal.slice(0, 8).forEach(function (s) {
        tasks.push(function () { return gayCategoryScan(s); });
      });
    }
    // ③ 关键词搜索
    normal.forEach(function (s) {
      useKws.forEach(function (kw) {
        tasks.push(function () { return gaySearchOne(s, kw); });
      });
    });

    return gayPool(tasks, 6).then(function (groups) {
      var seen = {}, out = [];
      groups.forEach(function (g) {
        if (!g || !g.length) return;
        for (var i = 0; i < g.length; i++) {
          var raw = g[i];
          var key = String(raw.vod_id || raw.id || '') + '|' + String(raw.vod_name || '');
          if (seen[key]) continue;
          seen[key] = 1;
          out.push(raw);
        }
      });
      return out;
    });
  }

  // 对外：classes / list 分流
  var _gayOrigClasses = API.classes;
  API.classes = function (api) {
    if (isGayAgg(api)) return Promise.resolve(GAY_CLASSES);
    return _gayOrigClasses(api);
  };

  var _gayOrigList = API.list;
  API.list = function (api, opt) {
    if (isGayAgg(api)) {
      opt = opt || {};
      var typeId = String(opt.typeId || 'all');
      if (GAY_KW[typeId] === undefined) typeId = 'all';
      var page = opt.page || 1;
      var cache = gayPoolCache[typeId];
      var buildResp = function (raws) {
        var start = (page - 1) * GAY_PAGE_SIZE;
        var slice = raws.slice(start, start + GAY_PAGE_SIZE);
        return {
          items: slice,
          page: page,
          pagecount: Math.max(1, Math.ceil(raws.length / GAY_PAGE_SIZE)),
          total: raws.length
        };
      };
      if (cache && cache.items) return Promise.resolve(buildResp(cache.items));
      return gayFetch(typeId).then(function (raws) {
        gayPoolCache[typeId] = { items: raws };
        return buildResp(raws);
      });
    }
    return _gayOrigList(api, opt);
  };

  var _gayOrigSearch = API.search;
  API.search = function (api, wd, page) {
    if (isGayAgg(api)) {
      // 专区内搜索：聚合各成人源搜索结果，仍只保留男同关键词命中（保持专区内容纯粹）
      var srcs = gaySources().slice(0, 12);
      var tasks = srcs.map(function (s) {
        return function () {
          return API.fetchJson(join(s.api, 'ac=detail&wd=' + encodeURIComponent(wd) + '&pg=' + (page || 1)), 12000)
            .then(function (j) {
              var arr = (j && j.list) || [];
              for (var k = 0; k < arr.length; k++) {
                if (arr[k] && (gaySourceIsThemed(s) || gayHitText.apply(null, gayItemFields(arr[k])))) {
                  arr[k].__gayApi = s.api; arr[k].__gaySrc = s.name;
                } else if (arr[k]) arr[k].__gaySkip = 1;
              }
              return arr.filter(function (r) { return r && !r.__gaySkip; });
            }).catch(function () { return []; });
        };
      });
      return gayPool(tasks, 6).then(function (groups) {
        var seen = {}, out = [];
        groups.forEach(function (g) {
          (g || []).forEach(function (raw) {
            var key = String(raw.vod_id || '') + '|' + String(raw.vod_name || '');
            if (seen[key]) return;
            seen[key] = 1; out.push(raw);
          });
        });
        return { items: out, page: page || 1, pagecount: 1 };
      });
    }
    return _gayOrigSearch(api, wd, page);
  };

  var _gayOrigDetail = API.detail;
  API.detail = function (api, id) {
    // 聚合条目详情：用条目自带的源接口回源补全（由 app.js 传入真实源地址；兜底扫描当前列表）
    if (isGayAgg(api)) {
      try {
        var hit = null;
        var findIn = function (arr) {
          for (var i = 0; i < (arr || []).length; i++) {
            if (String(arr[i].vod_id || arr[i].id) === String(id)) return arr[i];
          }
          return null;
        };
        if (w.V && w.V.items) {
          for (var j = 0; j < w.V.items.length; j++) {
            var it = w.V.items[j];
            if (String(it.id) === String(id) && it.raw && it.raw.__gayApi) { hit = it.raw; break; }
          }
        }
        if (hit && hit.__gayApi) {
          return _gayOrigDetail(hit.__gayApi, id).then(function (raw) {
            if (raw) { raw.__gayApi = hit.__gayApi; raw.__gaySrc = hit.__gaySrc; }
            return raw || hit;
          }).catch(function () { return hit; });
        }
      } catch (e) {}
      return Promise.resolve(null);
    }
    return _gayOrigDetail(api, id);
  };

  // 男同专区分类切换时清空聚合池（源更新后可重新拉取）
  API.gayClearPool = function () { gayPoolCache = {}; };

})(window);
</script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var CATS=(window.VIDEO_CATS||[]).filter(function(c){return c!=='自定义'});
var state={cat:CATS[0],src:null,api:null,classes:[],cls:null,page:1,pagecount:1,items:[],busy:false,detail:null,playing:null};
try{ window.__SLBOX=state; }catch(e){}
var hls=null;

/* CORS 兜底：部分采集接口无跨域头（App 内 file:// WebView 可直连；本地 http 测试走同源 /proxy） */
(function(){
  if(!window.API||!API.fetchJson)return;
  var _fj=API.fetchJson;
  var onLocalHost=(/^https?:$/i.test(location.protocol))&&/^(localhost|127\.0\.0\.1)$/i.test(location.hostname);
  API.fetchJson=function(url,ms,opts){
    var isHttp=/^https?:/i.test(url), canProxy=isHttp&&!/\/proxy\?/i.test(url);
    if(onLocalHost&&canProxy){ return _fj('/proxy?url='+encodeURIComponent(url),ms||20000,opts).catch(function(e){ return _fj(url,ms||20000,opts); }); }
    return _fj(url,ms,opts).catch(function(err){
      if(canProxy) return _fj('/proxy?url='+encodeURIComponent(url),ms||20000,opts);
      throw err;
    });
  };
})();

function tip(m){var t=$('tip');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},1800)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function sourcesOf(cat){return (window.VIDEO_SOURCES||[]).filter(function(s){return s.c===cat})}

/* ---------- 分类（仓库分支） ---------- */
function renderCats(){
  var box=$('catRow');box.innerHTML='';
  CATS.forEach(function(c){
    var n=sourcesOf(c).length;
    var d=document.createElement('div');d.className='chip'+(c===state.cat?' on':'');d.textContent=c+(n?' ('+n+')':'');
    d.onclick=function(){state.cat=c;renderCats();renderSrcs()};
    box.appendChild(d);
  });
}
/* ---------- 源条 ---------- */
function renderSrcs(){
  var box=$('srcRow');box.innerHTML='';
  var list=sourcesOf(state.cat);
  if(!list.length){box.innerHTML='<span class="chip sec">该分类暂无源</span>';return}
  list.forEach(function(s){
    var d=document.createElement('div');d.className='chip sec'+(state.src&&state.src.n===s.n?' on':'');d.textContent=s.n;
    d.onclick=function(){selectSource(s)};
    box.appendChild(d);
  });
  // 默认选第一个
  if(!state.src||state.src.c!==state.cat&&!list.some(function(x){return x.n===state.src.n})) selectSource(list[0]);
}
function selectSource(s){
  state.src=s;state.api=(s.t==='x')?('xpath:'+s.n):s.a;state.classes=[];state.cls=null;state.page=1;state.items=[];
  renderSrcs();
  $('crumb').textContent='当前源：'+s.n+' · 分类 '+state.cat;
  if(s.t==='x'){ $('view').innerHTML='<div class="grid"><div class="empty">该源为 XPath 动漫源，请用顶部搜索框搜索番剧</div></div>'; return }
  loadClasses();
}
function loadClasses(){
  var view=$('view');view.innerHTML='<div class="grid"><div class="load">正在读取分类…</div></div>';
  API.classes(state.api).then(function(list){
    state.classes=[{id:'',name:'全部'}].concat(list||[]);
    state.cls='';renderCls();loadList(null);
  }).catch(function(){
    state.classes=[{id:'',name:'全部'}];state.cls='';renderCls();loadList(null);
  });
}
function renderCls(){
  var box=$('view');
  var head=document.createElement('div');head.className='sect';head.innerHTML='分类 <span class="cnt">'+state.classes.length+' 个</span>';
  var row=document.createElement('div');row.className='row';row.style.padding='9px 12px';
  state.classes.forEach(function(c){
    var d=document.createElement('div');d.className='chip sec'+(c.id===state.cls?' on':'');d.textContent=c.name;
    d.onclick=function(){state.cls=c.id;state.page=1;state.items=[];renderCls();loadList(null)};
    row.appendChild(d);
  });
  box.innerHTML='';box.appendChild(head);box.appendChild(row);
  box.appendChild(makeGrid());
}
function makeGrid(){var g=document.createElement('div');g.className='grid';g.id='itemGrid';return g}

/* ---------- 列表（分批：每批最多 100，滑到底部才继续加载，避免一次性全加载卡顿） ---------- */
var BATCH=100;
function loadList(reset){
  var grid=$('itemGrid');if(!grid)return;
  if(state.busy||state.end)return;state.busy=true;
  if(reset){state.page=1;state.items=[];grid.innerHTML='<div class="load">正在加载影片…</div>'}
  var target=state.items.length+BATCH;
  (function step(){
    if(state.page>state.pagecount || state.items.length>=target){
      state.busy=false;state.end=(state.page>state.pagecount);paintGrid(grid,state.items);return;
    }
    API.list(state.api,{page:state.page,typeId:state.cls}).then(function(res){
      state.pagecount=res.pagecount||1;
      var items=(res.items||[]).map(function(r){return API.item(r)});
      if(!items.length){state.end=true;state.busy=false;paintGrid(grid,state.items);return;}
      state.items=state.items.concat(items);state.page++;step();
    }).catch(function(){state.busy=false;if(!state.items.length)grid.innerHTML='<div class="empty">加载失败，请换源或重试</div>';});
  })();
}
function paintGrid(grid,items){
  grid.innerHTML='';
  if(!items.length){grid.innerHTML='<div class="empty">该分类暂无内容</div>';return}
  var frag=document.createDocumentFragment();
  items.forEach(function(it){
    var d=document.createElement('div');d.className='card';
    var pic=it.pic?('<img class="pic" loading="lazy" src="'+esc(it.pic)+'" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">'):'<div class="pic"></div>';
    var rm=it.remarks?('<div class="rm">'+esc(it.remarks)+'</div>'):'';
    d.innerHTML=pic+rm+'<div class="nt">'+esc(it.name)+'</div>';
    d.onclick=function(){openDetail(it)};
    frag.appendChild(d);
  });
  grid.appendChild(frag);
  if(!state.end){
    var m=document.createElement('div');m.className='more';
    var b=document.createElement('button');b.textContent='加载更多（已加载 '+items.length+' 个）';b.onclick=nextBatch;
    m.appendChild(b);grid.appendChild(m);
  }
}
function nextBatch(){var g=$('itemGrid');if(g){var m=g.querySelector('.more');if(m)m.remove()}loadList(false)}
window.addEventListener('scroll',function(){
  if(state.busy||state.end)return;
  if((window.innerHeight+window.scrollY)>=document.body.scrollHeight-320) nextBatch();
},true);

/* ---------- 详情 ---------- */
function openDetail(it){
  state.detail=it;
  $('dPic').src=it.pic||'';$('dName').textContent=it.name;
  var tags=[];if(it.typeName)tags.push(it.typeName);if(it.year)tags.push(it.year);if(it.area)tags.push(it.area);if(it.score)tags.push('评分 '+it.score);
  $('dTags').innerHTML=tags.map(function(t){return '<span>'+esc(t)+'</span>'}).join('');
  $('dDesc').textContent=it.content||'暂无简介';
  $('detail').classList.add('on');
  $('dLines').innerHTML='<span class="chip sec">加载中…</span>';$('dEps').innerHTML='';
  API.detail(state.api,it.id).then(function(raw){
    var groups=API.play(raw||it.raw||{});
    if(!groups.length){$('dLines').innerHTML='<span class="chip sec">暂无播放地址</span>';return}
    renderLines(groups,0);
  }).catch(function(){ $('dLines').innerHTML='<span class="chip sec">详情加载失败</span>' });
}
function renderLines(groups,gi){
  var box=$('dLines');box.innerHTML='';
  groups.forEach(function(g,i){
    var d=document.createElement('div');d.className='chip sec'+(i===gi?' on':'');d.textContent=g.from;
    d.onclick=function(){renderLines(groups,i)};box.appendChild(d);
  });
  var ebox=$('dEps');ebox.innerHTML='';
  (groups[gi].eps||[]).forEach(function(ep,i){
    var d=document.createElement('div');d.className='ep';d.textContent=ep.name;
    d.onclick=function(){startPlay(ep,state.detail.name)};
    ebox.appendChild(d);
  });
}
function closeDetail(){$('detail').classList.remove('on')}

/* ---------- 播放 ---------- */
function startPlay(ep,name){
  $('pName').textContent=name+' · '+ep.name;
  $('play').classList.add('on');
  var v=$('pv');
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  var url=ep.url;
  if(/\.m3u8(\?|$)/i.test(url)){
    if(window.Hls&&Hls.isSupported()){hls=new Hls();hls.loadSource(url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,function(){v.play().catch(function(){})});}
    else v.src=url;
  } else { v.src=url; }
  v.play&&v.play().catch(function(){});
}
function closePlay(){$('play').classList.remove('on');try{$('pv').pause()}catch(e){}$('pv').removeAttribute('src');$('pv').load();}

/* ---------- 搜索 ---------- */
function doSearch(){
  var wd=$('kw').value.trim();if(!wd){tip('请输入关键词');return}
  var srcs=state.cat? sourcesOf(state.cat):(window.VIDEO_SOURCES||[]).slice(0,6);
  if(!srcs.length)srcs=(window.VIDEO_SOURCES||[]).slice(0,6);
  var head=document.createElement('div');head.className='sect';head.innerHTML='搜索 “'+esc(wd)+'” <span class="cnt">'+srcs.length+' 个源</span>';
  var grid=makeGrid();
  $('view').innerHTML='';$('view').appendChild(head);$('view').appendChild(grid);
  grid.innerHTML='<div class="load">正在搜索…</div>';
  var got=0;
  srcs.forEach(function(s){
    var api=(s.t==='x')?('xpath:'+s.n):s.api;
    API.search(api,wd,1).then(function(res){
      var items=(res.items||[]).map(function(r){return API.item(r)});
      if(items.length){
        if(got===0)grid.innerHTML='';
        var tag=document.createElement('div');tag.className='sect';tag.innerHTML=s.n+' <span class="cnt">'+items.length+'</span>';
        grid.appendChild(tag);
        if(got===0){ // 首个有结果的源，直接把结果渲染
          items.forEach(function(it){grid.appendChild(cardOf(it,api,s.n))});
        } else {
          items.slice(0,20).forEach(function(it){grid.appendChild(cardOf(it,api,s.n))});
        }
        got++;
      }
    }).catch(function(){});
  });
  setTimeout(function(){ if(got===0)grid.innerHTML='<div class="empty">没有搜到结果</div>' },8000);
}
function cardOf(it,api,sname){
  var d=document.createElement('div');d.className='card';
  var pic=it.pic?('<img class="pic" loading="lazy" src="'+esc(it.pic)+'" referrerpolicy="no-referrer" onerror="this.style.visibility=\'hidden\'">'):'<div class="pic"></div>';
  d.innerHTML=pic+(it.remarks?('<div class="rm">'+esc(it.remarks)+'</div>'):'')+'<div class="nt">'+esc(it.name)+'</div>';
  d.onclick=function(){ state.api=api; openDetail(it) };
  return d;
}

/* ---------- 源管理（简版） ---------- */
function showMgr(){
  var head=document.createElement('div');head.className='sect';head.innerHTML='源管理 <span class="cnt">内置 '+(window.VIDEO_SOURCES||[]).length+' 个源（保留原内置源，仅界面改为 Box 风格）</span>';
  var grid=makeGrid();
  $('view').innerHTML='';$('view').appendChild(head);$('view').appendChild(grid);
  grid.innerHTML='';
  CATS.forEach(function(c){
    var list=sourcesOf(c);if(!list.length)return;
    var t=document.createElement('div');t.className='sect';t.innerHTML=c+' <span class="cnt">'+list.length+'</span>';grid.appendChild(t);
    list.forEach(function(s){
      var d=document.createElement('div');d.className='card';d.style.aspectRatio='auto';
      d.innerHTML='<div style="padding:12px"><div style="font-size:13px;margin-bottom:4px">'+esc(s.n)+'</div><div style="font-size:10.5px;color:#8b93a7;word-break:break-all">'+esc(s.t==='x'?'XPath 动漫源':s.a)+'</div></div>';
      d.onclick=function(){ state.cat=c;state.src=null;renderCats();selectSource(s);tip('已切换到：'+s.n) };
      grid.appendChild(d);
    });
  });
}

window.showMgr=showMgr; /* 右上角「☰ 源管理」按钮通过内联 onclick 调用 */
renderCats();renderSrcs();
setTimeout(function(){tip('影视乐园 · Box 风格界面已就绪')},700);
})();
</script>
