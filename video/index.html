﻿/* ==========================================================================

﻿/* ==========================================================================
   影视乐园 · 样式（紫罗兰主题，配色/背景图/海报墙列数 均可在「设置」里自定义）
   ========================================================================== */

:root {
  /* ===== 巳泷梦幻紫（v9.3.0：与主页面 index 统一的梦幻紫系列）===== */
  --main: #9B4DE8;      /* 主色：梦幻紫 */
  --main2: #22D3EE;     /* 辅色：梦幻青 */
  --gold: #F472B6;      /* 点缀色：梦幻粉 */
  --bg: #0A0418;        /* 深空背景（与 index 一致） */
  --txt: #F2EDFF;
  --sub: rgba(212, 200, 245, .72);
  --line: rgba(139, 72, 235, .38);
  --cols: 3;            /* 海报墙列数（设置里可改 3/4/5） */
  --neon-blue: #22D3EE;
  --neon-purple: #9B4DE8;
  --neon-pink: #F472B6;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }

html, body {
  margin: 0; padding: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--txt);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  -webkit-user-select: none;
  user-select: none;
}

/* 自定义背景图图层 */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-size: cover;
  background-position: center;
  opacity: 0;
  transition: opacity 200ms ease;
  pointer-events: none;
}

.v-app {
  position: fixed;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(155, 77, 232, .32), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(34, 211, 238, .18), transparent 60%),
    radial-gradient(800px 480px at 55% 115%, rgba(244, 114, 182, .16), transparent 60%);
}

/* ===================== 顶栏 ===================== */
.v-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(8px + env(safe-area-inset-top, 0px)) 10px 8px 10px;
  background: linear-gradient(180deg, rgba(30, 8, 60, .96), rgba(14, 6, 32, .84));
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 20;
}

.v-head::after {
  content: "";
  position: absolute;
  left: 0; right: 0; bottom: -1px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--neon-blue), var(--neon-purple), var(--neon-pink), var(--neon-blue), transparent);
  background-size: 220% 100%;
  animation: slNeonFlow 5s linear infinite;
  opacity: .9;
}

@keyframes slNeonFlow {
  0% { background-position: 0% 0; }
  100% { background-position: 220% 0; }
}

.logo {
  flex: 0 0 auto;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: .5px;
  background: linear-gradient(90deg, #DFF6FF, var(--neon-blue) 25%, var(--neon-purple) 55%, var(--neon-pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 8px rgba(155, 77, 232, .4));
  white-space: nowrap;
}

.icon-btn {
  flex: 0 0 auto;
  width: 36px; height: 36px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(155, 77, 232, .22);
  color: #fff;
  font-size: 17px;
  line-height: 1;
  cursor: pointer;
  box-shadow: 0 0 10px rgba(155, 77, 232, .12);
}
.icon-btn:active { transform: scale(.95); }
#backBtn { font-size: 22px; line-height: .8; }

.search-box { flex: 1 1 auto; display: flex; align-items: center; gap: 6px; min-width: 0; }

.search-box input {
  flex: 1 1 auto;
  min-width: 0;
  height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(12, 5, 24, .75);
  color: #fff;
  font-size: 13px;
  outline: none;
}

/* 搜索图标内嵌在搜索框内（无外框） */
.search-box .search-ic {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  margin-right: -38px;
  border-radius: 999px 0 0 999px;
  font-size: 14px;
  color: var(--main2);
  z-index: 2;
  pointer-events: none;
}
.search-box input { padding-left: 40px; }

.search-box button {
  flex: 0 0 auto;
  height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--main), var(--main2));
  color: #fff;
  font-size: 13px;
  cursor: pointer;
}

/* ===================== 源切换条 ===================== */
.src-chips {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid rgba(155, 77, 232, .16);
  background: rgba(18, 7, 34, .5);
}
.src-chips::-webkit-scrollbar { display: none; }

/* ============ 视频源条（可折叠 · 上滑隐藏） ============ */
.src-bar {
  flex: 0 0 auto;
  background: rgba(18, 7, 34, .82);
  border-bottom: 1px solid rgba(34, 211, 238, .18);
  transition: transform 180ms ease;
}
.src-bar.hide { transform: translateY(-102%); display: none; }
.src-bar-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 10px 0 10px;
}
.sb-title { font-size: 10.5px; color: var(--sub); letter-spacing: 1px; }
.sb-fold {
  border: 1px solid var(--line);
  background: rgba(34, 211, 238, .18);
  color: var(--txt);
  font-size: 10.5px;
  padding: 3px 8px;
  border-radius: 8px;
  cursor: pointer;
}
/* 展开下拉抽屉：垂直滑动，固定最大高度（不随分类/源数量拉伸） */
.src-bar.drawer .src-cats,
.src-bar.drawer .src-chips {
  flex-direction: column;
  align-items: stretch;
  max-height: 34vh;
  overflow-y: auto;
  overflow-x: hidden;
}
.src-bar.drawer .src-cats { padding-bottom: 4px; }
.src-bar.drawer .src-cats .chip,
.src-bar.drawer .src-chips .chip { text-align: left; justify-content: flex-start; width: 100%; }

/* 源分类条（第一行） */
.src-cats {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px 0 10px;
  overflow-x: auto;
  scrollbar-width: none;
  background: rgba(18, 7, 34, .5);
}
.src-cats::-webkit-scrollbar { display: none; }

.chip.sm { padding: 5px 10px; font-size: 11.5px; }
.chip .cnt {
  font-style: normal;
  font-size: 9.5px;
  opacity: .8;
  margin-left: 4px;
  border-radius: 6px;
  padding: 0 4px;
  background: rgba(10, 4, 20, .45);
}

/* 源管理：分类小标题 */
.cat-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 12px 0 6px 0;
  padding: 6px 10px;
  border-radius: 10px;
  border: 1px solid rgba(155, 77, 232, .35);
  background: linear-gradient(90deg, rgba(155, 77, 232, .35), rgba(155, 77, 232, .12));
  font-size: 12.5px;
  font-weight: 700;
  color: #EFE3FF;
  cursor: pointer;
}
.cat-head .cnt { font-style: normal; font-size: 10.5px; color: var(--sub); font-weight: 400; }

/* 三框添加源 */
.form { display: flex; flex-direction: column; gap: 8px; }
.frow { display: flex; align-items: center; gap: 8px; }
.flab { flex: 0 0 44px; font-size: 12px; color: var(--sub); }
.inp {
  flex: 1 1 auto;
  min-width: 0;
  height: 40px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: rgba(12, 5, 24, .8);
  color: #fff;
  font-size: 12.5px;
  outline: none;
}
.inp.sel { height: 40px; }
.adv { margin: 6px 0 2px 0; }
.adv summary { font-size: 12px; color: #EFE3FF; padding: 6px 0; cursor: pointer; }

/* 自动加载更多 */
.autoload {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 16px 0 10px 0;
  color: var(--sub);
  font-size: 11.5px;
}
.autoload p { margin: 0; }
.autoload.end { padding: 14px 0 6px 0; font-size: 11px; opacity: .8; }
.spinner.sm { width: 22px; height: 22px; border-width: 2px; }

/* ===================== 主区 ===================== */
.v-main {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 10px 10px calc(28px + env(safe-area-inset-bottom, 0px)) 10px;
  -webkit-overflow-scrolling: touch;
}
.v-main::-webkit-scrollbar { width: 4px; }
.v-main::-webkit-scrollbar-thumb { background: linear-gradient(var(--main2), var(--main)); border-radius: 4px; }

/* 分类与子分类 */
.row-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.row-chips.sub { padding-left: 8px; border-left: 2px solid rgba(155, 77, 232, .35); }
/* 统一水平滑动（不换行）：顶部分类/子分类/仓库全部可左右滑动，无上限 */
.row-scroll {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  margin-bottom: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.row-scroll::-webkit-scrollbar { display: none; }
.row-scroll .chip { flex: 0 0 auto; }
.row-scroll.sticky {
  position: sticky;
  top: -10px;
  z-index: 6;
  padding: 8px 0 6px 0;
  background: linear-gradient(180deg, rgba(18, 7, 34, .97), rgba(18, 7, 34, .82));
  border-bottom: 1px dashed rgba(155, 77, 232, .25);
}

.chip {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(155, 77, 232, .16);
  color: var(--txt);
  font-size: 12.5px;
  cursor: pointer;
  white-space: nowrap;
}
.chip.on {
  background: linear-gradient(90deg, var(--main), var(--main2));
  border-color: rgba(255, 255, 255, .45);
  color: #fff;
  box-shadow: 0 0 10px rgba(110, 199, 255, .5);
}

/* 快捷行 */
.quick-row2 { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 8px; }
.quick-row2::-webkit-scrollbar { display: none; }

/* ===================== 海报墙 ===================== */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
  gap: 8px;
}

.card { cursor: pointer; }

.card .pic {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 3;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid rgba(155, 77, 232, .3);
  background: linear-gradient(160deg, rgba(155, 77, 232, .25), rgba(18, 7, 34, .6));
  display: flex; align-items: center; justify-content: center;
}
/* 老设备不支持 aspect-ratio 时的兜底高度 */
@supports not (aspect-ratio: 2 / 3) {
  .card .pic { height: 150px; }
}

.card .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .pic .ph { font-size: 11px; color: var(--sub); }
.card .pic .ph-bg {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 10px;
  background: radial-gradient(circle at 20% 15%, rgba(168,85,247,.35), rgba(18,7,34,.2) 60%),
              linear-gradient(160deg, rgba(124,58,237,.4), rgba(18,7,34,.75));
}
.card .pic .ph-bg i { font-size: 26px; color: rgba(233,213,255,.75); font-style: normal;
  text-shadow: 0 0 14px rgba(168,85,247,.6); }
.card .pic .ph-bg .ph-tx { font-size: 10.5px; color: rgba(233,213,255,.85); font-weight: 600;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card .pic .rmk {
  position: absolute; right: 4px; bottom: 4px; left: 4px;
  font-style: normal; font-size: 10px; text-align: right; color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .95);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card .pic .score {
  position: absolute; left: 4px; top: 4px;
  font-style: normal; font-size: 10px; color: var(--gold);
  background: rgba(10, 4, 20, .7); border-radius: 6px; padding: 0 4px;
}
.card .nm { margin-top: 5px; font-size: 12px; line-height: 1.3; height: 2.6em; overflow: hidden; }
.card .meta { font-size: 10.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .blurb {
  margin-top: 3px; font-size: 10.5px; color: rgba(238, 227, 255, .55); line-height: 1.35;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  max-height: 2.7em;
}

.sec-title {
  margin: 12px 0 8px 0;
  font-size: 13.5px;
  font-weight: 700;
  color: #EFE3FF;
  border-left: 3px solid var(--main2);
  padding-left: 8px;
}

.more-wrap { margin: 14px 0 6px 0; }

.wide-btn {
  width: 100%;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(34, 211, 238, .22);
  color: var(--txt);
  font-size: 13px;
  cursor: pointer;
}
.wide-btn.ghost { background: rgba(255, 255, 255, .05); }

.row2 { display: flex; gap: 8px; margin-top: 8px; }
.row2 > button { flex: 1 1 0; }

.block-label { font-size: 11.5px; color: var(--sub); margin: 8px 0 6px 0; }
.tip { font-size: 11px; color: var(--sub); line-height: 1.6; margin: 6px 0; }

.empty { padding: 24px 10px; text-align: center; color: var(--sub); font-size: 13px; }

/* 提示条与线路可播标记 */
.warn {
  margin: 8px 0;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid rgba(244, 114, 182, .55);
  background: rgba(244, 114, 182, .12);
  color: #FFC7E8;
  font-size: 11.5px;
  line-height: 1.6;
}
.chip i.ok { font-style: normal; font-size: 10px; color: #4ADE80; margin-left: 4px; }
.chip i.bad { font-style: normal; font-size: 10px; color: var(--gold); margin-left: 4px; }
.empty-msg { font-size: 11.5px; color: var(--sub); padding: 4px 0; }

.loading { padding: 40px 10px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: var(--sub); font-size: 13px; }
.spinner {
  width: 40px; height: 40px; border-radius: 50%;
  border: 3px solid rgba(155, 77, 232, .25);
  border-top-color: var(--gold);
  animation: spin 900ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.mini {
  padding: 7px 11px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(155, 77, 232, .2);
  color: #fff;
  font-size: 11.5px;
  cursor: pointer;
  white-space: nowrap;
}
.mini.on { background: linear-gradient(90deg, var(--main), var(--main2)); border-color: #fff; }
.mini.danger { border-color: rgba(255, 92, 120, .7); background: rgba(255, 59, 92, .18); }

/* ===================== 全局搜索折叠卡 ===================== */
.gs-status { font-size: 11px; color: var(--sub); margin-bottom: 8px; line-height: 1.5; }

.fold-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.fr-src { flex: 0 0 auto; font-size: 11.5px; color: var(--gold); min-width: 64px; }
.fr-meta { flex: 1 1 auto; min-width: 0; font-size: 10.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===================== 详情 ===================== */
.detail .d-top { display: flex; gap: 10px; }
.detail .d-pic {
  flex: 0 0 34%;
  aspect-ratio: 2 / 3;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: rgba(155, 77, 232, .15);
  display: flex; align-items: center; justify-content: center;
}
@supports not (aspect-ratio: 2 / 3) {
  .detail .d-pic { height: 160px; }
}
.detail .d-pic img { width: 100%; height: 100%; object-fit: cover; }
.detail .d-pic .ph { font-size: 11px; color: var(--sub); }
.detail .d-info { flex: 1 1 auto; min-width: 0; }
.detail .d-info h2 { margin: 0 0 6px 0; font-size: 16px; line-height: 1.35; }
.detail .d-meta { margin: 0 0 4px 0; font-size: 11.5px; color: var(--sub); }
.detail .d-src { margin: 0; font-size: 11.5px; color: var(--gold); }
.detail .d-cnt { margin: 0 0 6px 0; font-size: 12px; color: var(--sub); line-height: 1.65; }
.detail .d-cnt.clip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

.eps { display: flex; flex-wrap: wrap; gap: 6px; }
.ep {
  padding: 7px 10px;
  border-radius: 8px;
  border: 1px solid rgba(155, 77, 232, .3);
  background: rgba(155, 77, 232, .14);
  color: var(--txt);
  font-size: 12px;
  cursor: pointer;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ep.on { background: linear-gradient(90deg, var(--main), var(--main2)); border-color: #fff; }
.ep.watched { text-decoration: underline; text-decoration-color: var(--gold); }

/* ===================== 播放器 ===================== */
.pl-wrap { padding-bottom: 10px; }
.p-title { font-size: 13.5px; font-weight: 700; margin-bottom: 8px; color: #EFE3FF; }

.pl-stage {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 12px;
  border: 1px solid var(--line);
  overflow: hidden;
}
@supports not (aspect-ratio: 16 / 9) {
  .pl-stage { height: 210px; }
}
.pl-stage video { width: 100%; height: 100%; display: block; background: #000; }

/* 巳泷 v9.2.2：嗅探不到直链时用网页播放器 iframe 内嵌播放（AdultEmbed 签名播放器页 / Doodstream 等） */
.pl-iframe-fallback {
  position: absolute; inset: 0; width: 100%; height: 100%;
  border: 0; z-index: 6; background: #000;
}

.dm-layer {
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 55%;
  pointer-events: none;
  overflow: hidden;
  z-index: 3;
}
.dm-item {
  position: absolute;
  left: 0;
  white-space: nowrap;
  color: #fff;
  font-size: 1em;
  text-shadow: 0 1px 2px rgba(0, 0, 0, .95), 0 0 4px rgba(0, 0, 0, .6);
  will-change: transform;
  animation-name: dm-move;
  animation-timing-function: linear;
  animation-fill-mode: forwards;
}
@keyframes dm-move {
  from { transform: translateX(var(--dm-from, 320px)); }
  to { transform: translateX(var(--dm-to, -100%)); }
}

.pl-center {
  position: absolute; left: 50%; top: 50%;  transform: translate(-50%, -50%);
  width: 54px; height: 54px;
  border-radius: 50%;
  background: rgba(18, 7, 34, .55);
  border: 1px solid var(--line);
  color: #fff; font-size: 20px;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  z-index: 4;
}

.pl-fs {
  position: absolute; right: 8px; top: 8px;
  width: 34px; height: 34px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(18, 7, 34, .6);
  color: #fff; font-size: 15px;
  cursor: pointer;
  z-index: 5;
}

.pl-bar { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.pl-time { flex: 0 0 auto; font-size: 11px; color: var(--sub); min-width: 88px; }
.pl-seek { flex: 1 1 auto; width: 100%; accent-color: var(--main2); height: 22px; }

.pl-bar2, .dm-send, .pl-nav {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.pl-bar2::-webkit-scrollbar, .dm-send::-webkit-scrollbar, .pl-nav::-webkit-scrollbar { display: none; }

.pl-sel {
  padding: 6px 8px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(12, 5, 24, .8);
  color: #fff;
  font-size: 11.5px;
}

.dm-send input {
  flex: 1 1 auto;
  min-width: 90px;
  padding: 8px 10px;
  border-radius: 9px;
  border: 1px solid var(--line);
  background: rgba(12, 5, 24, .8);
  color: #fff;
  font-size: 12px;
  outline: none;
}

.pl-info { margin-top: 8px; font-size: 10.5px; color: var(--gold); line-height: 1.5; word-break: break-all; }

.dm-panel {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: rgba(18, 7, 34, .92);
  padding: 10px;
  max-height: 46vh;
  overflow-y: auto;
}
.dm-panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: #EFE3FF; margin-bottom: 6px; }
.dm-list { display: flex; flex-direction: column; gap: 4px; max-height: 26vh; overflow-y: auto; }
.dm-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--txt); padding: 3px 0; border-bottom: 1px dashed rgba(155, 77, 232, .16); }
.dm-txt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 播放尺寸 / 分辨率 */
.pl-fit {
  display: flex; align-items: center; gap: 6px;
  margin-top: 8px; overflow-x: auto; scrollbar-width: none;
}
.pl-fit::-webkit-scrollbar { display: none; }
.pl-fit .mini.on { background: linear-gradient(90deg, var(--main), var(--main2)); border-color: #fff; }
.pl-res { font-size: 10.5px; color: var(--sub); margin-top: 6px; }
.pl-res b { color: var(--gold); font-weight: 600; }

/* 全屏时隐藏关闭按钮，暂停/显示控件时才出现 */
body.pl-full #plFs { opacity: 0; pointer-events: none; transition: opacity 160ms ease; }
body.pl-full.ctl-show #plFs { opacity: 1; pointer-events: auto; }

/* ===== 播放器控件显隐（核心规则）=====
   只在全屏状态下生效：全屏 + 播放中 → 进度条、倍速、画质、裁剪、弹幕输入、导航
   等所有参数控件完全隐藏；全屏 + 暂停（或未开始播放）→ 全部显示。
   小窗预览（非全屏）永远常显，不隐藏。显隐由 body.pl-full / pl-playing 驱动。 */
.pl-ctl { transition: opacity 180ms ease; }
body.pl-full.pl-playing .pl-ctl { opacity: 0; pointer-events: none; }

/* 全屏播放：整个播放区铺满屏幕；进度条/倍速/分辨率等控件内嵌为视频上方的悬浮控制条 */
body.pl-full .v-head,
body.pl-full .src-bar { display: none; }
body.pl-full .v-main { padding: 0; }
body.pl-full .p-title,
body.pl-full .sec-title,
body.pl-full .row-chips,
body.pl-full .eps,
body.pl-full .dm-panel { display: none; }
/* 巳泷 v9.2.2：发弹幕输入区 / 播放信息在全屏左侧边栏内保留显示 */

/* 全屏内嵌控制条（巳泷 v9.2.0 重构：进度条固定底部与视频同宽；其余参数全部收进左侧边栏垂直排列，互不重叠） */
body.pl-full .pl-bar {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: min(92vw, 720px);
  z-index: 341; margin: 0; padding: 6px 10px; border-radius: 12px;
  background: rgba(10, 4, 20, .7);
  border: 1px solid rgba(155, 77, 232, .4);
  box-shadow: 0 0 16px rgba(155, 77, 232, .4);
}
/* 巳泷 v9.3.0：左侧边栏垂直滚动容器 —— 全屏时固定左侧，所有参数面板垂直滑动可见
   按钮缩小、可换行、不裁剪不溢出；16:9 横屏等宽，9:16 竖屏等长且只占左侧一部分 */
.pl-leftpanel { display: flex; flex-direction: column; gap: 10px; }
body.pl-full .pl-leftpanel {
  position: fixed;
  left: 10px; top: 4vh;
  bottom: calc(64px + env(safe-area-inset-bottom, 0px));   /* 给底部进度条留位 */
  width: min(230px, 36vw);
  max-width: 230px;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  z-index: 350; margin: 0; padding: 10px 8px; border-radius: 14px;
  background: rgba(12, 5, 24, .88);
  border: 1px solid rgba(155, 77, 232, .35);
  box-shadow: 0 0 16px rgba(155, 77, 232, .3);
}
/* 竖屏（9:16）时左侧边栏更窄，只占左侧一小部分 */
@media (orientation: portrait) {
  body.pl-full .pl-leftpanel {
    width: min(150px, 26vw);
    max-width: 150px;
  }
}
body.pl-full .pl-leftpanel .pl-bar2,
body.pl-full .pl-leftpanel .pl-res,
body.pl-full .pl-leftpanel .pl-nav,
body.pl-full .pl-leftpanel .pl-frames,
body.pl-full .pl-leftpanel .dm-send,
body.pl-full .pl-leftpanel .pl-fit,
body.pl-full .pl-leftpanel .pl-crop {
  position: static; left: auto; right: auto; top: auto; bottom: auto;
  width: auto; z-index: auto; margin: 0; padding: 12px 10px; border-radius: 12px;
  background: rgba(20, 10, 40, .5);
  border: 1px solid rgba(155, 77, 232, .25);
  box-shadow: none;
  flex: 0 0 auto;
  overflow-x: hidden;
  min-height: 0;
}
/* 巳泷 v9.3.0：左侧边栏内按钮缩小、可换行、防溢出，确保不裁剪不重叠 */
body.pl-full .pl-leftpanel .mini {
  padding: 6px 8px;
  font-size: 10px;
  line-height: 1.3;
  white-space: normal;
  overflow-wrap: break-word;
  word-break: break-word;
  flex: 0 0 auto;
  max-width: 100%;
  text-align: center;
}
body.pl-full .pl-leftpanel .pl-bar2,
body.pl-full .pl-leftpanel .pl-fit,
body.pl-full .pl-leftpanel .pl-crop,
body.pl-full .pl-leftpanel .pl-nav,
body.pl-full .pl-leftpanel .pl-frames {
  flex-wrap: wrap;
  gap: 6px;
}
/* 巳泷 v9.3.0：弹幕输入区在窄边栏内可换行，杜绝按钮文字/输入框溢出框外 */
body.pl-full .pl-leftpanel .dm-send {
  flex-wrap: wrap;
  gap: 6px;
}
body.pl-full .pl-leftpanel .dm-send input {
  flex: 1 1 100%;
  min-width: 0;
  padding: 9px 10px;
  font-size: 12px;
}
/* 巳泷 v9.3.0：音量/明暗/自动快进面板独立成块，行高加高不被压缩 */
body.pl-full .pl-tune {
  position: static; left: auto; right: auto; top: auto; bottom: auto;
  width: auto; max-height: none; transform: none;
  margin: 0; padding: 12px 10px;
  flex-direction: column; gap: 12px;
  background: rgba(20, 10, 40, .5);
  border: 1px solid rgba(155, 77, 232, .35);
  border-radius: 12px;
  overflow-x: hidden;
  flex: 0 0 auto;
}
body.pl-full .pl-leftpanel .tune-row {
  padding: 4px 0;
}
body.pl-full .pl-leftpanel .tune-row input[type=range] {
  height: 26px;
  min-height: 26px;
}
body.pl-full .pl-leftpanel .tune-tip {
  font-size: 10px;
  line-height: 1.6;
  padding-top: 4px;
}
/* 帧级微调（点「帧 ▾」展开）*/
.pl-frames { display: none; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
body.pl-frames-on .pl-frames { display: flex; }
.frame-tip { font-size: 10.5px; color: var(--sub); }
/* 全屏暂停面板：音量 + 明暗 + 自动快进（仅全屏暂停时显示）*/
.pl-tune { display: none; }
body:not(.pl-full) .pl-tune { display: none; }
body.pl-full.ctl-show .pl-tune { display: flex; }
/* 巳泷 v9.1.0：全屏锁定提示层（音量/亮度手势反馈 + 长按锁定提示） */
.pl-gesture-tip {
  position: fixed; left: 50%; top: 46%; transform: translate(-50%, -50%);
  z-index: 3999; pointer-events: none; color: rgba(255,255,255,.96);
  background: rgba(0,0,0,.72); padding: 12px 22px; border-radius: 12px;
  font-size: 15px; font-weight: 600; letter-spacing: 1px;
  display: none; text-shadow: 0 1px 4px rgba(0,0,0,.6);
  backdrop-filter: blur(4px);
}
.pl-gesture-tip.show { display: block; animation: gsUp 160ms ease; }
body.pl-locked { cursor: default; }
body.pl-locked #plCtl, body.pl-locked .pl-panel { visibility: hidden !important; }
.tune-row { display: flex; align-items: center; gap: 8px; }
.tune-lab { flex: 0 0 auto; font-size: 11.5px; color: var(--sub); min-width: 54px; }
.tune-row input[type=range] { flex: 1 1 auto; min-width: 80px; accent-color: var(--main2); height: 20px; }
.tune-val { flex: 0 0 auto; min-width: 42px; font-size: 11.5px; color: var(--gold); text-align: right; }
.tune-num {
  width: 74px; padding: 5px 6px; border-radius: 8px;
  border: 1px solid var(--line); background: rgba(12, 5, 24, .85);
  color: #fff; font-size: 12.5px; outline: none;
}
.tune-tip { font-size: 10px; color: var(--sub); line-height: 1.45; }
/* 巳泷 v9.2.0：尺寸/裁剪等参数条在全屏时也收进左侧边栏（不再隐藏、不占底部） */
body.pl-full .pl-fit,
body.pl-full .pl-crop { display: flex; }

body.pl-full .pl-stage {
  position: fixed;
  inset: 0;
  width: 100%; height: 100%;
  aspect-ratio: auto;
  border-radius: 0;
  border: none;
  z-index: 300;
  background: #000;
}
body.pl-full .pl-stage video { height: 100%; }

/* ===================== 源管理 ===================== */
.src-list { display: flex; flex-direction: column; gap: 8px; }
.src-row {
  display: flex; align-items: center; gap: 8px;
  padding: 9px 10px;
  border-radius: 12px;
  border: 1px solid rgba(34, 211, 238, .26);
  background: rgba(155, 77, 232, .1);
}
.src-row.on { border-color: var(--main2); box-shadow: 0 0 12px rgba(110, 199, 255, .4); }
.src-nm { flex: 1 1 auto; min-width: 0; font-size: 12.5px; }
.src-nm .tiny { font-style: normal; font-size: 10px; color: var(--gold); margin-left: 6px; }
.src-nm .tiny.ok { color: #4ADE80; }
.src-nm .tiny.bad { color: #FF7A93; }
.src-nm .tiny2 { font-size: 10px; color: var(--sub); word-break: break-all; }

.ta {
  width: 100%;
  min-height: 92px;
  padding: 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: rgba(12, 5, 24, .8);
  color: #fff;
  font-size: 12px;
  line-height: 1.5;
  outline: none;
  resize: vertical;
  margin-bottom: 6px;
}
.mini-ta { min-height: 40px; }

/* ===================== 设置 ===================== */
.theme-rows { display: flex; flex-direction: column; gap: 10px; margin: 10px 0 6px 0; }
.theme-rows label { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
.theme-rows input[type="color"] { width: 64px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: transparent; padding: 0; }
.file { display: none; }
.chk { display: flex; align-items: center; gap: 7px; font-size: 12.5px; cursor: pointer; }
.chk.big { margin: 6px 0; }
.chk input { width: 17px; height: 17px; accent-color: var(--main); }
input[type="range"] { width: 100%; accent-color: var(--main2); }

/* ===================== 轻提示 ===================== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(28px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  z-index: 500;
  max-width: 88vw;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--main2);
  background: rgba(18, 7, 34, .95);
  color: #fff;
  font-size: 12.5px;
  text-align: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 180ms ease, transform 180ms ease;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 420px) {
  .logo { font-size: 14px; }
  .search-box button { padding: 0 10px; font-size: 12px; }
  .grid { gap: 6px; }
  .card .nm { font-size: 11.5px; }
}

/* ===================== 四级层级：仓库 / 面包屑 / 源列表 ===================== */
.src-crumb {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 0 10px;
  overflow-x: auto;
  scrollbar-width: none;
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
}
.src-crumb::-webkit-scrollbar { display: none; }
.src-crumb .crumb {
  flex: 0 0 auto;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: rgba(34, 211, 238, .22);
  color: #EFE3FF;
  font-size: 11px;
  cursor: pointer;
}
.src-crumb .crumb-txt { flex: 0 0 auto; color: var(--sub); overflow: hidden; text-overflow: ellipsis; }
.chip.wh-chip { border-color: rgba(155, 77, 232, .5); }
.chip.wh-chip.repo { border-style: dashed; }
.chip .cnt.ok { color: #4ADE80; background: rgba(16, 120, 60, .35); }
.chip .cnt.bad { color: #FF7A93; background: rgba(200, 40, 80, .3); }

/* 仓库卡片（主页） */
.wh-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 8px;
}
.wh-card {
  position: relative;
  padding: 14px 8px 10px 8px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: linear-gradient(160deg, rgba(155, 77, 232, .28), rgba(18, 7, 34, .55));
  text-align: center;
  cursor: pointer;
  overflow: hidden;
}
.wh-card.repo { border-style: dashed; border-color: rgba(244, 114, 182, .55); }
.wh-card .wh-ic { font-size: 18px; display: block; margin-bottom: 6px; }
.wh-card .wh-nm { font-size: 12px; font-weight: 700; color: #EFE3FF; word-break: break-all; line-height: 1.35; }
.wh-card .wh-cnt { font-size: 10px; color: var(--sub); margin-top: 3px; display: block; }
.wh-card .wh-tag {
  position: absolute; right: 5px; top: 5px;
  font-size: 9px; padding: 1px 5px; border-radius: 6px;
  background: rgba(244, 114, 182, .25); color: #FFC7E8;
}
.wh-card .wh-tag.dead { background: rgba(255, 80, 110, .3); color: #FF9FAF; }

/* 仓库内：源列表 */
.src-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 12px;
  border: 1px solid rgba(34, 211, 238, .26);
  background: rgba(155, 77, 232, .1);
}
.src-card.on { border-color: var(--main2); box-shadow: 0 0 12px rgba(110, 199, 255, .4); }
.src-card .sc-main { flex: 1 1 auto; min-width: 0; }
.src-card .sc-nm { font-size: 13px; font-weight: 700; color: #EFE3FF; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-card .sc-api { font-size: 9.5px; color: var(--sub); word-break: break-all; margin-top: 3px; max-height: 2.4em; overflow: hidden; }
.src-card .sc-btns { flex: 0 0 auto; display: flex; flex-direction: column; gap: 5px; }
.src-card .sc-btns .mini { font-size: 10.5px; padding: 5px 9px; }
.src-card .sc-st {
  flex: 0 0 auto; font-size: 10px; padding: 3px 8px; border-radius: 8px;
  border: 1px solid var(--line);
}
.src-card .sc-st.ok { color: #4ADE80; border-color: rgba(74, 222, 128, .5); }
.src-card .sc-st.bad { color: #FF7A93; border-color: rgba(255, 122, 147, .5); }
.src-card .sc-st.net { color: #F472B6; border-color: rgba(244, 114, 182, .5); }

/* 失效区：两类分组 */
.dead-grp {
  margin: 10px 0 6px 0;
  padding: 7px 10px;
  border-radius: 10px;
  border: 1px solid rgba(255, 80, 110, .35);
  background: rgba(255, 60, 100, .12);
  font-size: 12px;
  font-weight: 700;
  color: #FF9FAF;
  display: flex;
  align-items: center;
  gap: 8px;
}
.dead-grp.net { border-color: rgba(244, 114, 182, .45); background: rgba(244, 114, 182, .12); color: #FFC7E8; }
.dead-grp .cnt { font-weight: 400; font-size: 10.5px; margin-left: auto; }

/* ===================== 全屏：播放中隐藏关闭按钮（暂停时显示） ===================== */
body.pl-full.pl-playing #plFs,
body.pl-full.pl-playing .fs-opts { opacity: 0 !important; pointer-events: none !important; }

/* ===================== 全屏方向选择（二级选项） ===================== */
.fs-opts {
  position: fixed;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  z-index: 320;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 62vw;
  max-width: 300px;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--main2);
  background: rgba(18, 7, 34, .96);
  box-shadow: 0 0 24px rgba(110, 199, 255, .5);
}
.fs-opts .fs-tip { font-size: 12px; color: var(--sub); text-align: center; }
.fs-opts .mini { padding: 11px 12px; font-size: 13.5px; }

/* ===================== 画面裁剪 ===================== */
.crop-wrap {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
}
.crop-wrap video {
  position: absolute;
  left: 0; top: 0;
  width: 100%; height: 100%;
  display: block;
  background: #000;
  will-change: transform;
}
.pl-crop {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  overflow-x: auto;
  scrollbar-width: none;
}
.pl-crop::-webkit-scrollbar { display: none; }
.pl-crop .mini.on { background: linear-gradient(90deg, var(--main), var(--main2)); border-color: #fff; }

/* ===================== 全局搜索结果源选择浮层（巳泷 v9.0.8：改为屏幕居中弹窗，不再贴底偏下） ===================== */
.gs-sheet {
  position: fixed;
  left: 50%; right: auto; top: 50%;
  transform: translate(-50%, -50%);
  width: min(430px, calc(100vw - 28px));
  z-index: 380;
  max-height: 74vh;
  overflow-y: auto;
  padding: 14px 14px 16px;
  border-radius: 18px;
  border: 1px solid var(--main2);
  background: rgba(18, 7, 34, .97);
  box-shadow: 0 18px 60px rgba(0,0,0,.6), 0 0 30px rgba(244, 114, 182, .45);
  animation: gsUp 220ms ease;
}
@keyframes gsUp { from { transform: translate(-50%, -44%); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
.gs-sheet .gs-sh-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13.5px; font-weight: 700; color: #EFE3FF; margin-bottom: 10px;
}
.gs-sheet .gs-sh-pic { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
.gs-sheet .gs-sh-pic img { width: 54px; height: 78px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
.gs-sheet .gs-sh-pic .gs-sh-meta { font-size: 10.5px; color: var(--sub); line-height: 1.5; }
.gs-sheet .mini { padding: 8px 10px; }

/* 内置仓库「选源」浮层 */
.repo-sheet-mask {
  position: fixed; inset: 0; z-index: 370;
  background: rgba(5, 2, 12, .55);
}
.repo-sheet {
  position: fixed;
  left: 12px; right: 12px; bottom: 12px;
  z-index: 380;
  max-height: 66vh;
  overflow-y: auto;
  padding: 12px 12px calc(16px + env(safe-area-inset-bottom, 0px)) 12px;
  border-radius: 16px;
  border: 1px solid var(--main2);
  background: rgba(18, 7, 34, .97);
  box-shadow: 0 -4px 28px rgba(244, 114, 182, .45);
  animation: gsUp 220ms ease;
}
.repo-sheet-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13.5px; font-weight: 700; color: #EFE3FF; margin-bottom: 10px;
}
.repo-sheet .mini { padding: 8px 10px; }

/* 搜索筛选开关 */
.chip.filter-on { background: linear-gradient(90deg, var(--main), var(--main2)); border-color: #fff; }
.gs-filter-box { border: 1px dashed rgba(155, 77, 232, .3); border-radius: 12px; padding: 8px; margin-bottom: 8px; background: rgba(155, 77, 232, .06); }

/* 长按自定义档位 / 自动快进自定义：数字输入弹层 */
.pl-cfg-mask {

/* ---- 顶栏：毛玻璃 + 更紧凑的搜索框 ---- */
.v-head {
  padding: calc(9px + env(safe-area-inset-top, 0px)) 12px 9px 12px;

}
.logo { font-size: 17px; letter-spacing: .8px; }
.icon-btn {
  width: 34px; height: 34px;
  border-radius: 999px;
  background: rgba(155, 77, 232, .14);
  border-color: rgba(155, 77, 232, .38);
}
.icon-btn:hover { background: rgba(155, 77, 232, .3); }
.search-box input {
  height: 38px;
  background: rgba(255, 255, 255, .055);
  border: 1px solid rgba(155, 77, 232, .42);

  transition: border-color .2s ease, background .2s ease;
}

/* ---- 分类胶囊 chips ---- */
.chip {
  padding: 7px 14px;

  border: 1px solid rgba(155, 77, 232, .32);
  background: rgba(255, 255, 255, .045);
  color: rgba(242, 237, 255, .88);
  font-size: 12.5px;
  letter-spacing: .3px;
  transition: background .18s ease, border-color .18s ease, transform .12s ease;
}
.chip:hover { border-color: rgba(34, 211, 238, .55); background: rgba(34, 211, 238, .08); }
.chip:active { transform: scale(.96); }
.chip.on {
  background: linear-gradient(120deg, var(--main) 0%, #6D28D9 55%, var(--main2) 100%);
  border-color: rgba(255, 255, 255, .5);
  box-shadow: 0 4px 16px rgba(124, 58, 237, .38);
  color: #fff;
  font-weight: 600;
}
.chip.sm { padding: 5px 11px; font-size: 11.5px; }
.src-cats, .src-chips { padding-top: 8px; }
.src-bar {
  background: rgba(13, 6, 28, .72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(155, 77, 232, .18);

/* ---- 海报卡片网格 ---- */
.grid { gap: 12px; align-items: start; }
.card {
  cursor: pointer;
  border-radius: 14px;
  padding: 0;
  transition: transform .22s ease;
}
.card:hover { transform: translateY(-3px); }
.card .pic {
  border-radius: 13px;
  border: 1px solid rgba(155, 77, 232, .34);
  background: linear-gradient(160deg, rgba(155, 77, 232, .3), rgba(18, 7, 34, .72));
  box-shadow: 0 6px 18px rgba(4, 1, 12, .55);
  transition: border-color .22s ease, box-shadow .22s ease;
}
.card:hover .pic {
  border-color: rgba(34, 211, 238, .72);
  box-shadow: 0 10px 26px rgba(124, 58, 237, .4);
}
.card .pic img { transition: transform .35s ease; }
.card:hover .pic img { transform: scale(1.045); }
.card .pic::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
  background: linear-gradient(180deg, transparent, rgba(6, 2, 14, .82));
  pointer-events: none;
  z-index: 0;
}
.card .pic .score, .card .pic .rmk, .card .pic .srcbdg { z-index: 2; }
.card .pic .score {
  font-size: 10.5px; font-weight: 700; color: #FFD98A;
  background: rgba(8, 3, 18, .68);
  border: 1px solid rgba(244, 114, 182, .35);
  border-radius: 7px;
  padding: 1px 5px;
}
.card .pic .rmk { font-size: 10px; bottom: 5px; }
.card .pic .srcbdg {
  position: absolute; top: 5px; right: 5px;
  max-width: 72%;
  font-style: normal; font-size: 9.5px; line-height: 1.4;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(10, 4, 20, .74);
  border: 1px solid rgba(155, 77, 232, .45);
  color: #C4B5FD;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

.src-dock {

.dock-src .ds-dot { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: rgba(180, 170, 210, .55); }
.dock-src .ds-dot.ok { background: #4ADE80; box-shadow: 0 0 6px rgba(74, 222, 128, .8); }
.dock-src .ds-dot.bad { background: #FF7A93; }
.dock-src .ds-nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dock-src .ds-ms { flex: 0 0 auto; font-size: 9.5px; color: rgba(212, 200, 245, .55); }
.dock-src .ds-cat { flex: 0 0 auto; font-size: 9px; color: rgba(196, 181, 253, .7); }
.dock-actions { display: flex; gap: 6px; flex: 0 0 auto; }
.dock-actions .mini { flex: 1 1 0; text-align: center; padding: 7px 4px; font-size: 11px; }
.dock-actions .mini:first-child { background: rgba(34, 211, 238, .2); border-color: rgba(34, 211, 238, .45); }

  .v-app.no-dock .v-main { padding-bottom: calc(28px + env(safe-area-inset-bottom, 0px)); }
  .v-app.no-dock .src-dock { display: none; }
  body.pl-full .src-dock { display: none; }
}

body.pl-full .src-dock { display: none; }

<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    /* v8.1.0 卡死修复：classList.remove/add 即使无实际变化也会产生 class 变更记录，
       本函数由 MutationObserver 回调，无脑 remove+add 会造成无限观察者风暴（主线程卡死）。
       改为「先检查、确有差异才写」。 */
    var d=document.documentElement;
    if(d){
      var dNeed=!d.classList.contains('sl-night')||d.classList.contains('sl-day')||d.classList.contains('sl-dusk')||d.classList.contains('day');
      if(dNeed){
        d.classList.remove('sl-day','sl-dusk','day');
        d.classList.add('sl-night');
      }
    }
    var b=document.body;
    if(b){
      var bNeed=!b.classList.contains('mode-night')||!b.classList.contains('mode-adult')||b.classList.contains('mode-daily')||b.classList.contains('mode-dusk')||b.classList.contains('day');
      if(bNeed){
        b.classList.remove('mode-daily','mode-dusk','day');
        b.classList.add('mode-night','mode-adult');
      }
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

  /* 接口地址归一化（用于去重）：去掉查询串、结尾斜杠、大小写差异 */
  function norm(u) {
    return String(u || '').trim().split('?')[0].replace(/\/+$/, '').toLowerCase();
  }

  function validApi(u) {
    if (!/^https?:\/\//i.test(u)) return '';
    if (/\.(jar|js|py)(\?|;|$)/i.test(u)) return '';    // 需要爬虫文件的源，网页版不可用

  function chooseCat(given, name) {
    var nm = String(name || '');
    if (ADULT_RE.test(nm)) return '成人（18+）';        // 明显成人源只进成人分类
    var cats = w.VIDEO_CATS || [];
    if (given && cats.indexOf(given) >= 0 && given !== (w.VIDEO_DEAD_CAT || '失效区')) return given;
    if (ANIME_RE.test(nm)) return '动漫';
    if (EDU_RE.test(nm)) return '教育';
    if (DRAMA_RE.test(nm)) return '短剧';
    if (ZY_RE.test(nm)) return '综艺';

  /* 合并进内置源数组（就地修改，app.js 启动时读取的就是合并后的数组） */
  function applyList(list, from) {
    var arr = w.VIDEO_SOURCES = w.VIDEO_SOURCES || [];
    var seen = {};
    for (var i = 0; i < arr.length; i++) {
      var a0 = arr[i] && (arr[i].a || arr[i].api);
      if (a0) seen[norm(a0)] = 1;
    }
    var added = 0;
    for (var k = 0; k < list.length && added < MAX_REMOTE; k++) {
      var it = list[k];
      if (!it) continue;
      var api = validApi(it.a || it.api);
      if (!api) continue;
      var key = norm(api);
      if (!key || seen[key]) continue;
      seen[key] = 1;
      var name = String(it.n || it.name || api.replace(/^https?:\/\//, '').split('/')[0]).trim();
      var cat = chooseCat(it.c || it.cat, name);
      var obj = { n: name, a: api, c: cat, v: 1 };
      if (from) obj.src = from;
      arr.push(obj);
      added++;

    return added;

  /* 解析任意清单文本 → { list: [{n,a,c}], multi: [{name,url}] } */
  function parseText(text, depth) {
    var out = { list: [], multi: [] };
    var j = null;
    try { j = JSON.parse(String(text || '')); } catch (e) { j = null; }

    if (j) {
      if (Array.isArray(j)) {
        for (var i = 0; i < j.length; i++) {
          var it = j[i];
          if (!it) continue;
          if (typeof it === 'string') { out.list.push({ a: it }); continue; }
          if (it.n && it.a) { out.list.push(it); continue; }
          if (it.name && it.api) { out.list.push(it); continue; }
          if (Array.isArray(it.sites)) {
            for (var s = 0; s < it.sites.length; s++) out.list.push(it.sites[s]);
          }
        }
      } else if (Array.isArray(j.sites)) {
        out.list = j.sites;
      } else if (Array.isArray(j.sources)) {
        for (var q = 0; q < j.sources.length; q++) out.list.push(j.sources[q]);
      } else if (Array.isArray(j.urls)) {
        for (var m = 0; m < j.urls.length; m++) {
          if (j.urls[m] && j.urls[m].url) out.multi.push({ name: j.urls[m].name || '', api: j.urls[m].url });
        }
      } else if (j.api || (j.n && j.a)) {
        out.list.push(j);
      }
    }

    // 解析出的 site 对象统一转成 {n,a,c}
    var list = [];
    for (var z = 0; z < out.list.length; z++) {
      var so = out.list[z];
      if (!so) continue;
      var api = so.a || so.api;
      if (!api) continue;
      if (so.type !== undefined && so.type !== null && String(so.type) !== '' && Number(so.type) !== 1) continue;
      list.push({ n: so.n || so.name || so.key || '', a: api, c: so.c || so.cat || '' });
    }
    out.list = list;

    if (!j && w.parseSourceJson) {
      var r = w.parseSourceJson(text);
      if (r && r.ok && r.list) {
        for (var p = 0; p < r.list.length; p++) out.list.push({ n: r.list[p].name, a: r.list[p].api, c: '' });
      }

    return new Promise(function (resolve, reject) {
      var xhr = null;
      try { xhr = new XMLHttpRequest(); } catch (e) { reject(e); return; }

        xhr.open('GET', url, true);

      var r = parseText(txt, depth || 0);
      if (r.list && r.list.length) return { url: url, list: r.list };
      if (r.multi && r.multi.length && (depth || 0) < 1) {
        return loadOne(r.multi[0].api, (depth || 0) + 1);
      }

    });
  }

  /* 依次尝试多个地址，直到拿到有效清单 */
  function loadAny(urls) {

    var firstErr = null;
    function step() {
      if (!queue.length) return Promise.reject(firstErr || new Error('empty'));
      var u = queue.shift();
      return loadOne(u).then(function (r) {
        if (r.list && r.list.length) return r;
        return step();
      }).catch(function (e) {
        firstErr = firstErr || e;
        return step();
      });
    }
    return step();
  }

  function getUserUrl() {
    var u = read(LS.url, '');
    return (typeof u === 'string' && /^https?:\/\//i.test(u)) ? u : '';
  }

  function defaultUrls() {
    var list = [];
    var d = w.VIDEO_REMOTE_MANIFESTS || [];
    for (var i = 0; i < d.length; i++) if (/^https?:\/\//i.test(d[i])) list.push(d[i]);
    return list;
  }

  function urlsToTry() {
    var out = [];
    var u = getUserUrl();
    if (u) out.push(u);
    var d = defaultUrls();
    for (var i = 0; i < d.length; i++) if (out.indexOf(d[i]) < 0) out.push(d[i]);
    return out;
  }

  function saveCache(at, url, list) {
    write(LS.cache, { at: at, url: url, items: list });
  }

  function applyCache() {
    var c = read(LS.cache, null);
    if (c && c.items && c.items.length) return applyList(c.items, 'cache');
    return 0;
  }

  function lastOk() { return Number(read(LS.lastOk, 0)) || 0; }
  function lastCheck() { return Number(read(LS.lastCheck, 0)) || 0; }

  function statusText() {
    var at = lastOk();
    var c = read(LS.cache, null);
    var n = c && c.items ? c.items.length : 0;
    if (!at) return '远程清单：未更新（正在使用本地清单）';
    return '远程清单：' + n + ' 个候选 · 上次更新 ' + new Date(at).toLocaleString();
  }

  function updateNow(manual) {
    var urls = urlsToTry();
    write(LS.lastCheck, Date.now());
    if (!urls.length) {
      if (manual && w.vToast) w.vToast('没有可用的远程清单地址');
      return Promise.resolve(0);
    }
    return loadAny(urls).then(function (r) {
      var added = applyList(r.list, 'remote');
      saveCache(Date.now(), r.url, r.list.slice(0, MAX_REMOTE));
      write(LS.lastOk, Date.now());
      try { if (w.vSourcesUpdated) w.vSourcesUpdated(); } catch (e) {}
      if (manual && w.vToast) w.vToast('远程清单已更新：新增 ' + added + ' 个源（' + r.url.split('/').pop() + '）', 3200);
      return added;
    }).catch(function () {
      if (manual && w.vToast) w.vToast('远程清单暂时无法访问，已回退本地清单', 3000);
      return 0;
    });
  }

  function checkDaily() {
    if (Date.now() - lastCheck() < GAP) return;
    updateNow(false);
  }

  function removeRemote() {
    var arr = w.VIDEO_SOURCES || [];
    for (var i = arr.length - 1; i >= 0; i--) {
      if (arr[i] && arr[i].src) arr.splice(i, 1);
    }
    try { localStorage.removeItem(LS.cache); localStorage.removeItem(LS.lastOk); } catch (e) {}
    try { if (w.vSourcesUpdated) w.vSourcesUpdated(); } catch (e) {}
  }

  /* ---------------- 启动即合并：本地清单 + 上次远程缓存（同步，赶在 app.js boot 前） ---------------- */
  try {
    var man = w.VIDEO_SOURCE_MANIFEST;
    if (man && man.items && man.items.length) applyList(man.items, 'local');
  } catch (e) {}
  try { applyCache(); } catch (e) {}

  w.SRCUPD = {
    getUrl: getUserUrl,
    setUrl: function (u) {
      u = String(u || '').trim();
      if (u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
      if (u) write(LS.url, u); else { try { localStorage.removeItem(LS.url); } catch (e) {} }
      return u;
    },
    updateNow: function () { return updateNow(true); },
    checkDaily: checkDaily,
    status: statusText,
    meta: function () { return { at: lastOk(), check: lastCheck(), cache: read(LS.cache, null) }; },
    defaults: defaultUrls,
    clear: removeRemote
  };

})(window);

/* ==========================================================================
   影视乐园 · xpath.js（Kazumi 式 XPath 规则引擎，已吞并 Kazumi 源规则体系）
   --------------------------------------------------------------------------
   规则格式（与 Kazumi plugins 完全一致）：
   {
     name:  '源名',  type: 'anime',
     baseURL: 'https://dmbus.cc/',
     searchURL: 'https://dmbus.cc/s----------.html?wd=@keyword',   // @keyword 占位符
     searchList:   '//div/div[3]/ul/li',    // 搜索结果列表节点
     searchName:   '//div/a[2]',            // 条目名称（在 searchList 节点内求值）
     searchResult: '//div/a[2]',            // 条目链接（href，在 searchList 节点内求值）
     chapterRoads: '//div/div[4]/div/ul',   // 播放线路容器（在详情页 document 求值）
     chapterResult: '//li/a',               // 单集链接（在 road 节点内求值）
     muliSources: true, usePost: false, useWebview: true, userAgent: ''
   }
   · 与 Kazumi 逻辑一致：searchName/searchResult 在 searchList 节点上下文求值，
     chapterResult 在 chapterRoads 节点上下文求值，链接取 href 并基于 baseURL 归一化。
   · 抓取：Android 端（file:// + allowUniversalAccess）直连 fetch；
     PC 测试版走本地代理 /proxy?url=…（由 server.ps1 提供），统一环境差异。
   ========================================================================== */

(function (w) {
  'use strict';

  var XP = {};

  var BROWSER_UA = 'Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Mobile Safari/537.36';

  /* ---------------------------------------------------------------- 抓取 */
  // 抓一段 HTML 文本（带 UA；失败返回空串，由调用方判断）
  XP.fetchHtml = function (url, ms) {
    var timeout = ms || 15000;
    return new Promise(function (resolve) {
      var done = false;
      var ctrl = null;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(''); } }, timeout);
      var opts = {
        method: 'GET', cache: 'no-store',
        headers: { 'User-Agent': BROWSER_UA, 'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' }
      };
      try {
        if (typeof AbortController !== 'undefined') { ctrl = new AbortController(); opts.signal = ctrl.signal; }
      } catch (e) {}

      // 代理检测：页面自身跑在 http(s) 上，且目标跨域 → 走本地代理转发（PC 测试版）
      var viaProxy = /^https?:/i.test(location.protocol) && !sameHost(url);
      var target = viaProxy ? '/proxy?url=' + encodeURIComponent(url) : url;

      fetch(target, opts).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      }).then(function (txt) {
        if (!done) { done = true; clearTimeout(timer); resolve(String(txt || '')); }
      }).catch(function (e) {
        if (!done) { done = true; clearTimeout(timer); resolve(''); }
      });
    });
  };

  function sameHost(u) {
    try {
      var a = new URL(String(u || ''), location.href);
      return a.host === location.host;
    } catch (e) { return false; }
  }
  w.xpSameHost = sameHost;

  /* ------------------------------------------------------ 链接归一化 */
  // 基于 baseURL 把相对/绝对地址拼成完整 URL（与 Kazumi normalizeEpisodeUrl 一致）
  XP.normalize = function (base, src) {
    try {
      var s = String(src || '').trim();
      if (!s) return '';
      if (/^https?:/i.test(s)) return s;
      if (/^\/\//i.test(s)) return (base.indexOf('https:') === 0 ? 'https:' : 'http:') + s;
      var b = String(base || '').trim();
      if (!/^https?:/i.test(b)) b = 'https://' + b;
      if (s.charAt(0) === '/') {
        var m = b.match(/^(https?:\/\/[^/]+)/i);
        return (m ? m[1] : b) + s;
      }
      if (!/\/$/.test(b) && b.indexOf('/') >= 0) { b = b.replace(/\/[^/]*$/, '/'); }
      return b + s;
    } catch (e) { return ''; }

  /* ------------------------------------------------------ XPath 求值 */
  // 解析 HTML 为 document，返回根元素；失败返回 null

  // 在 context（Element 或 Document）上求值 XPath，返回节点数组

  XP.nodes = function (context, expr) {

      for (var i = 0; i < r.snapshotLength; i++) list.push(r.snapshotItem(i));

  };

  function firstNode(context, expr) {
    var n = XP.nodes(context, expr);
    return n.length ? n[0] : null;
  }

  function nodeText(node) {
    if (!node) return '';
    try { return (node.textContent || '').trim(); } catch (e) { return ''; }
  }

  function nodeHref(node) {
    if (!node) return '';
    try { return String(node.getAttribute('href') || '').trim(); } catch (e) { return ''; }
  }

  /* ------------------------------------------------------ 搜索 */
  // 返回 [{name, src}] ；失败返回 []
  XP.search = function (rule, keyword) {
    if (!rule || !rule.searchURL || !rule.searchList) return Promise.resolve([]);
    var q = String(keyword || '');
    if (!q) return Promise.resolve([]);
    var url = String(rule.searchURL).replace(/@keyword/g, encodeURIComponent(q));
    return XP.fetchHtml(url).then(function (html) {
      if (!html) return [];
      var doc = toDoc(html);
      if (!doc) return [];
      var root = doc.documentElement;
      var listNodes = XP.nodes(root, rule.searchList);
      var out = [];
      for (var i = 0; i < listNodes.length; i++) {
        var node = listNodes[i];
        try {
          var nameEl = rule.searchName ? firstNode(node, rule.searchName) : null;
          var srcEl = rule.searchResult ? firstNode(node, rule.searchResult) : null;
          var name = nodeText(nameEl);
          var src = nodeHref(srcEl);
          if (!name && srcEl) name = nodeText(srcEl);
          if (!name || !src) continue;
          out.push({ name: name, src: XP.normalize(rule.baseURL, src) });
        } catch (e) {}
      }
      return out;
    });
  };

  /* ------------------------------------------------------ 详情（线路+集数） */
  // 返回 [{from, eps:[{name,url}]}] ；失败返回 []
  XP.chapters = function (rule, detailUrl) {
    if (!rule || !detailUrl) return Promise.resolve([]);
    return XP.fetchHtml(detailUrl).then(function (html) {
      if (!html) return [];
      var doc = toDoc(html);
      if (!doc) return [];
      var root = doc.documentElement;
      if (!rule.chapterRoads || !rule.chapterResult) return [];
      var roadNodes = XP.nodes(root, rule.chapterRoads);
      var out = [];
      for (var r = 0; r < roadNodes.length; r++) {
        var road = roadNodes[r];
        try {
          var eps = [];
          var epNodes = XP.nodes(road, rule.chapterResult);
          for (var k = 0; k < epNodes.length; k++) {
            try {
              var src = nodeHref(epNodes[k]);
              if (!src) continue;
              var nm = String(epNodes[k].textContent || '').replace(/\s+/g, '');
              if (!nm) nm = '第' + (k + 1) + '集';
              eps.push({ name: nm, url: XP.normalize(rule.baseURL, src) });
            } catch (e) {}
          }
          if (!eps.length) continue;
          out.push({ from: '播放线路' + (out.length + 1), eps: eps });
        } catch (e) {}
      }
      return out;
    });
  };

  /* ------------------------------------------------------ 嗅探页内视频地址
     有些源的集数页是播放器页（非直连 m3u8），需在页面 HTML/脚本里找真实视频地址。
     返回首个匹配的 m3u8/mp4 直连地址；找不到返回 ''。 */
  XP.sniffInHtml = function (html, baseURL) {
    try {
      var h = String(html || '');
      if (!h) return '';

      if (m) return m[0];
      m = h.match(/(?:src|url|link|playurl)\s*[:=]\s*["']([^"']+\.m3u8[^"']*)["']/i);
      if (m) return XP.normalize(baseURL, m[1]);
      m = h.match(/https?[^"'\s<>]+\.mp4[^"'\s<>]*/i);
      if (m) return m[0];
      return '';
    } catch (e) { return ''; }
  };
  w.xpSniffHtml = XP.sniffInHtml;

  /* ------------------------------------------------------ 规则校验 */
  XP.checkRule = function (rule) {
    var missing = [];
    if (!rule || typeof rule !== 'object') return '规则不是对象';
    if (!rule.baseURL) missing.push('baseURL');
    if (!rule.searchURL) missing.push('searchURL');
    if (!rule.searchList) missing.push('searchList');
    if (!rule.searchName) missing.push('searchName');
    if (!rule.searchResult) missing.push('searchResult');
    if (!rule.chapterRoads) missing.push('chapterRoads');
    if (!rule.chapterResult) missing.push('chapterResult');
    return missing.length ? ('缺少字段：' + missing.join(' / ')) : '';
  };

  /* ------------------------------------------------------ 规则解析（文本 → 规则对象）
     支持：① 直接 JSON 对象  ② {rules:{...}} 包裹  ③ Kazumi 插件 JSON（含 api/type 字段） */
  XP.parseRuleText = function (text) {
    try {
      var j = JSON.parse(String(text || ''));
      if (!j || typeof j !== 'object') return { ok: false, msg: '不是合法的规则 JSON' };
      var rule = (j.rules && typeof j.rules === 'object' && (j.rules.searchURL || j.rules.baseURL)) ? j.rules : j;
      var nm = String(rule.name || j.name || '').trim();
      var err = XP.checkRule(rule);
      if (err) return { ok: false, msg: err };
      return { ok: true, rule: rule, name: nm };
    } catch (e) { return { ok: false, msg: 'JSON 解析失败：' + e.message }; }
  };

  w.XP = XP;

})(window);

(function (w) {

  // 巳泷 v9.1：给请求加浏览器 UA / Accept —— 部分采集站（Cloudflare 等）会拦截无 UA 或

        seek.addEventListener('change', function () {

          try { w.DM.engine.idx = 0; w.DM.engine.lastPos = -10; w.DM.engine.clearScreen(); } catch (e) {}

      }

      // 倍速 / 画质

      // 音量（实时 + 记忆）
      var vol = $('plVol');
      if (vol && !vol.__bound) {

            var p = parseInt(vol.value, 10);

      }

      var br = $('plBright');
      if (br && !br.__bound) {
        br.__bound = true;
        var applyBr = function () {
          try {
            var p = parseInt(br.value, 10);

            try { localStorage.setItem('video_pl_bright', String(b)); } catch (e) {}
            var lab = $('vPlBright'); if (lab) lab.textContent = String(b);
          } catch (e) {}
        };
        br.addEventListener('input', applyBr);
        br.addEventListener('change', applyBr);
      }

      // 初始应用记忆的音量 / 明暗度
      try {
        var vv = parseFloat(localStorage.getItem('video_pl_vol') || '100');

      } catch (e) {}
      try {

      // 快进退档位按钮：单击快进/退进（交给 data-act=seek 委托）；长按(≥600ms)自定义该档位秒数（记忆）
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="seek"]'), function (btn) {

    },

    /* ---------------------------------------------- 比例 / 尺寸 / 分辨率 */
    detectRatio: function () {
      try {
        var v = this.v;
        var w = v.videoWidth || 0, h = v.videoHeight || 0;
        this.ratio = { w: w, h: h, aspect: (w > 0 && h > w) ? 'portrait' : (w > 0 ? 'landscape' : '') };
        this.updateRes();
      } catch (e) {}
    },

    updateRes: function () {
      try {
        var el = $('plRes');
        if (!el) return;
        var r = this.ratio, lv = this.levels.length;
        var t = '分辨率：' + (r.w ? (r.w + '×' + r.h + '（' + (r.aspect === 'portrait' ? '竖屏' : '横屏') + '）') : '读取中…');
        t += '　画质档位：' + (lv > 1 ? (lv + ' 档，可在上面切换') : '单一（该线路未提供多档）');
        t += '　尺寸：' + ({ contain: '原始比例', cover: '铺满裁剪', fill: '拉伸铺满' }[this.fit] || this.fit);
        t += '　裁剪：' + ({ off: '原始', '169': '16:9', '916': '9:16', '43': '4:3', custom: '自定义' + ((this.crop && this.crop.z) ? ('×' + Number((this.crop.z || 1).toFixed(1))) : '') }[(this.crop || {}).mode] || '原始');
        el.innerHTML = t;
      } catch (e) {}
    },

    setFit: function (mode) {
      if (['contain', 'cover', 'fill'].indexOf(mode) < 0) mode = 'contain';
      this.fit = mode;
      try { localStorage.setItem('video_pl_fit', JSON.stringify(mode)); } catch (e) {}
      this.applyFit();
      this.updateRes();
      var btns = document.querySelectorAll('[data-act="fit"]');
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === mode);
      this.info('视频尺寸：' + ({ contain: '原始比例（完整显示）', cover: '铺满（裁剪多余部分）', fill: '拉伸铺满（可能变形）' }[mode] || mode));
    },

    applyFit: function () {
      try {
        if (!this.v) return;
        if (this.crop && this.crop.mode !== 'off') { this.v.style.objectFit = 'contain'; return; }
        this.v.style.objectFit = (this.fit === 'fill') ? 'fill' : this.fit;
      } catch (e) {}
    },

    /* ---------------------------------------------- 画面裁剪（去黑边）
       · off      = 原始（跟随画面尺寸设置）
       · 169/916/43 = 预设比例：把有效画面按该比例裁满视口（cover）
       · custom   = 自定义：双指缩放整体、单指滑动调整边缘 */
    applyCrop: function () {
      try {
        var cw = this.cropWrap, v = this.v;
        if (!cw || !v) return;
        var stg = this.stage;
        if (!this.crop || this.crop.mode === 'off') {
          cw.style.left = '0'; cw.style.top = '0';
          cw.style.width = '100%'; cw.style.height = '100%';
          cw.style.overflow = 'hidden';
          v.style.transform = '';
          v.style.objectFit = (this.fit === 'fill') ? 'fill' : this.fit;
          v.style.objectPosition = '50% 50%';
          return;
        }
        var mode = this.crop.mode;
        v.style.objectFit = 'cover';
        if (mode === 'custom') {
          v.style.objectFit = 'contain';
          cw.style.left = '0'; cw.style.top = '0';
          cw.style.width = '100%'; cw.style.height = '100%';
          var z = this.crop.z || 1;
          v.style.transform = 'translate(' + (this.crop.tx || 0) + 'px,' + (this.crop.ty || 0) + 'px) scale(' + z + ')';
          return;
        }
        var ar = mode === '169' ? (16 / 9) : (mode === '916' ? (9 / 16) : (4 / 3));
        var sw = stg ? stg.clientWidth : 0, sh = stg ? stg.clientHeight : 0;
        var sar = (sw > 0 && sh > 0) ? (sw / sh) : (16 / 9);
        var vw = sw, vh = sh;
        if (ar >= sar) { vh = sw / ar; vw = sw; }
        else { vw = sh * ar; vh = sh; }
        cw.style.left = ((sw - vw) / 2) + 'px';
        cw.style.top = ((sh - vh) / 2) + 'px';
        cw.style.width = vw + 'px';
        cw.style.height = vh + 'px';
        cw.style.overflow = 'hidden';
        v.style.transform = '';
      } catch (e) {}
    },

    setCrop: function (mode) {
      if (['off', '169', '916', '43', 'custom'].indexOf(mode) < 0) mode = 'off';
      if (mode === 'reset') { this.crop = { mode: 'off', z: 1, tx: 0, ty: 0 }; mode = 'off'; }
      else {
        this.crop = this.crop || { mode: 'off', z: 1, tx: 0, ty: 0 };
        this.crop.mode = mode;
        if (mode === 'custom') { this.crop.z = this.crop.z || 1.2; this.crop.tx = this.crop.tx || 0; this.crop.ty = this.crop.ty || 0; }
      }
      try { localStorage.setItem('video_pl_crop', JSON.stringify(mode)); } catch (e) {}
      this.applyCrop();
      this.updateRes();
      var btns = document.querySelectorAll('[data-act="crop"]');
      for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('on', btns[i].getAttribute('data-v') === mode);
      this.info('画面裁剪：' + ({ off: '原始', '169': '16:9（去黑边）', '916': '9:16（去黑边）', '43': '4:3（去黑边）', custom: '自定义（双指缩放 / 单指滑动）' }[mode] || mode));
    },

    /* 自定义裁剪手势：双指缩放 + 单指平移 */
    bindCropGesture: function () {
      try {
        var self = this, stg = this.stage;
        if (!stg || stg.__cropBound) return;
        stg.__cropBound = true;
        var pts = {}, pinchD = 0, pinchZ = 1;
        stg.addEventListener('pointerdown', function (ev) {
          if (!self.crop || self.crop.mode !== 'custom') return;
          ev.preventDefault();
          pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
          if (Object.keys(pts).length === 2) {
            var ks = Object.keys(pts);
            pinchD = Math.hypot(pts[ks[0]].x - pts[ks[1]].x, pts[ks[0]].y - pts[ks[1]].y);
            pinchZ = self.crop.z || 1;
          }
        });
        stg.addEventListener('pointermove', function (ev) {
          if (!self.crop || self.crop.mode !== 'custom') return;
          if (!pts[ev.pointerId]) return;
          var prev = pts[ev.pointerId];
          var dx = ev.clientX - prev.x, dy = ev.clientY - prev.y;
          pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
          var ks = Object.keys(pts);
          if (ks.length === 2) {
            var a = pts[ks[0]], b = pts[ks[1]];
            var d = Math.hypot(a.x - b.x, a.y - b.y);
            if (pinchD > 0) {
              self.crop.z = Math.max(1, Math.min(6, pinchZ * (d / pinchD)));
              self.applyCrop();
            }
          } else {
            self.crop.tx = (self.crop.tx || 0) + dx;
            self.crop.ty = (self.crop.ty || 0) + dy;
            self.applyCrop();
          }
          try { ev.preventDefault(); } catch (e) {}
        });
        var end = function (ev) {
          if (self.crop && self.crop.mode === 'custom') self.updateRes();
          delete pts[ev.pointerId];
        };
        stg.addEventListener('pointerup', end);
        stg.addEventListener('pointercancel', end);
        stg.addEventListener('pointerleave', end);
      } catch (e) {}
    },

    /* 巳泷 v9.1.0：全屏手势 —— 右侧上/下滑 = 音量，左侧上/下滑 = 亮度；长按全屏画面 = 锁定/解锁（防误触弹出暂停） */
    bindFullscreenGestures: function () {
      try {
        var self = this, stg = this.stage;
        if (!stg || stg.__fsGestureBound) return;
        stg.__fsGestureBound = true;
        var t0 = null, axis = '', startX = 0, startY = 0, lastV = 0, lastB = 0, longHit = false, longTimer = null, startPos = 0;
        var D = 6;
        var getVol = function () {
          try { if (self.v) return self.v.volume * 100; return 100; } catch (e) { return 100; }
        };
        var getBr = function () {
          try { var b = parseFloat(localStorage.getItem('video_pl_bright') || '1'); return (b * 100).toFixed(0); } catch (e) { return '100'; }
        };
        var setVol = function (p) {
          try { p = Math.max(0, Math.min(100, p)); if (self.v) self.v.volume = p / 100; localStorage.setItem('video_pl_vol', String(p)); var lab = $('vPlVol'); if (lab) lab.textContent = p + '%'; } catch (e) {}
        };
        var setBr = function (p) {
          try { p = Math.max(10, Math.min(150, p)); var b = (p / 100).toFixed(2); if (self.v) self.v.style.filter = 'brightness(' + b + ')'; localStorage.setItem('video_pl_bright', String(b)); var lab = $('vPlBright'); if (lab) lab.textContent = b; } catch (e) {}
        };
        var tip = function (txt) { try { var el = $('plGestureTip'); if (el) { el.textContent = txt; el.classList.add('show'); } } catch (e) {} };
        var hideTip = function () { try { var el = $('plGestureTip'); if (el) el.classList.remove('show'); } catch (e) {} };

        stg.addEventListener('pointerdown', function (ev) {
          if (ev.pointerType === 'mouse') return;
          if (!document.body.classList.contains('pl-full')) { longHit = false; return; }
          // 巳泷 v9.3.0：锁定/解锁统一由长按触发；播放中才可手势（锁定状态下长按用于解锁）
          if (!self.v || self.v.paused) { longHit = false; return; }
          t0 = Date.now();
          startX = ev.clientX; startY = ev.clientY;
          try { startPos = (self.v && self.v.currentTime) || 0; } catch (e) { startPos = 0; }
          axis = ''; lastV = getVol(); lastB = getBr(); longHit = false;
          clearTimeout(longTimer);
          longTimer = setTimeout(function () {
            longHit = true;
            if (self.locked) {
              // 已锁定 → 本次长按 = 解锁（一次长按+松手只算一次操作，松手不再触发任何动作）
              self.locked = false;
              document.body.classList.remove('pl-locked');
              hideTip();
              tip('🔓 已解锁');
              try { if (self.v) self.v.play(); } catch (e) {}
              setTimeout(hideTip, 900);
            } else {
              // 未锁定 → 本次长按 = 锁定
              self.locked = true;
              document.body.classList.add('pl-locked');
              tip('🔒 已锁定（再次长按解锁）');
              try { if (self.v) self.v.pause(); } catch (e) {}
            }
          }, 700);
        });
        stg.addEventListener('pointermove', function (ev) {
          if (ev.pointerType === 'mouse') return;
          if (!t0 || !self.v || self.v.paused || self.locked) return;
          var dx = ev.clientX - startX, dy = ev.clientY - startY;
          if (axis === '' && (Math.abs(dx) > D || Math.abs(dy) > D)) {
            axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
            clearTimeout(longTimer);
          }
          if (axis === 'y') {
            if (ev.clientX < window.innerWidth * 0.5) {  // 左半边 → 亮度
              var nb = lastB - (dy / window.innerHeight) * 80;
              setBr(parseInt(nb, 10)); tip('☀ 亮度 ' + getBr() + '%');
            } else {                                  // 右半边 → 音量
              var nv = lastV - (dy / window.innerHeight) * 80;
              setVol(parseInt(nv, 10)); tip('🔊 音量 ' + getVol() + '%');
            }
          } else if (axis === 'x') {
            // 巳泷 v9.2.0：播放中横向滑动 = 快进/退进（右滑快进，左滑退进，跟手实时）
            // 巳泷 v9.3.0：拖动时显示目标时间，让用户清楚知道拖到了哪里
            try {
              var dur = self.v.duration || 0;
              if (dur > 0) {
                var span = (dx / window.innerWidth) * 60;   // 全宽滑动 ≈ 60 秒
                var target = Math.max(0, Math.min(dur - 0.5, startPos + span));
                self.v.currentTime = target;
                self.updateTime();
                try { self.savePos(target); } catch (e2) {}
                tip((span >= 0 ? '⏩ 快进 +' : '⏪ 退进 ') + Math.abs(span).toFixed(0) + 's ｜ ' + self.fmt(target) + ' / ' + self.fmt(dur));
              }
            } catch (e) {}
          }
        });
        var end = function (ev) {
          if (ev.pointerType === 'mouse') return;
          clearTimeout(longTimer);
          var wasT0 = t0;
          t0 = null;
          // 巳泷 v9.3.0：长按已在按下时完成锁定/解锁，松手只做收尾，不重复触发（一次长按+松手算一次）
          if (longHit) { longHit = false; hideTip(); return; }
          if (self.locked) return;
          if (axis !== '') { hideTip(); axis = ''; return; }   // 手势滑动结束不触发播放/暂停
          if (wasT0 && Date.now() - wasT0 >= 700) return;       // 长按未达阈值、或其它
        };
        stg.addEventListener('pointerup', end);
        stg.addEventListener('pointercancel', end);
        // 锁定提示层（CSS 内建）
        var tEl = document.createElement('div');
        tEl.id = 'plGestureTip';
        tEl.className = 'pl-gesture-tip';
        stg.parentNode && stg.parentNode.appendChild(tEl);
      } catch (e) {}
    },

        /* ★ v9.8.0：每次进全屏都用视频真实分辨率重算横竖，避免 9:16 被判成横屏、16:9 被判成竖屏。

        this.notifyFull(true, target);    // 通知原生：隐藏底部导航栏 + 强制旋转（无视设备锁定）
        this.showCtl(!!this.v.paused);    // 进入全屏：暂停时显示控件，播放中保持隐藏
        this.info('全屏（' + (target === 'portrait' ? '竖向' : '横向') + '，按原始尺寸不拉伸）：点击画面播放/暂停，暂停后进度条与参数自动显示；返回键退出全屏');
        this.applyCrop();
        this.applyFit();
        try { w.DM.engine.relayout(); } catch (e) {}
      } catch (e) {}
    },

    exitFull: function () {
      try {

        if (btn) btn.innerHTML = '<i class="fa-solid fa-maximize"></i>';
        try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}

    },

        if (this.autoOri === false) { this.openFsOpts(); return; }
        this.detectRatio();
        var vw = (this.v && this.v.videoWidth) || 0, vh = (this.v && this.v.videoHeight) || 0;
        var asp = (vw > 0 && vh > 0) ? (vh > vw ? 'portrait' : 'landscape') : this.ratio.aspect;
        this.enterFull(asp === 'portrait' ? 'portrait' : 'landscape');
      } catch (e) {}
    },

    isFull: function () { return document.body.classList.contains('pl-full'); },

    openExternal: function () {
      var url = this.epUrl();
      if (!url) { this.fail('没有可播放地址'); return; }
      try {
        if (w.VideoNative && w.VideoNative.openExternal) { w.VideoNative.openExternal(url); this.info('已交给手机播放器打开：' + url.slice(0, 70)); }
        else { this.info('网页环境不支持外部播放器：' + url.slice(0, 70)); }
      } catch (e) { this.fail('打开外部播放器失败：' + e.message); }
    },

    /* ------------------------------------------------------------- 弹幕 */
    toggleDm: function () {
      w.DM.cfg.on = !w.DM.cfg.on;
      w.DM.saveCfg();
      w.DM.engine.applyCfg();
      var b = $('plDmBtn');
      if (b) b.textContent = w.DM.cfg.on ? '弹幕 开' : '弹幕 关';
      // 巳泷 v9.1.0：同步更新详情页/暂停面板的弹幕开关
      var b2 = $('plTuneDmBtn');
      if (b2) b2.textContent = (w.DM.cfg.on ? '开' : '关') + '弹幕';
      var b3 = document.querySelector('.row-chips [data-act="dmtoggle"]');
      if (b3) b3.textContent = w.DM.cfg.on ? '弹幕开' : '弹幕关';
      this.info(w.DM.cfg.on ? '弹幕已打开' : '弹幕已关闭');
    },

    sendDm: function () {
      try {
        var inp = $('dmText');
        var txt = String((inp && inp.value) || '').trim();
        if (!txt) { this.info('请输入弹幕内容'); return; }
        if (!w.DM.cfg.on) { w.DM.cfg.on = true; w.DM.saveCfg(); w.DM.engine.applyCfg(); }
        var t = this.v ? (this.v.currentTime || 0) : 0;
        w.DM.addLocal(w.V.detail.item.name, this.epName(), txt, '#FFFFFF', t);
        w.DM.engine.list.push({ t: t, text: txt, color: '#FFFFFF' });
        w.DM.engine.list.sort(function (a, b) { return a.t - b.t; });
        w.DM.engine.spawn({ t: t, text: txt, color: '#FFFFFF' });
        if (inp) inp.value = '';
        this.info('弹幕已发送并保存在本机（' + this.fmt(t) + '）');
      } catch (e) { this.fail('发送弹幕失败：' + e.message); }
    },

    /* --------------------------------------------------------- 进度记录 */
    posKey: function () {
      try { return 'video_pos_' + encodeURIComponent(w.V.detail.item.name + '|' + this.epName()); } catch (e) { return ''; }
    },

    savedPos: function () {
      try {
        var v = parseFloat(localStorage.getItem(this.posKey()) || '0');
        return isFinite(v) && v > 5 ? v : 0;
      } catch (e) { return 0; }
    },

    savePos: function (t) {
      try {
        var k = this.posKey();
        if (!k) return;
        localStorage.setItem(k, String(Math.max(0, t || 0)));
      } catch (e) {}
      try { if (w.vRecordHist) w.vRecordHist(t); } catch (e) {}
    },

    fmt: function (s) {
      s = Math.max(0, Math.floor(s || 0));
      var m = Math.floor(s / 60), x = s % 60;
      return (m < 10 ? '0' : '') + m + ':' + (x < 10 ? '0' : '') + x;
    },

    updateTime: function () {
      try {
        var v = this.v, d = v.duration || 0, t = v.currentTime || 0;
        var lab = $('plTime');
        if (lab) lab.textContent = this.fmt(t) + ' / ' + (d > 0 ? this.fmt(d) : '--:--');
        var seek = $('plSeek');
        if (seek && d > 0 && !(seek.__dragging && seek.__dragging())) seek.value = String(Math.round((t / d) * 1000));
      } catch (e) {}
    }
  };

})(window);

  <script>

   ========================================================================== */

(function (w) {
  'use strict';

  var UI = {};

  function esc(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  UI.esc = esc;

  function curSourceName() {
    var V = w.V;
    return (V && V.sources && V.sources[V.cur]) ? (V.sources[V.cur].name || '') : '';
  }

  function card(it, i, srcLabel) {
    var pic = it.pic
      ? ('<img loading="lazy" referrerpolicy="no-referrer" src="' + esc(it.pic) + '" alt="">')
      : '<span class="ph">暂无海报</span>';
    var rm = it.remarks ? ('<i class="rmk">' + esc(it.remarks) + '</i>') : '';
    var meta = [it.year, it.typeName].filter(Boolean).join(' · ');

    var sb = srcLabel ? ('<i class="srcbdg">' + esc(srcLabel) + '</i>') : '';
    var blurb = it.blurb ? ('<div class="blurb">' + esc(it.blurb) + '</div>') : '';

      '<div class="nm">' + esc(it.name) + '</div>' +
      (meta ? ('<div class="meta">' + esc(meta) + '</div>') : '') +

  }

  UI.renderGrid = function (items, emptyTip, srcLabel) {

      return '<div class="loading"><div class="spinner"></div><p>' + esc(V.loadingTxt || '正在加载…') + '</p></div>';
    }

    // 主页层（Level 1）：分类 Tab（仓库分类 / 综合资源接口 / 成人 / 动漫 / 自定义）
    if (V.level === 'wh') {
      h += '<div class="quick-row2">';
      h += '<button class="mini' + (V.quickView === 'fav' ? ' on' : '') + '" data-act="viewfav">★ 我的收藏（' + (V.fav || []).length + '）</button>';
      h += '<button class="mini" data-act="viewhist">🕘 最近观看（' + (V.hist || []).length + '）</button>';
      h += '<button class="mini" data-act="tocols">列数 ' + ((V.cols >= 3 && V.cols <= 5) ? V.cols : 3) + ' 列</button>';
      h += '</div>';
      var tab = V.homeTab || '综合资源接口';
      if (tab === '仓库分类') return h + UI.homeRepos();
      if (tab === '成人') return h + UI.homeCatList('成人（18+）');
      if (tab === '动漫') return h + UI.homeCatList('动漫');
      if (tab === '自定义') return h + UI.homeCustom();
      return h + UI.homeAll();
    }

    // 源列表层（Level 2）：当前仓库下的源；自定义仓库 = 该仓库组的接口
    if (V.level === 'src') {
      var dead = w.VIDEO_DEAD_CAT || '失效区';
      if (V.curWh === dead) return UI.renderDeadZone();
      h += '<div class="sec-title">' + (V.curWh === '自定义' ? ('自定义 › ' + (V.customFocus ? esc(V.customFocus) : '全部')) : ('仓库：' + esc(V.curWh))) + '（点「进入」展开视频标签分类）</div>';
      var rows = '';
      for (var s = 0; s < V.sources.length; s++) {
        var so = V.sources[s];
        if (V.curWh === '自定义') {
          if ((so.cat || '') !== '自定义') continue;
          if (V.customFocus && so.cg !== V.customFocus) continue;
        } else if ((so.cat || '综合影视') !== V.curWh) continue;
        var ok = w.vIsOk ? w.vIsOk(so.api) : null;
        var st = ok === true ? '<span class="sc-st ok">✔ 可用</span>' : (ok === false ? '<span class="sc-st bad">✘ 失效</span>' : '<span class="sc-st">待检测</span>');
        rows += '<div class="src-card' + (s === V.cur ? ' on' : '') + '">' +

      if (!rows) rows = '<div class="empty">这里还没有接口（去「源管理」添加，或打开一个仓库选择源）</div>';
      return h + rows;
    }

    // 分类层（Level 3/4）：分类列表 + 该分类下的内容
    h += '<div class="quick-row2">';
    h += '<button class="mini" data-act="viewfav">★ 收藏（' + (V.fav || []).length + '）</button>';
    h += '<button class="mini" data-act="viewhist">🕘 最近（' + (V.hist || []).length + '）</button>';
    h += '<button class="mini" data-act="tocols">' + ((V.cols >= 3 && V.cols <= 5) ? V.cols : 3) + ' 列</button>';
    h += '</div>';

    // 加载失败：明确提示 + 一键重试
    if (V.clsErr) {

      return h;
    }
    if (V.listErr) {
      h += '<div class="warn">' + esc(V.listErr) + '</div>';
      h += '<div class="row2"><button class="wide-btn" data-act="retry">↺ 重试加载内容</button></div>';
    }

    // 一级分类在顶部仓库条内水平滑动（srcBar），内容区只放子分类 + 海报墙（消除冗余遮挡）
    if (V.subs.length) {
      h += '<div class="row-scroll sub"><button class="chip' + (!V.curSub ? ' on' : '') + '" data-act="sub" data-id="">全部</button>';

    h += UI.renderGrid(V.items, V.listErr ? '加载失败，点上方「重试」' : '这个分类没有内容，换一个分类或换个源试试', curSourceName());
    h += UI.autoLoadHint();
    h += '<div class="more-wrap"><button class="wide-btn ghost" data-act="top">↑ 回到顶部</button></div>';
    return h;
  };

  /* 主页「综合资源接口」：全部内置接口分块展示（点接口直接进入内容）
     （仓库已归到「仓库分类」Tab，这里不再重复展示） */
  UI.homeAll = function () {
    var V = w.V;
    var h = '<div class="sec-title">综合资源接口（点接口直接进入分类浏览）</div>';
    var order = w.VIDEO_CATS || ['综合影视'];
    var dead = w.VIDEO_DEAD_CAT || '失效区';
    var hide = { '成人（18+）': 1, '动漫': 1 };
    hide[dead] = 1;
    var shown = false;
    for (var c = 0; c < order.length; c++) {

      h += '<div class="sec-title">' + UI.esc(ct) + '（' + idxs.length + '）</div>';

    for (var k = 0; k < custom.length; k++) {
      var ck = custom[k];
      if (!ck || !ck.api) continue;
      if (ck.kind === 'repo') {
        var cnt = (ck.children && ck.children.length) ? ck.children.length : 0;
        h += '<div class="wh-card repo" data-act="customrepo" data-name="' + UI.esc(ck.name) + '">' +
          '<span class="wh-tag">仓库</span><span class="wh-ic">📦</span>' +
          '<span class="wh-nm">' + UI.esc(ck.name) + '</span>' +
          '<span class="wh-cnt">' + cnt + ' 个接口 · 点开选源</span></div>';
      } else {
        var idx = -1;
        for (var m = 0; m < V.sources.length; m++) if (V.sources[m].api === ck.api) { idx = m; break; }
        if (idx < 0) continue;   // 已被移除/失效的接口不再展示
        h += '<div class="wh-card" data-act="customsingle" data-i="' + idx + '">' +
          '<span class="wh-tag">接口</span><span class="wh-ic">🔌</span>' +
          '<span class="wh-nm">' + UI.esc(ck.name || ck.api) + '</span>' +
