<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>巳泷资源库·最近更新</title>
    <style>
        /* ===== 赛博朋克深空霓虹 ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: #05001a;
            background-image: radial-gradient(circle at 50% -20%, #180a48 0%, #05001a 60%, #02000f 100%);
            color: #eaf6ff;
            padding-bottom: 40px;
            overflow-x: hidden;
        }
        .page-header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            background: rgba(18,6,48,0.85);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(0,229,255,0.35);
            box-shadow: 0 2px 16px rgba(0,229,255,0.15);
        }
        .back-btn {
            position: absolute;
            left: 14px;
            border: 1px solid rgba(0,229,255,0.5);
            background: rgba(0,229,255,0.08);
            color: #7deeff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,229,255,0.25);
        }
        .back-btn:active { background: rgba(0,229,255,0.25); color: #02000f; }
        .page-title {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #00e5ff 0%, #b16cff 50%, #ff6ec7 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(177,108,255,0.7));
        }
        #game-list-container {
            padding: 16px;
        }
        .game-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,229,255,0.3);
            border-radius: 14px;
            transition: all 0.25s ease;
        }
        .game-item:hover {
            border-color: #00e5ff;
            box-shadow: 0 0 16px rgba(0,229,255,0.35), 0 0 6px rgba(255,110,199,0.2);
            background: rgba(0,229,255,0.06);
            transform: translateX(4px);
        }
        .game-item-left { flex: 1; min-width: 0; }
        .game-item-left span {
            font-size: 0.95rem;
            color: #eaf6ff;
            word-break: break-all;
        }
        .game-item-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .status-icon {
            font-size: 0.75rem;
            color: #7deeff;
            background: rgba(0,229,255,0.12);
            padding: 3px 10px;
            border-radius: 20px;
            white-space: nowrap;
        }
        .edit-btn {
            background: none;
            border: 1px solid rgba(0,229,255,0.35);
            color: #7deeff;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
        }
        /* 霓虹滚动条 */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #00e5ff, #b16cff, #ff6ec7); border-radius: 6px; }
        ::-webkit-scrollbar-thumb:hover { box-shadow: 0 0 8px rgba(0,229,255,0.6); }
        * { scrollbar-width: thin; scrollbar-color: #b16cff rgba(255,255,255,0.06); }
    </style>
</head>
<body>
<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    var d=document.documentElement;
    if(d){
      d.classList.remove('sl-day','sl-dusk','day');
      d.classList.add('sl-night');
    }
    if(document.body){
      document.body.classList.remove('mode-daily','mode-dusk','day');
      document.body.classList.add('mode-night','mode-adult');
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>


<div class="page-header">
    <button class="back-btn" onclick="history.back()">← 返回</button>
    <h1 class="page-title">最近更新</h1>
</div>

<!-- 游戏列表会自动从仓库加载到这里 -->
<div id="game-list-container"></div>

<script>
// yxgx.html 自己去拉 GitHub 仓库的游戏列表
const REMOTE_REPO_URL = "https://silong-respool.github.io/gay/yxgx.html";

async function loadGamesFromRepo() {
  try {
    const res = await fetch(REMOTE_REPO_URL, { cache: "no-cache" });
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const items = doc.querySelectorAll(".game-item");
    
    const container = document.getElementById("game-list-container");
    container.innerHTML = "";
    items.forEach(item => {
      item.removeAttribute("onclick");
      item.querySelectorAll("[onclick]").forEach(el => el.removeAttribute("onclick"));
      container.appendChild(item);
    });
  } catch (e) {
    console.error("拉取仓库游戏失败", e);
  }
}

// 页面一打开就拉远程
loadGamesFromRepo();
</script>

<style id="sl-skeleton">
/* ============================================================
   巳泷资源库 · 前端骨架 Token 体系（v8.0.7）
   统一：颜色 / 字体 / 圆角 / 间距 / 阴影 / 层级
   所有页面通过构建脚本内联本文件，页面运行时不额外请求 CSS。
   ============================================================ */
:root{
  /* 颜色 */
  --sl-bg:#08050f;
  --sl-bg-2:#0e0819;
  --sl-surface:#151024;
  --sl-surface-2:#1d1533;
  --sl-glass:rgba(16,10,30,.72);
  --sl-glass-strong:rgba(20,12,36,.92);
  --sl-primary:#8b5cf6;
  --sl-primary-2:#7c3aed;
  --sl-accent:#22d3ee;
  --sl-pink:#ff6ec7;
  --sl-glow:rgba(139,92,246,.45);
  --sl-text:#f5f3ff;
  --sl-text-2:#d8cfe9;
  --sl-muted:#a99bc4;
  --sl-line:rgba(139,92,246,.26);
  --sl-line-strong:rgba(139,92,246,.42);
  --sl-success:#34d399;
  --sl-danger:#f87171;
  --sl-warning:#fbbf24;
  /* 字体 */
  --sl-font:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sl-font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
  /* 圆角 */
  --sl-r-sm:8px;
  --sl-r-md:12px;
  --sl-r-lg:18px;
  --sl-r-xl:24px;
  --sl-r-pill:999px;
  /* 间距 */
  --sl-sp-1:4px;
  --sl-sp-2:8px;
  --sl-sp-3:12px;
  --sl-sp-4:16px;
  --sl-sp-5:24px;
  --sl-sp-6:32px;
  /* 阴影 */
  --sl-shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --sl-shadow:0 8px 30px rgba(0,0,0,.45);
  --sl-shadow-lg:0 18px 60px rgba(0,0,0,.55);
  --sl-glow-line:0 0 0 1px rgba(139,92,246,.18),0 0 24px rgba(139,92,246,.18);
  /* 层级 */
  --sl-z-nav:100;
  --sl-z-panel:300;
  --sl-z-modal:1000;
  --sl-z-toast:2000;
  /* 兼容旧页面变量名 */
  --acc:var(--sl-primary);
  --acc2:var(--sl-accent);
  --pink:var(--sl-pink);
  --border:var(--sl-line);
  --bg:var(--sl-bg);
  --txt:var(--sl-text);
  --v-glow:var(--sl-primary);
  --v-ink:var(--sl-text);
  --v-soft:var(--sl-line);
  --text-muted:var(--sl-muted);
}

html,body{
  background:var(--sl-bg);
  color:var(--sl-text);
  font-family:var(--sl-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{min-height:100vh}
::selection{background:rgba(139,92,246,.38);color:#fff}
*{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.55) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:var(--sl-r-pill)}
::-webkit-scrollbar-track{background:transparent}
*:focus-visible{outline:2px solid rgba(34,211,238,.55);outline-offset:2px}

/* 顶部栏：统一深色玻璃 + 紫罗兰描边（不改各页面原有高度与排布） */
.navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-sm)!important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
/* 侧栏 / 抽屉 / 面板统一 */
.side,.side-panel,.side-pane,.src-dock,.panel,.drawer{
  border-color:var(--sl-line)!important;
}
.side-header,.side-hd,.dock-head{
  border-bottom-color:var(--sl-line)!important;
}
.side-header h3,.side-hd h3,.dock-title{
  color:var(--sl-text)!important;letter-spacing:.4px;
}

/* 通用按钮：统一字体、圆角、动效；保留各页面自己的配色 */
.btn,.pbtn,.mini,.sr-tool,.tab-btn,.api-pool-btn,.rate-btn,.mbtn,.card-edit,.dk-tts,.icon-btn,.sl-top .bk{
  font-family:var(--sl-font);
  border-radius:var(--sl-r-md);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:active,.pbtn:active,.mini:active,.sr-tool:active,.tab-btn:active,.api-pool-btn:active,.rate-btn:active,.mbtn:active,.card-edit:active,.dk-tts:active,.icon-btn:active,.sl-top .bk:active{
  transform:scale(.97);
}
.primary,.pbtn{
  background-image:linear-gradient(135deg,var(--sl-primary-2),var(--sl-primary))!important;
  border-color:transparent!important;
  color:#fff!important;
  box-shadow:0 6px 18px rgba(124,58,237,.32);
}

/* 输入类：统一深色底、占位色与聚焦光环（排除勾选/滑杆/取色/文件） */
input,textarea,select{font-family:var(--sl-font)}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),textarea,select{
  background:var(--sl-surface-2)!important;
  color:var(--sl-text)!important;
  border:1px solid var(--sl-line)!important;
  border-radius:var(--sl-r-md)!important;
}
input::placeholder,textarea::placeholder{color:var(--sl-muted)}
input:focus,textarea:focus,select:focus{
  border-color:var(--sl-primary)!important;
  box-shadow:0 0 0 3px rgba(139,92,246,.16);
}

/* 区块标题与正文层级 */
.hd h2,.side-section h4,.side-header h3,.bubble-name,.v-bubble-name{
  color:var(--sl-text);
}
.hd,.side-section h4{
  letter-spacing:.3px;
}
.msg-time,.sub,.hint,.brand-status,.meta,.ds{
  color:var(--sl-muted);
}

/* 弹窗 / 浮层统一描边与阴影 */
.modal,.rate-card,.pet-card,.sl-kwarn,.dt,.dt-head,.context-menu{
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-lg)!important;
}

/* 兼容旧的白日/黄昏蓝白覆盖：即使旧 class 残留，也保持统一紫罗兰暗色 */
html.sl-day,html.sl-dusk{
  --bg:var(--sl-bg);--card:var(--sl-surface);--line:var(--sl-line);
  --txt:var(--sl-text);--mut:var(--sl-muted);--acc:var(--sl-primary);--acc2:var(--sl-accent);
}
html.sl-day body,html.sl-dusk body{
  background:radial-gradient(ellipse at 12% 6%,rgba(139,92,246,.20),transparent 55%),
             radial-gradient(ellipse at 88% 94%,rgba(255,110,199,.12),transparent 55%),
             var(--sl-bg)!important;
  color:var(--sl-text)!important;
}
html.sl-day .navbar,html.sl-dusk .navbar,body.mode-daily .nav{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  background-image:none!important;
}
html.sl-day .side-header h3,body.mode-daily .hd h2,body.mode-daily .about-site h2{
  color:var(--sl-text)!important;
}
html.sl-day .side,body.mode-daily .side{
  background:var(--sl-glass-strong)!important;
  border-color:var(--sl-line)!important;
}
body.mode-daily .side a:hover,body.mode-daily .side a.on{
  color:var(--sl-text)!important;
  border-left-color:var(--sl-primary)!important;
}

/* 移动端安全区与间距基线 */
@supports(padding:max(0px)){
  .navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
    padding-top:max(8px,env(safe-area-inset-top));
  }
}

</style>
</body>
</html>
