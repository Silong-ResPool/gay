name: SilongResource
options:
  bundleIdPrefix: silong.gay
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "14.0"
    ENABLE_BITCODE: "NO"
targets:
  SilongResource:
    type: application
    platform: iOS
    sources:
      - path: SilongResource
        excludes:
          - "Info.plist"
          - "README.md"
          - "logo.b64"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: silong.gay.ios
        PRODUCT_NAME: SilongResource
        INFOPLIST_FILE: SilongResource/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "8.5.0"
        CURRENT_PROJECT_VERSION: "850"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
schemes:
  SilongResource:
    build:
      targets:
        SilongResource: all
    archive:
      config: Release
