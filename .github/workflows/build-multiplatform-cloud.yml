name: Cloud Multiplatform Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/build-multiplatform-cloud.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Create design system
        shell: bash
        run: |
          mkdir -p assets/ui
          cat > assets/ui/obsidian-violet.css <<'EOF'
          :root{--bg:#08070d;--bg-2:#0d0b14;--surface:rgba(22,19,34,.82);--surface-2:rgba(31,27,48,.72);--line:rgba(199,185,255,.16);--line-strong:rgba(199,185,255,.32);--violet:#8b7cf6;--violet-soft:#c7b9ff;--violet-deep:#5b4b9e;--gold:#c5a66d;--text:#ece8f6;--muted:#a69fb8;--danger:#d58a9c;--radius:18px;--shadow:0 22px 70px rgba(0,0,0,.38)}
          *{box-sizing:border-box}
          html{color-scheme:dark;background:var(--bg);scroll-behavior:smooth}
          body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 50% -10%,rgba(121,98,198,.18),transparent 38rem),linear-gradient(180deg,var(--bg),#07060c 70%);line-height:1.65;overflow-x:hidden}
          h1,h2,h3,h4{font-family:"Noto Serif SC","Songti SC",Georgia,serif;font-weight:650;letter-spacing:.02em;line-height:1.25;color:#f4f0ff}
          a{color:inherit;text-decoration:none}
          button,input,select,textarea{font:inherit}
          button,a,[role=button]{-webkit-tap-highlight-color:transparent}
          .container,main,section{width:min(100% - 28px,1180px);margin-inline:auto}
          .card,.game-item,.module-card,.panel,article,aside .nav-item{background:linear-gradient(180deg,rgba(35,31,54,.82),rgba(18,16,29,.86));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
          .card,.game-item,.module-card{padding:16px;transition:border-color .2s ease,transform .2s ease,background .2s ease}
          .card:hover,.game-item:hover,.module-card:hover{border-color:var(--line-strong);transform:translateY(-2px);background:linear-gradient(180deg,rgba(43,38,67,.9),rgba(20,17,32,.9))}
          .btn,button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:10px 16px;border-radius:12px;border:1px solid var(--line-strong);color:var(--text);background:linear-gradient(180deg,rgba(111,94,188,.28),rgba(62,50,105,.32));cursor:pointer}
          .btn:hover,button:hover{border-color:rgba(199,185,255,.55);background:linear-gradient(180deg,rgba(126,108,205,.38),rgba(68,55,112,.38))}
          input,select,textarea{width:100%;min-height:44px;padding:10px 12px;color:var(--text);background:rgba(13,11,20,.78);border:1px solid var(--line);border-radius:12px;outline:none}
          input:focus,select:focus,textarea:focus{border-color:rgba(199,185,255,.62);box-shadow:0 0 0 3px rgba(139,124,246,.12)}
          img,video,canvas{max-width:100%;border-radius:14px}
          .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
          .eyebrow{color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase}
          .muted,small{color:var(--muted)}
          .ov-svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
          .ov-icon-host{font-size:0!important}.ov-icon-host:before{display:none!important}
          .download-hero{padding:42px 0 24px;text-align:center}.download-hero h1{font-size:clamp(30px,6vw,58px);margin:8px 0}
          .platform-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px;padding:22px 0 48px}
          .platform-card{display:flex;flex-direction:column;gap:12px;min-height:210px;padding:22px;background:linear-gradient(180deg,rgba(35,31,54,.9),rgba(17,15,27,.92));border:1px solid var(--line);border-radius:20px}
          .platform-card .btn{margin-top:auto}
          @media (max-width:600px){.container,main,section{width:min(100% - 20px,1180px)}body{font-size:14px}.card,.game-item,.module-card{padding:13px;border-radius:15px}.grid{gap:12px;grid-template-columns:1fr}.btn,button{min-height:44px}}
          @media (min-width:601px) and (max-width:1024px){.grid{grid-template-columns:repeat(2,1fr)}}
          @media (min-width:1025px){.grid{grid-template-columns:repeat(3,1fr)}}
          @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
          EOF
          cat > assets/ui/obsidian-violet.js <<'EOF'
          (function(){
            const paths={home:'M3 11l9-8 9 8M5 10v10h14V10',download:'M12 3v12m0 0l-5-5m5 5l5-5M4 21h16',close:'M6 6l12 12M18 6L6 18',menu:'M4 7h16M4 12h16M4 17h16',image:'M4 5h16v14H4zM8 11l3 3 3-3 4 4',music:'M9 18V5l10-2v12M9 18a3 3 0 11-6 0 3 3 0 016 0zm10-2a3 3 0 11-6 0 3 3 0 016 0z',game:'M7 8h10a4 4 0 014 4v1a3 3 0 01-5 2l-2-2h-2l-2 2a3 3 0 01-5-2v-1a4 4 0 014-4z',book:'M4 5a3 3 0 013-3h13v17H7a3 3 0 00-3 3zM17 2v17'};
            function svg(n){return `<svg class="ov-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.download}"/></svg>`}
            function run(){
              document.querySelectorAll('i.fa,i.fas,i.far,i.fab,span.fa').forEach(function(el){
                if(el.dataset.ov)return;el.dataset.ov='1';const c=el.className;const name=Object.keys(paths).find(k=>c.includes(k))||'menu';el.insertAdjacentHTML('afterbegin',svg(name));el.style.fontSize='0';
              });
              const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
              nodes.forEach(n=>{if(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/u.test(n.nodeValue)){n.nodeValue=n.nodeValue.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu,'');}});
              document.querySelectorAll('a,button').forEach(el=>{if(el.innerText&&el.innerText.includes('下载'))el.setAttribute('href','download.html');});
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
            new MutationObserver(()=>requestAnimationFrame(run)).observe(document.documentElement,{subtree:true,childList:true});
          })();
          EOF
          cat > download.html <<'EOF'
          <!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下载巳泷资源库 8.5.0</title><link rel="stylesheet" href="assets/ui/obsidian-violet.css"></head><body>
          <main><section class="download-hero"><p class="eyebrow">DOWNLOAD CENTER</p><h1>选择安装平台</h1><p class="muted">所有发行包保持相同版本、功能内容与统一视觉。</p></section>
          <div class="platform-grid">
          <article class="platform-card"><h2>Android</h2><p>适用于安卓手机与平板，arm64-v8a。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0.apk">下载 APK</a></article>
          <article class="platform-card"><h2>HarmonyOS</h2><p>适用于支持安卓兼容环境的鸿蒙设备。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0-harmony.apk">下载 Harmony APK</a></article>
          <article class="platform-card"><h2>iOS</h2><p>未签名 IPA，需自行重签后安装。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0.ipa">下载 IPA</a></article>
          <article class="platform-card"><h2>Windows</h2><p>Windows 10/11 x64 便携版。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0.exe">下载 EXE</a></article>
          <article class="platform-card"><h2>macOS Intel</h2><p>适用于 Intel 芯片 Mac。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0-macOS-x64.zip">下载 ZIP</a></article>
          <article class="platform-card"><h2>macOS Apple Silicon</h2><p>适用于 M 系列芯片 Mac。</p><a class="btn" href="https://github.com/Silong-ResPool/gay/releases/download/v8.5.0-multiplatform/%E5%B7%94%E6%B3%A7%E8%B5%84%E6%BA%90%E5%BA%938.5.0-macOS-arm64.zip">下载 ZIP</a></article>
          </div><p style="text-align:center"><a href="index.html">返回首页</a></p></main><script src="assets/ui/obsidian-violet.js"></script></body></html>
          EOF
      - name: Inject UI into all pages
        shell: python
        run: |
          from pathlib import Path
          css='<link rel="stylesheet" href="assets/ui/obsidian-violet.css?v=23">'
          late='<link rel="stylesheet" href="assets/ui/obsidian-violet.css?v=23-late">'
          js='<script src="assets/ui/obsidian-violet.js?v=23"></script>'
          vp='<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts: continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              if 'name="viewport"' not in s: s=s.replace('</head>',vp+'\n</head>')
              if 'obsidian-violet.css?v=23-late' not in s: s=s.replace('</body>',css+'\n'+late+'\n'+js+'\n</body>')
              p.write_text(s,encoding='utf-8')
      - name: Commit prepared web
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add assets/ui/obsidian-violet.css assets/ui/obsidian-violet.js download.html
          git add '*.html' '**/*.html'
          git commit -m 'build: apply obsidian violet unified UI [skip ci]' || true
          git push
  windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Electron project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force PC\www | Out-Null
          robocopy $PWD PC\www /E /XD .git PC /NFL /NDL /NJH /NJS /NP
          @'
          {
            "name":"silong-resource-pc","version":"8.5.0","main":"main.js",
            "scripts":{"build":"electron-builder --win portable"},
            "build":{"appId":"silong.gay.pc","productName":"巳泷资源库","directories":{"output":"release"},"artifactName":"${productName}${version}.${ext}","files":["main.js","preload.js","www/**/*","package.json"],"win":{"target":[{"target":"portable","arch":["x64"]}]}}
          }
          '@ | Set-Content -Encoding UTF8 PC\package.json
          "const {app,BrowserWindow}=require('electron');const path=require('path');function createWindow(){new BrowserWindow({width:1280,height:820,minWidth:360,minHeight:640,autoHideMenuBar:true,webPreferences:{preload:path.join(__dirname,'preload.js')}}).loadFile(path.join(__dirname,'www','index.html'))}app.whenReady().then(createWindow);app.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit()});app.on('activate',()=>{if(BrowserWindow.getAllWindows().length===0)createWindow()});" | Set-Content PC\main.js
          "window.addEventListener('DOMContentLoaded',()=>{window.Silong={version:'8.5.0',platform:process.platform}});" | Set-Content PC\preload.js
      - working-directory: PC
        run: npm install --no-save electron@31.7.7 electron-builder@24.13.3
      - working-directory: PC
        run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.5.0-multiplatform
          files: PC/release/巳泷资源库8.5.0.exe
  mac_x64:
    needs: prepare
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Electron project
        shell: bash
        run: |
          mkdir -p PC/www
          rsync -a --exclude .git --exclude PC ./ PC/www/
          cat > PC/package.json <<'JSON'
          {"name":"silong-resource-pc","version":"8.5.0","main":"main.js","scripts":{"build":"electron-builder --mac zip --x64"},"build":{"appId":"silong.gay.pc","productName":"巳泷资源库","directories":{"output":"release"},"artifactName":"${productName}${version}-macOS-x64.${ext}","files":["main.js","preload.js","www/**/*","package.json"],"mac":{"target":[{"target":"zip","arch":["x64"]}]}}
          JSON
          printf "const {app,BrowserWindow}=require('electron');const path=require('path');function createWindow(){new BrowserWindow({width:1280,height:820,minWidth:360,minHeight:640,webPreferences:{preload:path.join(__dirname,'preload.js')}}).loadFile(path.join(__dirname,'www','index.html'))}app.whenReady().then(createWindow);app.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit()});app.on('activate',()=>{if(BrowserWindow.getAllWindows().length===0)createWindow()});" > PC/main.js
          printf "window.addEventListener('DOMContentLoaded',()=>{window.Silong={version:'8.5.0',platform:process.platform}});" > PC/preload.js
      - working-directory: PC
        run: npm install --no-save electron@31.7.7 electron-builder@24.13.3
      - working-directory: PC
        run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.5.0-multiplatform
          files: PC/release/巳泷资源库8.5.0-macOS-x64.zip
  mac_arm64:
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Electron project
        shell: bash
        run: |
          mkdir -p PC/www
          rsync -a --exclude .git --exclude PC ./ PC/www/
          cat > PC/package.json <<'JSON'
          {"name":"silong-resource-pc","version":"8.5.0","main":"main.js","scripts":{"build":"electron-builder --mac zip --arm64"},"build":{"appId":"silong.gay.pc","productName":"巳泷资源库","directories":{"output":"release"},"artifactName":"${productName}${version}-macOS-arm64.${ext}","files":["main.js","preload.js","www/**/*","package.json"],"mac":{"target":[{"target":"zip","arch":["arm64"]}]}}
          JSON
          printf "const {app,BrowserWindow}=require('electron');const path=require('path');function createWindow(){new BrowserWindow({width:1280,height:820,minWidth:360,minHeight:640,webPreferences:{preload:path.join(__dirname,'preload.js')}}).loadFile(path.join(__dirname,'www','index.html'))}app.whenReady().then(createWindow);app.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit()});app.on('activate',()=>{if(BrowserWindow.getAllWindows().length===0)createWindow()});" > PC/main.js
          printf "window.addEventListener('DOMContentLoaded',()=>{window.Silong={version:'8.5.0',platform:process.platform}});" > PC/preload.js
      - working-directory: PC
        run: npm install --no-save electron@31.7.7 electron-builder@24.13.3
      - working-directory: PC
        run: npm run build
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v8.5.0-multiplatform
          files: PC/release/巳泷资源库8.5.0-macOS-arm64.zip
