name: SL World Deploy
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sl-world-deploy.yml'
      - 'deploy/sl_world.ready'
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download package
        run: |
          set -euxo pipefail
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for i in 1 2 3 4 5; do
            if curl -L --fail --retry 3 --max-time 90 -A "$UA" -o /tmp/sl_covers.tar.gz "https://aka.doubaocdn.com/s/di5Ns2eYC2"; then break; fi
            sleep 3
          done
          ls -lh /tmp/sl_covers.tar.gz
          tar -xzf /tmp/sl_covers.tar.gz
      - name: Inspect changes
        run: |
          set -euxo pipefail
          git status --short | tee /tmp/status.txt
          git diff --stat | tee -a /tmp/status.txt
          echo '### Git status' >> $GITHUB_STEP_SUMMARY
          cat /tmp/status.txt >> $GITHUB_STEP_SUMMARY
      - name: Commit and push
        run: |
          set -euxo pipefail
          git config user.name "silong-deploy"
          git config user.email "silong-deploy@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'NO_CHANGES'; exit 0; fi
          git commit -m "DEPLOY-SL-COVERS-AUTO: 11 world cover images"
          for i in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then echo PUSH_OK; break; fi
            sleep 3
          done
