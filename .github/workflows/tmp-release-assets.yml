name: release-assets-v850
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Download chunk manifest
        run: curl -L --retry 5 --retry-delay 3 --max-time 60 -o chunks.json "https://rob-own-peers-heard.trycloudflare.com/tunnel_chunks.json"
      - name: Download and assemble assets in parallel
        run: |
          python3 - <<'PY'
          import json, urllib.request, concurrent.futures, pathlib, shutil, time
          data=json.load(open('chunks.json'))
          for key, urls in data.items():
              outdir=pathlib.Path(key); outdir.mkdir(exist_ok=True)
              def fetch(item):
                  i,url=item
                  path=outdir/f'part{i:02d}'
                  last=None
                  for attempt in range(4):
                      try:
                          req=urllib.request.Request(url,headers={'User-Agent':'silong-release'})
                          with urllib.request.urlopen(req,timeout=120) as r, open(path,'wb') as f:
                              shutil.copyfileobj(r,f)
                          expected=10*1024*1024 if i<len(urls)-1 else None
                          if expected is None or path.stat().st_size==expected:
                              print(key,i,path.stat().st_size,flush=True); return
                          last=Exception('short file '+str(path.stat().st_size))
                      except Exception as e:
                          last=e
                      time.sleep(2)
                  raise RuntimeError(f'{key} chunk {i} failed: {last}')
              with concurrent.futures.ThreadPoolExecutor(max_workers=24) as ex:
                  list(ex.map(fetch, enumerate(urls)))
              with open(key+'.bin','wb') as out:
                  for i in range(len(urls)):
                      out.write((outdir/f'part{i:02d}').read_bytes())
              print(key,'combined',pathlib.Path(key+'.bin').stat().st_size,flush=True)
          for key,name in [('android','Silong-ResPool_v8.5.0_Android.apk'),('harmony','Silong-ResPool_v8.5.0_Harmony.apk'),('windows','Silong-ResPool_v8.5.0_Windows.exe')]:
              pathlib.Path(key+'.bin').replace(name)
          PY
          ls -lh Silong-ResPool_v8.5.0_*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload gay "Silong-ResPool_v8.5.0_Android.apk" "Silong-ResPool_v8.5.0_Harmony.apk" "Silong-ResPool_v8.5.0_Windows.exe" --clobber
