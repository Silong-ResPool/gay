name: release-assets-v850
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download chunk manifest
        run: curl -L --retry 5 --retry-delay 3 -o chunks.json "https://aka.doubaocdn.com/s/Py7U7WS5vb"
      - name: Download and assemble assets
        run: |
          set -e
          for key in android harmony windows; do
            n=$(jq -r ".${key} | length" chunks.json)
            echo "$key chunks: $n"
            rm -f ${key}.part*
            for i in $(seq 0 $((n-1))); do
              idx=$(printf '%02d' $i)
              url=$(jq -r ".${key}[$i]" chunks.json)
              echo "$key $idx $url"
              curl -L --retry 5 --retry-delay 3 -o ${key}.part${idx} "$url"
            done
            cat ${key}.part* > ${key}.bin
            rm -f ${key}.part*
          done
          mv android.bin Silong-ResPool_v8.5.0_Android.apk
          mv harmony.bin Silong-ResPool_v8.5.0_Harmony.apk
          mv windows.bin Silong-ResPool_v8.5.0_Windows.exe
          ls -lh Silong-ResPool_v8.5.0_*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload gay "Silong-ResPool_v8.5.0_Android.apk" "Silong-ResPool_v8.5.0_Harmony.apk" "Silong-ResPool_v8.5.0_Windows.exe" --clobber
          gh api -X PATCH repos/Silong-ResPool/gay/releases/431055237 -f name="Silong ResPool v8.5.0"
