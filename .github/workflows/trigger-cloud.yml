name: Trigger Cloud Multiplatform Build
on:
  push:
    branches: [main]
    paths: [.github/workflows/trigger-cloud.yml]
permissions:
  actions: write
  contents: read
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cloud workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh auth status
          gh workflow list
          gh workflow run "Cloud Multiplatform Build" --ref main --verbose
          code=$?
          echo "dispatch exit code: $code"
          exit $code
