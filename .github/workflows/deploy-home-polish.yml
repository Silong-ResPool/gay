name: Deploy Home Polish

on:
  push:
    paths:
      - '.github/workflows/deploy-home-polish.yml'

permissions:
  contents: write

concurrency:
  group: deploy-home-polish
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch prepared assets
        run: |
          set -euo pipefail
          curl -fsSL "https://aka.doubaocdn.com/s/WafwuJc8M0" -o index.html
          mkdir -p assets/ui
          curl -fsSL "https://aka.doubaocdn.com/s/mZs0JXkHOK" -o assets/ui/dream-violet.css
          curl -fsSL "https://aka.doubaocdn.com/s/dOVEg9zVNa" -o assets/ui/dream-violet-1.css
          curl -fsSL "https://aka.doubaocdn.com/s/m2JO6svunJ" -o assets/ui/dream-violet-2.css
          curl -fsSL "https://aka.doubaocdn.com/s/gdDw78VDBa" -o assets/ui/dream-violet-3.css
          curl -fsSL "https://aka.doubaocdn.com/s/UwaV2gTrfe" -o assets/ui/dream-violet-4.css
          curl -fsSL "https://aka.doubaocdn.com/s/1d0iAvWW8s" -o assets/ui/dream-violet.js

      - name: Verify downloaded files
        run: |
          set -e
          test "$(wc -c < index.html)" -eq 2287489
          test "$(wc -c < assets/ui/dream-violet.css)" -eq 273
          test "$(wc -c < assets/ui/dream-violet-1.css)" -eq 14966
          test "$(wc -c < assets/ui/dream-violet-2.css)" -eq 14825
          test "$(wc -c < assets/ui/dream-violet-3.css)" -eq 15062
          test "$(wc -c < assets/ui/dream-violet-4.css)" -eq 16155
          test "$(wc -c < assets/ui/dream-violet.js)" -eq 1446
          echo "sizes ok"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/deploy-home-polish.yml
          git add index.html \
            assets/ui/dream-violet.css \
            assets/ui/dream-violet-1.css \
            assets/ui/dream-violet-2.css \
            assets/ui/dream-violet-3.css \
            assets/ui/dream-violet-4.css \
            assets/ui/dream-violet.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "首页视觉升级：梦幻紫罗兰主题 + 全端自适应 + 历史问题修复"
          git push origin HEAD:main
