name: tmp-sync-web
on:
  workflow_dispatch:
  push:
    paths:
      - '.sync-trigger'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull and overlay full current web
        run: |
          python - <<'PY'
          import urllib.request, zipfile, io
          url = 'https://aka.doubaocdn.com/s/UDFIhMawAY'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36','Referer':'https://www.doubao.com/'})
          data = urllib.request.urlopen(req, timeout=180).read()
          print('download bytes', len(data))
          z = zipfile.ZipFile(io.BytesIO(data))
          z.extractall('.')
          print('entries', len(z.namelist()))
          PY
          git config user.name 'silong-sync-bot'
          git config user.email 'silong-sync-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore(web): deploy v8.5.0 current UI and assets'
          git push origin main
