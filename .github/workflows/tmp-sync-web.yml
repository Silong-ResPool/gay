name: tmp-sync-web
on:
  workflow_dispatch:
  push:
    paths:
      - '.sync-trigger'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Pull and overlay web update
        run: |
          python - <<'PY'
          import urllib.request, zipfile, io, os
          url = 'https://aka.doubaocdn.com/s/HX9COOSp1O'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36','Referer':'https://www.doubao.com/'})
          data = urllib.request.urlopen(req, timeout=90).read()
          print('download bytes', len(data))
          zipfile.ZipFile(io.BytesIO(data)).extractall('.')
          print('extracted')
          PY
          git config user.name 'silong-sync-bot'
          git config user.email 'silong-sync-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore(web): sync v8.5.0 player session fix'
          git push origin main
