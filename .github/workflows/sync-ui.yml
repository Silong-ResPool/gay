name: sync-ui-assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download changed web files
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o index.html 'https://aka.doubaocdn.com/s/MWChXYfvVV'
          mkdir -p assets/ui story/worlds music
          curl -L --fail --retry 3 -o assets/ui/v12.css 'https://aka.doubaocdn.com/s/fLwgUV6lIE'
          curl -L --fail --retry 3 -o assets/ui/hero_main.svg 'https://aka.doubaocdn.com/s/rOltI3VMU9'
          curl -L --fail --retry 3 -o assets/ui/world_xjlr.svg 'https://aka.doubaocdn.com/s/WZ8WoUXU06'
          curl -L --fail --retry 3 -o assets/ui/world_zgysl.svg 'https://aka.doubaocdn.com/s/ht2f8V6Ay7'
          curl -L --fail --retry 3 -o story/index.html 'https://aka.doubaocdn.com/s/rHH5PXqvZh'
          curl -L --fail --retry 3 -o story/worlds/index.js 'https://aka.doubaocdn.com/s/1d7ENVYyFB'
          curl -L --fail --retry 3 -o music/index.html 'https://aka.doubaocdn.com/s/BzspNleOPC'

      - name: Verify files
        run: |
          set -euo pipefail
          for f in index.html assets/ui/v12.css assets/ui/hero_main.svg assets/ui/world_xjlr.svg assets/ui/world_zgysl.svg story/index.html story/worlds/index.js music/index.html; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            echo "$f $(wc -c < "$f")"
          done

      - name: Commit deployment
        run: |
          set -euo pipefail
          git config user.name 'Silong Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm --quiet .github/workflows/sync-ui.yml
          git add index.html assets/ui/v12.css assets/ui/hero_main.svg assets/ui/world_xjlr.svg assets/ui/world_zgysl.svg story/index.html story/worlds/index.js music/index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: 部署 v12 深空 UI 与文游封面 [skip ci]'
            git push origin HEAD:main
          fi
