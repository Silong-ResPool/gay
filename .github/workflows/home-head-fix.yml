name: home-head-fix
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/home-head-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch index head
        run: |
          python3 - <<'PY'
          p = 'index.html'
          s = open(p, encoding='utf-8').read()
          anchor = '<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">'
          old_end = '<link rel="stylesheet" href="assets/ui/dream-violet.css?v=20261128f">'
          assert s.count(anchor) == 1, 'anchor count != 1'
          assert s.count(old_end) == 1, 'old skin link count != 1'
          ins = (anchor +
                 '\n<style>html{background-color:#08070c}body{background-color:#08070c}</style>' +
                 '\n<link rel="stylesheet" href="assets/ui/dream-violet.css?v=20261128g">')
          t = s.replace(anchor, ins, 1).replace(old_end + '\n', '', 1)
          assert old_end not in t, 'old link still present'
          assert 'dream-violet.css?v=20261128g' in t, 'g link missing'
          open(p, 'w', encoding='utf-8').write(t)
          print('patched bytes:', len(t.encode('utf-8')))
          PY
      - name: Commit and push
        run: |
          git config user.name "巳泷"
          git config user.email "xz35238345yun@163.com"
          git add index.html
          git commit -m "fix(home): 皮肤移入 head 消除首屏闪烁，手机端紧凑重排上线"
          git push
