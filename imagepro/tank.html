<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻影坦克 · 图像处理</title>
<style>
:root{--bg:#0b0616;--panel:#160a2a;--line:rgba(177,108,255,.32);--acc:#b16cff;--pink:#ff6ec7;--cyan:#00e5ff;--txt:#efe6ff;--mut:#a593c4}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:var(--txt);
  background:radial-gradient(circle at 30% -10%,#2a104d,#0b0616 55%,#05010c);padding:16px 14px 90px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back{border:1px solid rgba(0,229,255,.45);background:rgba(0,229,255,.08);color:#9ff4ff;padding:8px 13px;border-radius:20px;font-size:12.5px;cursor:pointer}
h1{font-size:18px;background:linear-gradient(90deg,var(--cyan),var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:1px}
.tip{font-size:11.5px;color:var(--mut);line-height:1.7;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:rgba(20,10,40,.8);border:1px solid var(--line);border-radius:14px;padding:12px}
.card h2{font-size:12px;color:#dccdff;margin-bottom:8px}
.drop{height:150px;border:1px dashed rgba(177,108,255,.45);border-radius:10px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:11px;color:var(--mut);cursor:pointer;overflow:hidden;background:rgba(255,255,255,.03)}
.drop img{max-width:100%;max-height:100%;object-fit:contain}
preview{display:block}
.pv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.pv .box{border-radius:12px;border:1px solid var(--line);overflow:hidden;height:220px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#777}
.pv .box img{max-width:100%;max-height:100%;object-fit:contain}
.pv .white{background:#fff;color:#555}
.pv .black{background:#000}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.acts button{flex:1;min-width:140px;padding:12px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#eadfff;font-size:13px;cursor:pointer}
.acts button.main{border:0;background:linear-gradient(135deg,var(--acc),var(--pink));color:#fff;font-weight:800}
.tip2{font-size:10.5px;color:var(--mut);margin-top:10px;line-height:1.7}
@media(max-width:560px){.grid{grid-template-columns:1fr}.pv{grid-template-columns:1fr}}
</style>
</head>
<body>
<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    /* v8.1.0 卡死修复：classList.remove/add 即使无实际变化也会产生 class 变更记录，
       本函数由 MutationObserver 回调，无脑 remove+add 会造成无限观察者风暴（主线程卡死）。
       改为「先检查、确有差异才写」。 */
    var d=document.documentElement;
    if(d){
      var dNeed=!d.classList.contains('sl-night')||d.classList.contains('sl-day')||d.classList.contains('sl-dusk')||d.classList.contains('day');
      if(dNeed){
        d.classList.remove('sl-day','sl-dusk','day');
        d.classList.add('sl-night');
      }
    }
    var b=document.body;
    if(b){
      var bNeed=!b.classList.contains('mode-night')||!b.classList.contains('mode-adult')||b.classList.contains('mode-daily')||b.classList.contains('mode-dusk')||b.classList.contains('day');
      if(bNeed){
        b.classList.remove('mode-daily','mode-dusk','day');
        b.classList.add('mode-night','mode-adult');
      }
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

<div class="hd"><button class="back" id="backBtn">← 返回</button><h1>幻影坦克</h1></div>
<p class="tip">上传两张图：白底显示图 A、黑底显示图 B。生成一张 PNG，在白色背景上看似 A，在黑色背景上看似 B。适合头像/彩蛋/隐写。</p>
<div class="grid">
  <div class="card"><h2>白底显示图 A</h2><div class="drop" id="dropA">点击选择图片<input type="file" id="fileA" accept="image/*" hidden></div></div>
  <div class="card"><h2>黑底显示图 B</h2><div class="drop" id="dropB">点击选择图片<input type="file" id="fileB" accept="image/*" hidden></div></div>
</div>
<div class="pv">
  <div class="box white" id="pvWhite">白底预览</div>
  <div class="box black" id="pvBlack">黑底预览</div>
</div>
<div class="acts">
  <button class="main" id="makeBtn">生成幻影坦克 PNG</button>
  <button id="saveBtn">下载 PNG</button>
</div>
<p class="tip2">原理：按 alpha 混合求解每像素颜色与透明度；两张图尺寸会自动裁切到较小的那张。生成结果不含任何外链、全部本地计算。</p>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var imgA=null,imgB=null,outUrl='';
function load(input,which){
  var f=input.files&&input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      if(which==='a'){imgA=im;$('dropA').innerHTML='<img src="'+im.src+'" alt="">';}
      else{imgB=im;$('dropB').innerHTML='<img src="'+im.src+'" alt="">';}
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
$('dropA').onclick=function(){ $('fileA').click(); };
$('dropB').onclick=function(){ $('fileB').click(); };
$('fileA').onchange=function(){ load(this,'a'); };
$('fileB').onchange=function(){ load(this,'b'); };
function make(){
  if(!imgA||!imgB){ alert('请先选择两张图片'); return null; }
  var w=Math.min(imgA.naturalWidth,imgB.naturalWidth),h=Math.min(imgA.naturalHeight,imgB.naturalHeight);
  if(!w||!h){ alert('图片尺寸无效'); return null; }
  var ca=document.createElement('canvas'),cb=document.createElement('canvas'),co=document.createElement('canvas');
  ca.width=cb.width=co.width=w;ca.height=cb.height=co.height=h;
  var xa=ca.getContext('2d'),xb=cb.getContext('2d'),xo=co.getContext('2d');
  xa.drawImage(imgA,0,0,w,h);xb.drawImage(imgB,0,0,w,h);
  var da=xa.getImageData(0,0,w,h).data,db=xb.getImageData(0,0,w,h).data,od=xo.createImageData(w,h);
  for(var i=0;i<da.length;i+=4){
    var ar=da[i],ag=da[i+1],ab=da[i+2];
    var br=db[i],bg=db[i+1],bb=db[i+2];
    /* A = C*a + 255*(1-a); B = C*a  →  a = 1 + (B-A)/255, C = B/a */
    var alpha=1+((br-ar)+(bg-ag)+(bb-ab))/(3*255);
    alpha=Math.max(0.02,Math.min(1,alpha));
    od.data[i]=Math.max(0,Math.min(255,Math.round(br/alpha)));
    od.data[i+1]=Math.max(0,Math.min(255,Math.round(bg/alpha)));
    od.data[i+2]=Math.max(0,Math.min(255,Math.round(bb/alpha)));
    od.data[i+3]=Math.round(alpha*255);
  }
  xo.putImageData(od,0,0);
  return co.toDataURL('image/png');
}
$('makeBtn').onclick=function(){
  var u=make();if(!u)return;
  outUrl=u;
  $('pvWhite').innerHTML='<img src="'+u+'" alt="">';
  $('pvBlack').innerHTML='<img src="'+u+'" alt="">';
};
$('saveBtn').onclick=function(){
  if(!outUrl)outUrl=make();
  if(!outUrl){return;}
  var a=document.createElement('a');a.href=outUrl;a.download='幻影坦克_'+Date.now()+'.png';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);
};
$('backBtn').onclick=function(){ history.length>1?history.back():location.href='index.html'; };
})();
</script>
<style id="sl-skeleton">
/* ============================================================
   巳泷资源库 · 前端骨架 Token 体系（v8.0.7）
   统一：颜色 / 字体 / 圆角 / 间距 / 阴影 / 层级
   所有页面通过构建脚本内联本文件，页面运行时不额外请求 CSS。
   ============================================================ */
:root{
  /* 颜色 */
  --sl-bg:#08050f;
  --sl-bg-2:#0e0819;
  --sl-surface:#151024;
  --sl-surface-2:#1d1533;
  --sl-glass:rgba(16,10,30,.72);
  --sl-glass-strong:rgba(20,12,36,.92);
  --sl-primary:#8b5cf6;
  --sl-primary-2:#7c3aed;
  --sl-accent:#22d3ee;
  --sl-pink:#ff6ec7;
  --sl-glow:rgba(139,92,246,.45);
  --sl-text:#f5f3ff;
  --sl-text-2:#d8cfe9;
  --sl-muted:#a99bc4;
  --sl-line:rgba(139,92,246,.26);
  --sl-line-strong:rgba(139,92,246,.42);
  --sl-success:#34d399;
  --sl-danger:#f87171;
  --sl-warning:#fbbf24;
  /* 字体 */
  --sl-font:'PingFang SC','Microsoft YaHei',system-ui,-apple-system,'Segoe UI',sans-serif;
  --sl-font-mono:'JetBrains Mono','Consolas','Courier New',monospace;
  /* 圆角 */
  --sl-r-sm:8px;
  --sl-r-md:12px;
  --sl-r-lg:18px;
  --sl-r-xl:24px;
  --sl-r-pill:999px;
  /* 间距 */
  --sl-sp-1:4px;
  --sl-sp-2:8px;
  --sl-sp-3:12px;
  --sl-sp-4:16px;
  --sl-sp-5:24px;
  --sl-sp-6:32px;
  /* 阴影 */
  --sl-shadow-sm:0 2px 10px rgba(0,0,0,.35);
  --sl-shadow:0 8px 30px rgba(0,0,0,.45);
  --sl-shadow-lg:0 18px 60px rgba(0,0,0,.55);
  --sl-glow-line:0 0 0 1px rgba(139,92,246,.18),0 0 24px rgba(139,92,246,.18);
  /* 层级 */
  --sl-z-nav:100;
  --sl-z-panel:300;
  --sl-z-modal:1000;
  --sl-z-toast:2000;
  /* 兼容旧页面变量名 */
  --acc:var(--sl-primary);
  --acc2:var(--sl-accent);
  --pink:var(--sl-pink);
  --border:var(--sl-line);
  --bg:var(--sl-bg);
  --txt:var(--sl-text);
  --v-glow:var(--sl-primary);
  --v-ink:var(--sl-text);
  --v-soft:var(--sl-line);
  --text-muted:var(--sl-muted);
}

html,body{
  background:var(--sl-bg);
  color:var(--sl-text);
  font-family:var(--sl-font);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body{min-height:100vh}
::selection{background:rgba(139,92,246,.38);color:#fff}
*{scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.55) transparent}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(139,92,246,.45);border-radius:var(--sl-r-pill)}
::-webkit-scrollbar-track{background:transparent}
*:focus-visible{outline:2px solid rgba(34,211,238,.55);outline-offset:2px}

/* 顶部栏：统一深色玻璃 + 紫罗兰描边（不改各页面原有高度与排布） */
.navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-sm)!important;
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
/* 侧栏 / 抽屉 / 面板统一 */
.side,.side-panel,.side-pane,.src-dock,.panel,.drawer{
  border-color:var(--sl-line)!important;
}
.side-header,.side-hd,.dock-head{
  border-bottom-color:var(--sl-line)!important;
}
.side-header h3,.side-hd h3,.dock-title{
  color:var(--sl-text)!important;letter-spacing:.4px;
}

/* 通用按钮：统一字体、圆角、动效；保留各页面自己的配色 */
.btn,.pbtn,.mini,.sr-tool,.tab-btn,.api-pool-btn,.rate-btn,.mbtn,.card-edit,.dk-tts,.icon-btn,.sl-top .bk{
  font-family:var(--sl-font);
  border-radius:var(--sl-r-md);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease,border-color .16s ease;
}
.btn:active,.pbtn:active,.mini:active,.sr-tool:active,.tab-btn:active,.api-pool-btn:active,.rate-btn:active,.mbtn:active,.card-edit:active,.dk-tts:active,.icon-btn:active,.sl-top .bk:active{
  transform:scale(.97);
}
.primary,.pbtn{
  background-image:linear-gradient(135deg,var(--sl-primary-2),var(--sl-primary))!important;
  border-color:transparent!important;
  color:#fff!important;
  box-shadow:0 6px 18px rgba(124,58,237,.32);
}

/* 输入类：统一深色底、占位色与聚焦光环（排除勾选/滑杆/取色/文件） */
input,textarea,select{font-family:var(--sl-font)}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"]),textarea,select{
  background:var(--sl-surface-2)!important;
  color:var(--sl-text)!important;
  border:1px solid var(--sl-line)!important;
  border-radius:var(--sl-r-md)!important;
}
input::placeholder,textarea::placeholder{color:var(--sl-muted)}
input:focus,textarea:focus,select:focus{
  border-color:var(--sl-primary)!important;
  box-shadow:0 0 0 3px rgba(139,92,246,.16);
}

/* 区块标题与正文层级 */
.hd h2,.side-section h4,.side-header h3,.bubble-name,.v-bubble-name{
  color:var(--sl-text);
}
.hd,.side-section h4{
  letter-spacing:.3px;
}
.msg-time,.sub,.hint,.brand-status,.meta,.ds{
  color:var(--sl-muted);
}

/* 弹窗 / 浮层统一描边与阴影 */
.modal,.rate-card,.pet-card,.sl-kwarn,.dt,.dt-head,.context-menu{
  border-color:var(--sl-line)!important;
  box-shadow:var(--sl-shadow-lg)!important;
}

/* 兼容旧的白日/黄昏蓝白覆盖：即使旧 class 残留，也保持统一紫罗兰暗色 */
html.sl-day,html.sl-dusk{
  --bg:var(--sl-bg);--card:var(--sl-surface);--line:var(--sl-line);
  --txt:var(--sl-text);--mut:var(--sl-muted);--acc:var(--sl-primary);--acc2:var(--sl-accent);
}
html.sl-day body,html.sl-dusk body{
  background:radial-gradient(ellipse at 12% 6%,rgba(139,92,246,.20),transparent 55%),
             radial-gradient(ellipse at 88% 94%,rgba(255,110,199,.12),transparent 55%),
             var(--sl-bg)!important;
  color:var(--sl-text)!important;
}
html.sl-day .navbar,html.sl-dusk .navbar,body.mode-daily .nav{
  background:linear-gradient(180deg,var(--sl-glass-strong),var(--sl-glass))!important;
  border-color:var(--sl-line)!important;
  background-image:none!important;
}
html.sl-day .side-header h3,body.mode-daily .hd h2,body.mode-daily .about-site h2{
  color:var(--sl-text)!important;
}
html.sl-day .side,body.mode-daily .side{
  background:var(--sl-glass-strong)!important;
  border-color:var(--sl-line)!important;
}
body.mode-daily .side a:hover,body.mode-daily .side a.on{
  color:var(--sl-text)!important;
  border-left-color:var(--sl-primary)!important;
}

/* 移动端安全区与间距基线 */
@supports(padding:max(0px)){
  .navbar,.v-head,.sl-top,.topbar,.top-bar,#topbar,.app-header,.header{
    padding-top:max(8px,env(safe-area-inset-top));
  }
}

</style>
</body>
</html>
