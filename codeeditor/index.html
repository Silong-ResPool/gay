<script id="sl-force-night">
/* v8.0.7：全站强制单一黑夜紫罗兰模式
   清除历史白日/黄昏 class，并强制成人内容全部可见；
   用 MutationObserver 防止旧页面脚本再次加回 sl-day / mode-daily。 */
(function(){
  function force(){
    var d=document.documentElement;
    if(d){
      d.classList.remove('sl-day','sl-dusk','day');
      d.classList.add('sl-night');
    }
    if(document.body){
      document.body.classList.remove('mode-daily','mode-dusk','day');
      document.body.classList.add('mode-night','mode-adult');
    }
  }
  try{
    localStorage.setItem('sl_cycle','1');
    localStorage.setItem('sl_site_mode','"adult"');
  }catch(e){}
  force();
  try{
    new MutationObserver(force).observe(document.documentElement,{attributes:true,attributeFilter:['class']});
  }catch(e){}
  document.addEventListener('DOMContentLoaded',function(){
    force();
    try{
      new MutationObserver(force).observe(document.body,{attributes:true,attributeFilter:['class']});
    }catch(e){}
    setTimeout(force,300);
  });
})();

</script>

  files=[
    {name:'index.html',lang:'html',content:DEFAULT_HTML},
    {name:'styles.css',lang:'css',content:'/* 在这里写 CSS，会自动注入 index.html */\n'},
    {name:'script.js',lang:'javascript',content:'// 在这里写 JS，会自动注入 index.html\n'}
  ];
}
var active=0,editor=null,selected=null,previewReady=false,aiHistory=[];

function saveFiles(){try{localStorage.setItem(FKEY,JSON.stringify(files))}catch(e){toast('本地空间不足，保存失败')}}
function langOf(name){var n=String(name||'').toLowerCase();if(/\.html?$/.test(n))return 'html';if(/\.css$/.test(n))return 'css';if(/\.js$/.test(n))return 'javascript';if(/\.json$/.test(n))return 'json';if(/\.md$/.test(n))return 'markdown';return 'plaintext'}
function langLabel(l){return {html:'HTML',css:'CSS',javascript:'JavaScript',json:'JSON',markdown:'Markdown',plaintext:'纯文本'}[l]||l}

function renderTabs(){
  var box=$('tabs');box.innerHTML='';
  files.forEach(function(f,i){
    var b=document.createElement('div');b.className='tab'+(i===active?' on':'');
    b.innerHTML='<span>'+esc(f.name)+'</span><span class="x" data-i="'+i+'">×</span>';
    b.onclick=function(e){
      var x=e.target.getAttribute&&e.target.getAttribute('data-i');
      if(x!=null){ delFile(+x); return; }
      switchFile(i);
    };
    box.appendChild(b);
  });
  var add=document.createElement('div');add.className='tab';add.textContent='+';
  add.onclick=newFile;box.appendChild(add);
}

function switchFile(i){
  if(i<0||i>=files.length)return;
  active=i;selected=null;$('inspector').classList.remove('on');
  renderTabs();
  var f=files[i];$('fileInfo').textContent=f.name;$('langTag').textContent=langLabel(langOf(f.name));
  if(editor){monaco.editor.setModelLanguage(editor.getModel(),langOf(f.name));editor.setValue(f.content||'');editor.setScrollTop(0);}
  schedulePreview();
}
function delFile(i){
  if(files.length<=1){toast('至少保留一个文件');return}
  files.splice(i,1);if(active>=files.length)active=files.length-1;
  saveFiles();switchFile(active);
}
function newFile(){
  var n=prompt('文件名（例如 app.js / style.css / index.html）','new.html');
  if(!n)return;n=n.trim();if(!n)return;
  if(files.some(function(f){return f.name===n})){toast('同名文件已存在');return}
  files.push({name:n,lang:langOf(n),content:''});active=files.length-1;saveFiles();switchFile(active);
}

function currentFile(){return files[active]||files[0]}

function buildPreview(){
  var cur=currentFile();
  var htmlFile=(langOf(cur.name)==='html')?cur:files.filter(function(f){return langOf(f.name)==='html'})[0];
  var css=files.filter(function(f){return langOf(f.name)==='css'}).map(function(f){return f.content}).join('\n');
  var js=files.filter(function(f){return langOf(f.name)==='javascript'}).map(function(f){return f.content}).join('\n;\n');
  if(!htmlFile){
    return '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font-family:system-ui;padding:20px"><pre>当前项目没有 HTML 文件，新建 index.html 后即可预览。</pre></body></html>';
  }
  var h=htmlFile.content||'';
  if(css){
    if(/<\/head>/i.test(h)) h=h.replace(/<\/head>/i,'<style>\n'+css+'\n</style>\n</head>');
    else h='<style>\n'+css+'\n</style>\n'+h;
  }
  if(js){
    var safe=js.replace(/<\/script>/gi,'<\\/script>');
    if(/<\/body>/i.test(h)) h=h.replace(/<\/body>/i,'<script>\n'+safe+'\n<\/script>\n</body>');
    else h+='<script>\n'+safe+'\n<\/script>';
  }
  return h;
}

var runTimer=null;
function schedulePreview(){
  if(!$('autoRun').checked)return;
  clearTimeout(runTimer);runTimer=setTimeout(doPreview,600);
}
function doPreview(){
  try{
    $('preview').srcdoc=buildPreview();
    previewReady=false;
  }catch(e){toast('预览失败：'+e.message)}
}

var FIELDS=[
  ['width','宽','px'],['height','高','px'],['font-size','字号','px'],
  ['color','文字颜色','color'],['background-color','背景色','color'],
  ['opacity','不透明度','range'],['border-radius','圆角','px'],
  ['margin','外边距','text'],['padding','内边距','text'],
  ['transform','变换','text'],['animation','动画','text'],['transition','过渡','text']
];
function paintInspector(){
  var box=$('formBox');box.innerHTML='';
  if(!selected){$('selInfo').textContent='先在预览里勾选「点击编辑」，再点任意元素';return}
  var tag=selected.tagName.toLowerCase();
  var id=selected.id?'#'+selected.id:'';
  var cls=selected.className&&typeof selected.className==='string'?'.'+selected.className.trim().split(/\s+/).slice(0,2).join('.'):'';
  $('selInfo').textContent='已选中：'+tag+id+cls+'　（改动实时生效）';
  var cs=null;try{cs=selected.ownerDocument.defaultView.getComputedStyle(selected)}catch(e){}
  FIELDS.forEach(function(f){
    var key=f[0],label=f[1],type=f[2];
    var row=document.createElement('div');row.className='frow';
    var lb=document.createElement('label');lb.textContent=label;row.appendChild(lb);
    if(type==='color'){
      var inp=document.createElement('input');inp.type='color';
      var v=selected.style[key]||(cs?cs.getPropertyValue(key):'')||'#ffffff';
      try{inp.value=toHex(v)}catch(e){inp.value='#ffffff'}
      inp.oninput=function(){selected.style[key]=inp.value};
      row.appendChild(inp);
    }else if(type==='range'){
      var r=document.createElement('input');r.type='range';r.min='0';r.max='1';r.step='0.01';
      var ov=selected.style.opacity!==''?+selected.style.opacity:(cs?+cs.opacity:1);if(!isFinite(ov))ov=1;
      r.value=String(ov);
      var vv=document.createElement('span');vv.className='v';vv.textContent=Math.round(ov*100)+'%';
      r.oninput=function(){selected.style.opacity=r.value;vv.textContent=Math.round(+r.value*100)+'%'};
      row.appendChild(r);row.appendChild(vv);
    }else{
      var inp2=document.createElement('input');inp2.type='text';
      var val=selected.style[key]||(cs?cs.getPropertyValue(key):'')||'';
      inp2.value=String(val).trim();
      inp2.oninput=function(){selected.style[key]=inp2.value};
      row.appendChild(inp2);
    }
    box.appendChild(row);
  });
}
function toHex(v){
  v=String(v||'').trim();
  if(/^#[0-9a-f]{6}$/i.test(v))return v;
  if(/^#[0-9a-f]{3}$/i.test(v))return '#'+v[1]+v[1]+v[2]+v[2]+v[3]+v[3];
  var m=v.match(/rgba?\((\d+)[,\s]+(\d+)[,\s]+(\d+)/i);
  if(m)return '#'+[1,2,3].map(function(i){var n=+m[i];return ('0'+n.toString(16)).slice(-2)}).join('');
  return '#ffffff';
}

function bindPreview(){
  var fr=$('preview');
  try{
    var d=fr.contentDocument;
    if(!d)return;
    previewReady=true;
    d.addEventListener('click',function(e){
      if(!$('editMode').checked)return;
      e.preventDefault();e.stopPropagation();
      var el=e.target;
      if(!el||el===d.documentElement||el===d.body)return;
      selected=el;
      $('inspector').classList.add('on');
      try{
        var old=d.getElementById('__sl_outline');if(old)old.remove();
        el.style.outline='2px solid #ff6ec7';
        el.style.outlineOffset='1px';
        setTimeout(function(){try{el.style.outline='';}catch(e){}},1200);
      }catch(e){}
      paintInspector();
    },true);
  }catch(e){}
}
$('preview').addEventListener('load',bindPreview);

$('backBtn').onclick=function(){if(window.CodeNative&&CodeNative.exit)CodeNative.exit();else location.href='../index.html'};
$('newBtn').onclick=newFile;
$('runBtn').onclick=doPreview;
$('refreshBtn').onclick=doPreview;
$('insClose').onclick=function(){$('inspector').classList.remove('on')};
$('applySrcBtn').onclick=function(){
  if(!selected){toast('还没有选中元素');return}
  try{
    var d=$('preview').contentDocument;
    var html='<!DOCTYPE html>\n'+d.documentElement.outerHTML;
    var hf=files.filter(function(f){return langOf(f.name)==='html'})[0];
    if(!hf){toast('项目里没有 HTML 文件');return}
    hf.content=html;saveFiles();
    if(currentFile()===hf&&editor){editor.setValue(html)}
    toast('已写回 '+hf.name);doPreview();
  }catch(e){toast('写回失败：'+e.message)}
};

/* ---------- Monaco ---------- */
window.require.config({paths:{vs:'vendor/vs'}});
window.require(['vs/editor/editor.main'],function(){
  monaco.editor.defineTheme('silong-purple',{
    base:'vs-dark',inherits:true,rules:[
      {token:'comment',foreground:'7c6a9c',fontStyle:'italic'},
      {token:'keyword',foreground:'ff6ec7'},
      {token:'string',foreground:'00e5ff'},
      {token:'number',foreground:'ffd166'},
      {token:'tag',foreground:'b16cff'},
      {token:'attribute.name',foreground:'9ff4ff'}
    ],
    colors:{'editor.background':'#0b0418','editorCursor.foreground':'#ff6ec7','editor.lineHighlightBackground':'#1a0b33',
      'editorLineNumber.foreground':'#5c4a7a','editorLineNumber.activeForeground':'#b16cff','editor.selectionBackground':'#3a1a66'}
  });
  editor=monaco.editor.create($('monaco'),{
    value:currentFile().content,language:langOf(currentFile().name),theme:'silong-purple',
    automaticLayout:true,fontSize:13.5,lineHeight:21,fontFamily:"'JetBrains Mono','Cascadia Code',Consolas,monospace",
    minimap:{enabled:false},scrollBeyondLastLine:false,wordWrap:'on',tabSize:2,insertSpaces:true,
    padding:{top:10,bottom:20},smoothScrolling:true
  });
  editor.onDidChangeModelContent(function(){
    var f=currentFile();f.content=editor.getValue();saveFiles();schedulePreview();
  });
  switchFile(active);
  setTimeout(doPreview,300);
});

/* ---------- AI 代码助手 ---------- */
var AKEY='sl_code_ai_cfg';
var aiCfg=null;
try{aiCfg=JSON.parse(localStorage.getItem(AKEY)||'null')}catch(e){aiCfg=null}
function defaultCfg(){
  var b='',k=[],m='agnes-3.0-flash';
  if(window.SL_API){b=b64d(SL_API.b);k=(SL_API.k||[]).map(b64d);m=b64d(SL_API.m)||m}
  return {base:b,keys:k,model:m};
}
function getCfg(){return Object.assign(defaultCfg(),aiCfg||{})}
function saveCfg(c){aiCfg=c;try{localStorage.setItem(AKEY,JSON.stringify(c))}catch(e){}}
function fillCfg(){
  var c=getCfg();$('cfgBase').value=c.base||'';$('cfgKeys').value=(c.keys||[]).join('\n');$('cfgModel').value=c.model||'';
}
$('cfgBtn').onclick=function(){fillCfg();$('cfgModal').classList.add('on')};
$('aiCfg').onclick=function(){fillCfg();$('cfgModal').classList.add('on')};
$('cfgCancel').onclick=function(){$('cfgModal').classList.remove('on')};
$('cfgSave').onclick=function(){
  var keys=$('cfgKeys').value.split(/[\n,，;；]+/).map(function(s){return s.trim()}).filter(Boolean);
  saveCfg({base:$('cfgBase').value.trim(),keys:keys,model:$('cfgModel').value.trim()||'agnes-3.0-flash'});
  $('cfgModal').classList.remove('on');toast('API 配置已保存');
};
$('aiBtn').onclick=function(){$('aiPanel').classList.add('on');$('aiInput').focus()};
$('aiClose').onclick=function(){$('aiPanel').classList.remove('on')};

/* 独立限频：5 分钟 20 次 */
function rateOk(){
  var now=Date.now(),w=5*60*1000,key='sl_code_ai_rate';
  var arr=[];try{arr=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){arr=[]}
  arr=arr.filter(function(t){return now-t<w});
  if(arr.length>=20)return false;
  arr.push(now);try{localStorage.setItem(key,JSON.stringify(arr))}catch(e){}
  return true;
}
function addMsg(role,text){
  var box=$('aiMsgs');var m=document.createElement('div');m.className='msg '+(role==='u'?'u':'a');
  m.textContent=text;box.appendChild(m);box.scrollTop=box.scrollHeight;return m;
}
function addInsert(m,text){
  var b=document.createElement('span');b.className='ins';b.textContent='插入到编辑器';
  b.onclick=function(){if(editor){editor.setValue(text);toast('已插入编辑器')}};
  m.appendChild(document.createElement('br'));m.appendChild(b);
}
function contextText(){
  var f=currentFile();var t=f?f.content:'';
  if(t.length>6000)t=t.slice(0,6000)+'\n/* ...内容过长已截断... */';
  var sel=selected?('\n已选中元素：<'+selected.tagName.toLowerCase()+' class="'+selected.className+'">'):'';
  return '当前文件：'+f.name+'\n```'+langOf(f.name)+'\n'+t+'\n```'+sel;
}
$('aiSend').onclick=function(){
  var q=$('aiInput').value.trim();if(!q)return;
  if(!rateOk()){toast('代码助手 5 分钟最多 20 次，请稍后再试');return}
  $('aiInput').value='';
  addMsg('u',q);
  var cfg=getCfg();
  var keys=(cfg.keys||[]).filter(Boolean);
  if(!keys.length){addMsg('a','还没有配置 API Key');return}
  var key=keys[Math.floor(Math.random()*keys.length)];
  var base=String(cfg.base||'').replace(/\/+$/,'');
  addMsg('a','正在思考…');
  var box=$('aiMsgs');var thinking=box.lastChild;
  fetch(base+'/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:cfg.model||'agnes-3.0-flash',temperature:0.4,max_tokens:2000,
      messages:[
        {role:'system',content:'你是资深前端工程师。回答要可直接运行，优先给出完整代码。'},
        {role:'user',content:contextText()+'\n\n用户需求：'+q}
      ]})
  }).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
   .then(function(d){
      var text=(d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content)||'没有返回内容';
      thinking.textContent=text;addInsert(thinking,text);box.scrollTop=box.scrollHeight;
   }).catch(function(e){thinking.textContent='请求失败：'+e.message});
};
$('aiInput').addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter')$('aiSend').click()});

/* 启动 */
renderTabs();switchFile(0);
})();
</script>
